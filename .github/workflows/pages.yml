# Publica el sitio tal cual, sin Jekyll.
#
# El constructor heredado de Pages fallaba —«Page build failed», sin más
# detalle— incluso con un `.nojekyll` en la raíz. El sospechoso es el espacio
# del directorio `Material html`. Este flujo sube los archivos como artefacto
# estático y los despliega, sin procesarlos, y no tiene ese problema.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no se cancela el que ya está en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: despliegue
        uses: actions/deploy-pages@v4
