            const total = editables.length;
            const pct = total ? Math.round((aciertos / total) * 100) : 0;
            const color = pct >= 80 ? '#15803D' : pct >= 50 ? '#B45309' : '#B91C1C';

            return (
                <div ref={ref} className="my-6 rounded-2xl border-2 border-primary/20 bg-white p-5 shadow-sm">
                    <div className="flex flex-wrap items-center gap-2 mb-2">
                        <span className="lp-gradient text-white p-2 rounded-lg"><i className="fas fa-table-list"></i></span>
                        <h4 className="text-base font-bold text-primary" style={{ margin: 0 }}>{titulo}</h4>
                        <EtiquetaTipo texto="E1 · Traza" className="ml-auto text-[0.65rem] uppercase tracking-wider font-bold text-white bg-primary/80 rounded px-2 py-0.5" />
                    </div>
                    {enunciado && <div className="text-[0.95rem] text-gray-700 mb-3">{enunciado}</div>}
                    <SelectorLenguaje disponibles={disponibles} activo={langActivo} onCambiar={cambiarLang} />
                    {codigo && <CodeBlock code={porLenguaje(codigo, langActivo)} lang={langActivo} title="Algoritmo a trazar" plegable={false} />}

                    <p className="text-xs text-gray-500 mb-2">
                        <i className="fas fa-keyboard mr-1"></i>
                        Complete las celdas resaltadas. Use <span className="inline-code">—</span> si la variable aún no tiene valor.
                    </p>

                    <div className="overflow-x-auto">
                        <table className="w-full text-sm border-collapse">
                            <thead>
                                <tr>
                                    {columnas.map(c => (
                                        <th key={c.clave} className="bg-primary/10 text-primary text-left px-3 py-2 border border-gray-200 font-semibold whitespace-nowrap">
                                            {c.titulo}
                                        </th>
                                    ))}
                                </tr>
                            </thead>
                            <tbody>
                                {filas.map((f, i) => (
                                    <tr key={i} className={i % 2 ? 'bg-gray-50/60' : ''}>
                                        {columnas.map(c => {
                                            const editable = ocultas.includes(c.clave);
                                            if (!editable) {
                                                return <td key={c.clave} className="px-3 py-1.5 border border-gray-200 text-gray-700 align-top">
                                                    {c.clave === 'instruccion'
                                                        ? <span className="font-mono text-[0.82rem]">{porLenguaje(f[c.clave], langActivo)}</span>
                                                        : f[c.clave]}
                                                </td>;
                                            }
                                            const k = `${i}|${c.clave}`;
                                            const ok = esCorrecta(i, c.clave);
                                            let cls = 'border-gray-300 bg-amber-50/60';
                                            if (comprobado) cls = ok ? 'border-green-500 bg-green-50' : 'border-red-400 bg-red-50';
                                            return (
                                                <td key={c.clave} className="px-1.5 py-1 border border-gray-200">
                                                    <div className="flex items-center gap-1">
                                                        <input type="text" value={valores[k] || ''} onChange={e => escribir(k, e.target.value)}
                                                            disabled={comprobado} aria-label={`${c.titulo}, paso ${i + 1}`}
                                                            className={`w-full min-w-[70px] px-2 py-1 rounded border text-[0.82rem] font-mono outline-none focus:border-secondary ${cls}`} />
                                                        {comprobado && <i className={`fas ${ok ? 'fa-check text-green-600' : 'fa-xmark text-red-500'} text-xs`}></i>}
                                                    </div>
                                                    {comprobado && !ok && (
                                                        <div className="text-[0.7rem] text-green-700 font-mono mt-0.5 pl-1">→ {f[c.clave]}</div>
                                                    )}
                                                </td>
                                            );
                                        })}
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    <div className="mt-3 flex items-center gap-3 flex-wrap">
                        {!comprobado
                            ? <button onClick={() => setComprobado(true)}
                                className="text-sm font-bold px-4 py-1.5 rounded-full text-white lp-gradient hover:opacity-90">
                                <i className="fas fa-check-double mr-1"></i>Comprobar traza
                            </button>
                            : <>
                                <button onClick={() => { setComprobado(false); setValores({}); setRevelado(false); }}
                                    className="text-sm font-bold px-4 py-1.5 rounded-full border border-primary text-primary hover:bg-primary/5">
                                    <i className="fas fa-rotate-right mr-1"></i>Reintentar
                                </button>
                                <span className="text-sm font-bold" style={{ color }}>
                                    {aciertos} / {total} celdas correctas ({pct} %)
                                </span>
                                {exigeRespuesta && sinResponder > 0 && (
                                    <span className="text-xs font-semibold text-[#B45309]">
                                        {sinResponder} sin responder — una celda en blanco no cuenta
                                    </span>
                                )}
                            </>}
                        {pista && !revelado && (
                            <button onClick={() => setRevelado(true)} className="text-xs font-semibold text-gray-500 hover:text-primary underline">
                                <i className="fas fa-lightbulb mr-1"></i>Ver pista
                            </button>
                        )}
                    </div>
                    {revelado && pista && (
                        <div className="mt-3 animate-fade-in"><Box type="tip" label="Pista">{pista}</Box></div>
                    )}
                </div>
            );
        };

        /* ============================================================
           E3 · DETECTA Y DIAGNOSTICA EL ERROR
           Tres respuestas obligatorias: UBICAR la línea, CLASIFICAR el
           tipo de error y ANTICIPAR su consecuencia, que es lo que la
           taxonomía E3 pide y lo que el `impacto` solo mostraba. La
           retroalimentación nombra los pasos que fallan: «ubicó bien
           pero clasificó mal» es el caso más informativo.
        ============================================================ */
        const DetectaError = ({ titulo = 'Detecte y diagnostique el error', enunciado, lineas, lang = 'pseudo', lineaCorrecta, tipos, tipoCorrecto, consecuencias, consecuenciaCorrecta, explicacion, impacto }) => {
            // OJO: `lineaCorrecta` también admite {pseudo, python, r, vba}. El
            // mismo fallo NO está en la misma línea en los cuatro lenguajes
            // (VBA añade Sub/Dim, Python no lleva declaraciones...). Darlo por
            // constante haría que el ejercicio calificara mal al cambiar de
            // pestaña, y en silencio.
            //
            // Y con la clave va el TEXTO: `enunciado` y `explicacion` admiten
            // el mismo objeto. Un enunciado que dice «el comentario de la
            // línea 4» es cierto en pseudocódigo y falso en Python, donde esa
            // línea es justamente la respuesta. Lo mejor es redactarlos sin
            // citar ningún número; cuando haga falta citarlo, va por lenguaje.
            // La comprobación 8 de verificar.py vigila las dos propiedades.
            const idiomas = lenguajesDe(lineas);
            const disponibles = idiomas.length ? idiomas : [lang];
            const [langActivo, cambiarLang] = useLenguajeActivo(disponibles, lang);
            const lineasAct = porLenguaje(lineas, langActivo);
            const correctaAct = porLenguaje(lineaCorrecta, langActivo);
            const enunciadoAct = porLenguaje(enunciado, langActivo);
            const explicacionAct = porLenguaje(explicacion, langActivo);

            const [linea, setLinea] = useState(null);
            const [tipo, setTipo] = useState(null);
            const [consecuencia, setConsecuencia] = useState(null);
            const [comprobado, setComprobado] = useState(false);
            const ref = useRef(null);
            useTypeset(ref, [comprobado]);

            // Al cambiar de lenguaje la selección de la línea deja de tener
            // sentido; el tipo y la consecuencia son los mismos en los cuatro.
            useEffect(() => { setLinea(null); setComprobado(false); }, [langActivo]);

            // Sin `consecuencias` el ejercicio se queda en dos pasos en vez de
            // romperse: un `.map` sobre `undefined` dejaría el capítulo en
            // blanco. Que todo E3 las traiga lo exige la regla 24 de verificar.py.
            const conConsecuencia = Array.isArray(consecuencias) && consecuencias.length > 0;
            const pasos = conConsecuencia ? 3 : 2;
            const lineaOk = linea === correctaAct;
            const tipoOk = tipo === tipoCorrecto;
            const consecuenciaOk = !conConsecuencia || consecuencia === consecuenciaCorrecta;
            // El botón exige TODAS las respuestas. Un botón deshabilitado que no
            // dice por qué se lee como roto: quien completó el Paso 1 pulsa y
            // no pasa nada. Se rotula el progreso —igual que `Emparejamiento`,
            // que muestra «Comprobar (2/4)»— y se nombran los pasos que faltan.
            const pendientes = [
                linea === null && 'señale la línea (Paso 1)',
                tipo === null && 'clasifique el error (Paso 2)',
                conConsecuencia && consecuencia === null && 'anticipe la consecuencia (Paso 3)',
            ].filter(Boolean);
            const hechos = pasos - pendientes.length;
            const listo = pendientes.length === 0;
            const unir = (partes) => partes.length < 2 ? partes.join('')
                : `${partes.slice(0, -1).join(', ')} y ${partes[partes.length - 1]}`;
            const queFalta = listo ? null
                : pendientes.length === 1 ? `Falta un paso: ${pendientes[0]}.`
                    : `Para poder comprobar: ${unir(pendientes)}.`;
            const fallados = [
                !lineaOk && 'la línea',
                !tipoOk && 'el tipo de error',
                !consecuenciaOk && 'la consecuencia',
            ].filter(Boolean);
            const veredicto = fallados.length === 0 ? '¡Diagnóstico correcto!'
                : fallados.length === pasos ? `No acertó ningún paso: revise ${unir(fallados)}.`
                    : `Revise ${unir(fallados)}: lo demás está bien.`;
            const reintentar = () => { setComprobado(false); setLinea(null); setTipo(null); setConsecuencia(null); };

            // Los pasos 2 y 3 son la misma pieza: opciones con letra que se
            // colorean al comprobar.
            const opcionesDe = (lista, elegida, elegir, correcta) => (
                <div className="space-y-1.5 mb-3">
                    {lista.map((t, i) => {
                        const sel = elegida === i;
                        let cls = 'border-gray-200 bg-white hover:border-primary/40';
                        if (comprobado) {
                            if (i === correcta) cls = 'border-green-500 bg-green-50';
                            else if (sel) cls = 'border-red-400 bg-red-50';
                            else cls = 'border-gray-200 bg-white opacity-70';
                        } else if (sel) cls = 'border-secondary bg-amber-50';
                        return (
                            <button key={i} onClick={() => !comprobado && elegir(i)} disabled={comprobado} aria-pressed={sel}
                                className={`w-full text-left px-3 py-2 rounded-lg border text-[0.9rem] flex items-center gap-2.5 transition-all ${cls}`}>
                                <span className={`flex-shrink-0 w-5 h-5 rounded-full flex items-center justify-center text-[0.7rem] font-bold ${sel ? 'lp-gradient text-white' : 'bg-gray-100 text-gray-600'}`}>
                                    {String.fromCharCode(97 + i)}
                                </span>
                                <span className="flex-1 text-gray-700">{t}</span>
                                {comprobado && i === correcta && <i className="fas fa-check text-green-600 text-xs"></i>}
                            </button>
                        );
                    })}
                </div>
            );

            return (
                <div ref={ref} className="my-6 rounded-2xl border-2 p-5 shadow-sm" style={{ borderColor: '#FCA5A5', background: '#FFFBFB' }}>
                    <div className="flex flex-wrap items-center gap-2 mb-2">
                        <span className="text-white p-2 rounded-lg" style={{ background: 'linear-gradient(135deg,#B91C1C 0%,#F59E0B 100%)' }}><i className="fas fa-bug"></i></span>
                        <h4 className="text-base font-bold text-navy" style={{ margin: 0 }}>{titulo}</h4>
                        <EtiquetaTipo texto="E3 · Diagnóstico" className="ml-auto text-[0.65rem] uppercase tracking-wider font-bold text-white bg-red-700/80 rounded px-2 py-0.5" />
                    </div>
                    {enunciadoAct && <div className="text-[0.95rem] text-gray-700 mb-3">{enunciadoAct}</div>}

                    <p className="text-xs font-semibold text-gray-600 mb-1"><span className="text-red-700">Paso 1.</span> Señale la línea que contiene el error:</p>
                    <SelectorLenguaje disponibles={disponibles} activo={langActivo} onCambiar={cambiarLang} />
                    <div className="rounded-xl overflow-hidden border border-gray-700 bg-gray-900 mb-4">
                        {lineasAct.map((l, i) => {
                            const n = i + 1;
                            const sel = linea === n;
                            let cls = 'hover:bg-white/5';
                            if (comprobado) {
                                if (n === correctaAct) cls = 'bg-green-900/50 ring-1 ring-green-500';
                                else if (sel) cls = 'bg-red-900/50 ring-1 ring-red-500';
                            } else if (sel) cls = 'bg-amber-500/20 ring-1 ring-amber-400';
                            return (
                                <button key={i} onClick={() => !comprobado && setLinea(n)} disabled={comprobado}
                                    aria-label={`Línea ${n}`} aria-pressed={sel}
                                    className={`w-full text-left flex items-start gap-3 px-3 py-1 font-mono text-[0.82rem] transition-colors ${cls}`}>
                                    <span className="text-gray-400 select-none w-6 text-right flex-shrink-0">{n}</span>
                                    <span className="text-gray-100 whitespace-pre overflow-x-auto"
                                        dangerouslySetInnerHTML={{ __html: resaltar(l, langActivo) }} />
                                    {comprobado && n === correctaAct && <i className="fas fa-arrow-left text-green-400 ml-auto flex-shrink-0 mt-0.5"></i>}
                                </button>
                            );
                        })}
                    </div>

                    <p className="text-xs font-semibold text-gray-600 mb-1"><span className="text-red-700">Paso 2.</span> Clasifique el tipo de error:</p>
                    {opcionesDe(tipos, tipo, setTipo, tipoCorrecto)}

                    {conConsecuencia && <>
                        <p className="text-xs font-semibold text-gray-600 mb-1"><span className="text-red-700">Paso 3.</span> Anticipe la consecuencia:</p>
                        {opcionesDe(consecuencias, consecuencia, setConsecuencia, consecuenciaCorrecta)}
                    </>}

                    <div className="flex items-center gap-3 flex-wrap">
                        {!comprobado
                            ? <button onClick={() => listo && setComprobado(true)} disabled={!listo}
                                className="text-sm font-bold px-4 py-1.5 rounded-full text-white lp-gradient disabled:opacity-40">
                                <i className="fas fa-magnifying-glass mr-1"></i>Comprobar diagnóstico ({hechos}/{pasos})
                            </button>
                            : <button onClick={reintentar}
                                className="text-sm font-bold px-4 py-1.5 rounded-full border border-primary text-primary hover:bg-primary/5">
                                <i className="fas fa-rotate-right mr-1"></i>Reintentar
                            </button>}
                        {!comprobado && queFalta && (
                            <span className="text-xs text-gray-600" role="status">
                                <i className="fas fa-circle-info mr-1"></i>{queFalta}
                            </span>
                        )}
                        {comprobado && (
                            <span className={`text-sm font-bold ${fallados.length === 0 ? 'text-green-600' : 'text-red-500'}`}>
                                <i className={`fas ${fallados.length === 0 ? 'fa-circle-check' : 'fa-circle-xmark'} mr-1`}></i>
                                {veredicto}
                            </span>
                        )}
                    </div>

                    {comprobado && (
                        <div className="mt-4 space-y-3 animate-fade-in">
                            <Box type="info" label="Explicación">{explicacionAct}</Box>
                            {impacto && <Box type="danger" label="Consecuencia financiera">{impacto}</Box>}
                        </div>
                    )}
                </div>
            );
        };

        /* ============================================================
           E4 · COMPARADOR — dos versiones lado a lado + veredicto
        ============================================================ */
        const Comparador = ({ titulo = 'Compare las dos versiones', enunciado, a, b, lang = 'pseudo', pregunta, opciones, multiple = false }) => {
            const idiomas = lenguajesDe(a.codigo);
            const disponibles = idiomas.length ? idiomas : [lang];
            const [langActivo, cambiarLang] = useLenguajeActivo(disponibles, lang);

            const panel = (v, acento) => (
                <div className="flex-1 min-w-[260px]">
                    <div className="text-xs font-bold uppercase tracking-wider mb-1 px-1" style={{ color: acento }}>
                        <i className="fas fa-code-branch mr-1"></i>{v.etiqueta}
                    </div>
                    <CodeBlock code={porLenguaje(v.codigo, langActivo)} lang={v.lang || langActivo} title={v.etiqueta} plegable={false} />
                    {v.nota && <p className="text-xs text-gray-500 italic -mt-2 px-1">{v.nota}</p>}
                </div>
            );
            return (
                <div className="my-6 rounded-2xl border-2 border-teal/30 bg-white p-5 shadow-sm" style={{ borderColor: 'rgba(14,116,144,0.3)' }}>
                    <div className="flex flex-wrap items-center gap-2 mb-2">
                        <span className="text-white p-2 rounded-lg" style={{ background: 'linear-gradient(135deg,#0E7490,#3D008D)' }}><i className="fas fa-code-compare"></i></span>
                        <h4 className="text-base font-bold text-primary" style={{ margin: 0 }}>{titulo}</h4>
                        <EtiquetaTipo texto="E4 · Equivalencia" className="ml-auto text-[0.65rem] uppercase tracking-wider font-bold text-white rounded px-2 py-0.5" style={{ background: '#0E7490' }} />
                    </div>
                    {enunciado && <div className="text-[0.95rem] text-gray-700 mb-3">{enunciado}</div>}
                    <SelectorLenguaje disponibles={disponibles} activo={langActivo} onCambiar={cambiarLang} />
                    <div className="flex flex-wrap gap-4">
                        {panel(a, '#3D008D')}
                        {panel(b, '#D81B6A')}
                    </div>
                    {pregunta && <MCQ pregunta={pregunta} opciones={opciones} multiple={multiple} />}
                </div>
            );
        };

        /* ============================================================
           E5 · ORDENA LOS PASOS
           Interacción por clic (no arrastrar): accesible por teclado y
           funcional en pantallas táctiles.
           El desorden es DETERMINISTA: no puede recalcularse en cada
           render ni cambiar entre visitas.
        ============================================================ */
        // Una permutación pseudoaleatoria sembrada con el texto de los pasos:
        // cada ejercicio, y cada lenguaje, tiene la suya, y no cambia entre
        // visitas. La anterior era `[n−1, 0, n−2, 1, …]` en todos, y quien notaba
        // el patrón resolvía los ocho del curso sin leer el código (L1). De 200
        // candidatas se queda con la primera que no deja ningún paso en su sitio,
        // ni dos seguidos en orden, ni tres a saltos iguales (como 1, 3, 5, que
        // es otro patrón); con tres pasos no existe, y se queda con la que menos
        // tiene.
        const mezclaPorDefecto = (pasos) => {
            const n = pasos.length;
            let h = 2166136261;                        // FNV-1a del texto
            for (const c of pasos.join('\n')) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); }
            let t = h >>> 0;
            const azar = () => {                       // mulberry32
                t = (t + 0x6D2B79F5) | 0;
                let r = Math.imul(t ^ (t >>> 15), 1 | t);
                r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
                return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
            };
            let mejor = [...Array(n).keys()], defectos = Infinity;
            for (let intento = 0; intento < 200 && defectos > 0; intento++) {
                const q = [...Array(n).keys()];
                for (let i = n - 1; i > 0; i--) { const j = Math.floor(azar() * (i + 1)); [q[i], q[j]] = [q[j], q[i]]; }
                const d = q.filter((v, k) => v === k || (k > 0 && v === q[k - 1] + 1)
                    || (k > 1 && v - q[k - 1] === q[k - 1] - q[k - 2])).length;
                if (d < defectos) { mejor = q; defectos = d; }
            }
            return mejor;
        };

        // `libres` declara los pasos que pueden cambiar de lugar entre sí sin que el
        // algoritmo cambie: grupos de posiciones (desde 0) del orden canónico, por
        // lenguaje como `pasos` —`{ pseudo: [[1, 2], [3, 4]], … }`— o una sola lista
        // si vale para todos. Dentro de un grupo cualquier orden cuenta como bien.
        // Sin `libres` se califica contra un único orden, como siempre; por eso un
        // ejercicio con dos lecturas independientes, o dos cálculos que no dependen
        // uno del otro, TIENE que declararlos: si no, castiga una respuesta correcta.
        const OrdenaPasos = ({ titulo = 'Ordene los pasos del algoritmo', enunciado, pasos, lang = 'pseudo', mezcla, pista, libres }) => {
            const idiomas = lenguajesDe(pasos);
            const langs = idiomas.length ? idiomas : [lang];
            const [langActivo, cambiarLang] = useLenguajeActivo(langs, lang);
            const pasosAct = porLenguaje(pasos, langActivo);

            const orden = (mezcla && mezcla.length === pasosAct.length) ? mezcla : mezclaPorDefecto(pasosAct);
            const [secuencia, setSecuencia] = useState([]);
            const [comprobado, setComprobado] = useState(false);
            useEffect(() => { setSecuencia([]); setComprobado(false); }, [langActivo]);
            const disponibles = orden.filter(i => !secuencia.includes(i));

            const agregar = (i) => { if (!comprobado) setSecuencia(s => [...s, i]); };
            const quitar = (pos) => { if (!comprobado) setSecuencia(s => s.filter((_, k) => k !== pos)); };
            const completo = secuencia.length === pasosAct.length;
            const gruposCrudos = libres ? porLenguaje(libres, langActivo) : [];
            const grupos = Array.isArray(gruposCrudos) ? gruposCrudos : [];
            useEffect(() => {
                const usados = new Set();
                grupos.forEach(g => {
                    const mal = !Array.isArray(g) || g.length < 2 || g.some(k => !Number.isInteger(k) || k < 0 || k >= pasosAct.length || usados.has(k));
                    if (mal) console.error(`[OrdenaPasos] \`libres\` (${langActivo}): el grupo ${JSON.stringify(g)} no vale. Cada grupo lleva dos o más posiciones entre 0 y ${pasosAct.length - 1}, y ninguna posición va en dos grupos.`);
                    if (Array.isArray(g)) g.forEach(k => usados.add(k));
                });
            }, [langActivo]);
            const grupoDe = (pos) => grupos.find(g => Array.isArray(g) && g.includes(pos));
            // Por texto, no por índice: dos pasos iguales intercambiados dan el mismo programa.
            // Y un paso de un grupo libre vale en cualquier posición de su grupo.
            const posOk = (pos) => {
                const puesto = pasosAct[secuencia[pos]];
                if (puesto === pasosAct[pos]) return true;
                const g = grupoDe(pos);
                return !!g && g.some(k => pasosAct[k] === puesto);
            };
            const aciertos = secuencia.filter((_, pos) => posOk(pos)).length;
            const todoOk = completo && aciertos === pasosAct.length;

            return (
                <div className="my-6 rounded-2xl border-2 border-primary/20 bg-white p-5 shadow-sm">
                    <div className="flex flex-wrap items-center gap-2 mb-2">
                        <span className="lp-gradient text-white p-2 rounded-lg"><i className="fas fa-list-ol"></i></span>
                        <h4 className="text-base font-bold text-primary" style={{ margin: 0 }}>{titulo}</h4>
                        <EtiquetaTipo texto="E5 · Secuencia" className="ml-auto text-[0.65rem] uppercase tracking-wider font-bold text-white bg-primary/80 rounded px-2 py-0.5" />
                    </div>
                    {enunciado && <div className="text-[0.95rem] text-gray-700 mb-3">{enunciado}</div>}

                    <SelectorLenguaje disponibles={langs} activo={langActivo} onCambiar={cambiarLang} />
                    <div className="grid md:grid-cols-2 gap-4">
                        <div>
                            <div className="text-xs font-bold uppercase tracking-wider text-gray-500 mb-1.5">
                                Pasos disponibles ({disponibles.length})
                            </div>
                            <div className="space-y-1.5 min-h-[60px] rounded-xl border-2 border-dashed border-gray-200 p-2">
                                {disponibles.map(i => (
                                    <button key={i} onClick={() => agregar(i)} disabled={comprobado}
                                        className="w-full text-left px-3 py-2 rounded-lg border border-gray-200 bg-gray-50 hover:border-secondary hover:bg-amber-50 text-[0.88rem] text-gray-700 font-mono transition-all flex items-center gap-2">
                                        <i className="fas fa-plus text-secondary text-xs flex-shrink-0"></i>
                                        <span className="flex-1 whitespace-pre-wrap">{pasosAct[i]}</span>
                                    </button>
                                ))}
                                {!disponibles.length && <p className="text-xs text-gray-500 italic text-center py-3" style={{ margin: 0 }}>Todos los pasos están en la secuencia</p>}
                            </div>
                        </div>

                        <div>
                            <div className="text-xs font-bold uppercase tracking-wider text-gray-500 mb-1.5">
                                Su secuencia ({secuencia.length}/{pasosAct.length})
                            </div>
                            <div className="space-y-1.5 min-h-[60px] rounded-xl border-2 border-dashed p-2" style={{ borderColor: '#ED1E79' }}>
                                {secuencia.map((i, pos) => {
                                    let cls = 'border-gray-200 bg-white';
                                    if (comprobado) cls = posOk(pos) ? 'border-green-500 bg-green-50' : 'border-red-400 bg-red-50';
                                    return (
                                        <button key={pos} onClick={() => quitar(pos)} disabled={comprobado}
                                            className={`w-full text-left px-3 py-2 rounded-lg border text-[0.88rem] text-gray-700 font-mono transition-all flex items-center gap-2 ${cls}`}>
                                            <span className="flex-shrink-0 w-5 h-5 rounded-full lp-gradient text-white flex items-center justify-center text-[0.7rem] font-bold">{pos + 1}</span>
                                            <span className="flex-1 whitespace-pre-wrap">{pasosAct[i]}</span>
                                            {comprobado
                                                ? <i className={`fas ${posOk(pos) ? 'fa-check text-green-600' : 'fa-xmark text-red-500'} text-xs flex-shrink-0`}></i>
                                                : <i className="fas fa-xmark text-gray-300 text-xs flex-shrink-0"></i>}
                                        </button>
                                    );
                                })}
                                {!secuencia.length && <p className="text-xs text-gray-500 italic text-center py-3" style={{ margin: 0 }}>Haga clic en los pasos de la izquierda, en el orden correcto</p>}
                            </div>
                        </div>
                    </div>

                    <div className="mt-3 flex items-center gap-3 flex-wrap">
                        {!comprobado
                            ? <button onClick={() => completo && setComprobado(true)} disabled={!completo}
                                className="text-sm font-bold px-4 py-1.5 rounded-full text-white lp-gradient disabled:opacity-40">
                                <i className="fas fa-flag-checkered mr-1"></i>Comprobar orden
                            </button>
                            : <>
                                <button onClick={() => { setComprobado(false); setSecuencia([]); }}
                                    className="text-sm font-bold px-4 py-1.5 rounded-full border border-primary text-primary hover:bg-primary/5">
                                    <i className="fas fa-rotate-right mr-1"></i>Reintentar
                                </button>
                                <span className={`text-sm font-bold ${todoOk ? 'text-green-600' : 'text-red-500'}`}>
                                    <i className={`fas ${todoOk ? 'fa-circle-check' : 'fa-circle-xmark'} mr-1`}></i>
                                    {todoOk ? '¡Secuencia correcta!' : `${aciertos} de ${pasosAct.length} pasos en ${grupos.length ? 'una posición válida' : 'la posición correcta'}`}
                                </span>
                            </>}
                    </div>
                    {comprobado && grupos.length > 0 && (
                        <p className="text-xs text-gray-600 mt-2" data-orden-libre="">
                            <i className="fas fa-shuffle mr-1 text-secondary"></i>
                            Este ejercicio admite más de un orden: los pasos que no dependen unos de otros pueden intercambiarse.
                        </p>
                    )}
                    {comprobado && !todoOk && (
                        <div className="mt-3 animate-fade-in">
                            <Box type="tip" label={grupos.length ? 'Un orden correcto' : 'Orden correcto'}>
                                <ol className="text-sm" style={{ listStyle: 'decimal', paddingLeft: '1.4rem', margin: 0 }}>
                                    {pasosAct.map((p, i) => <li key={i} className="font-mono text-[0.85rem] whitespace-pre-wrap">{p}</li>)}
                                </ol>
                            </Box>
                        </div>
                    )}
                    {pista && <p className="text-xs text-gray-500 italic mt-2"><i className="fas fa-lightbulb mr-1 text-secondary"></i>{pista}</p>}
                </div>
            );
        };

        /* ============================================================
           E6 · EMPAREJAMIENTO ENTRE REPRESENTACIONES
           solucion[i] = índice en `derecha` que corresponde a izquierda[i]
        ============================================================ */
        const PALETA_PARES = ['#3D008D', '#D81B6A', '#0E7490', '#B91C1C', '#15803D', '#B45309', '#001A4D', '#7C3AED'];

        const Emparejamiento = ({ titulo = 'Empareje cada elemento con su correspondencia', enunciado, izquierda, derecha, solucion, lang = 'pseudo', etiquetaIzq = 'Concepto', etiquetaDer = 'Corresponde a' }) => {
            // El lado izquierdo suele ser codigo y por tanto cambia con el
            // lenguaje; el derecho son significados y no cambia.
            const idiomas = lenguajesDe(izquierda);
            const langs = idiomas.length ? idiomas : [lang];
            const [langActivo, cambiarLang] = useLenguajeActivo(langs, lang);
            const izqAct = porLenguaje(izquierda, langActivo);

            const [pares, setPares] = useState({});
            const [selIzq, setSelIzq] = useState(null);
            const [comprobado, setComprobado] = useState(false);
            const ref = useRef(null);
            useTypeset(ref, [comprobado]);
            useEffect(() => { setPares({}); setSelIzq(null); setComprobado(false); }, [langActivo]);

            const derUsada = (j) => Object.values(pares).includes(j);
            const izqDe = (j) => Object.keys(pares).find(i => pares[i] === j);

            const clicIzq = (i) => {
                if (comprobado) return;
                if (pares[i] !== undefined) { setPares(p => { const n = { ...p }; delete n[i]; return n; }); setSelIzq(null); return; }
                setSelIzq(selIzq === i ? null : i);
            };
            const clicDer = (j) => {
                if (comprobado) return;
                if (derUsada(j)) { const i = izqDe(j); setPares(p => { const n = { ...p }; delete n[i]; return n; }); return; }
                if (selIzq === null) return;
                setPares(p => ({ ...p, [selIzq]: j }));
                setSelIzq(null);
            };

            const completo = Object.keys(pares).length === izqAct.length;
            const parOk = (i) => pares[i] === solucion[i];
            const aciertos = izqAct.map((_, i) => parOk(i)).filter(Boolean).length;
            const todoOk = aciertos === izqAct.length;

            return (
                <div ref={ref} className="my-6 rounded-2xl border-2 border-primary/20 bg-white p-5 shadow-sm">
                    <div className="flex flex-wrap items-center gap-2 mb-2">
                        <span className="lp-gradient text-white p-2 rounded-lg"><i className="fas fa-link"></i></span>
                        <h4 className="text-base font-bold text-primary" style={{ margin: 0 }}>{titulo}</h4>
                        <EtiquetaTipo texto="E6 · Emparejar" className="ml-auto text-[0.65rem] uppercase tracking-wider font-bold text-white bg-primary/80 rounded px-2 py-0.5" />
                    </div>
                    {enunciado && <div className="text-[0.95rem] text-gray-700 mb-2">{enunciado}</div>}
                    <SelectorLenguaje disponibles={langs} activo={langActivo} onCambiar={cambiarLang} />
                    <p className="text-xs text-gray-500 mb-3">
                        <i className="fas fa-hand-pointer mr-1"></i>
                        Haga clic en un elemento de la izquierda y luego en su pareja de la derecha. Para deshacer, haga clic sobre cualquiera de los dos.
                    </p>

                    <div className="grid md:grid-cols-2 gap-4">
                        <div>
                            <div className="text-xs font-bold uppercase tracking-wider text-gray-500 mb-1.5">{etiquetaIzq}</div>
                            <div className="space-y-1.5">
                                {izqAct.map((t, i) => {
                                    const emparejado = pares[i] !== undefined;
                                    const color = emparejado ? PALETA_PARES[pares[i] % PALETA_PARES.length] : null;
                                    let cls = 'border-gray-200 bg-white hover:border-primary/40';
                                    if (comprobado && emparejado) cls = parOk(i) ? 'border-green-500 bg-green-50' : 'border-red-400 bg-red-50';
                                    else if (selIzq === i) cls = 'border-secondary bg-amber-50 ring-2 ring-secondary/30';
                                    return (
                                        <button key={i} onClick={() => clicIzq(i)} disabled={comprobado}
                                            aria-pressed={selIzq === i}
                                            className={`w-full text-left px-3 py-2 rounded-lg border text-[0.88rem] text-gray-700 transition-all flex items-start gap-2 ${cls}`}>
                                            <span className={'flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-[0.7rem] font-bold mt-0.5 ' + (color ? 'text-white' : 'text-navy')}
                                                style={{ background: color || '#CBD5E1' }}>
                                                {emparejado ? String.fromCharCode(65 + pares[i]) : i + 1}
                                            </span>
                                            <span className="flex-1">{t}</span>
                                            {comprobado && emparejado && <i className={`fas ${parOk(i) ? 'fa-check text-green-600' : 'fa-xmark text-red-500'} text-xs mt-1`}></i>}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        <div>
                            <div className="text-xs font-bold uppercase tracking-wider text-gray-500 mb-1.5">{etiquetaDer}</div>
                            <div className="space-y-1.5">
                                {derecha.map((t, j) => {
                                    const usada = derUsada(j);
                                    const color = usada ? PALETA_PARES[j % PALETA_PARES.length] : null;
                                    let cls = 'border-gray-200 bg-white hover:border-primary/40';
                                    if (usada) cls = 'border-gray-300 bg-gray-50';
                                    if (comprobado && usada) {
                                        const i = Number(izqDe(j));
                                        cls = parOk(i) ? 'border-green-500 bg-green-50' : 'border-red-400 bg-red-50';
                                    }
                                    return (
                                        <button key={j} onClick={() => clicDer(j)} disabled={comprobado}
                                            className={`w-full text-left px-3 py-2 rounded-lg border text-[0.88rem] text-gray-700 transition-all flex items-start gap-2 ${cls}`}>
                                            <span className={'flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-[0.7rem] font-bold mt-0.5 ' + (color ? 'text-white' : 'text-navy')}
                                                style={{ background: color || '#CBD5E1' }}>
                                                {String.fromCharCode(65 + j)}
                                            </span>
                                            <span className="flex-1">{t}</span>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </div>

                    <div className="mt-3 flex items-center gap-3 flex-wrap">
                        {!comprobado
                            ? <button onClick={() => completo && setComprobado(true)} disabled={!completo}
                                className="text-sm font-bold px-4 py-1.5 rounded-full text-white lp-gradient disabled:opacity-40">
                                <i className="fas fa-check-double mr-1"></i>Comprobar ({Object.keys(pares).length}/{izqAct.length})
                            </button>
                            : <>
                                <button onClick={() => { setComprobado(false); setPares({}); setSelIzq(null); }}
                                    className="text-sm font-bold px-4 py-1.5 rounded-full border border-primary text-primary hover:bg-primary/5">
                                    <i className="fas fa-rotate-right mr-1"></i>Reintentar
                                </button>
                                <span className={`text-sm font-bold ${todoOk ? 'text-green-600' : 'text-red-500'}`}>
                                    <i className={`fas ${todoOk ? 'fa-circle-check' : 'fa-circle-xmark'} mr-1`}></i>
                                    {aciertos} de {izqAct.length} correctos
                                </span>
                            </>}
                    </div>
                    {comprobado && !todoOk && (
                        <div className="mt-3 animate-fade-in">
                            <Box type="tip" label="Emparejamiento correcto">
                                <ul className="text-sm" style={{ listStyle: 'none', padding: 0, margin: 0 }}>
                                    {izqAct.map((t, i) => (
                                        <li key={i} className="mb-1">
                                            <strong>{i + 1}</strong> → <strong>{String.fromCharCode(65 + solucion[i])}</strong>
                                            <span className="text-gray-500"> · {derecha[solucion[i]]}</span>
                                        </li>
                                    ))}
                                </ul>
                            </Box>
                        </div>
                    )}
                </div>
            );
        };

        /* ============================================================
           TRAZADOR — motor de traza paso a paso (exposición, no ejercicio)

           Aquí el estudiante MIRA una traza ejecutarse; en `TablaTraza` le toca
           hacerla. Por eso no califica nada y `verificar.py` no lo cuenta en la
           cuota de ejercicios: enseña el método que el E1 después evalúa.

           `pasos` lleva DELTAS, no el estado completo. Cada paso declara solo
           las variables que su instrucción cambia, el componente acumula el
           resto, y la celda que cambió se resalta. Escribir el estado entero en
           cada fila sería más largo y, sobre todo, escondería lo único que hay
           que ver: qué tocó esta instrucción y qué dejó igual.

               { linea: 4,                        // o {pseudo, python, r, vba}
                 estado: { interes: '2.160.000' },  // solo lo que cambia
                 nota: 'Ya hay capital y tasa, así que el interés se puede calcular.',
                 salida: SALIDA_INTERES }         // opcional, también por lenguaje

           `linea` admite objeto por lenguaje porque el número cambia —VBA añade
           `Sub` y `Dim`, Python no lleva declaraciones—, y `salida` también,
           porque lo impreso no coincide: Python saca `2,160,000` y R `2160000`.
           Los VALORES de las variables no: son los mismos en los cuatro, y
           hacérselo ver al estudiante es parte del objetivo.

           Lo ya ejecutado se calcula recorriendo los pasos dados, NO las líneas
           anteriores a la activa. En este capítulo daría igual —la secuencia va
           de arriba abajo—, pero los capítulos 4 y 5 heredan el componente y
           allí el flujo salta y se repite: «ya ejecutado» dejaría de coincidir
           con «todo lo que está más arriba».
        ============================================================ */
        const Trazador = ({ titulo = 'Traza paso a paso', enunciado, codigo, lang = 'pseudo', variables, pasos, nota }) => {
            const idiomas = lenguajesDe(codigo);
            const disponibles = idiomas.length ? idiomas : [lang];
            const [langActivo, cambiarLang] = useLenguajeActivo(disponibles, lang);

            // Cuántas instrucciones se han ejecutado, de 0 a n. El 0 no es un
            // caso degenerado: «antes de empezar, ninguna variable tiene valor»
            // es la primera fila de cualquier prueba de escritorio hecha a mano.
            const [hechos, setHechos] = useState(0);
            const ref = useRef(null);
            useTypeset(ref, [hechos, langActivo]);

            const total = pasos.length;
            const lineasAct = String(porLenguaje(codigo, langActivo)).split('\n');

            const lineaDe = (p) => {
                const v = Number(porLenguaje(p.linea, langActivo));
                return Number.isFinite(v) ? v : null;
            };

            // Estado acumulado tras cada paso, y qué claves cambió cada uno. Una
            // variable `efimera` no se arrastra: vale solo en el paso que la
            // escribe. Es para lo que no es una variable del programa sino algo
            // que se evalúa, como una condición: arrastrada, la columna
            // «saldo > 0» seguía diciendo «Verdadero» con el saldo ya en
            // −200 000 (L5).
            const efimeras = new Set(variables.filter(v => v.efimera).map(v => v.clave));
            const acumulado = [];
            const cambiadas = [];
            let estado = {};
            pasos.forEach(p => {
                const arrastrado = Object.fromEntries(Object.entries(estado).filter(([k]) => !efimeras.has(k)));
                estado = { ...arrastrado, ...(p.estado || {}) };
                acumulado.push(estado);
                cambiadas.push(Object.keys(p.estado || {}));
            });

            const actual = hechos > 0 ? pasos[hechos - 1] : null;
            const lineaActiva = actual ? lineaDe(actual) : null;
            const ejecutadas = new Set(pasos.slice(0, hechos).map(lineaDe).filter(n => n !== null));
            const conSalida = pasos.some(p => p.salida !== undefined && p.salida !== null);

            const ir = (n) => setHechos(Math.max(0, Math.min(total, n)));

            // Sin tabla de teclas: un objeto indexado por `e.key` devolvería el
            // `toString` heredado si alguien pulsa una tecla con ese nombre.
            const teclado = (e) => {
                if (e.key === 'ArrowRight') { e.preventDefault(); ir(hechos + 1); }
                else if (e.key === 'ArrowLeft') { e.preventDefault(); ir(hechos - 1); }
                else if (e.key === 'Home') { e.preventDefault(); ir(0); }
                else if (e.key === 'End') { e.preventDefault(); ir(total); }
            };

            const instruccionDe = (p) => {
                const n = lineaDe(p);
                return n && lineasAct[n - 1] !== undefined ? lineasAct[n - 1].trim() : '—';
            };

            return (
                <div ref={ref} className="my-6 rounded-2xl border-2 border-primary/20 bg-white p-5 shadow-sm">
                    <div className="flex flex-wrap items-center gap-2 mb-2">
                        <span className="lp-gradient text-white p-2 rounded-lg"><i className="fas fa-shoe-prints"></i></span>
                        <h4 className="text-base font-bold text-primary" style={{ margin: 0 }}>{titulo}</h4>
                        <span className="ml-auto text-[0.65rem] uppercase tracking-wider font-bold text-white bg-teal rounded px-2 py-0.5">Traza guiada</span>
                    </div>
                    {enunciado && <div className="text-[0.95rem] text-gray-700 mb-3">{enunciado}</div>}

                    <SelectorLenguaje disponibles={disponibles} activo={langActivo} onCambiar={cambiarLang} />

                    {/* La región entera es un solo destino de tabulación: dentro
                        hay hasta doce saltos directos, y hacer que el tabulador
                        los recorra uno a uno para llegar al final del bloque
                        convierte la navegación por teclado en un castigo. */}
                    <div tabIndex={0} onKeyDown={teclado} role="group"
                        aria-label={`${titulo}. Use las flechas izquierda y derecha para avanzar y retroceder.`}
                        className="rounded-xl outline-none focus:ring-2 focus:ring-secondary/60">

                    {/* Un solo desplazamiento horizontal para TODO el bloque, no
                        uno por línea: con `overflow-x` en cada línea, un móvil
                        de 375 px pinta una barra debajo de cada instrucción y
                        además cada línea se desplaza por su cuenta, de modo que
                        la sangría deja de alinear. El `min-w-max` interior le da
                        a todas las filas el ancho de la más larga, para que la
                        franja de la línea activa llegue hasta el final. */}
                        <div className="rounded-xl overflow-hidden border border-gray-700 bg-gray-900">
                            <div className="overflow-x-auto">
                                <div className="min-w-max">
                                    {lineasAct.map((l, i) => {
                                        const n = i + 1;
                                        const activa = n === lineaActiva;
                                        const hecha = ejecutadas.has(n);
                                        const cls = activa ? 'bg-amber-500/20 ring-1 ring-amber-400'
                                            : hecha ? 'bg-white/[0.04]' : '';
                                        return (
                                            <div key={i} className={`flex items-start gap-3 px-3 py-1 font-mono text-[0.82rem] transition-colors ${cls}`}>
                                                <span className="select-none w-6 text-right flex-shrink-0 text-gray-400">{n}</span>
                                                <span className={`select-none w-3 flex-shrink-0 ${activa ? 'text-amber-400' : 'text-gray-700'}`}>
                                                    {activa ? '▶' : hecha ? '·' : ' '}
                                                </span>
                                                <span className={`whitespace-pre ${activa ? 'text-white' : 'text-gray-100'}`}
                                                    dangerouslySetInnerHTML={{ __html: resaltar(l, langActivo) }} />
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>

                        <div className="mt-3 flex items-center gap-2 flex-wrap">
                            <button onClick={() => ir(hechos - 1)} disabled={hechos === 0}
                                className="text-sm font-bold px-3.5 py-1.5 rounded-full border border-primary text-primary hover:bg-primary/5 disabled:opacity-40">
                                <i className="fas fa-chevron-left mr-1"></i>Anterior
                            </button>
                            <button onClick={() => ir(hechos + 1)} disabled={hechos === total}
                                className="text-sm font-bold px-4 py-1.5 rounded-full text-white lp-gradient hover:opacity-90 disabled:opacity-40">
                                Siguiente<i className="fas fa-chevron-right ml-1"></i>
                            </button>
                            <button onClick={() => ir(0)} disabled={hechos === 0}
                                className="text-xs font-semibold text-gray-500 hover:text-primary underline disabled:opacity-40 disabled:no-underline">
                                <i className="fas fa-rotate-right mr-1"></i>Reiniciar
                            </button>
                            <span className="ml-auto text-xs text-gray-500">
                                Paso <strong className="text-primary">{hechos}</strong> de {total}
                                <span className="hidden sm:inline text-gray-500"> · flechas ← →</span>
                            </span>
                        </div>

                        <div className="mt-2 h-1 rounded-full bg-gray-100 overflow-hidden">
                            <div className="h-full lp-gradient transition-all duration-200"
                                style={{ width: `${total ? (hechos / total) * 100 : 0}%` }}></div>
                        </div>

                        <div className="mt-2 flex flex-wrap gap-1">
                            {pasos.map((p, i) => (
                                <button key={i} onClick={() => ir(i + 1)} aria-label={`Ir al paso ${i + 1}`}
                                    aria-current={hechos === i + 1 ? 'step' : undefined}
                                    className={`w-6 h-6 rounded text-[0.68rem] font-bold border transition-colors ${hechos === i + 1
                                        ? 'lp-gradient text-white border-transparent'
                                        : i < hechos ? 'bg-primary/10 text-primary border-primary/20'
                                            : 'bg-white text-gray-500 border-gray-200 hover:border-primary/40'}`}>
                                    {i + 1}
                                </button>
                            ))}
                        </div>

                        <p role="status" aria-live="polite" className="mt-3 mb-0 text-[0.9rem] text-gray-700 min-h-[2.6rem] rounded-lg px-3 py-2"
                            style={{ background: 'rgba(14,116,144,0.06)', borderLeft: '3px solid #0E7490' }}>
                            {actual
                                ? <><strong className="text-teal">Paso {hechos}.</strong> {actual.nota}</>
                                : <span className="text-gray-600">Aún no se ha ejecutado ninguna instrucción: ninguna variable tiene valor. Pulse <strong>Siguiente</strong>.</span>}
                        </p>

                        <div className="overflow-x-auto mt-3">
                            <table className="w-full text-sm border-collapse">
                                <thead>
                                    <tr>
                                        <th className="bg-primary/10 text-primary text-left px-2 py-2 border border-gray-200 font-semibold w-8">#</th>
                                        <th className="bg-primary/10 text-primary text-left px-3 py-2 border border-gray-200 font-semibold">Instrucción</th>
                                        {variables.map(v => (
                                            <th key={v.clave} className="bg-primary/10 text-primary text-left px-3 py-2 border border-gray-200 font-semibold whitespace-nowrap">
                                                {v.titulo || v.clave}
                                            </th>
                                        ))}
                                        {conSalida && <th className="bg-primary/10 text-primary text-left px-3 py-2 border border-gray-200 font-semibold">Salida</th>}
                                    </tr>
                                </thead>
                                <tbody>
                                    {hechos === 0 && (
                                        <tr>
                                            <td colSpan={2 + variables.length + (conSalida ? 1 : 0)}
                                                className="px-3 py-3 border border-gray-200 text-gray-500 text-center italic">
                                                La tabla se llena a medida que avanza la traza.
                                            </td>
                                        </tr>
                                    )}
                                    {pasos.slice(0, hechos).map((p, i) => (
                                        <tr key={i} className={i === hechos - 1 ? 'bg-amber-50' : i % 2 ? 'bg-gray-50/60' : ''}>
                                            <td className="px-2 py-1.5 border border-gray-200 text-gray-500 text-center">{i + 1}</td>
                                            <td className="px-3 py-1.5 border border-gray-200 text-gray-700 font-mono text-[0.8rem]">{instruccionDe(p)}</td>
                                            {variables.map(v => {
                                                const cambio = cambiadas[i].includes(v.clave);
                                                const val = acumulado[i][v.clave];
                                                return (
                                                    <td key={v.clave}
                                                        className={`px-3 py-1.5 border border-gray-200 font-mono text-[0.82rem] ${cambio ? 'font-bold text-secondary-texto bg-secondary/5' : 'text-gray-700'}`}>
                                                        {val === undefined ? <span className="text-gray-300">—</span> : val}
                                                    </td>
                                                );
                                            })}
                                            {conSalida && (
                                                <td className="px-3 py-1.5 border border-gray-200 font-mono text-[0.8rem] text-teal">
                                                    {p.salida !== undefined && p.salida !== null
                                                        ? porLenguaje(p.salida, langActivo)
                                                        : <span className="text-gray-300">—</span>}
                                                </td>
                                            )}
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {nota && <p className="text-xs text-gray-500 italic mt-3 mb-0">{nota}</p>}
                </div>
            );
        };

        [TablaTraza, DetectaError, Comparador, OrdenaPasos, Emparejamiento].forEach(c => AUTOETIQUETADOS.add(c));

        /* ============================================================
           FUENTES — citas, lista de referencias y procedencia de los datos

           Nada de esto se teclea: las entradas salen de Zotero
           (`exportar_zotero.py` → `_fuentes/referencias.json`) y llegan al
           capítulo ya formateadas en APA 7, en una isla de JSON que estampa
           `estampar_referencias.py` después del script, entre los centinelas
           LP-REFS. Aquí solo se leen.

             <Cita k="clave" />                    (Autor, 2024)
             <Cita k="clave" loc="p. 12" />        (Autor, 2024, p. 12)
             <Cita k="clave" narrativa />          Autor (2024)
             <Cita k="a; b" pre="véase" />         (véase Autor, 2019; Otro, 2024)
             <Referencias />                       la lista, al final de la última lección
             <ParaProfundizar k="a; b" />          lecturas recomendadas que el capítulo NO cita,
                                                   después de <Referencias />
             <Fuente k="clave" />                  Fuente: Autor (2024).
             <Fuente propia />                     Fuente: elaboración propia.
             <Fuente ilustrativo />                Datos ilustrativos…
             <Ilustrativo>…</Ilustrativo>          nota: estas cifras no describen un producto real

           El `App` pinta una sola lección a la vez, así que un `href="#ref-…"`
           no alcanza una lista que está en otra lección. La cita lanza el
           evento `lp:ir-a`, que el `App` escucha: cambia de lección y lleva al
           ancla. `LP_NAV` guarda de dónde se salió, para poder volver.

           Una clave que no está en la isla se pinta como un chip rojo y escribe
           en `console.error`: así la ve quien lee y la ve `sonda_navegador.mjs`,
           que falla con cualquier error de consola.
        ============================================================ */
        const LP_NAV = { leccion: 0, retorno: null };
        const LP_REFS = { leido: false, bloque: null };

        const referenciasDelCapitulo = () => {
            if (!LP_REFS.leido) {
                LP_REFS.leido = true;
                const isla = document.getElementById('lp-referencias');
                if (isla) {
                    try { LP_REFS.bloque = JSON.parse(isla.textContent); }
                    catch (e) { console.error('[LP-REFS] la isla de referencias no es JSON válido:', e.message); }
                }
            }
            return LP_REFS.bloque;
        };

        const entradaDe = (clave) => {
            const bloque = referenciasDelCapitulo();
            return (bloque && bloque.entradas && bloque.entradas[clave]) || null;
        };

        /* El HTML de una entrada trae solo `em`, `i`, `sup`, `sub` y `a[href]`:
           lo garantiza el estampador y lo vuelve a exigir este lector, que no
           usa `dangerouslySetInnerHTML`. Cualquier otra cosa que apareciera en
           la isla se pinta como texto, no como etiqueta. */
        const ENTIDADES_HTML = { '&amp;': '&', '&lt;': '<', '&gt;': '>', '&quot;': '"', '&#x27;': "'", '&#39;': "'" };
        const quitarEntidades = (s) => s.replace(/&(?:amp|lt|gt|quot|#x27|#39);/g, m => ENTIDADES_HTML[m]);

        const pintarEntrada = (html) => {
            const raiz = { hijos: [] };
            const pila = [raiz];
            const etiqueta = /<(\/?)(em|i|sup|sub|a)(?:\s+href="(https?:\/\/[^"<>\s]+)")?>/g;
            const texto = (t) => { if (t) pila[pila.length - 1].hijos.push(quitarEntidades(t)); };
            let ultimo = 0, m;
            while ((m = etiqueta.exec(html || '')) !== null) {
                texto(html.slice(ultimo, m.index));
                ultimo = etiqueta.lastIndex;
                if (!m[1]) {
                    const nodo = { tag: m[2], href: m[3] ? quitarEntidades(m[3]) : null, hijos: [] };
                    pila[pila.length - 1].hijos.push(nodo);
                    pila.push(nodo);
                } else if (pila.length > 1 && pila[pila.length - 1].tag === m[2]) {
                    pila.pop();
                }
            }
            texto((html || '').slice(ultimo));
            const aReact = (n, i) => {
                if (typeof n === 'string') return n;
                const hijos = n.hijos.map(aReact);
                if (n.tag !== 'a') return React.createElement(n.tag, { key: i }, hijos);
                if (!n.href) return <span key={i}>{hijos}</span>;
                // `overflowWrap`: una URL es una sola palabra de 60 caracteres,
                // y a 375 px se sale de la pantalla si no se la deja partir.
                return <a key={i} href={n.href} target="_blank" rel="noopener noreferrer"
                    className="text-primary underline" style={{ overflowWrap: 'anywhere' }}>{hijos}</a>;
            };
            return raiz.hijos.map(aReact);
        };

        /* Lleva al ancla de un `lp:ir-a`: un `id` (`ancla`) o la cita número
           `cita` de la lección. Las citas se cuentan y no se numeran con un id
           porque la lección se desmonta al salir de ella: un id generado al
           montar sería otro a la vuelta.

           Mueve el contenedor que hace scroll en vez de llamar a
           `scrollIntoView`, que además de ese movería los que tienen
           `overflow: hidden` —el marco del `App`—, y sin animación: el panel de
           vista previa no corre `requestAnimationFrame`. */
        const irAlAncla = (detalle, destacar = true) => {
            const d = detalle || {};
            const el = d.ancla ? document.getElementById(d.ancla)
                : Number.isInteger(d.cita) ? document.querySelectorAll('a[data-cita]')[d.cita] : null;
            if (!el) return false;
            let cont = el.parentElement;
            while (cont && !(/(auto|scroll)/.test(getComputedStyle(cont).overflowY) && cont.scrollHeight > cont.clientHeight)) {
                cont = cont.parentElement;
            }
            if (cont) {
                const r = el.getBoundingClientRect(), c = cont.getBoundingClientRect();
                if (r.top < c.top + 8 || r.bottom > c.bottom - 8) cont.scrollTop += r.top - c.top - cont.clientHeight / 3;
            } else {
                el.scrollIntoView({ block: 'center' });
            }
            if (destacar) {
                try { el.focus({ preventScroll: true }); } catch (e) { /* sin foco no pasa nada */ }
                try {
                    el.animate([{ backgroundColor: 'rgba(61,0,141,0.20)' }, { backgroundColor: 'rgba(61,0,141,0)' }],
                        { duration: 1600, easing: 'ease-out' });
                } catch (e) { /* sin Web Animations se queda sin el destello */ }
            }
            return true;
        };

        const ChipSinFuente = ({ children }) => (
            <span data-cita-rota="" className="inline-block rounded px-1.5 text-[0.85em] font-semibold"
                style={{ color: '#B91C1C', background: '#FEF2F2', border: '1px solid #FCA5A5' }}>{children}</span>
        );

        const Cita = ({ k, loc, narrativa = false, pre }) => {
            const claves = String(k === undefined || k === null ? '' : k).split(';').map(c => c.trim()).filter(Boolean);
            const faltan = claves.filter(c => !entradaDe(c));
            const fallo = !claves.length ? 'no trae ninguna clave en `k`'
                : faltan.length ? `la clave «${faltan.join('; ')}» no está en la isla de referencias del capítulo`
                    : (loc && claves.length > 1) ? 'lleva `loc` y varias claves: no se sabe a cuál pertenece'
                        : null;
            useEffect(() => {
                if (fallo) console.error(`[Cita] <Cita k="${k === undefined ? '' : k}">: ${fallo}. Revise la clave y ejecute estampar_referencias.py.`);
            }, [fallo]);
            if (fallo) return <ChipSinFuente>[¿cita «{faltan.length ? faltan.join('; ') : claves.join('; ')}»?]</ChipSinFuente>;

            const irALista = (clave) => (e) => {
                e.preventDefault();
                const citas = Array.from(document.querySelectorAll('a[data-cita]'));
                LP_NAV.retorno = { leccion: LP_NAV.leccion, cita: citas.indexOf(e.currentTarget), clave };
                window.dispatchEvent(new CustomEvent('lp:ir-a', { detail: { leccion: 'ultima', ancla: `ref-${clave}` } }));
            };
            const enlace = (clave, contenido) => (
                <a key={clave} href={`#ref-${clave}`} role="doc-biblioref" data-cita={clave}
                    title={entradaDe(clave).plano} onClick={irALista(clave)}
                    className="text-primary underline decoration-dotted underline-offset-2 hover:decoration-solid rounded-sm">
                    {contenido}
                </a>
            );
            // Dos obras seguidas del mismo autor comparten el nombre, como en
            // la APA: «(Entidad, 2024a, 2024b)» y no «(Entidad, 2024a; Entidad, 2024b)».
            const grupos = [];
            claves.forEach(clave => {
                const e = entradaDe(clave);
                const ultimo = grupos[grupos.length - 1];
                if (ultimo && ultimo.autor === e.autor) ultimo.obras.push({ clave, anio: e.anio });
                else grupos.push({ autor: e.autor, obras: [{ clave, anio: e.anio }] });
            });
            const entre = (piezas, sep, ultimoSep = sep) => piezas.reduce((acc, p, i) =>
                i === 0 ? [p] : [...acc, <React.Fragment key={`s${i}`}>{i === piezas.length - 1 ? ultimoSep : sep}</React.Fragment>, p], []);
            const lugar = loc ? <>, {loc}</> : null;

            if (narrativa) {
                // Como pandoc: en la cita narrativa el nombre es prosa y el enlace es el año.
                const piezas = grupos.map((g, i) => (
                    <React.Fragment key={i}>
                        {pintarEntrada(g.autor)} ({entre(g.obras.map(o => enlace(o.clave, pintarEntrada(o.anio))), ', ')}{lugar})
                    </React.Fragment>
                ));
                return <span className="lp-cita">{pre ? <>{pre} </> : null}{entre(piezas, ', ', ' y ')}</span>;
            }
            const piezas = grupos.map((g, i) => (
                <React.Fragment key={i}>
                    {entre(g.obras.map((o, j) => enlace(o.clave,
                        j === 0 ? <>{pintarEntrada(g.autor)}, {pintarEntrada(o.anio)}</> : pintarEntrada(o.anio))), ', ')}
                </React.Fragment>
            ));
            return <span className="lp-cita">({pre ? <>{pre} </> : null}{entre(piezas, '; ')}{lugar})</span>;
        };

        // Sangría francesa, la de las dos listas: la primera línea sale al margen
        // y las demás entran 1,5 rem, que a 375 px aún deja 44 caracteres.
        const ESTILO_ENTRADA = {
            paddingLeft: '2rem', textIndent: '-1.5rem', paddingRight: '0.5rem',
            paddingTop: '0.3rem', paddingBottom: '0.3rem', marginBottom: '0.3rem', lineHeight: 1.6,
            overflowWrap: 'anywhere', borderLeft: '3px solid transparent',
        };

        const Referencias = ({ titulo = 'Referencias' }) => {
            const bloque = referenciasDelCapitulo();
            const orden = (bloque && Array.isArray(bloque.orden)) ? bloque.orden.filter(c => bloque.entradas && bloque.entradas[c]) : [];
            const [destino, setDestino] = useState(() => (LP_NAV.retorno ? LP_NAV.retorno.clave : null));
            const [retorno, setRetorno] = useState(() => LP_NAV.retorno);

            useEffect(() => {
                if (!orden.length) console.error('[Referencias] <Referencias /> no tiene nada que listar: el capítulo no trae isla de referencias. Ejecute estampar_referencias.py.');
                // La lista ya estaba montada cuando se pulsó la cita (la cita
                // está en esta misma lección): se entera por el evento.
                const alIr = (e) => {
                    const ancla = (e.detail && e.detail.ancla) || '';
                    if (!ancla.startsWith('ref-')) return;
                    setDestino(ancla.slice(4));
                    setRetorno(LP_NAV.retorno);
                };
                window.addEventListener('lp:ir-a', alIr);
                // Al salir de la lección se olvida el regreso: un «Volver al
                // texto» que llevara a una cita de hace tres lecciones confunde.
                return () => { window.removeEventListener('lp:ir-a', alIr); LP_NAV.retorno = null; };
            }, []);

            const volver = () => {
                const r = retorno;
                setRetorno(null); setDestino(null); LP_NAV.retorno = null;
                if (r) window.dispatchEvent(new CustomEvent('lp:ir-a', { detail: { leccion: r.leccion, cita: r.cita } }));
            };

            if (!orden.length) return <p><ChipSinFuente>[¿referencias?]</ChipSinFuente></p>;
            return (
                <section role="doc-bibliography" aria-label={titulo} className="my-6">
                    <h3>{titulo}</h3>
                    <ul className="text-[0.92rem] text-gray-700" style={{ listStyle: 'none', paddingLeft: 0, margin: 0 }}>
                        {orden.map(clave => {
                            const aqui = destino === clave;
                            return (
                                <li key={clave} id={`ref-${clave}`} role="doc-biblioentry" tabIndex={-1}
                                    className="rounded-md outline-none"
                                    style={{
                                        ...ESTILO_ENTRADA,
                                        borderLeft: `3px solid ${aqui ? '#ED1E79' : 'transparent'}`,
                                        background: aqui ? '#F5F0FA' : 'transparent',
                                    }}>
                                    {pintarEntrada(bloque.entradas[clave].html)}
                                    {aqui && retorno && (
                                        <span className="block mt-1.5" style={{ textIndent: 0 }}>
                                            <button type="button" onClick={volver}
                                                className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold text-white lp-gradient hover:opacity-90">
                                                <i className="fas fa-arrow-turn-up fa-flip-horizontal" aria-hidden="true"></i>Volver al texto
                                            </button>
                                        </span>
                                    )}
                                </li>
                            );
                        })}
                    </ul>
                </section>
            );
        };

        /* Lecturas recomendadas: obras que el capítulo NO cita. Van aparte de
           «Referencias» porque esa lista dice «de aquí salió lo que se afirma»,
           y esta no afirma nada de nadie; mezcladas, un libro que nadie abrió
           para escribir el capítulo pasaría por fuente suya. Por eso el
           título y la frase son fijos y no hay propiedad para cambiarlos.

           Las claves se escriben en `k`, como en `Cita`, y las entradas llegan
           formateadas en el campo `profundizar` de la isla. Se pintan en el
           orden de la isla —el de la APA—, no en el de `k`. Ninguna cita lleva
           aquí, así que las entradas no tienen `id="ref-…"`: una clave no
           puede estar en las dos listas, y si lo estuviera no habría dos
           elementos con el mismo id. Sin claves no pinta nada. */
        const ParaProfundizar = ({ k }) => {
            const claves = String(k === undefined || k === null ? '' : k).split(';').map(c => c.trim()).filter(Boolean);
            const bloque = referenciasDelCapitulo();
            const lecturas = (bloque && bloque.profundizar) || {};
            const entradas = lecturas.entradas || {};
            const faltan = claves.filter(c => !entradas[c]);
            const queFalta = faltan.join('; ');
            useEffect(() => {
                if (queFalta) console.error(`[ParaProfundizar] <ParaProfundizar k="${k}">: la clave «${queFalta}» no está entre las lecturas recomendadas de la isla de referencias del capítulo. Revise la clave y ejecute estampar_referencias.py.`);
            }, [queFalta]);
            if (!claves.length) return null;
            const orden = (Array.isArray(lecturas.orden) ? lecturas.orden : []).filter(c => claves.includes(c) && entradas[c]);
            return (
                <section aria-label="Para profundizar" data-para-profundizar="" className="my-6">
                    <h3>Para profundizar</h3>
                    <p>Lecturas recomendadas. El capítulo no les atribuye ninguna afirmación.</p>
                    <ul className="text-[0.92rem] text-gray-700" style={{ listStyle: 'none', paddingLeft: 0, margin: 0 }}>
                        {orden.map(clave => (
                            <li key={clave} data-lectura={clave} className="rounded-md" style={ESTILO_ENTRADA}>
                                {pintarEntrada(entradas[clave].html)}
                            </li>
                        ))}
                    </ul>
                    {queFalta && <p><ChipSinFuente>[¿lectura «{queFalta}»?]</ChipSinFuente></p>}
                </section>
            );
        };

        /* De dónde sale lo que muestra una figura o una tabla. Exactamente una
           modalidad: una fuente citada (`k`), elaboración propia (`propia`) o
           datos que no son de nadie (`ilustrativo`). Con ninguna o con dos, la
           procedencia es justo lo que no se sabe, y se pinta como error. Los
           hijos completan la frase: «Fuente: adaptado de Autor (2024).» */
        const Fuente = ({ k, loc, propia, ilustrativo, children }) => {
            const conClave = k !== undefined && k !== null && String(k).trim() !== '';
            const modalidades = [conClave, !!propia, !!ilustrativo].filter(Boolean).length;
            useEffect(() => {
                if (modalidades !== 1) console.error(`[Fuente] <Fuente> necesita exactamente una modalidad —k, propia o ilustrativo— y trae ${modalidades}.`);
            }, [modalidades]);
            if (modalidades !== 1) return <p className="text-center"><ChipSinFuente>[¿fuente?]</ChipSinFuente></p>;
            return (
                <p className="text-xs text-gray-500 text-center" data-fuente={conClave ? 'cita' : propia ? 'propia' : 'ilustrativo'}
                    {...(ilustrativo ? { 'data-ilustrativo': '' } : {})}>
                    {conClave && <><span className="font-semibold">Fuente:</span> {children ? <>{children} </> : null}<Cita k={k} loc={loc} narrativa />.</>}
                    {propia && <><span className="font-semibold">Fuente:</span> elaboración propia{children ? <> {children}</> : null}.</>}
                    {ilustrativo && <><span className="font-semibold">Datos ilustrativos:</span> se eligieron para que la cuenta se pueda seguir, no describen un producto ni una entidad reales.{children ? <> {children}</> : null}</>}
                </p>
            );
        };

        /* Nota que declara ilustrativas las cifras de un pasaje. Lleva
           `data-ilustrativo` para que se pueda contar qué cifras del capítulo
           se declararon así y cuáles tienen fuente. */
        const Ilustrativo = ({ children }) => (
            <div data-ilustrativo="" className="rounded-xl px-5 py-4 my-4 border-l-4" style={{ borderColor: '#0E7490', background: '#F0F9FB' }}>
                <span className="inline-flex items-center gap-2 text-[0.7rem] uppercase tracking-wider font-bold rounded mb-2 px-2 py-0.5 text-white" style={{ background: '#0E7490' }}>
                    <i className="fas fa-flask"></i>Datos ilustrativos
                </span>
                <div className="text-gray-700 leading-relaxed text-[0.95rem]">{children}</div>
            </div>
        );
        /* === LP-CORE FIN === */
