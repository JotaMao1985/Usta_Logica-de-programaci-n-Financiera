        /* ============================================================
           CONFIGURACIÓN DEL CAPÍTULO
           Al crear un capítulo nuevo, esto es lo único que cambia aquí
           arriba; el contenido va en las secciones de más abajo.
        ============================================================ */
        // RA1, textual del syllabus (fila 31): «Construye un algoritmo

        /* ============================================================
           FlotanteVisualizer — LOCAL DE ESTE CAPÍTULO
           No va en LP-CORE: lo usa un solo capítulo, y meterlo en la

        const PRESETS_FLOTANTE = [
            { v: '0.1', et: '0,1', nota: 'un décimo' },
            { v: '0.25', et: '0,25', nota: 'un cuarto' },
            { v: '0.5', et: '0,5', nota: 'un medio' },
            { v: '0.07', et: '0,07', nota: 'siete centavos' },
        ];

        const FlotanteVisualizer = () => {
            const [texto, setTexto] = useState('0.1');
            const [vueltas, setVueltas] = useState(10000);

            const x = Number(texto);
            const valido = texto.trim() !== '' && Number.isFinite(x);

            // Los 64 bits reales del double, leídos de la memoria.
            const bits = (() => {
                if (!valido) return null;
                const buf = new ArrayBuffer(8);
                new Float64Array(buf)[0] = x;
                const u = new Uint8Array(buf);
                let s = '';
                for (let i = 7; i >= 0; i--) s += u[i].toString(2).padStart(8, '0');
                return { signo: s[0], exponente: s.slice(1, 12), mantisa: s.slice(12) };
            })();

            // Lo que la máquina guarda de verdad, hasta 20 decimales.
            const guardado = valido ? x.toFixed(20) : '';
            const decimalesEscritos = texto.includes('.') ? texto.split('.')[1].length : 0;
            const sobrante = valido ? guardado.split('.')[1].slice(decimalesEscritos) : '';
            const exacto = valido && /^0*$/.test(sobrante);

            // La acumulación: sumar `vueltas` veces el mismo número.
            const acumulado = (() => {
                if (!valido) return 0;
                let a = 0;
                for (let i = 0; i < vueltas; i++) a += x;
                return a;
            })();
            const esperado = valido ? x * vueltas : 0;
            const iguales = acumulado === esperado;
            const diferencia = acumulado - esperado;

            return (
                <div className="my-5 rounded-2xl border-2 border-primary/20 bg-white p-5 shadow-sm not-prose">
                    <div className="flex items-center gap-2 mb-3">
                        <span className="lp-gradient text-white p-2 rounded-lg"><i className="fas fa-magnifying-glass-chart"></i></span>

                    </div>

                        <input id="flot-num" type="text" inputMode="decimal" value={texto}
                            onChange={e => setTexto(e.target.value)}
                            className="px-3 py-1.5 rounded-lg border-2 border-gray-300 font-mono text-base w-32 focus:border-primary focus:outline-none"
                            aria-label="Número decimal a descomponer" />
                        <div className="flex flex-wrap gap-1.5">
                            {PRESETS_FLOTANTE.map(p => (
                                <button key={p.v} onClick={() => setTexto(p.v)} title={p.nota}
                                    className={`px-2.5 py-1 rounded-full text-xs font-bold transition-all ${texto === p.v ? 'lp-gradient text-white shadow' : 'bg-white border border-gray-300 text-gray-600 hover:bg-gray-100'}`}>
                                    {p.et}
                                </button>
                            ))}
                        </div>
                    </div>

                    {!valido ? (
                        <p className="text-sm text-gray-500 italic">Escriba un número para ver su representación.</p>
                    ) : (
                        <>
                            <div className="mb-4">
                                <div className="text-[0.65rem] uppercase tracking-wider text-gray-400 font-bold mb-1.5">
                                    Los 64 bits, tal como están en memoria
                                </div>
                                <div className="bg-navy rounded-lg p-3 text-white/90">
                                    <div className="font-mono text-[0.7rem] leading-relaxed break-all">
                                        <span style={{ color: '#FDB913', fontWeight: 700 }}>{bits.signo}</span>{/* contraste-ok: 9.66:1 medido sobre el navy #001A4D del contenedor */}
                                        <span className="mx-1" style={{ color: '#7DD3FC' }}>{bits.exponente}</span>{/* contraste-ok: 10.04:1 sobre el mismo navy */}
                                        <span style={{ color: '#F9A8D4' }}>{bits.mantisa}</span>{/* contraste-ok: 9.23:1 sobre el mismo navy */}
                                    </div>
                                    {/* La leyenda va dentro del mismo recuadro para llevar los colores de los bits que nombra. */}
                                    <div className="flex flex-wrap gap-4 mt-2 text-[0.65rem] font-bold">
                                        <span style={{ color: '#FDB913' }}>■ signo (1)</span>{/* contraste-ok: 9.66:1 sobre el navy #001A4D del contenedor */}
                                        <span style={{ color: '#7DD3FC' }}>■ exponente (11)</span>{/* contraste-ok: 10.04:1 sobre el mismo navy */}
                                        <span style={{ color: '#F9A8D4' }}>■ mantisa (52)</span>{/* contraste-ok: 9.23:1 sobre el mismo navy */}
                                    </div>
                                </div>
                            </div>

                            <div className="grid md:grid-cols-2 gap-3 mb-4">
                                <div className="rounded-xl border border-gray-200 p-3">
                                    <div className="text-[0.65rem] uppercase tracking-wider text-gray-400 font-bold">Usted escribió</div>
                                    <div className="font-mono font-bold text-navy text-lg break-all">{texto}</div>
                                </div>
                                <div className={`rounded-xl border-2 p-3 ${exacto ? 'border-green-300 bg-green-50' : 'border-red-300 bg-red-50'}`}>
                                    <div className="text-[0.65rem] uppercase tracking-wider text-gray-500 font-bold">La máquina guarda (20 decimales)</div>
                                    <div className="font-mono font-bold text-navy text-sm break-all">{guardado}</div>
                                    <div className={`text-xs font-bold mt-1 ${exacto ? 'text-green-700' : 'text-red-700'}`}>
                                        {exacto ? '✓ exacto' : '✗ no es el número que escribió'}
                                    </div>
                                </div>
                            </div>

                            <div className="rounded-xl border border-gray-200 p-4">
                                <div className="flex flex-wrap items-center gap-2 mb-3">

                                    {[100, 1000, 10000, 100000].map(n => (
                                        <button key={n} onClick={() => setVueltas(n)}
                                            className={`px-2.5 py-1 rounded-full text-xs font-bold transition-all ${vueltas === n ? 'lp-gradient text-white shadow' : 'bg-white border border-gray-300 text-gray-600 hover:bg-gray-100'}`}>
                                            {n.toLocaleString('es-CO')} veces
                                        </button>
                                    ))}
                                </div>
                                <div className="grid md:grid-cols-2 gap-3 text-sm">
                                    <div>
                                        <div className="text-[0.65rem] uppercase tracking-wider text-gray-400 font-bold">Sumando uno a uno</div>
                                        <div className="font-mono font-bold text-navy break-all">{acumulado.toFixed(20)}</div>
                                    </div>
                                    <div>
                                        <div className="text-[0.65rem] uppercase tracking-wider text-gray-400 font-bold">Multiplicando de una vez</div>
                                        <div className="font-mono font-bold text-navy break-all">{esperado.toFixed(20)}</div>
                                    </div>
                                </div>
                                <div className={`mt-3 rounded-lg p-3 border-2 ${iguales ? 'border-green-300 bg-green-50' : 'border-red-300 bg-red-50'}`}>
                                    <div className="font-bold text-sm" style={{ color: iguales ? '#15803D' : '#B91C1C' }}>
                                        suma == producto &nbsp;→&nbsp; {iguales ? 'Verdadero' : 'Falso'}
                                    </div>
                                    {!iguales && (
                                        <div className="text-xs text-gray-700 mt-1">
                                            Diferencia: <span className="font-mono font-bold">{diferencia.toExponential(4)}</span>.
                                            Es minúscula, pero basta para que la comparación responda
                                            <strong> Falso</strong>, y cambia con el número de sumas: pruebe los cuatro

                <p>
                    Un programa financiero —por sofisticado que sea— es, en última instancia, una secuencia de

                <Box type="info" label="Idea central">

                </Box>

                <h3>La arquitectura de Von Neumann: sus componentes</h3>
                <p>

                    memoria; la de entrada y la de salida. Las conectan los buses <Cita k="matthews2020" loc="§5.2" />.

                            <ul>
                                <li><strong>ALU</strong> (unidad aritmético-lógica): realiza operaciones matemáticas y lógicas, como la suma, la resta y el O lógico.</li>

                                <li><strong>Registros</strong>: unidades de almacenamiento pequeñas y rápidas que guardan los datos y las instrucciones que se están ejecutando.</li>

                        </div>
                    },

                                <li><strong>RAM</strong> (memoria de acceso aleatorio): cualquiera de sus posiciones se puede alcanzar directamente <Cita k="matthews2020" loc="§5.2" />. Aquí viven las variables de su programa mientras corre.</li>
                                <li><strong>La caché no está aquí.</strong> Es memoria integrada en la propia CPU, más rápida que la principal, y suele venir en niveles: L1 y L2 y, en muchas CPU de varios núcleos, un L3 compartido entre ellos <Cita k="matthews2020" loc="§11.1 y §11.2.1" />.</li>
                                <li><strong>El almacenamiento secundario</strong> más conocido son los discos, que guardan los archivos de forma persistente <Cita k="matthews2020" loc="§11.2" />. Ahí va lo que debe conservarse.</li>

                        <p>
                            Lo que se gana es <strong>flexibilidad</strong>: si el programa es un dato más, un programa puede
                            cargar, generar o modificar otro. Eso es lo que hacen un compilador, un intérprete y —en el mundo de la hoja de cálculo— una macro que escribe fórmulas: tratan a otro programa como un dato.
                        </p>
                        <p>
                            Lo que se pierde es <strong>aislamiento</strong>. Si datos e instrucciones son indistinguibles para
                            la máquina, un dato malicioso puede acabar ejecutándose. Por eso conviene desconfiar de un archivo
                            de Excel con macros que llega de fuera: una macro es un programa, y para la máquina es un dato
                            más. El capítulo 6 lo mira de cerca.
                        </p>
                        <p>
                            De qué depende: de si el sistema necesita cargar o cambiar programas. Un equipo que va a correr
                            siempre el mismo programa puede renunciar a esa flexibilidad a cambio de aislamiento. El criterio,
                            entonces, no es cuál decisión es «mejor», sino cuánto necesita el sistema tratar un programa como un dato.
                        </p>
                    </Box>}>
                    En la arquitectura de Von Neumann, las instrucciones y los datos viven en la misma memoria: la celda 0

        const InteresCompuestoChart = () => {

                const compuesto = años.map(t => capital * Math.pow(1 + tasa / 100, t));
                return [
                    { x: años, y: simple, name: 'Interés simple', line: { color: '#0E7490', width: 2.5, dash: 'dash' }, hovertemplate: 'Año %{x}: %{y:,.0f} COP<extra>Simple</extra>' },
                    { x: años, y: compuesto, name: 'Interés compuesto', line: { color: '#ED1E79', width: 3 }, fill: 'tonexty', fillcolor: 'rgba(237,30,121,0.12)', hovertemplate: 'Año %{x}: %{y:,.0f} COP<extra>Compuesto</extra>' },
                ];
            }, () => ({
                margin: { t: 10, r: 10, b: 40, l: 95 }, legend: { orientation: 'h', y: -0.22 }, separators: ',.',
                xaxis: { title: 'Año', gridcolor: '#eee', tick0: 0, dtick: 1 },

            }), [capital, tasa, plazo]);

            const fmtCOP = (v) => new Intl.NumberFormat('es-CO', { maximumFractionDigits: 0 }).format(Math.round(v));
            const vf = capital * Math.pow(1 + tasa / 100, plazo);
            const vs = capital * (1 + (tasa / 100) * plazo);
            const extra = vf - vs;

            return (
                <div className="my-4">
                    <div className="grid md:grid-cols-3 gap-3 mb-3">
                        <div className="bg-bg rounded-lg p-3">

                        </div>
                        <div className="bg-bg rounded-lg p-3">
                            <label className="text-xs font-bold text-navy block mb-1" htmlFor="int-tasa">Tasa: <span className="text-secondary">{tasa.toFixed(1).replace('.', ',')} % anual</span></label>
                            <input id="int-tasa" type="range" min="1" max="30" step="0.5" value={tasa}

                                onChange={e => setPlazo(+e.target.value)} className="lp-range w-full" aria-label="Plazo en años" />
                        </div>
                    </div>

                    <div className="grid grid-cols-3 gap-2 mb-3 text-center">
                        <div className="bg-white rounded-xl border border-gray-200 p-3 shadow-sm">

                            <div className="font-mono font-bold text-navy text-sm mt-0.5">$ {fmtCOP(vs)}</div>
                        </div>
                        <div className="bg-white rounded-xl border border-gray-200 p-3 shadow-sm">
                            <div className="text-[0.65rem] uppercase tracking-wider text-gray-400 font-bold">VF compuesto</div>
                            <div className="font-mono font-bold text-secondary text-sm mt-0.5">$ {fmtCOP(vf)}</div>

                </div>
            );

                <h3>Laboratorio: qué guarda la máquina de verdad</h3>
                <p>
                    Escriba un número y mire sus 64 bits. Pruebe <strong>0,25</strong> y <strong>0,5</strong>: en base 2
                    son 0,01 y 0,1 —un cuarto y un medio—, fracciones que terminan, y por eso se guardan exactas. Pruebe
                    después <strong>0,1</strong> y <strong>0,07</strong>.
                </p>
                <FlotanteVisualizer />

                <p>
                    El reparto que colorea el laboratorio sale de tres datos del formato doble de IEEE 754: ocupa 64 bits,
                    11 de ellos son del exponente y su precisión es de 53 bits <Cita k="goldberg1991" loc="The IEEE Standard › Formats and Operations › Precision, tabla de parámetros" />.
                    En los formatos de IEEE, el signo ocupa un bit <Cita k="goldberg1991" loc="The IEEE Standard › Formats and Operations › Exponent" />.
                    Quitados ese y los 11 del exponente quedan 64 − 1 − 11 = 52 para la mantisa: uno menos que la precisión.
                    La diferencia se explica con un recurso de los formatos en base 2: como el bit más significativo de un número
                    normalizado siempre es 1, no hace falta gastar espacio en guardarlo, y de un formato que se lo ahorra se dice
                    que tiene un bit oculto <Cita k="goldberg1991" loc="The IEEE Standard › Formats and Operations › Base" />.
                </p>

        const App = () => {
            const [activeLessonIndex, setActiveLessonIndex] = useState(() => {
                const saved = parseInt(leerGuardado(CONFIG.storageKey), 10);
                return Number.isInteger(saved) && saved >= 0 ? saved : 0;
            });
            // La barra es hermana flex del contenido: no lo superpone, lo

            // dejaría el texto en 79 px, ilegible. Arranca abierta solo desde
            // el punto de corte `lg` de Tailwind, que es el que usa `irA` para
            // cerrarla al navegar.
            const [sidebarOpen, setSidebarOpen] = useState(() => window.innerWidth >= 1024);

            const safeIndex = Math.min(activeLessonIndex, curriculum.length - 1);
            const activeLesson = curriculum[safeIndex];
            const ActiveComponent = activeLesson.component;
            const progreso = Math.round(((safeIndex + 1) / curriculum.length) * 100);

            // Una cita de la lección 2 enlaza con la lista de referencias, que
            // está en la última: como solo se pinta una lección, un `href="#…"`
            // no la alcanza. `Cita` y `Referencias` lanzan `lp:ir-a` con la
            // lección (`'ultima'` o su número) y el ancla; aquí se cambia de
            // lección y, ya pintada, se lleva al ancla en vez de al principio.
            const anclaPendiente = useRef(null);

            useEffect(() => {
                LP_NAV.leccion = safeIndex;
                guardar(CONFIG.storageKey, String(safeIndex));
                typesetMath();
                const pendiente = anclaPendiente.current;
                anclaPendiente.current = null;
                if (pendiente && irAlAncla(pendiente)) {
                    // MathJax y Plotly terminan de pintar después y mueven lo que
                    // hay debajo: se vuelve a situar una vez, ya sin el destello.
                    const t = setTimeout(() => irAlAncla(pendiente, false), 450);
                    return () => clearTimeout(t);
                }
                const cont = document.getElementById('contenido-scroll');
                if (cont) cont.scrollTo({ top: 0, behavior: 'smooth' });
            }, [safeIndex]);

            useEffect(() => {
                const alIr = (e) => {
                    const d = (e && e.detail) || {};
                    const ultima = curriculum.length - 1;
                    const destino = d.leccion === 'ultima' ? ultima
                        : Number.isInteger(d.leccion) ? Math.max(0, Math.min(d.leccion, ultima))
                            : LP_NAV.leccion;
                    if (destino === LP_NAV.leccion) { irAlAncla(d); return; }
                    anclaPendiente.current = d;
                    setActiveLessonIndex(destino);
                };
                window.addEventListener('lp:ir-a', alIr);
                return () => window.removeEventListener('lp:ir-a', alIr);
            }, []);

            const irA = (idx) => {
                setActiveLessonIndex(idx);
                if (window.innerWidth < 1024) setSidebarOpen(false);
            };

                                            Siguiente {renderIcon('ChevronRight', 18)}
                                        </button>
                                    </div>
                                </div>

                                <SectionHeader title={activeLesson.title} icon={Icons[activeLesson.icon]} />

                                {safeIndex === 0 && (
                                    <div className="mb-8 text-center bg-white p-7 rounded-2xl shadow-sm border border-gray-100">
                                        <p className="text-xs uppercase tracking-widest text-secondary-texto font-bold mb-2">

                                        <div className="flex justify-center flex-wrap gap-2 mt-4 text-xs">

                                        </div>
                                    </div>

                                <div className="animate-fade-in" key={activeLesson.id}>
                                    <ActiveComponent />
                                </div>

                                <div className="mt-12 flex items-center justify-between gap-3">
                                    <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}

                                    </button>
                                    <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-white lp-gradient hover:opacity-90 disabled:opacity-30 text-sm font-medium">
                                        <span className="hidden sm:inline">{safeIndex < curriculum.length - 1 ? curriculum[safeIndex + 1].title : 'Fin'}</span>
                                        <span className="sm:hidden">Siguiente</span>
                                        {renderIcon('ChevronRight', 18)}
                                    </button>
                                </div>

                                <footer className="mt-16 pt-8 border-t border-gray-200">
                                    <div className="lp-header rounded-xl p-6 text-center">

                                            <strong>Capítulo {CONFIG.numero} · {CONFIG.titulo}</strong>
                                        </p>
                                        <p className="text-xs mt-1 text-white italic">
                                            {CONFIG.lema}
                                        </p>
                                        <p className="text-xs mt-2 text-white/70">

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
