        const Cap2Section = () => (
            <div className="prose-lp">
                <Motivacion icon="fa-microchip"
                    gancho="La CPU hace la multiplicación en nanosegundos. Lo que tarda es traerle los números.">
                    El reporte de cartera tarda cuarenta minutos. El analista que lo heredó le puso más memoria RAM
                    al equipo y siguió tardando cuarenta minutos. Pidió un computador nuevo y bajó a treinta y ocho.
                    El cuello de botella no estaba donde lo buscaba, y sin saber por dónde pasan los datos no hay
                    forma de encontrarlo: solo de comprar hardware a ciegas.
                </Motivacion>

                <p>
                    Un programa financiero —por sofisticado que sea— es, en última instancia, una secuencia de
                    instrucciones que la <strong>CPU</strong> ejecuta sobre datos almacenados en <strong>memoria</strong>.
                    Entender esta arquitectura es esencial para escribir código eficiente y diagnosticar problemas de rendimiento.
                </p>

                <Box type="info" label="Idea central">
                    La <strong>arquitectura de Von Neumann</strong> (1945) establece que tanto los <em>datos</em> como las
                    <em>instrucciones</em> se almacenan en la misma memoria y se transmiten por los mismos buses.
                    Es el modelo que usan prácticamente todos los computadores actuales.
                </Box>

                <h3>La arquitectura de Von Neumann: los cuatro componentes</h3>
                <VonNeumannSVG />

                <Tabs tabs={[
                    {
                        label: '1. CPU',
                        content: <div>
                            <p>El <Termino def="Central Processing Unit. El 'cerebro' del computador. Ejecuta las instrucciones de los programas. Contiene la ALU, la Unidad de Control y registros.">procesador</Termino> ejecuta las instrucciones. Se compone de:</p>
                            <ul>
                                <li><strong>ALU</strong> (Unidad Aritmético-Lógica): realiza operaciones matemáticas (suma, resta, comparaciones, AND, OR).</li>
                                <li><strong>UC</strong> (Unidad de Control): coordina el flujo de instrucciones. Lee la siguiente instrucción de la memoria, la decodifica y orquesta su ejecución.</li>
                                <li><strong>Registros</strong>: pequeñas memorias ultrarrápidas dentro de la CPU. Guardan operandos y resultados intermedios.</li>
                            </ul>
                        </div>
                    },
                    {
                        label: '2. Memoria principal',
                        content: <div>
                            <p>Almacena tanto los <strong>datos</strong> como el <strong>programa</strong> en ejecución:</p>
                            <ul>
                                <li><strong>RAM</strong> (Random Access Memory): volátil, rápida. Aquí residen las variables de tu programa mientras se ejecuta.</li>
                                <li><strong>ROM</strong> (Read-Only Memory): no volátil, contiene firmware esencial (BIOS/UEFI).</li>
                                <li><strong>Caché</strong>: memoria intermedia entre RAM y CPU. Jerarquía L1, L2, L3.</li>
                            </ul>
                        </div>
                    },
                    {
                        label: '3. Dispositivos E/S',
                        content: <div>
                            <p>Conectan el computador con el mundo exterior:</p>
                            <ul>
                                <li><strong>Entrada:</strong> teclado, ratón, escáner, lector de banda magnética, terminal POS.</li>
                                <li><strong>Salida:</strong> monitor, impresora, altavoces.</li>
                                <li><strong>Almacenamiento:</strong> disco duro (HDD/SSD), que es <em>persistente</em> (no se borra al apagar).</li>
                            </ul>
                        </div>
                    },
                    {
                        label: '4. Buses',
                        content: <div>
                            <p>Los <strong>buses</strong> son las "autopistas" de datos que conectan todos los componentes:</p>
                            <ul>
                                <li><strong>Bus de datos:</strong> transporta los valores (números, instrucciones).</li>
                                <li><strong>Bus de direcciones:</strong> indica <em>dónde</em> en la memoria leer o escribir.</li>
                                <li><strong>Bus de control:</strong> señales de coordinación (leer, escribir, interrupción).</li>
                            </ul>
                        </div>
                    },
                ]} />

                <h3>El ciclo de instrucción: fetch → decode → execute</h3>
                <p>
                    La CPU no "piensa": ejecuta mecánicamente un ciclo infinito. Cada instrucción sigue cuatro pasos:
                </p>
                <Pipeline steps={[
                    { num: 1, title: 'Fetch', desc: 'La CPU lee la siguiente instrucción de la memoria (usando el Program Counter).' },
                    { num: 2, title: 'Decode', desc: 'La Unidad de Control interpreta qué operación realizar (suma, salto, comparación).' },
                    { num: 3, title: 'Execute', desc: 'La ALU ejecuta la operación sobre los operandos.' },
                    { num: 4, title: 'Store', desc: 'El resultado se guarda en un registro o en la memoria.' },
                ]} />

                <Box type="tip" label="Analogía: el cajero automático (ATM)">
                    Un <Termino def="Automated Teller Machine. Dispositivo electrónico que permite a los clientes de una entidad financiera realizar transacciones sin necesidad de un cajero humano.">ATM</Termino> es una computadora con arquitectura de Von Neumann: el lector de tarjeta y el teclado son <strong>dispositivos de entrada</strong>; la pantalla y el dispensador de billetes,
                    <strong> de salida</strong>; la RAM guarda temporalmente el saldo consultado durante la sesión; y la CPU
                    ejecuta las instrucciones del software (validar PIN, consultar saldo, autorizar retiro). Las transacciones
                    finales se persisten en el <strong>disco duro</strong> del servidor central del banco.
                </Box>

                <h3>Del hardware al software: la jerarquía de abstracción</h3>
                <div className="overflow-x-auto">
                    <table>
                        <thead><tr><th>Nivel</th><th>Qué es</th><th>Ejemplo financiero</th></tr></thead>

                            <tr><td><strong>Ensamblador</strong></td><td>Mnemónicos legibles (MOV, ADD, CMP)</td><td><span className="inline-code">MOV AL, 61h</span></td></tr>
                            <tr><td><strong>Alto nivel</strong></td><td>Python, Java, C++</td><td><span className="inline-code">saldo -= monto_retiro</span></td></tr>
                            <tr><td><strong>Aplicación</strong></td><td>Software financiero</td><td>Core bancario, app de trading, ERP</td></tr>
                        </tbody>
                    </table>
                </div>

                <h3>El ciclo de instrucción, escrito en los cuatro lenguajes</h3>
                <p>
                    Una memoria de cuatro celdas basta para ver el ciclo completo. La celda 0 guarda el
                    <strong> código de operación</strong>; las dos siguientes, los operandos; la última espera el
                    resultado. Que instrucciones y datos convivan en la misma memoria es <em>exactamente</em> lo que
                    propuso Von Neumann.

                    pregunta="¿Qué diferencia hay entre las dos?"

                <Ejercicio tipo="E8"><Reto
                    titulo="¿Por qué instrucciones y datos comparten la misma memoria?"
                    solucion={<Box type="tip" label="Criterio de diseño">
                        <p>
                            Lo que se gana es <strong>flexibilidad</strong>: si el programa es un dato más, un programa puede
                            cargar, generar o modificar otro. De ahí salen los compiladores, los intérpretes y —en el mundo
                            de la hoja de cálculo— las macros que escriben fórmulas.
                        </p>
                        <p>
                            Lo que se pierde es <strong>aislamiento</strong>. Si datos e instrucciones son indistinguibles para
                            la máquina, un dato malicioso puede acabar ejecutándose. Por eso un archivo de Excel con macros
                            llega bloqueado y hay que habilitarlo a mano: no es un capricho del área de seguridad, es la
                            consecuencia directa de esta decisión de arquitectura, que se verá de cerca en el capítulo 6.
                        </p>
                        <p>
                            La alternativa —memorias separadas para código y datos, la llamada arquitectura Harvard— existe y se
                            usa en microcontroladores, donde el programa no cambia nunca. El criterio, entonces, no es cuál es
                            «mejor», sino si el sistema necesita modificar su propio código.
                        </p>
                    </Box>}>
                    En la arquitectura de Von Neumann, las instrucciones y los datos viven en la misma memoria: la celda 0

                    sostiene que sería más seguro tenerlas en memorias separadas. ¿Qué se gana y qué se pierde con cada

                <h3>4. Precedencia de operadores: ¿quién se ejecuta primero?</h3>
                <p>
                    Cuando una expresión tiene varios operadores, Python sigue un orden de precedencia.

                </p>

                            <tr><td>2</td><td><span className="inline-code">**</span></td><td>Potencia</td></tr>
                            <tr><td>3</td><td><span className="inline-code">+x, -x</span></td><td>Signo (unario)</td></tr>
                            <tr><td>4</td><td><span className="inline-code">*, /, //, %</span></td><td>Multiplicación, división, módulo</td></tr>
                            <tr><td>5</td><td><span className="inline-code">+, -</span></td><td>Suma, resta</td></tr>
                            <tr><td>6</td><td><span className="inline-code">&lt;, &lt;=, &gt;, &gt;=, !=, ==</span></td><td>Comparaciones</td></tr>

                </div>
                <Reto titulo="Ver solución (Parte 2)"
                    solucion={<div>
                        <p><strong>42:</strong> Binario = 101010, Octal = 52, Hex = 2A.</p>
                        <p><strong>1101:</strong> Decimal = 13, Octal = 15, Hex = D.</p>
                        <p><strong>A3:</strong> Decimal = 163 (10×16+3), Binario = 1010 0011, Octal = 243.</p>
                    </div>}>
                    Calcula cada celda antes de verificar.
                </Reto>

                <h3>Parte 3 · Cuestionario integrador</h3>
                <Quiz titulo="Evaluación final · Unidad 1" preguntas={[
                    {
                        pregunta: 'El número binario 1101 equivale en decimal a:',
                        opciones: [
                            { texto: '13 (8 + 4 + 0 + 1 = 13)', correcta: true },
                            { texto: '11', correcta: false },
                            { texto: '1101 (es el mismo número)', correcta: false },
                        ],
                        justificacion: '1×8 + 1×4 + 0×2 + 1×1 = 13.'
                    },
                    {
                        pregunta: 'En la arquitectura de Von Neumann, el componente que coordina la lectura y ejecución de instrucciones es:',
                        opciones: [
                            { texto: 'La Unidad de Control (UC).', correcta: true },
                            { texto: 'La ALU.', correcta: false },
                            { texto: 'La memoria RAM.', correcta: false },
                        ],
                        justificacion: 'La UC es el "director de orquesta": lee la instrucción de memoria, la decodifica y coordina su ejecución.'
                    },
                    {
                        pregunta: '¿Cuál es el resultado de: 2 ** 3 ** 2?',
                        opciones: [
                            { texto: '512 (primero 3**2=9, luego 2**9=512).', correcta: true },
                            { texto: '64 (primero 2**3=8, luego 8**2=64).', correcta: false },
                            { texto: 'Error de sintaxis.', correcta: false },
                        ],
                        justificacion: 'El operador ** se evalúa de derecha a izquierda: primero 3**2=9, luego 2**9=512.'
                    },
                    {
                        pregunta: 'Un byte puede representar valores desde 0 hasta:',
                        opciones: [
                            { texto: '255 (2⁸ - 1).', correcta: true },
                            { texto: '128', correcta: false },
                            { texto: '1024', correcta: false },
                        ],
                        justificacion: '8 bits → 2⁸ = 256 valores distintos, de 0 a 255.'
                    },
                    {
                        pregunta: 'La expresión: not (saldo > 0) and cuenta_activa, significa:',
                        opciones: [
                            { texto: 'El saldo NO es positivo Y la cuenta está activa.', correcta: true },
                            { texto: 'El saldo es positivo Y la cuenta NO está activa.', correcta: false },
                            { texto: 'El saldo NO es positivo O la cuenta está activa.', correcta: false },
                        ],
                        justificacion: 'not (saldo > 0) significa saldo <= 0. Con AND, ambas condiciones deben cumplirse.'
                    },
                    {
                        pregunta: 'El operador // en Python realiza:',
                        opciones: [
                            { texto: 'División entera (descarta decimales).', correcta: true },
                            { texto: 'División con decimales.', correcta: false },
                            { texto: 'Comentario de una línea.', correcta: false },
                        ],
                        justificacion: '// es división entera: 10 // 3 = 3. La división con decimales es /.'
                    },
                    {
                        pregunta: '¿Qué tipo de memoria pierde su contenido al apagar el computador?',
                        opciones: [
                            { texto: 'RAM', correcta: true },
                            { texto: 'Disco SSD', correcta: false },
                            { texto: 'ROM', correcta: false },
                        ],
                        justificacion: 'La RAM es volátil. Disco SSD y ROM conservan los datos sin alimentación eléctrica.'
                    },
                    {
                        pregunta: 'En Python, ¿qué valor tiene la expresión: False or True and False?',
                        opciones: [
                            { texto: 'False (and primero: True and False → False; luego False or False → False).', correcta: true },
                            { texto: 'True', correcta: false },
                            { texto: 'Error de tipo.', correcta: false },
                        ],
                        justificacion: 'and precede a or: True and False → False; False or False → False.'
                    },
                ]} />

                <h3>Glosario de la Unidad 1</h3>
                <div className="grid md:grid-cols-2 gap-2">
                    {GLOSARIO.map(([t, d], i) => (
                        <div key={i} className="border border-gray-200 rounded-lg p-3 bg-white">
                            <span className="font-bold text-primary text-sm">{t}</span>
                            <p className="text-xs text-gray-600 mt-0.5" style={{ margin: '2px 0 0' }}>{d}</p>
                        </div>
                    ))}
                </div>

                <h3>Recursos complementarios</h3>
                <Accordion items={[
                    {
                        titulo: 'Sistemas de numeración', contenido: <ul className="text-sm">
                            <li>Khan Academy — <a className="text-primary underline" href="https://es.khanacademy.org/math/algebra-home/alg-intro-to-algebra/algebra-intro-to-binary/v/number-systems-introduction" target="_blank" rel="noopener noreferrer">Introducción a los sistemas de numeración</a>.</li>
                            <li>Calculadora de programador de Windows/macOS (modo Programador).</li>
                            <li>Python oficial: <a className="text-primary underline" href="https://docs.python.org/3/library/functions.html#bin" target="_blank" rel="noopener noreferrer">funciones bin(), oct(), hex()</a>.</li>
                        </ul>
                    },
                    {
                        titulo: 'Estructura del computador', contenido: <ul className="text-sm">
                            <li>Crash Course Computer Science — <a className="text-primary underline" href="https://www.youtube.com/watch?v=OAxP6X8GxZg" target="_blank" rel="noopener noreferrer">The Central Processing Unit (CPU)</a>.</li>
                            <li>Nand2Tetris — <a className="text-primary underline" href="https://www.nand2tetris.org/" target="_blank" rel="noopener noreferrer">Curso gratuito para construir un computador desde cero</a>.</li>
                            <li>Scott, J. C. (2009). <em>But How Do It Know?</em> — Explicación sencilla de cómo funciona un computador.</li>
                        </ul>
                    },
                    {
                        titulo: 'Operadores y Python', contenido: <ul className="text-sm">
                            <li>Python oficial — <a className="text-primary underline" href="https://docs.python.org/3/reference/expressions.html#operator-precedence" target="_blank" rel="noopener noreferrer">Precedencia de operadores</a>.</li>
                            <li>Real Python — <a className="text-primary underline" href="https://realpython.com/python-operators-expressions/" target="_blank" rel="noopener noreferrer">Operators and Expressions in Python</a>.</li>
                            <li>W3Schools — <a className="text-primary underline" href="https://www.w3schools.com/python/python_operators.asp" target="_blank" rel="noopener noreferrer">Python Operators</a>.</li>
                        </ul>
                    },
                ]} />

                <Box type="tip" label="¡Unidad 1 completada!">
                    Si respondiste bien la evaluación integradora, dominas los fundamentos de sistemas de numeración,
                    estructura del computador y operadores. Estás listo para abordar <strong>estructuras de control</strong>
                    (condicionales, ciclos) y <strong>funciones</strong> en la siguiente unidad.
                </Box>
            </div>
        );

        /* ============================================================
           CURRÍCULO
        ============================================================ */
        const curriculum = [
            { id: 'portada', title: 'Portada y objetivos', icon: 'BookOpen', component: PortadaSection },
            { id: 'cap1', title: '1. Sistemas de numeración', icon: 'Binary', component: Cap1Section },
            { id: 'cap2', title: '2. Estructura del computador', icon: 'Cpu', component: Cap2Section },
            { id: 'cap3', title: '3. Operadores', icon: 'Calculator', component: Cap3Section },
            // `Binary` se repite a propósito: el catálogo de iconos vive en
            // LP-CORE y añadir uno obligaría a editar la librería a mano. Para
            // esta sección encaja, además: va de representación binaria.
            { id: 'cap4', title: '4. Reales y error de redondeo', icon: 'Binary', component: Cap4Section },
            { id: 'eval', title: 'Evaluación y glosario', icon: 'Award', component: EvaluacionSection },
        ];

        /* ============================================================
           APP
        ============================================================ */

        const App = () => {
            const [activeLessonIndex, setActiveLessonIndex] = useState(() => {
                const saved = parseInt(localStorage.getItem(CONFIG.storageKey), 10);
                return Number.isInteger(saved) && saved >= 0 ? saved : 0;
            });
            // La barra es hermana flex del contenido: no lo superpone, lo
            // COMPRIME. Abierta ocupa 18 rem, así que en un viewport de 375 px
            // dejaría el texto en 79 px, ilegible. Arranca abierta solo desde
            // el punto de corte `lg` de Tailwind, que es el que usa `irA` para
            // cerrarla al navegar.
            const [sidebarOpen, setSidebarOpen] = useState(() => window.innerWidth >= 1024);

            const safeIndex = Math.min(activeLessonIndex, curriculum.length - 1);
            const activeLesson = curriculum[safeIndex];
            const ActiveComponent = activeLesson.component;
            const progreso = Math.round(((safeIndex + 1) / curriculum.length) * 100);

            useEffect(() => {
                localStorage.setItem(CONFIG.storageKey, String(safeIndex));
                typesetMath();
                const cont = document.getElementById('contenido-scroll');
                if (cont) cont.scrollTo({ top: 0, behavior: 'smooth' });
            }, [safeIndex]);

            const irA = (idx) => {
                setActiveLessonIndex(idx);
                if (window.innerWidth < 1024) setSidebarOpen(false);
            };

            return (
                <div className="flex h-screen overflow-hidden relative">
                    <button onClick={() => setSidebarOpen(p => !p)}
                        className="fixed top-4 left-4 z-50 p-2.5 rounded-full shadow-lg text-white transition-all hover:scale-110 lp-gradient"
                        title={sidebarOpen ? 'Ocultar menú' : 'Mostrar menú'} aria-label={sidebarOpen ? 'Ocultar menú' : 'Mostrar menú'}>
                        <i className={`fas ${sidebarOpen ? 'fa-times' : 'fa-bars'} text-sm`}></i>
                    </button>

                    {sidebarOpen && <div className="fixed inset-0 bg-black/20 z-30 lg:hidden" onClick={() => setSidebarOpen(false)} />}

                    <aside className="flex-shrink-0 overflow-y-auto z-40 flex flex-col lp-header"
                        style={{
                            width: sidebarOpen ? '18rem' : '0', minWidth: sidebarOpen ? '18rem' : '0',
                            opacity: sidebarOpen ? 1 : 0, transition: 'width 0.3s ease, min-width 0.3s ease, opacity 0.25s ease',
                            overflow: sidebarOpen ? 'visible auto' : 'hidden'
                        }}>
                        <div className="p-6 pt-16 border-b border-white/10">
                            {/* contraste-ok: el gold va sobre el navy de `lp-header`, no sobre el fondo claro */}
                            <p className="text-[0.65rem] uppercase tracking-widest text-gold font-bold">Universidad Santo Tomás</p>
                            <h1 className="text-white font-bold text-lg tracking-tight mt-1">
                                Lógica de Programación Financiera
                            </h1>
                            <p className="text-xs text-white/60 mt-1">
                                Capítulo {CONFIG.numero} · <span className="text-secondary font-semibold">{CONFIG.titulo}</span>
                            </p>
                        </div>

                        <nav className="p-4 space-y-2 flex-1">
                            {curriculum.map((lesson, idx) => (
                                <button key={lesson.id} onClick={() => irA(idx)}
                                    className={`w-full flex items-start gap-3 px-3 py-3 text-sm rounded-lg transition-all text-left ${safeIndex === idx ? 'text-white shadow-lg lp-gradient' : 'text-white/60 hover:text-white hover:bg-white/10'}`}>
                                    <span className="flex-shrink-0 mt-0.5" style={{ width: 18, height: 18 }}>{renderIcon(lesson.icon, 18)}</span>
                                    <span className="font-medium leading-tight break-words">{lesson.title}</span>
                                </button>
                            ))}
                        </nav>

                        <div className="p-4 text-[10px] text-white/40 border-t border-white/10">
                            <p>{CONFIG.ra} · {CONFIG.horas} horas</p>
                            <p>Pseudocódigo · Python · R · VBA</p>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col overflow-hidden bg-bg">
                        <div className="h-1.5 bg-gray-200 flex-shrink-0">
                            <div className="h-full lp-gradient transition-all duration-500" style={{ width: `${progreso}%` }}></div>
                        </div>

                        <div id="contenido-scroll" className="flex-1 overflow-y-auto p-6 lg:p-12">
                            <div className="max-w-4xl mx-auto w-full">
                                <div className="mb-6 flex items-center justify-between flex-wrap gap-3">
                                    <span className="text-xs font-bold tracking-wider text-secondary uppercase">
                                        Lección {safeIndex + 1} de {curriculum.length} · {progreso} %
                                    </span>
                                    <div className="flex gap-2">
                                        <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full hover:bg-gray-100 disabled:opacity-30 transition-colors text-sm font-medium text-navy">
                                            {renderIcon('ChevronLeft', 18)} Anterior
                                        </button>
                                        <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full text-white lp-gradient disabled:opacity-30 transition-colors text-sm font-medium">
                                            Siguiente {renderIcon('ChevronRight', 18)}
                                        </button>
                                    </div>
                                </div>

                                <SectionHeader title={activeLesson.title} icon={Icons[activeLesson.icon]} />

                                {safeIndex === 0 && (
                                    <div className="mb-8 text-center bg-white p-7 rounded-2xl shadow-sm border border-gray-100">
                                        <p className="text-xs uppercase tracking-widest text-secondary font-bold mb-2">
                                            Capítulo {CONFIG.numero} · {CONFIG.horas} horas · {CONFIG.ra}
                                        </p>
                                        <h1 className="text-2xl font-bold text-primary mb-2">{CONFIG.titulo}</h1>
                                        <p className="text-gray-600 font-light">{CONFIG.subtitulo}</p>
                                        <div className="flex justify-center flex-wrap gap-2 mt-4 text-xs">
                                            {CONFIG.temas.map(t => (
                                                <span key={t} className="px-3 py-1 rounded-full bg-primary/10 text-primary">{t}</span>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="animate-fade-in" key={activeLesson.id}>
                                    <ActiveComponent />
                                </div>

                                <div className="mt-12 flex items-center justify-between gap-3">
                                    <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-gray-300 bg-white hover:bg-gray-50 disabled:opacity-30 text-sm font-medium text-navy">
                                        {renderIcon('ChevronLeft', 18)}
                                        <span className="hidden sm:inline">{safeIndex > 0 ? curriculum[safeIndex - 1].title : 'Inicio'}</span>
                                        <span className="sm:hidden">Anterior</span>
                                    </button>
                                    <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-white lp-gradient hover:opacity-90 disabled:opacity-30 text-sm font-medium">
                                        <span className="hidden sm:inline">{safeIndex < curriculum.length - 1 ? curriculum[safeIndex + 1].title : 'Fin'}</span>
                                        <span className="sm:hidden">Siguiente</span>
                                        {renderIcon('ChevronRight', 18)}
                                    </button>
                                </div>

                                <footer className="mt-16 pt-8 border-t border-gray-200">
                                    <div className="lp-header rounded-xl p-6 text-center">
                                        <p className="text-white font-medium text-sm">
                                            <strong>Capítulo {CONFIG.numero} · {CONFIG.titulo}</strong>
                                        </p>
                                        <p className="text-xs mt-1 text-white/80 italic">
                                            La lógica es la misma; el lenguaje solo cambia de acento.
                                        </p>
                                        <p className="text-xs mt-2 text-white/70">
                                            Universidad Santo Tomás · Lógica de Programación Financiera
                                        </p>
                                        <p className="text-xs text-white/70">
                                            Docente y diseño del material: {CONFIG.docente}
                                        </p>
                                        <p className="text-[10px] mt-2 text-white/50">
                                            Material de aprendizaje autónomo. Casos contextualizados al sector financiero colombiano.
                                        </p>
                                    </div>
                                </footer>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
