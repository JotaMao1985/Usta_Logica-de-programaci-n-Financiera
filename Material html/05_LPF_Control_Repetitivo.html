            const langs = idiomas.length ? idiomas : [lang];
            const [langActivo, cambiarLang] = useLenguajeActivo(langs, lang);
            const pasosAct = porLenguaje(pasos, langActivo);

            const orden = (mezcla && mezcla.length === pasosAct.length) ? mezcla : mezclaPorDefecto(pasosAct);
            const [secuencia, setSecuencia] = useState([]);
            const [comprobado, setComprobado] = useState(false);
            useEffect(() => { setSecuencia([]); setComprobado(false); }, [langActivo]);
            const disponibles = orden.filter(i => !secuencia.includes(i));

            const agregar = (i) => { if (!comprobado) setSecuencia(s => [...s, i]); };
            const quitar = (pos) => { if (!comprobado) setSecuencia(s => s.filter((_, k) => k !== pos)); };
            const completo = secuencia.length === pasosAct.length;
            // Por texto, no por índice: dos pasos iguales intercambiados dan el mismo programa.
            const posOk = (pos) => pasosAct[secuencia[pos]] === pasosAct[pos];
            const aciertos = secuencia.filter((_, pos) => posOk(pos)).length;
            const todoOk = completo && aciertos === pasosAct.length;

            return (
                <div className="my-6 rounded-2xl border-2 border-primary/20 bg-white p-5 shadow-sm">
                    <div className="flex items-center gap-2 mb-2">
                        <span className="lp-gradient text-white p-2 rounded-lg"><i className="fas fa-list-ol"></i></span>
                        <h4 className="text-base font-bold text-primary" style={{ margin: 0 }}>{titulo}</h4>
                        <EtiquetaTipo texto="E5 · Secuencia" className="ml-auto text-[0.65rem] uppercase tracking-wider font-bold text-white bg-primary/80 rounded px-2 py-0.5" />
                    </div>
                    {enunciado && <div className="text-[0.95rem] text-gray-700 mb-3">{enunciado}</div>}

                    <SelectorLenguaje disponibles={langs} activo={langActivo} onCambiar={cambiarLang} />
                    <div className="grid md:grid-cols-2 gap-4">
                        <div>
                            <div className="text-xs font-bold uppercase tracking-wider text-gray-500 mb-1.5">
                                Pasos disponibles ({disponibles.length})
                            </div>
                            <div className="space-y-1.5 min-h-[60px] rounded-xl border-2 border-dashed border-gray-200 p-2">
                                {disponibles.map(i => (
                                    <button key={i} onClick={() => agregar(i)} disabled={comprobado}
                                        className="w-full text-left px-3 py-2 rounded-lg border border-gray-200 bg-gray-50 hover:border-secondary hover:bg-amber-50 text-[0.88rem] text-gray-700 font-mono transition-all flex items-center gap-2">
                                        <i className="fas fa-plus text-secondary text-xs flex-shrink-0"></i>
                                        <span className="flex-1 whitespace-pre-wrap">{pasosAct[i]}</span>
                                    </button>
                                ))}
                                {!disponibles.length && <p className="text-xs text-gray-500 italic text-center py-3" style={{ margin: 0 }}>Todos los pasos están en la secuencia</p>}
                            </div>
                        </div>

                        <div>
                            <div className="text-xs font-bold uppercase tracking-wider text-gray-500 mb-1.5">
                                Su secuencia ({secuencia.length}/{pasosAct.length})
                            </div>
                            <div className="space-y-1.5 min-h-[60px] rounded-xl border-2 border-dashed p-2" style={{ borderColor: '#ED1E79' }}>
                                {secuencia.map((i, pos) => {
                                    let cls = 'border-gray-200 bg-white';
                                    if (comprobado) cls = posOk(pos) ? 'border-green-500 bg-green-50' : 'border-red-400 bg-red-50';
                                    return (
                                        <button key={pos} onClick={() => quitar(pos)} disabled={comprobado}
                                            className={`w-full text-left px-3 py-2 rounded-lg border text-[0.88rem] text-gray-700 font-mono transition-all flex items-center gap-2 ${cls}`}>
                                            <span className="flex-shrink-0 w-5 h-5 rounded-full lp-gradient text-white flex items-center justify-center text-[0.7rem] font-bold">{pos + 1}</span>
                                            <span className="flex-1 whitespace-pre-wrap">{pasosAct[i]}</span>
                                            {comprobado
                                                ? <i className={`fas ${posOk(pos) ? 'fa-check text-green-600' : 'fa-xmark text-red-500'} text-xs flex-shrink-0`}></i>
                                                : <i className="fas fa-xmark text-gray-300 text-xs flex-shrink-0"></i>}
                                        </button>
                                    );
                                })}
                                {!secuencia.length && <p className="text-xs text-gray-500 italic text-center py-3" style={{ margin: 0 }}>Haga clic en los pasos de la izquierda, en el orden correcto</p>}
                            </div>
                        </div>
                    </div>

                    <div className="mt-3 flex items-center gap-3 flex-wrap">
                        {!comprobado
                            ? <button onClick={() => completo && setComprobado(true)} disabled={!completo}
                                className="text-sm font-bold px-4 py-1.5 rounded-full text-white lp-gradient disabled:opacity-40">
                                <i className="fas fa-flag-checkered mr-1"></i>Comprobar orden
                            </button>
                            : <>
                                <button onClick={() => { setComprobado(false); setSecuencia([]); }}
                                    className="text-sm font-bold px-4 py-1.5 rounded-full border border-primary text-primary hover:bg-primary/5">
                                    <i className="fas fa-rotate-right mr-1"></i>Reintentar
                                </button>
                                <span className={`text-sm font-bold ${todoOk ? 'text-green-600' : 'text-red-500'}`}>
                                    <i className={`fas ${todoOk ? 'fa-circle-check' : 'fa-circle-xmark'} mr-1`}></i>
                                    {todoOk ? '¡Secuencia correcta!' : `${aciertos} de ${pasosAct.length} pasos en la posición correcta`}
                                </span>
                            </>}
                    </div>
                    {comprobado && !todoOk && (
                        <div className="mt-3 animate-fade-in">
                            <Box type="tip" label="Orden correcto">
                                <ol className="text-sm" style={{ listStyle: 'decimal', paddingLeft: '1.4rem', margin: 0 }}>
                                    {pasosAct.map((p, i) => <li key={i} className="font-mono text-[0.85rem] whitespace-pre-wrap">{p}</li>)}
                                </ol>
                            </Box>
                        </div>
                    )}
                    {pista && <p className="text-xs text-gray-500 italic mt-2"><i className="fas fa-lightbulb mr-1 text-secondary"></i>{pista}</p>}
                </div>
            );
        };

        /* ============================================================
           E6 · EMPAREJAMIENTO ENTRE REPRESENTACIONES
           solucion[i] = índice en `derecha` que corresponde a izquierda[i]
        ============================================================ */
        const PALETA_PARES = ['#3D008D', '#D81B6A', '#0E7490', '#B91C1C', '#15803D', '#B45309', '#001A4D', '#7C3AED'];

        const Emparejamiento = ({ titulo = 'Empareje cada elemento con su correspondencia', enunciado, izquierda, derecha, solucion, lang = 'pseudo', etiquetaIzq = 'Concepto', etiquetaDer = 'Corresponde a' }) => {
            // El lado izquierdo suele ser codigo y por tanto cambia con el
            // lenguaje; el derecho son significados y no cambia.
            const idiomas = lenguajesDe(izquierda);
            const langs = idiomas.length ? idiomas : [lang];
            const [langActivo, cambiarLang] = useLenguajeActivo(langs, lang);
            const izqAct = porLenguaje(izquierda, langActivo);

            const [pares, setPares] = useState({});
            const [selIzq, setSelIzq] = useState(null);
            const [comprobado, setComprobado] = useState(false);
            const ref = useRef(null);
            useTypeset(ref, [comprobado]);
            useEffect(() => { setPares({}); setSelIzq(null); setComprobado(false); }, [langActivo]);

            const derUsada = (j) => Object.values(pares).includes(j);
            const izqDe = (j) => Object.keys(pares).find(i => pares[i] === j);

            const clicIzq = (i) => {
                if (comprobado) return;
                if (pares[i] !== undefined) { setPares(p => { const n = { ...p }; delete n[i]; return n; }); setSelIzq(null); return; }
                setSelIzq(selIzq === i ? null : i);
            };
            const clicDer = (j) => {
                if (comprobado) return;
                if (derUsada(j)) { const i = izqDe(j); setPares(p => { const n = { ...p }; delete n[i]; return n; }); return; }
                if (selIzq === null) return;
                setPares(p => ({ ...p, [selIzq]: j }));
                setSelIzq(null);
            };

            const completo = Object.keys(pares).length === izqAct.length;
            const parOk = (i) => pares[i] === solucion[i];
            const aciertos = izqAct.map((_, i) => parOk(i)).filter(Boolean).length;
            const todoOk = aciertos === izqAct.length;

            return (
                <div ref={ref} className="my-6 rounded-2xl border-2 border-primary/20 bg-white p-5 shadow-sm">
                    <div className="flex items-center gap-2 mb-2">
                        <span className="lp-gradient text-white p-2 rounded-lg"><i className="fas fa-link"></i></span>
                        <h4 className="text-base font-bold text-primary" style={{ margin: 0 }}>{titulo}</h4>
                        <EtiquetaTipo texto="E6 · Emparejar" className="ml-auto text-[0.65rem] uppercase tracking-wider font-bold text-white bg-primary/80 rounded px-2 py-0.5" />
                    </div>
                    {enunciado && <div className="text-[0.95rem] text-gray-700 mb-2">{enunciado}</div>}
                    <SelectorLenguaje disponibles={langs} activo={langActivo} onCambiar={cambiarLang} />
                    <p className="text-xs text-gray-500 mb-3">
                        <i className="fas fa-hand-pointer mr-1"></i>
                        Haga clic en un elemento de la izquierda y luego en su pareja de la derecha. Para deshacer, haga clic sobre cualquiera de los dos.
                    </p>

                    <div className="grid md:grid-cols-2 gap-4">
                        <div>
                            <div className="text-xs font-bold uppercase tracking-wider text-gray-500 mb-1.5">{etiquetaIzq}</div>
                            <div className="space-y-1.5">
                                {izqAct.map((t, i) => {
                                    const emparejado = pares[i] !== undefined;
                                    const color = emparejado ? PALETA_PARES[pares[i] % PALETA_PARES.length] : null;
                                    let cls = 'border-gray-200 bg-white hover:border-primary/40';
                                    if (comprobado && emparejado) cls = parOk(i) ? 'border-green-500 bg-green-50' : 'border-red-400 bg-red-50';
                                    else if (selIzq === i) cls = 'border-secondary bg-amber-50 ring-2 ring-secondary/30';
                                    return (
                                        <button key={i} onClick={() => clicIzq(i)} disabled={comprobado}
                                            aria-pressed={selIzq === i}
                                            className={`w-full text-left px-3 py-2 rounded-lg border text-[0.88rem] text-gray-700 transition-all flex items-start gap-2 ${cls}`}>
                                            <span className={'flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-[0.7rem] font-bold mt-0.5 ' + (color ? 'text-white' : 'text-navy')}
                                                style={{ background: color || '#CBD5E1' }}>
                                                {emparejado ? String.fromCharCode(65 + pares[i]) : i + 1}
                                            </span>
                                            <span className="flex-1">{t}</span>
                                            {comprobado && emparejado && <i className={`fas ${parOk(i) ? 'fa-check text-green-600' : 'fa-xmark text-red-500'} text-xs mt-1`}></i>}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        <div>
                            <div className="text-xs font-bold uppercase tracking-wider text-gray-500 mb-1.5">{etiquetaDer}</div>
                            <div className="space-y-1.5">
                                {derecha.map((t, j) => {
                                    const usada = derUsada(j);
                                    const color = usada ? PALETA_PARES[j % PALETA_PARES.length] : null;
                                    let cls = 'border-gray-200 bg-white hover:border-primary/40';
                                    if (usada) cls = 'border-gray-300 bg-gray-50';
                                    if (comprobado && usada) {
                                        const i = Number(izqDe(j));
                                        cls = parOk(i) ? 'border-green-500 bg-green-50' : 'border-red-400 bg-red-50';
                                    }
                                    return (
                                        <button key={j} onClick={() => clicDer(j)} disabled={comprobado}
                                            className={`w-full text-left px-3 py-2 rounded-lg border text-[0.88rem] text-gray-700 transition-all flex items-start gap-2 ${cls}`}>
                                            <span className={'flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-[0.7rem] font-bold mt-0.5 ' + (color ? 'text-white' : 'text-navy')}
                                                style={{ background: color || '#CBD5E1' }}>
                                                {String.fromCharCode(65 + j)}
                                            </span>
                                            <span className="flex-1">{t}</span>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </div>

                    <div className="mt-3 flex items-center gap-3 flex-wrap">
                        {!comprobado
                            ? <button onClick={() => completo && setComprobado(true)} disabled={!completo}
                                className="text-sm font-bold px-4 py-1.5 rounded-full text-white lp-gradient disabled:opacity-40">
                                <i className="fas fa-check-double mr-1"></i>Comprobar ({Object.keys(pares).length}/{izqAct.length})
                            </button>
                            : <>
                                <button onClick={() => { setComprobado(false); setPares({}); setSelIzq(null); }}
                                    className="text-sm font-bold px-4 py-1.5 rounded-full border border-primary text-primary hover:bg-primary/5">
                                    <i className="fas fa-rotate-right mr-1"></i>Reintentar
                                </button>
                                <span className={`text-sm font-bold ${todoOk ? 'text-green-600' : 'text-red-500'}`}>
                                    <i className={`fas ${todoOk ? 'fa-circle-check' : 'fa-circle-xmark'} mr-1`}></i>
                                    {aciertos} de {izqAct.length} correctos
                                </span>
                            </>}
                    </div>
                    {comprobado && !todoOk && (
                        <div className="mt-3 animate-fade-in">
                            <Box type="tip" label="Emparejamiento correcto">
                                <ul className="text-sm" style={{ listStyle: 'none', padding: 0, margin: 0 }}>
                                    {izqAct.map((t, i) => (
                                        <li key={i} className="mb-1">
                                            <strong>{i + 1}</strong> → <strong>{String.fromCharCode(65 + solucion[i])}</strong>
                                            <span className="text-gray-500"> · {derecha[solucion[i]]}</span>
                                        </li>
                                    ))}
                                </ul>
                            </Box>
                        </div>
                    )}
                </div>
            );
        };

        /* ============================================================
           TRAZADOR — motor de traza paso a paso (exposición, no ejercicio)

           Aquí el estudiante MIRA una traza ejecutarse; en `TablaTraza` le toca
           hacerla. Por eso no califica nada y `verificar.py` no lo cuenta en la
           cuota de ejercicios: enseña el método que el E1 después evalúa.

           `pasos` lleva DELTAS, no el estado completo. Cada paso declara solo
           las variables que su instrucción cambia, el componente acumula el
           resto, y la celda que cambió se resalta. Escribir el estado entero en
           cada fila sería más largo y, sobre todo, escondería lo único que hay
           que ver: qué tocó esta instrucción y qué dejó igual.

               { linea: 4,                        // o {pseudo, python, r, vba}
                 estado: { interes: '2.160.000' },  // solo lo que cambia
                 nota: 'Ya hay capital y tasa, así que el interés se puede calcular.',
                 salida: SALIDA_INTERES }         // opcional, también por lenguaje

           `linea` admite objeto por lenguaje porque el número cambia —VBA añade
           `Sub` y `Dim`, Python no lleva declaraciones—, y `salida` también,
           porque lo impreso no coincide: Python saca `2,160,000` y R `2160000`.
           Los VALORES de las variables no: son los mismos en los cuatro, y
           hacérselo ver al estudiante es parte del objetivo.

           Lo ya ejecutado se calcula recorriendo los pasos dados, NO las líneas
           anteriores a la activa. En este capítulo daría igual —la secuencia va
           de arriba abajo—, pero los capítulos 4 y 5 heredan el componente y
           allí el flujo salta y se repite: «ya ejecutado» dejaría de coincidir
           con «todo lo que está más arriba».
        ============================================================ */
        const Trazador = ({ titulo = 'Traza paso a paso', enunciado, codigo, lang = 'pseudo', variables, pasos, nota }) => {
            const idiomas = lenguajesDe(codigo);
            const disponibles = idiomas.length ? idiomas : [lang];
            const [langActivo, cambiarLang] = useLenguajeActivo(disponibles, lang);

            // Cuántas instrucciones se han ejecutado, de 0 a n. El 0 no es un
            // caso degenerado: «antes de empezar, ninguna variable tiene valor»
            // es la primera fila de cualquier prueba de escritorio hecha a mano.
            const [hechos, setHechos] = useState(0);
            const ref = useRef(null);
            useTypeset(ref, [hechos, langActivo]);

            const total = pasos.length;
            const lineasAct = String(porLenguaje(codigo, langActivo)).split('\n');

            const lineaDe = (p) => {
                const v = Number(porLenguaje(p.linea, langActivo));
                return Number.isFinite(v) ? v : null;
            };

            // Estado acumulado tras cada paso, y qué claves cambió cada uno. Una
            // variable `efimera` no se arrastra: vale solo en el paso que la
            // escribe. Es para lo que no es una variable del programa sino algo
            // que se evalúa, como una condición: arrastrada, la columna
            // «saldo > 0» seguía diciendo «Verdadero» con el saldo ya en
            // −200 000 (L5).
            const efimeras = new Set(variables.filter(v => v.efimera).map(v => v.clave));
            const acumulado = [];
            const cambiadas = [];
            let estado = {};
            pasos.forEach(p => {
                const arrastrado = Object.fromEntries(Object.entries(estado).filter(([k]) => !efimeras.has(k)));
                estado = { ...arrastrado, ...(p.estado || {}) };
                acumulado.push(estado);
                cambiadas.push(Object.keys(p.estado || {}));
            });

            const actual = hechos > 0 ? pasos[hechos - 1] : null;
            const lineaActiva = actual ? lineaDe(actual) : null;
            const ejecutadas = new Set(pasos.slice(0, hechos).map(lineaDe).filter(n => n !== null));
            const conSalida = pasos.some(p => p.salida !== undefined && p.salida !== null);

            const ir = (n) => setHechos(Math.max(0, Math.min(total, n)));

            // Sin tabla de teclas: un objeto indexado por `e.key` devolvería el
            // `toString` heredado si alguien pulsa una tecla con ese nombre.
            const teclado = (e) => {
                if (e.key === 'ArrowRight') { e.preventDefault(); ir(hechos + 1); }
                else if (e.key === 'ArrowLeft') { e.preventDefault(); ir(hechos - 1); }
                else if (e.key === 'Home') { e.preventDefault(); ir(0); }
                else if (e.key === 'End') { e.preventDefault(); ir(total); }
            };

            const instruccionDe = (p) => {
                const n = lineaDe(p);
                return n && lineasAct[n - 1] !== undefined ? lineasAct[n - 1].trim() : '—';
            };

            return (
                <div ref={ref} className="my-6 rounded-2xl border-2 border-primary/20 bg-white p-5 shadow-sm">
                    <div className="flex items-center gap-2 mb-2">
                        <span className="lp-gradient text-white p-2 rounded-lg"><i className="fas fa-shoe-prints"></i></span>
                        <h4 className="text-base font-bold text-primary" style={{ margin: 0 }}>{titulo}</h4>
                        <span className="ml-auto text-[0.65rem] uppercase tracking-wider font-bold text-white bg-teal rounded px-2 py-0.5">Traza guiada</span>
                    </div>
                    {enunciado && <div className="text-[0.95rem] text-gray-700 mb-3">{enunciado}</div>}

                    <SelectorLenguaje disponibles={disponibles} activo={langActivo} onCambiar={cambiarLang} />

                    {/* La región entera es un solo destino de tabulación: dentro
                        hay hasta doce saltos directos, y hacer que el tabulador
                        los recorra uno a uno para llegar al final del bloque
                        convierte la navegación por teclado en un castigo. */}
                    <div tabIndex={0} onKeyDown={teclado} role="group"
                        aria-label={`${titulo}. Use las flechas izquierda y derecha para avanzar y retroceder.`}
                        className="rounded-xl outline-none focus:ring-2 focus:ring-secondary/60">

                    {/* Un solo desplazamiento horizontal para TODO el bloque, no
                        uno por línea: con `overflow-x` en cada línea, un móvil
                        de 375 px pinta una barra debajo de cada instrucción y
                        además cada línea se desplaza por su cuenta, de modo que
                        la sangría deja de alinear. El `min-w-max` interior le da
                        a todas las filas el ancho de la más larga, para que la
                        franja de la línea activa llegue hasta el final. */}
                        <div className="rounded-xl overflow-hidden border border-gray-700 bg-gray-900">
                            <div className="overflow-x-auto">
                                <div className="min-w-max">
                                    {lineasAct.map((l, i) => {
                                        const n = i + 1;
                                        const activa = n === lineaActiva;
                                        const hecha = ejecutadas.has(n);
                                        const cls = activa ? 'bg-amber-500/20 ring-1 ring-amber-400'
                                            : hecha ? 'bg-white/[0.04]' : '';
                                        return (
                                            <div key={i} className={`flex items-start gap-3 px-3 py-1 font-mono text-[0.82rem] transition-colors ${cls}`}>
                                                <span className="select-none w-6 text-right flex-shrink-0 text-gray-400">{n}</span>
                                                <span className={`select-none w-3 flex-shrink-0 ${activa ? 'text-amber-400' : 'text-gray-700'}`}>
                                                    {activa ? '▶' : hecha ? '·' : ' '}
                                                </span>
                                                <span className={`whitespace-pre ${activa ? 'text-white' : 'text-gray-100'}`}
                                                    dangerouslySetInnerHTML={{ __html: resaltar(l, langActivo) }} />
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>

                        <div className="mt-3 flex items-center gap-2 flex-wrap">
                            <button onClick={() => ir(hechos - 1)} disabled={hechos === 0}
                                className="text-sm font-bold px-3.5 py-1.5 rounded-full border border-primary text-primary hover:bg-primary/5 disabled:opacity-40">
                                <i className="fas fa-chevron-left mr-1"></i>Anterior
                            </button>
                            <button onClick={() => ir(hechos + 1)} disabled={hechos === total}
                                className="text-sm font-bold px-4 py-1.5 rounded-full text-white lp-gradient hover:opacity-90 disabled:opacity-40">
                                Siguiente<i className="fas fa-chevron-right ml-1"></i>
                            </button>
                            <button onClick={() => ir(0)} disabled={hechos === 0}
                                className="text-xs font-semibold text-gray-500 hover:text-primary underline disabled:opacity-40 disabled:no-underline">
                                <i className="fas fa-rotate-right mr-1"></i>Reiniciar
                            </button>
                            <span className="ml-auto text-xs text-gray-500">
                                Paso <strong className="text-primary">{hechos}</strong> de {total}
                                <span className="hidden sm:inline text-gray-500"> · flechas ← →</span>
                            </span>
                        </div>

                        <div className="mt-2 h-1 rounded-full bg-gray-100 overflow-hidden">
                            <div className="h-full lp-gradient transition-all duration-200"
                                style={{ width: `${total ? (hechos / total) * 100 : 0}%` }}></div>
                        </div>

                        <div className="mt-2 flex flex-wrap gap-1">
                            {pasos.map((p, i) => (
                                <button key={i} onClick={() => ir(i + 1)} aria-label={`Ir al paso ${i + 1}`}
                                    aria-current={hechos === i + 1 ? 'step' : undefined}
                                    className={`w-6 h-6 rounded text-[0.68rem] font-bold border transition-colors ${hechos === i + 1
                                        ? 'lp-gradient text-white border-transparent'
                                        : i < hechos ? 'bg-primary/10 text-primary border-primary/20'
                                            : 'bg-white text-gray-500 border-gray-200 hover:border-primary/40'}`}>
                                    {i + 1}
                                </button>
                            ))}
                        </div>

                        <p role="status" aria-live="polite" className="mt-3 mb-0 text-[0.9rem] text-gray-700 min-h-[2.6rem] rounded-lg px-3 py-2"
                            style={{ background: 'rgba(14,116,144,0.06)', borderLeft: '3px solid #0E7490' }}>
                            {actual
                                ? <><strong className="text-teal">Paso {hechos}.</strong> {actual.nota}</>
                                : <span className="text-gray-600">Aún no se ha ejecutado ninguna instrucción: ninguna variable tiene valor. Pulse <strong>Siguiente</strong>.</span>}
                        </p>

                        <div className="overflow-x-auto mt-3">
                            <table className="w-full text-sm border-collapse">
                                <thead>
                                    <tr>
                                        <th className="bg-primary/10 text-primary text-left px-2 py-2 border border-gray-200 font-semibold w-8">#</th>
                                        <th className="bg-primary/10 text-primary text-left px-3 py-2 border border-gray-200 font-semibold">Instrucción</th>
                                        {variables.map(v => (
                                            <th key={v.clave} className="bg-primary/10 text-primary text-left px-3 py-2 border border-gray-200 font-semibold whitespace-nowrap">
                                                {v.titulo || v.clave}
                                            </th>
                                        ))}
                                        {conSalida && <th className="bg-primary/10 text-primary text-left px-3 py-2 border border-gray-200 font-semibold">Salida</th>}
                                    </tr>
                                </thead>
                                <tbody>
                                    {hechos === 0 && (
                                        <tr>
                                            <td colSpan={2 + variables.length + (conSalida ? 1 : 0)}
                                                className="px-3 py-3 border border-gray-200 text-gray-500 text-center italic">
                                                La tabla se llena a medida que avanza la traza.
                                            </td>
                                        </tr>
                                    )}
                                    {pasos.slice(0, hechos).map((p, i) => (
                                        <tr key={i} className={i === hechos - 1 ? 'bg-amber-50' : i % 2 ? 'bg-gray-50/60' : ''}>
                                            <td className="px-2 py-1.5 border border-gray-200 text-gray-500 text-center">{i + 1}</td>
                                            <td className="px-3 py-1.5 border border-gray-200 text-gray-700 font-mono text-[0.8rem]">{instruccionDe(p)}</td>
                                            {variables.map(v => {
                                                const cambio = cambiadas[i].includes(v.clave);
                                                const val = acumulado[i][v.clave];
                                                return (
                                                    <td key={v.clave}
                                                        className={`px-3 py-1.5 border border-gray-200 font-mono text-[0.82rem] ${cambio ? 'font-bold text-secondary-texto bg-secondary/5' : 'text-gray-700'}`}>
                                                        {val === undefined ? <span className="text-gray-300">—</span> : val}
                                                    </td>
                                                );
                                            })}
                                            {conSalida && (
                                                <td className="px-3 py-1.5 border border-gray-200 font-mono text-[0.8rem] text-teal">
                                                    {p.salida !== undefined && p.salida !== null
                                                        ? porLenguaje(p.salida, langActivo)
                                                        : <span className="text-gray-300">—</span>}
                                                </td>
                                            )}
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {nota && <p className="text-xs text-gray-500 italic mt-3 mb-0">{nota}</p>}
                </div>
            );
        };

        // RA1, textual del syllabus (fila 31): «Construye un algoritmo

            docente: 'Javier Mauricio Sierra',

        /* ============================================================
           ARTEFACTOS INTERACTIVOS DEL CAPÍTULO

           Viven aquí y no en LP-CORE a propósito: los usa un solo capítulo, y
           meterlos en la librería obligaría a reestampar los ocho por algo que
           solo necesita este. (Plan de la Tarea 10, H9.)
        ============================================================ */

        // La cuota fija de la amortización francesa. El capítulo la toma como
        // dada: se deduce en matemáticas financieras y el capítulo 8 la

        // NO se redondea al peso (supuesto S3 del plan): así el saldo final es
        // un residuo de millonésimas y no de centavos.
        const cuotaFija = (capital, tasa, n) => capital * tasa / (1 - Math.pow(1 + tasa, -n));

        // Un residuo de punto flotante escrito como se lee: −3,6 × 10⁻⁶, y no

        // centavo se escribe 0,00 y no «-0,00»: el signo de un residuo es
        // información para la sección 6, no para una tabla de pagos.
        const pesosCO = (x) => (Math.abs(x) < 0.005 ? 0 : x)
            .toLocaleString('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

        /* ------------------------------------------------------------
           AmortizacionPasoAPaso — la tabla de amortización ES un ciclo

        ------------------------------------------------------------ */
        const CREDITOS_AMORTIZACION = [
            { id: 'vivienda', nombre: 'Crédito de vivienda', capital: 150000000, tasa: 0.011, n: 240 },
            { id: 'vehiculo', nombre: 'Crédito de vehículo', capital: 30000000, tasa: 0.0145, n: 60 },
            { id: 'libre', nombre: 'Libre inversión', capital: 10000000, tasa: 0.015, n: 12 },
        ];

        const PSEUDO_AMORTIZACION = `cuota <- capital * tasa / (1 - (1 + tasa) ^ (-n))
saldo <- capital
totalIntereses <- 0

Para k <- 1 Hasta n Hacer
    interes <- saldo * tasa
    abono   <- cuota - interes
    saldo   <- saldo - abono
    totalIntereses <- totalIntereses + interes
    Escribir k, interes, abono, saldo
FinPara`;

        const AmortizacionPasoAPaso = () => {

        /* ------------------------------------------------------------
           TresCiclosComparados — el mismo cobro con las tres formas

           Cobrar las cuotas pendientes de un crédito, escrito con `Mientras`,
           con `Para` y con `Repita`. Con una o más cuotas pendientes las tres
           cobran lo mismo, y el estudiante podría concluir que da igual cuál se
           use. Con CERO no: `Repita` entra antes de preguntar y cobra una cuota
           que nadie debía (plan de la Tarea 10, H5).

           Los dos paneles opcionales son los `for` con trampa. El de R con
           `1:n`: con n = 0 da DOS vueltas, con k = 1 y con k = 0 (H4). Y el de
           Python con `range(1, n)`, el error de la motivación: da n − 1 vueltas
           y solo cobra bien con n = 0. Lo añadió la revisión del 2026-10-20: el
           caso n = 0 ya lo resolvían la tabla y el recuadro de la sección, y
           este panel deja algo que descubrir.
        ------------------------------------------------------------ */
        const COBRO_CUOTA = cuotaFija(10000000, 0.015, 12);

        const FORMAS_CICLO = [
            {
                id: 'mientras', nombre: 'Mientras', nota: 'Pregunta antes de entrar.',
                codigo: `cobrado <- 0
k <- 1
Mientras k <= n Hacer
    cobrado <- cobrado + cuota
    k <- k + 1
FinMientras`,
                vueltas: (n) => { let v = 0, k = 1; while (k <= n) { v++; k++; } return v; },
            },
            {
                id: 'para', nombre: 'Para', nota: 'El contador lo lleva el ciclo.',
                codigo: `cobrado <- 0
Para k <- 1 Hasta n Hacer
    cobrado <- cobrado + cuota
FinPara`,
                vueltas: (n) => { let v = 0; for (let k = 1; k <= n; k++) v++; return v; },
            },
            {
                id: 'repita', nombre: 'Repita…Hasta', nota: 'Entra primero y pregunta después.',
                codigo: `cobrado <- 0
k <- 1
Repita
    cobrado <- cobrado + cuota
    k <- k + 1
Hasta k > n`,
                vueltas: (n) => { let v = 0, k = 1; do { v++; k++; } while (!(k > n)); return v; },
            },
        ];

        // `1:n` en R cuenta hacia abajo cuando n < 1: 1:0 es c(1, 0).
        const FORMA_R = {
            id: 'r', nombre: 'for de R con 1:n', nota: 'Parece un Para. Con n = 0 no lo es.',
            codigo: `cobrado <- 0
for (k in 1:n) {
  cobrado <- cobrado + cuota
}`,
            vueltas: (n) => (n >= 1 ? n : 2 - n),
        };

        // `range(1, n)` se detiene antes de n: el segundo número no se usa.
        const FORMA_PY = {
            id: 'py', nombre: 'for de Python con range(1, n)', nota: 'La traducción de la motivación.',
            codigo: `cobrado = 0
for k in range(1, n):
    cobrado = cobrado + cuota`,

        };

        const TresCiclosComparados = () => {
            const [n, setN] = useState(3);
            const [conR, setConR] = useState(false);
            const [conPy, setConPy] = useState(false);
            const formas = [...FORMAS_CICLO, ...(conR ? [FORMA_R] : []), ...(conPy ? [FORMA_PY] : [])];
            const debido = n * COBRO_CUOTA;
            const resultados = formas.map(f => ({ ...f, v: f.vueltas(n) }));
            const alguienFalla = resultados.some(r => r.v !== n);

            return (
                <div className="my-6 rounded-2xl border-2 border-primary/20 bg-white p-4 sm:p-5 shadow-sm not-prose">
                    <div className="flex items-center gap-2 mb-3">
                        <span className="lp-gradient text-white p-2 rounded-lg"><i className="fas fa-code-compare"></i></span>
                        <h4 className="text-base font-bold text-primary" style={{ margin: 0 }}>El mismo cobro, tres ciclos</h4>
                        <span className="ml-auto text-[0.65rem] uppercase tracking-wider font-bold text-white bg-teal rounded px-2 py-0.5">Interactivo</span>
                    </div>

                    <p className="text-[0.95rem] text-gray-700 mb-3">
                        Tres formas de cobrar las <span className="inline-code">n</span> cuotas pendientes de un
                        crédito, cada una de {pesosCO(COBRO_CUOTA)}. Cambie <span className="inline-code">n</span> y
                        compruebe con qué valor <strong>dejan de cobrar lo mismo</strong>. Después añada los
                        dos <span className="inline-code">for</span> de abajo.
                    </p>

                    <div className="mb-3">
                        <span className="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1" id="lp-cuotas-pendientes">Cuotas pendientes, <span className="normal-case font-mono">n</span></span>
                        <div className="flex flex-wrap gap-1.5" role="group" aria-labelledby="lp-cuotas-pendientes">
                            {[0, 1, 2, 3, 4, 5, 6].map(v => (
                                <button key={v} type="button" onClick={() => setN(v)} aria-pressed={n === v}
                                    className={'w-10 h-9 rounded-lg border-2 font-mono text-sm font-bold ' +

                                    {v}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className={'grid gap-3 mb-3 ' + (formas.length === 4 ? 'sm:grid-cols-2' : 'sm:grid-cols-3')}>
                        {resultados.map(r => {
                            const mal = r.v !== n;
                            return (
                                <div key={r.id} className={'rounded-xl border-2 p-3 min-w-0 ' + (mal ? 'border-[#B91C1C] bg-[#FEF2F2]' : 'border-gray-300')}>
                                    <p className="text-xs font-bold uppercase tracking-wider text-gray-500" style={{ margin: 0 }}>{r.nombre}</p>
                                    <p className="text-xs text-gray-500 mb-2" style={{ margin: 0 }}>{r.nota}</p>
                                    <pre className="text-[0.78rem] leading-snug bg-gray-50 border border-gray-200 rounded-lg p-2 overflow-x-auto" style={{ margin: '0 0 0.5rem' }}><code>{r.codigo}</code></pre>
                                    <p className="font-mono text-sm text-navy" style={{ margin: 0 }}>vueltas: <strong>{r.v}</strong></p>
                                    <p className={'font-mono text-sm ' + (mal ? 'text-[#B91C1C] font-bold' : 'text-navy')} style={{ margin: 0 }}>

                    <label className="flex items-center gap-2 text-sm text-gray-700 mb-1 cursor-pointer">
                        <input type="checkbox" checked={conR} onChange={(e) => setConR(e.target.checked)} className="w-4 h-4 accent-[#3D008D]" />
                        Añadir el <span className="inline-code">for (k in 1:n)</span> de R
                    </label>
                    <label className="flex items-center gap-2 text-sm text-gray-700 mb-3 cursor-pointer">
                        <input type="checkbox" checked={conPy} onChange={(e) => setConPy(e.target.checked)} className="w-4 h-4 accent-[#3D008D]" />
                        Añadir el <span className="inline-code">for k in range(1, n)</span> de Python
                    </label>

                    <div role="status" className={'rounded-xl p-3 text-sm ' +
                        (alguienFalla ? 'bg-[#B45309]/15 border-2 border-[#B45309]' : 'bg-gray-100 border border-gray-300')}>
                        {!alguienFalla
                            ? <span>Con n = {n} los {formas.length} ciclos dan {n} {n === 1 ? 'vuelta' : 'vueltas'} y
                                cobran {pesosCO(debido)}. Pruebe otro valor.</span>
                            : <span><strong>Aquí difieren.</strong> {n === 0 ? 'No se debe nada, y aun así ' : 'Se deben ' + pesosCO(debido) + ', y '}
                                {resultados.filter(r => r.v !== n).map(r =>
                                'el ' + r.nombre + ' cobra ' + pesosCO(r.v * COBRO_CUOTA)).join(' y ')}. Ninguno da un error: el
                                cobro sale como si fuera correcto.</span>}

        };

        /* ------------------------------------------------------------
           TIRBiseccion — el ciclo que para porque converge

           Hasta aquí los ciclos paran porque un contador llega a su tope. Este
           para porque la respuesta ya es lo bastante precisa, y nadie sabe de
           antemano cuántas vueltas va a necesitar.

           El caso: 10 000 000 al 1,5 % mensual en 12 cuotas, con una comisión
           de 300 000 descontada al desembolsar. El cliente recibe 9 700 000 y
           paga doce cuotas calculadas sobre 10 000 000. La TIR es la tasa que
           iguala lo que recibe con lo que paga. Medida con el intervalo
           [0 %, 10 %] y tolerancia 10⁻⁶: 1,9924 % mensual en 17 vueltas.

           Es la búsqueda binaria del capítulo 2 —que encontró un crédito entre
           40 000 en 12 comparaciones; en el peor caso harían falta 16, aunque el capítulo 2 no lo dice— aplicada a una función en
           vez de a una lista. Se cita, no se repite.

           El VPN se calcula con un ciclo DENTRO del ciclo de la bisección: el
           pseudocódigo no llama a ninguna función, que son del capítulo 8.
        ------------------------------------------------------------ */
        const TIR_CASO = { capital: 10000000, tasa: 0.015, n: 12, comision: 300000 };
        const TIR_CUOTA = cuotaFija(TIR_CASO.capital, TIR_CASO.tasa, TIR_CASO.n);
        const TIR_RECIBIDO = TIR_CASO.capital - TIR_CASO.comision;
        const TIR_TOLERANCIA = 1e-6;
        const vpnTir = (r) => {
            let vpn = -TIR_RECIBIDO;
            for (let k = 1; k <= TIR_CASO.n; k++) vpn = vpn + TIR_CUOTA / Math.pow(1 + r, k);
            return vpn;
        };

        const PSEUDO_BISECCION = `bajo <- 0
alto <- 0.10
vueltas <- 0
Mientras alto - bajo >= 0.000001 Hacer
    medio <- (bajo + alto) / 2
    vpn <- -recibido
    Para k <- 1 Hasta n Hacer
        vpn <- vpn + cuota / (1 + medio) ^ k
    FinPara
    Si vpn > 0 Entonces
        bajo <- medio
    Sino
        alto <- medio
    FinSi
    vueltas <- vueltas + 1
FinMientras`;

        // Una tasa en porcentaje, con los decimales que hagan falta para que
        // dos extremos del intervalo no salgan escritos igual.
        const tasaPct = (r, dec = 4) => (r * 100).toLocaleString('es-CO', { minimumFractionDigits: 0, maximumFractionDigits: dec }) + ' %';

        const TIRBiseccion = () => {
            const [vueltas, setVueltas] = useState([]);
            const [acercar, setAcercar] = useState(false);
            const ultima = vueltas.length ? vueltas[vueltas.length - 1] : null;
            const bajo = ultima ? ultima.bajoNuevo : 0;
            const alto = ultima ? ultima.altoNuevo : 0.10;
            const ancho = alto - bajo;
            const termino = ancho < TIR_TOLERANCIA;
            // Decimales para distinguir los extremos: crecen al estrecharse.
            const dec = Math.min(8, Math.max(2, Math.ceil(-Math.log10(Math.max(ancho * 100, 1e-9))) + 2));

            const darVuelta = (lista) => {
                const u = lista.length ? lista[lista.length - 1] : null;
                const b = u ? u.bajoNuevo : 0, a = u ? u.altoNuevo : 0.10;
                if (a - b < TIR_TOLERANCIA) return lista;
                const medio = (b + a) / 2;
                const vpn = vpnTir(medio);
                return [...lista, {
                    n: lista.length + 1, bajo: b, alto: a, medio, vpn,
                    bajoNuevo: vpn > 0 ? medio : b, altoNuevo: vpn > 0 ? a : medio,
                }];
            };
            const hastaParar = () => {
                let l = vueltas;
                for (let i = 0; i < 60; i++) { const s = darVuelta(l); if (s === l) break; l = s; }
                setVueltas(l);
            };

            const idGrafica = 'chart-tir-biseccion';
            usePlotly(idGrafica, () => {
                const x0 = acercar && ultima ? Math.max(0, bajo - ancho) : 0;
                const x1 = acercar && ultima ? Math.min(0.10, alto + ancho) : 0.10;
                const xs = [], ys = [];
                for (let i = 0; i <= 120; i++) { const r = x0 + (x1 - x0) * i / 120; xs.push(r * 100); ys.push(vpnTir(r)); }
                const trazas = [
                    { x: xs, y: ys, mode: 'lines', name: 'VPN', line: { color: '#3D008D', width: 2.5 }, hovertemplate: 'tasa %{x:.4f} %<br>VPN %{y:,.0f}<extra></extra>' },
                ];
                const vistas = vueltas.filter(v => v.medio >= x0 && v.medio <= x1);
                if (vistas.length) {
                    trazas.push({
                        x: vistas.map(v => v.medio * 100), y: vistas.map(v => v.vpn), mode: 'markers', name: 'medio',
                        marker: { size: vistas.map(v => (v === ultima ? 11 : 7)), color: vistas.map(v => (v === ultima ? '#ED1E79' : '#9CA3AF')) },
                        hovertemplate: 'medio %{x:.6f} %<br>VPN %{y:,.0f}<extra></extra>',
                    });
                }
                return trazas;
            }, () => {
                const x0 = acercar && ultima ? Math.max(0, bajo - ancho) : 0;
                const x1 = acercar && ultima ? Math.min(0.10, alto + ancho) : 0.10;
                return {
                    margin: { l: 64, r: 12, t: 12, b: 44 },
                    showlegend: false,
                    xaxis: { title: { text: 'tasa mensual (%)', font: { size: 12 } }, range: [x0 * 100, x1 * 100], zeroline: false, automargin: true, nticks: 3 },
                    yaxis: { title: { text: 'VPN (pesos)', font: { size: 12 }, standoff: 8 }, automargin: true, zeroline: true, zerolinecolor: '#001A4D', zerolinewidth: 1.5, tickformat: ',.0f' },
                    shapes: [{
                        type: 'rect', xref: 'x', yref: 'paper', x0: bajo * 100, x1: alto * 100, y0: 0, y1: 1,
                        fillcolor: 'rgba(14,116,144,0.14)', line: { color: '#0E7490', width: 1 },
                    }],
                    separators: ',.',
                    font: { family: 'Inter, system-ui, sans-serif', size: 11 },
                };
            }, [vueltas.length, acercar]);

            return (
                <div className="my-6 rounded-2xl border-2 border-primary/20 bg-white p-4 sm:p-5 shadow-sm not-prose">
                    <div className="flex items-center gap-2 mb-3">
                        <span className="lp-gradient text-white p-2 rounded-lg"><i className="fas fa-bullseye"></i></span>
                        <h4 className="text-base font-bold text-primary" style={{ margin: 0 }}>La TIR, partiendo el intervalo</h4>
                        <span className="ml-auto text-[0.65rem] uppercase tracking-wider font-bold text-white bg-teal rounded px-2 py-0.5">Interactivo</span>
                    </div>

                    <p className="text-[0.95rem] text-gray-700 mb-3">
                        Un crédito de {pesosCO(TIR_CASO.capital)} al {tasaPct(TIR_CASO.tasa)} mensual en {TIR_CASO.n} cuotas
                        de {pesosCO(TIR_CUOTA)}, con una comisión de {pesosCO(TIR_CASO.comision)} descontada al
                        desembolsar: el cliente recibe {pesosCO(TIR_RECIBIDO)}. La TIR es la tasa a la que
                        el <strong>VPN</strong> —lo recibido contra las doce cuotas traídas a hoy— vale cero. Cada vuelta
                        parte el intervalo por la mitad y se queda con la mitad donde el VPN cambia de signo.
                    </p>

                    <CodeBlock title="El ciclo de la bisección" code={PSEUDO_BISECCION} lang="pseudo" plegable={false} />

                    <ChartFrame id={idGrafica} height="chart-h-320"
                        caption="La franja es el intervalo [bajo, alto]. El VPN baja al subir la tasa y cruza el cero una sola vez: la TIR está siempre dentro de la franja." />

                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3" role="status" aria-live="polite">
                        {[
                            ['vueltas', String(vueltas.length), true],
                            ['bajo', tasaPct(bajo, dec)],
                            ['alto', tasaPct(alto, dec)],
                            ['alto - bajo', tasaPct(ancho, dec + 1)],
                        ].map(([e, v, d]) => (
                            <div key={e} className="rounded-lg bg-gray-50 border border-gray-200 px-3 py-2 min-w-0">
                                <div className="text-xs font-mono text-gray-500">{e}</div>
                                <div className={'font-mono text-xs sm:text-sm whitespace-nowrap ' + (d ? 'text-primary font-bold' : 'text-navy')}>{v}</div>
                            </div>
                        ))}
                    </div>

                    <div className="flex flex-wrap gap-2 mb-3">
                        <button type="button" onClick={() => setVueltas(darVuelta(vueltas))} disabled={termino}
                            className="text-sm font-bold px-3 py-1.5 rounded-full border-2 border-primary bg-primary text-white hover:bg-primary/90 disabled:opacity-40 disabled:cursor-not-allowed">
                            <i className="fas fa-plus mr-1"></i>Una vuelta
                        </button>
                        <button type="button" onClick={hastaParar} disabled={termino}
                            className="text-sm font-bold px-3 py-1.5 rounded-full border-2 border-primary text-primary hover:bg-primary/5 disabled:opacity-40 disabled:cursor-not-allowed">
                            Hasta que pare
                        </button>
                        <button type="button" onClick={() => setVueltas([])} disabled={!vueltas.length}
                            className="text-sm font-bold px-3 py-1.5 rounded-full border-2 border-gray-300 text-gray-600 hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed">
                            <i className="fas fa-rotate-left mr-1"></i>Reiniciar
                        </button>
                        <label className="flex items-center gap-2 text-sm text-gray-700 cursor-pointer ml-1">
                            <input type="checkbox" checked={acercar} onChange={(e) => setAcercar(e.target.checked)} className="w-4 h-4 accent-[#3D008D]" />
                            Acercar la gráfica al intervalo
                        </label>
                    </div>

                    {vueltas.length > 0 && (
                        <div className="overflow-auto rounded-xl border border-gray-200 mb-3" style={{ maxHeight: '15rem' }}>
                            <table className="w-full text-xs sm:text-sm font-mono whitespace-nowrap" style={{ margin: 0, minWidth: '30rem', borderCollapse: 'separate', borderSpacing: 0 }}>
                                <thead>
                                    <tr>
                                        <th className="sticky top-0 bg-gray-100 px-2 py-1.5 text-right">vuelta</th>
                                        <th className="sticky top-0 bg-gray-100 px-2 py-1.5 text-right">bajo</th>
                                        <th className="sticky top-0 bg-gray-100 px-2 py-1.5 text-right">alto</th>
                                        <th className="sticky top-0 bg-gray-100 px-2 py-1.5 text-right">medio</th>
                                        <th className="sticky top-0 bg-gray-100 px-2 py-1.5 text-center">vpn</th>
                                        <th className="sticky top-0 bg-gray-100 px-2 py-1.5 text-left">se queda con</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {vueltas.map(v => (
                                        <tr key={v.n} className={v === ultima ? 'bg-primary/10' : ''}>
                                            <td className="px-2 py-1 text-right text-primary font-bold">{v.n}</td>
                                            <td className="px-2 py-1 text-right">{tasaPct(v.bajo, 6)}</td>
                                            <td className="px-2 py-1 text-right">{tasaPct(v.alto, 6)}</td>
                                            <td className="px-2 py-1 text-right">{tasaPct(v.medio, 6)}</td>
                                            <td className={'px-2 py-1 text-center font-bold ' + (v.vpn > 0 ? 'text-[#15803D]' : 'text-[#B91C1C]')}>{v.vpn > 0 ? '+' : '−'}</td>
                                            <td className="px-2 py-1 text-left">{v.vpn > 0 ? 'bajo ← medio' : 'alto ← medio'}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    <div className={'rounded-xl p-3 text-sm ' + (termino ? 'bg-[#15803D]/10 border-2 border-[#15803D]' : 'bg-gray-100 border border-gray-300')}>
                        {termino
                            ? <span><strong>El ciclo paró en la vuelta {vueltas.length}.</strong> El intervalo mide
                                {' '}{tasaPct(ancho, 7)}, menos que la tolerancia de 0,0001 %, así que la condición
                                del <span className="inline-code">Mientras</span> ya es falsa. TIR mensual:
                                {' '}<strong>{tasaPct((bajo + alto) / 2, 4)}</strong>. La tasa pactada era {tasaPct(TIR_CASO.tasa)}.</span>
                            : <span>El ciclo sigue mientras el intervalo mida <strong>0,0001 % o más</strong>. Nadie
                                le dijo cuántas vueltas dar: eso lo decide la tolerancia.</span>}
                    </div>
                </div>
            );
        };

        /* ------------------------------------------------------------
           FLUJOGRAMAS — la flecha que sube

           Los del capítulo 4 enseñaban caminos que se separan y se vuelven a
           juntar. Estos enseñan otra cosa: una flecha que SUBE, de vuelta a una
           instrucción que ya se ejecutó. Es lo único nuevo en la simbología, y
           es todo el capítulo.

           Una sola versión por flujograma, y estrecha, en vez de las dos del
           capítulo 4. Allí la versión ancha hacía falta porque las ramas de
           una cascada salen hacia el costado. Aquí no sale nada hacia el
           costado: el retorno va por un carril a la izquierda y la salida por
           uno a la derecha, y los dos caben en 248 unidades. Con un ancho
           máximo de 340 px, la letra de 11,5 unidades sale a ~15 px en una
           columna de 319 px y a ~16 px en escritorio.

           La leyenda va en HTML y no en <text>, que no fluye y encoge con el
           viewBox (lección del capítulo 4).
        ------------------------------------------------------------ */
        const FLECHA_DEFS = (
            <defs>
                <marker id="lp-flecha5" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L7,3 z" fill="#3D008D" />
                </marker>
                <marker id="lp-flecha5-retorno" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L7,3 z" fill="#ED1E79" />
                </marker>
            </defs>
        );

        // Piezas comunes, en unidades del viewBox de 248 de ancho.
        const EJE = 124, CARRIL_IZQ = 14, CARRIL_DER = 234;
        const MONO = 'ui-monospace, monospace';
        const ESTILO_FLUJOGRAMA = { width: '100%', maxWidth: '340px', height: 'auto', margin: '0 auto', display: 'block' };
        const RETORNO = '#ED1E79';

        const fjTerminal = (y, texto, fondo) => (
            <g>
                <ellipse cx={EJE} cy={y + 19} rx="50" ry="19" fill={fondo} />
                <text x={EJE} y={y + 24} textAnchor="middle" fontSize="13" fontWeight="700" fill="#FFFFFF">{texto}</text>
            </g>
        );
        const fjEntradaSalida = (y, texto) => (
            <g>
                <polygon points={`38,${y} 224,${y} 210,${y + 38} 24,${y + 38}`} fill="#E0F2F7" stroke="#0E7490" strokeWidth="1.5" />
                <text x={EJE} y={y + 24} textAnchor="middle" fontSize="12.5" fontFamily={MONO} fill="#001A4D">{texto}</text>
            </g>
        );
        // Proceso de una o dos líneas. `delCiclo` lo pinta con borde
        // discontinuo teal: es lo que el `Para` hace por su cuenta.
        const fjProceso = (y, lineas, delCiclo) => {
            const alto = lineas.length === 1 ? 36 : 54;
            return (
                <g>
                    <rect x="24" y={y} width="200" height={alto} rx="6"
                        fill={delCiclo ? '#E0F2F7' : '#F5F0FA'} stroke={delCiclo ? '#0E7490' : '#3D008D'}
                        strokeWidth="1.5" strokeDasharray={delCiclo ? '5 3' : undefined} />
                    {lineas.map((l, i) => (
                        <text key={i} x={EJE} y={y + (lineas.length === 1 ? 23 : 22 + i * 18)} textAnchor="middle"
                            fontSize="12" fontFamily={MONO} fill="#001A4D">{l}</text>
                    ))}
                </g>
            );
        };
        const fjDecision = (y, texto, delCiclo) => (
            <g>
                <polygon points={`${EJE},${y} 216,${y + 32} ${EJE},${y + 64} 32,${y + 32}`}
                    fill={delCiclo ? '#E0F2F7' : '#F5F0FA'} stroke={delCiclo ? '#0E7490' : '#3D008D'}
                    strokeWidth="1.8" strokeDasharray={delCiclo ? '5 3' : undefined} />
                <text x={EJE} y={y + 37} textAnchor="middle" fontSize="13" fontFamily={MONO} fill="#001A4D">{texto}</text>
            </g>
        );
        const fjFlecha = (y1, y2) => (
            <line x1={EJE} y1={y1} x2={EJE} y2={y2} stroke="#3D008D" strokeWidth="1.5" markerEnd="url(#lp-flecha5)" />
        );
        const fjLinea = (x1, y1, x2, y2, color = '#3D008D') => (
            <line x1={x1} y1={y1} x2={x2} y2={y2} stroke={color} strokeWidth={color === RETORNO ? 2 : 1.5} />
        );
        // El retorno: baja un poco desde `yDesde`, va al carril izquierdo, sube
        // hasta `yHasta` y entra por la izquierda al punto de unión del eje.
        const fjRetorno = (yDesde, yHasta) => (
            <g>
                {fjLinea(EJE, yDesde, EJE, yDesde + 14, RETORNO)}
                {fjLinea(CARRIL_IZQ, yDesde + 14, EJE, yDesde + 14, RETORNO)}
                {fjLinea(CARRIL_IZQ, yDesde + 14, CARRIL_IZQ, yHasta, RETORNO)}
                <line x1={CARRIL_IZQ} y1={yHasta} x2={EJE - 5} y2={yHasta} stroke={RETORNO} strokeWidth="2" markerEnd="url(#lp-flecha5-retorno)" />
                <circle cx={EJE} cy={yHasta} r="3.5" fill="#3D008D" />
            </g>
        );
        const fjRotulo = (x, y, texto, ancla = 'start') => (
            <text x={x} y={y} textAnchor={ancla} fontSize="11.5" fontWeight="700" fill={texto === 'Sí' ? '#15803D' : '#B91C1C'}>{texto}</text>
        );

        const FlujogramaMientras = () => {
            const DESCRIPCION = 'Flujograma de un ciclo Mientras. Inicio; se leen saldo y abono; meses se inicia en 0; un rombo pregunta si saldo es mayor que 0. Por la rama Sí se ejecuta el cuerpo —saldo menos abono y meses más uno— y una flecha de retorno sube por la izquierda hasta antes del rombo, que vuelve a preguntar. Por la rama No se sale del ciclo, se escribe meses y Fin. La pregunta va antes del cuerpo: si el saldo empieza en cero, el cuerpo no se ejecuta ninguna vez.';
            const UNION = 190, ROMBO = 206, CUERPO = 290, SALIDA = 380;
            return (
                <figure className="my-6 not-prose">
                    <svg viewBox="0 0 248 516" role="img" style={ESTILO_FLUJOGRAMA} aria-label={DESCRIPCION}>
                        {FLECHA_DEFS}
                        {fjTerminal(7, 'Inicio', '#3D008D')}
                        {fjFlecha(45, 68)}
                        {fjEntradaSalida(70, 'Leer saldo, abono')}
                        {fjFlecha(108, 132)}
                        {fjProceso(134, ['meses ← 0'])}
                        {fjLinea(EJE, 170, EJE, UNION)}
                        {fjFlecha(UNION, ROMBO - 2)}
                        {fjDecision(ROMBO, 'saldo > 0')}
                        {fjFlecha(ROMBO + 64, CUERPO - 2)}
                        {fjRotulo(EJE + 8, ROMBO + 80, 'Sí')}
                        {fjProceso(CUERPO, ['saldo ← saldo - abono', 'meses ← meses + 1'])}
                        {fjRetorno(CUERPO + 54, UNION)}
                        {fjLinea(216, ROMBO + 32, CARRIL_DER, ROMBO + 32)}
                        {fjRotulo(221, ROMBO + 24, 'No')}
                        {fjLinea(CARRIL_DER, ROMBO + 32, CARRIL_DER, SALIDA)}
                        {fjLinea(CARRIL_DER, SALIDA, EJE, SALIDA)}
                        {fjFlecha(SALIDA, SALIDA + 20)}
                        {fjEntradaSalida(SALIDA + 22, 'Escribir meses')}
                        {fjFlecha(SALIDA + 60, SALIDA + 84)}
                        {fjTerminal(SALIDA + 86, 'Fin', '#001A4D')}
                    </svg>
                    <figcaption className="text-xs text-gray-500 text-center mt-2 px-2">
                        El rombo va <strong>antes</strong> del cuerpo. La flecha que sube devuelve el flujo a la
                        pregunta, y se sale por el «No». Si el saldo ya es cero al llegar, el cuerpo no se
                        ejecuta <strong>ninguna</strong> vez.
                    </figcaption>
                </figure>
            );
        };

        const FlujogramaRepita = () => {
            const DESCRIPCION = 'Flujograma de un ciclo Repita…Hasta. Inicio; se entra directamente al cuerpo, que lee monto; después un rombo pregunta si monto es mayor que 0. Por la rama No una flecha de retorno sube por la izquierda hasta antes de Leer monto, que se vuelve a ejecutar. Por la rama Sí se sale del ciclo, se escribe monto y Fin. La pregunta va después del cuerpo: el cuerpo se ejecuta al menos una vez, y se sale por el Sí, al revés que en un Mientras.';
            const UNION = 64, ROMBO = 152;
            return (
                <figure className="my-6 not-prose">
                    <svg viewBox="0 0 248 350" role="img" style={ESTILO_FLUJOGRAMA} aria-label={DESCRIPCION}>
                        {FLECHA_DEFS}
                        {fjTerminal(7, 'Inicio', '#3D008D')}
                        {fjLinea(EJE, 45, EJE, UNION)}
                        {fjFlecha(UNION, 88)}
                        <circle cx={EJE} cy={UNION} r="3.5" fill="#3D008D" />
                        {fjEntradaSalida(90, 'Leer monto')}
                        {fjFlecha(128, ROMBO - 2)}
                        {fjDecision(ROMBO, 'monto > 0')}
                        {fjLinea(32, ROMBO + 32, CARRIL_IZQ, ROMBO + 32, RETORNO)}
                        {fjRotulo(18, ROMBO + 24, 'No')}
                        {fjLinea(CARRIL_IZQ, ROMBO + 32, CARRIL_IZQ, UNION, RETORNO)}
                        <line x1={CARRIL_IZQ} y1={UNION} x2={EJE - 5} y2={UNION} stroke={RETORNO} strokeWidth="2" markerEnd="url(#lp-flecha5-retorno)" />
                        {fjFlecha(ROMBO + 64, ROMBO + 86)}
                        {fjRotulo(EJE + 8, ROMBO + 80, 'Sí')}
                        {fjEntradaSalida(ROMBO + 88, 'Escribir monto')}
                        {fjFlecha(ROMBO + 126, ROMBO + 150)}
                        {fjTerminal(ROMBO + 152, 'Fin', '#001A4D')}
                    </svg>
                    <figcaption className="text-xs text-gray-500 text-center mt-2 px-2">
                        Aquí el rombo va <strong>después</strong> del cuerpo: se lee el monto sin preguntar nada, y
                        solo entonces se decide si se vuelve a leer. Se sale por el «Sí», al revés que en
                        el <span className="inline-code">Mientras</span>: <span className="inline-code">Hasta</span> dice
                        cuándo <em>parar</em>, no cuándo <em>seguir</em>.
                    </figcaption>
                </figure>
            );
        };

        const FlujogramaPara = () => {
            const DESCRIPCION = 'Flujograma de un ciclo Para, desarmado. Inicio; se leen n y cuota; cobrado se inicia en 0. Después vienen las tres piezas que el Para hace por su cuenta, dibujadas con borde discontinuo: k se inicia en 1; un rombo pregunta si k es menor o igual que n; y, al final del cuerpo, k aumenta en 1. Por la rama Sí se ejecuta el cuerpo, cobrado más cuota, luego k más uno, y una flecha de retorno sube por la izquierda hasta antes del rombo. Por la rama No se sale, se escribe cobrado y Fin.';
            const UNION = 240, ROMBO = 256, CUERPO = 340, SALIDA = 470;
            return (
                <figure className="my-6 not-prose">
                    <svg viewBox="0 0 248 596" role="img" style={ESTILO_FLUJOGRAMA} aria-label={DESCRIPCION}>
                        {FLECHA_DEFS}
                        {fjTerminal(7, 'Inicio', '#3D008D')}
                        {fjFlecha(45, 68)}
                        {fjEntradaSalida(70, 'Leer n, cuota')}
                        {fjFlecha(108, 132)}
                        {fjProceso(134, ['cobrado ← 0'])}
                        {fjFlecha(170, 186)}
                        {fjProceso(188, ['k ← 1'], true)}
                        {fjLinea(EJE, 224, EJE, UNION)}
                        {fjFlecha(UNION, ROMBO - 2)}
                        {fjDecision(ROMBO, 'k <= n', true)}
                        {fjFlecha(ROMBO + 64, CUERPO - 2)}
                        {fjRotulo(EJE + 8, ROMBO + 80, 'Sí')}
                        {fjProceso(CUERPO, ['cobrado ← cobrado + cuota'])}
                        {fjFlecha(CUERPO + 36, CUERPO + 52)}
                        {fjProceso(CUERPO + 54, ['k ← k + 1'], true)}
                        {fjRetorno(CUERPO + 90, UNION)}
                        {fjLinea(216, ROMBO + 32, CARRIL_DER, ROMBO + 32)}
                        {fjRotulo(221, ROMBO + 24, 'No')}
                        {fjLinea(CARRIL_DER, ROMBO + 32, CARRIL_DER, SALIDA)}
                        {fjLinea(CARRIL_DER, SALIDA, EJE, SALIDA)}
                        {fjFlecha(SALIDA, SALIDA + 20)}
                        {fjEntradaSalida(SALIDA + 22, 'Escribir cobrado')}
                        {fjFlecha(SALIDA + 60, SALIDA + 84)}
                        {fjTerminal(SALIDA + 86, 'Fin', '#001A4D')}
                    </svg>
                    <figcaption className="text-xs text-gray-500 text-center mt-2 px-2">
                        Un <span className="inline-code">Para</span> es un <span className="inline-code">Mientras</span> con
                        tres piezas que usted no escribe: <strong>iniciar</strong> el contador, <strong>compararlo</strong> con
                        el tope y <strong>aumentarlo</strong> al final de cada vuelta. Son las de borde discontinuo. Cada
                        lenguaje las hace a su manera, y ahí están sus diferencias.
                    </figcaption>
                </figure>
            );
        };

        /* Dos Para, uno dentro de otro: el reporte de la cartera que traza la
           sección 5. Los dos retornos van por carriles concéntricos —el de fuera
           por x = 14, el de dentro por x = 34— y las piezas del ciclo de dentro
           se estrechan (x de 44 a 204) para dejarle sitio. Lo que el dibujo tiene
           que dejar ver es dónde queda `subtotal ← 0`: dentro del retorno de
           fuera y fuera del de dentro. Las coordenadas de abajo suponen una
           primera caja de una línea; la real tiene dos —tasa y total—, y por eso
           todo lo demás va en un grupo trasladado 17 unidades. Añadido en la
           revisión del 2026-10-20. */
        const FlujogramaAnidado = () => {

                <h3>Lo que «Para» significa en cada lenguaje</h3>
                <p>

                    pseudocódigo y en VBA, el <span className="inline-code">Para</span> inicia un contador, lo

                    a tres preguntas que conviene hacerle a cada uno: si el tope se incluye, qué pasa cuando

                        <strong>Python no incluye el tope.</strong> <span className="inline-code">range(1, n + 1)</span> da

                    </p>
                    <p>

                        {' '}<span className="inline-code">1:0</span> no es una secuencia vacía: es <span className="inline-code">c(1, 0)</span>.
                        Un crédito sin cuotas pendientes entra dos veces al ciclo de cobro, una con la cuota 1 y
                        otra con la cuota 0. La forma segura es <span className="inline-code">seq_len(n)</span>, que
                        da 1, 2, …, n, y nada si n vale 0. El plan de pagos de arriba usa <span className="inline-code">1:n</span> y

                    </p>

                        secuencia, se haya cambiado k o no; en pseudocódigo, la convención es no tocarlo.
                    </p>

                <h3>Cuando el final lo marca un dato</h3>
                <p>
                    Hasta aquí, los ciclos que recorren pagos sabían cuándo parar por algo que ellos mismos calculaban: un contador, un saldo. El cierre de recaudo de la sección 1 leía primero cuántos pagos habían llegado, y con
                    eso contaba. En una caja nadie sabe de antemano cuántos van a llegar: el cajero digita los
                    pagos a medida que los recibe y, al cerrar, digita un −1. Ese −1 no es un pago —ningún pago es
                    negativo—, sino la marca de que no hay más.
                </p>

                <CodeTabs
                    titulo="El cierre de caja, con Repita"
                    bloques={EJ_CAJA_REPITA}
                    nota="El programa lee datos, así que no hay una salida fija. Fíjese en dónde está la pregunta: al final de la vuelta, como en la validación de la sección 3." />

                <Ejercicio tipo="E2"><MCQ
                    pregunta="El cajero digita tres pagos —250 000, 400 000 y 150 000— y después el −1. ¿Qué muestra el programa al terminar?"
                    opciones={[
                        { texto: '4 pagos por 799 999', correcta: true, justificacion: 'El Repita pregunta al final de la vuelta, después de sumar y de contar. Cuando el cajero digita el −1, la vuelta ya está en marcha: el −1 se lee, se suma al total como si fuera un pago y se cuenta; solo después la condición monto = −1 da verdadero y el ciclo sale. Por eso la caja no cuadra por ningún lado: cuatro pagos para tres recibos, y un peso menos de lo que entró. Tres pagos por 800 000 es lo que el cajero espera, pero el ciclo no sabe que el −1 es el final hasta que lo pregunta, y lo pregunta tarde. Cuatro pagos por 800 000 ve que el −1 se cuenta, pero olvida que en la misma vuelta también se sumó. Y el ciclo sí termina: en la vuelta del −1, la condición se cumple. (En Python y en R, el if … break del final hace de Hasta.)' },
                        { texto: '3 pagos por 800 000', correcta: false },
                        { texto: '4 pagos por 800 000', correcta: false },
                        { texto: 'Nada: vuelve a pedir un monto, y no termina', correcta: false },
                    ]}
                /></Ejercicio>

                <p>
                    A un valor como ese −1 se le llama <Termino def="Un valor que ningún dato real puede tomar, y que se escribe después del último dato para marcar que no hay más. El ciclo lo lee, pero no lo procesa.">centinela</Termino>.
                    El <span className="inline-code">Repita</span> lo procesa porque pregunta al final, después de
                    sumar y contar. Con un centinela, la pregunta tiene que ir en medio: después de leer y antes de
                    procesar. La forma de conseguirlo sin salir a mitad del cuerpo es leer el primer dato antes del
                    ciclo y los siguientes al final del cuerpo. Se llama <Termino def="Leer el primer dato antes del ciclo y los siguientes al final del cuerpo. Así la condición se evalúa siempre entre una lectura y el proceso del dato leído.">lectura adelantada</Termino>:
                </p>

                <CodeTabs
                    titulo="El cierre de caja, con lectura adelantada"
                    bloques={EJ_CAJA_ADELANTADA}
                    nota="Con los mismos datos, escribe 3 pagos por 800 000. Y si el primer dato ya es el −1, el ciclo no da ninguna vuelta y escribe 0 pagos por 0, que es lo correcto en un día sin recaudo." />

                <p>
                    Es el <span className="inline-code">Mientras</span> con dos lecturas de la sección 3, que allí
                    perdía frente al <span className="inline-code">Repita</span> para validar un monto, y aquí es el
                    que sirve. La diferencia está en el cuerpo. En la validación,
                    el cuerpo solo leía, y lo que se hacía con el monto venía después del ciclo: la pregunta del
                    {' '}<span className="inline-code">Repita</span> quedaba justo entre leer y usar. Aquí el cuerpo
                    lee y además suma, y el <span className="inline-code">Repita</span> pregunta después de sumar.
                </p>
                <p>
                    La condición vuelve a usar <span className="inline-code">&lt;&gt;</span>, como el plan de pagos que
                    no paraba, y esta vez no hay salida que saltar: <span className="inline-code">monto</span> no se
                    acerca al −1 vuelta a vuelta, sino que en cada una recibe lo que se digita, y un −1 digitado se
                    guarda exacto. La regla
                    del capítulo 1 —nunca comparar dinero con igualdad exacta— es para cifras que salen de cuentas,
                    como el saldo del plan de pagos. Lo
                    que cambia es de quién depende la finitud: el ciclo termina cuando llega el centinela, y si
                    nadie lo digita, no termina. Por eso el centinela tiene que ser un valor que ningún dato real
                    pueda tomar. Ningún pago es negativo; en una lista de ajustes contables, donde sí los hay, un −1
                    podría ser un dato.
                </p>
