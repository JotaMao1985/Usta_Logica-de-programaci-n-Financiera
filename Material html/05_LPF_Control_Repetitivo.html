    <!-- Prism.js — resaltado de sintaxis con gramáticas oficiales.
         `Prism.manual = true` DEBE ir antes de cargar el núcleo: si no, Prism
         recorre el documento al cargar y aquí el contenido lo pinta React
         después, de modo que ese recorrido solo gasta tiempo.
         El pseudocódigo no tiene gramática oficial: se registra en LP-CORE.

         Cada componente corresponde a una clave de `GRAMATICA`, y el núcleo NO
         trae ninguno de ellos: solo markup, css, clike y javascript. Una clave
         sin su componente no da error, solo deja el bloque sin resaltar, así
         que `ensamblar.py` compara ambas listas y falla si falta alguno.

         Los cuatro lenguajes del curso son pseudocódigo, Python, R y VBA; los
         demás los usa el material de Python para APIs, que comparte esta
         librería. -->

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #F8FAFC;
            color: #1E293B;
            scroll-behavior: smooth;
        }

        code,
        pre {

        }

        .lp-gradient {

        }

        .lp-header {

        }

        .lp-card {

               el Tailwind del CDN genera tras el primer render entraba animado
               desde 0, y la tarjeta se medía más angosta de lo que es. */

        }

        .lp-card:hover {

                transform: translateY(0);
            }
        }

        button:focus-visible,
        a:focus-visible {

            outline-offset: 2px;
        }

        .inline-code {
            background: #F1F5F9;
            color: #0F172A;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;

            font-family: 'Fira Code', monospace;
        }

        .chart-h-320 {
            height: 320px;
        }

        .chart-h-360 {
            height: 360px;
        }

        .chart-h-420 {
            height: 420px;
        }

        /* `not-prose` es del plugin Typography de Tailwind, que no se carga:
           aquí solo lo respetan los títulos y las tablas, que es donde
           `.prose-lp` pisaba lo que el componente pedía (el `th` con
           `text-right` salía a la izquierda, el `h4` con `text-primary` salía
           navy; L4). Los párrafos, las listas y las negritas lo siguen
           ignorando a propósito: los componentes que declaran `not-prose`
           —`Motivacion` y `CalloutPro`, entre otros— se ajustaron con esos
           márgenes y viñetas, y quitárselos cambiaba cientos de medidas en
           los cinco capítulos, viñetas incluidas. Medido el 2026-10-27. */
        .prose-lp p {
            margin-bottom: 1rem;
            line-height: 1.75;
        }

        .prose-lp h3:not(.not-prose *) {
            color: #D81B6A;
            font-weight: 600;
            font-size: 1.2rem;
            margin: 1.8rem 0 0.6rem;
        }

        .prose-lp h4:not(.not-prose *) {
            color: #001A4D;
            font-weight: 600;
            font-size: 1.05rem;
            margin: 1.4rem 0 0.4rem;
        }

        .prose-lp ul {
            list-style: disc;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }

        .prose-lp ol {
            list-style: decimal;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }

        .prose-lp li {
            margin-bottom: 0.35rem;
            line-height: 1.65;
        }

        .prose-lp strong {
            color: #0F172A;
        }

        .prose-lp table:not(.not-prose *) {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            margin: 1rem 0;
        }

        .prose-lp th:not(.not-prose *) {
            background: #F5F0FA;
            color: #001A4D;
            text-align: left;
            padding: 0.6rem 0.8rem;
            border: 1px solid #E2E8F0;
        }

        .prose-lp td:not(.not-prose *) {

            border: 1px solid #E2E8F0;
            vertical-align: top;

        .eq-block {

            border: 1px solid rgba(61, 0, 141, 0.12);
            border-radius: 12px;
            padding: 0.6rem 1rem;
            overflow-x: auto;
        }

        .lp-range {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 999px;
            background: #EADCF8;
            outline: none;
        }

        .lp-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ED1E79;
            border: 2px solid #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .25);
            cursor: pointer;
        }

        mjx-container svg {

        /* ============================================================
           BLOQUES DE CÓDIGO — patrón tomado del material de Diseño de
           Experimentos (cap. 1, «El diseño, escrito en código»).
        ============================================================ */
        .lp-code-wrapper {
            position: relative;
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.12);
        }

        /* La pestaña activa se apoya sobre el bloque: sin esquina superior
           izquierda, para que se lea como una carpeta y no como dos cajas. */
        .lp-code-wrapper.con-pestanas {
            border-top-left-radius: 0;
        }

        .lp-code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            border-bottom: 1px solid #334155;
        }

        .lp-code-title {
            font-size: 0.72rem;
            font-weight: 600;
            color: #94A3B8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .lp-code-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #CBD5E1;
            padding: 0.35rem 0.7rem;
            border-radius: 0.375rem;
            font-size: 0.72rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .lp-code-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .lp-code-btn.copiado {
            background: rgba(34, 197, 94, 0.3);
            color: #4ADE80;
        }

        .lp-code-pre {
            background: #1E293B;
            color: #F3F4F6;
            padding: 1.5rem;
            margin: 0;
            overflow-x: auto;
            font-family: 'Fira Code', monospace;
            font-size: 0.875rem;
            line-height: 1.625;
            max-height: 30rem;
            overflow-y: auto;
            transition: max-height 0.3s ease;
        }

        /* Prism nombra sus tokens con palabras que Tailwind también usa como
           utilidades, y gana la que tenga más peso. `table` es la que muerde:
           la gramática de TOML marca `[pytest]` como `token table`, Tailwind
           le aplica `display: table` y la cabecera de sección se parte en tres
           líneas. Dentro de un bloque de código un token es siempre texto en
           línea, así que se fija aquí y la colisión deja de importar. */
        .lp-code-pre .token {
            display: inline;
        }

        .lp-code-pre.plegado {
            max-height: 9.5rem;
            overflow: hidden;
        }

        .lp-code-pre.plegado::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 3.75rem;
            background: linear-gradient(transparent, #1E293B);
            pointer-events: none;
        }

        /* Pestañas de lenguaje, en forma de carpeta. */
        .lp-tab {
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.45rem 1.1rem;
            border-radius: 0.5rem 0.5rem 0 0;
            background: #E2E8F0;
            color: #475569;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .lp-tab:hover {
            background: #CBD5E1;
            color: #0F172A;
        }

        .lp-tab.activa {
            background: linear-gradient(135deg, #3D008D 0%, #D81B6A 100%);
            color: #fff;
        }

        /* Líneas de SALIDA dentro del bloque (`//>`, `#>`, `'>`).
           Prism las tokeniza como comentario; aquí se les da color propio
           para distinguir lo que escribió el docente de lo que respondió
           la máquina. */
        .lp-salida,
        .lp-salida .token {
            color: #7DD3FC !important;
            font-style: normal !important;
        }

        .lp-salida {
            display: inline-block;
            width: 100%;
            background: rgba(125, 211, 252, 0.07);
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">

        /* === LP-CORE INICIO — no editar a mano: se genera con ensamblar.py === */
        const { useState, useEffect, useRef } = React;

        const typesetMath = (retries = 25) => {
            if (window.MathJax && window.MathJax.typesetPromise) {
                try { window.MathJax.typesetClear && window.MathJax.typesetClear(); } catch (e) { }
                window.MathJax.typesetPromise().catch(() => { });
            } else if (retries > 0) {
                setTimeout(() => typesetMath(retries - 1), 200);
            }
        };

        const useTypeset = (ref, deps) => {
            useEffect(() => {
                const t = setTimeout(() => {
                    if (ref.current && window.MathJax && window.MathJax.typesetPromise) {
                        window.MathJax.typesetPromise([ref.current]).catch(() => { });
                    }
                }, 40);
                return () => clearTimeout(t);
            }, deps);
        };

        /* ============================================================
           ICONOS SVG
        ============================================================ */
        const Icons = {
            BookOpen: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                </svg>
            ),
            Binary: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <rect x="2" y="2" width="20" height="20" rx="2" />
                    <line x1="6" y1="7" x2="10" y2="7" /><line x1="8" y1="5" x2="8" y2="9" />
                    <line x1="14" y1="7" x2="18" y2="7" />
                    <line x1="6" y1="13" x2="10" y2="13" /><line x1="6" y1="17" x2="10" y2="17" /><line x1="14" y1="17" x2="18" y2="17" />
                    <line x1="14" y1="13" x2="18" y2="13" /><line x1="16" y1="11" x2="16" y2="15" />
                </svg>
            ),
            Cpu: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <rect x="4" y="4" width="16" height="16" rx="2" />
                    <rect x="9" y="9" width="6" height="6" />
                    <path d="M9 2v2" /><path d="M15 2v2" /><path d="M9 20v2" /><path d="M15 20v2" />
                    <path d="M2 9h2" /><path d="M2 15h2" /><path d="M20 9h2" /><path d="M20 15h2" />
                </svg>
            ),
            Calculator: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <rect x="4" y="2" width="16" height="20" rx="2" />
                    <line x1="8" y1="6" x2="16" y2="6" /><line x1="8" y1="10" x2="8" y2="14" />
                    <line x1="12" y1="10" x2="12" y2="14" /><line x1="16" y1="10" x2="16" y2="14" />
                    <line x1="8" y1="18" x2="16" y2="18" />
                </svg>
            ),
            Award: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <circle cx="12" cy="8" r="7"></circle>
                    <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
                </svg>
            ),
            ChevronLeft: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            ),
            ChevronRight: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            ),
        };

        const renderIcon = (iconName, size = 20) => {
            const Icon = Icons[iconName];
            return Icon ? <Icon size={size} /> : null;
        };
        const Box = ({ type = 'info', label, children }) => {
            const styles = {
                info: { border: '#3D008D', bg: '#F5F0FA', label: '#3D008D', icon: 'fa-circle-info' },
                tip: { border: '#15803D', bg: '#F0FDF4', label: '#15803D', icon: 'fa-lightbulb' },
                warn: { border: '#B45309', bg: '#FFFBEB', label: '#B45309', icon: 'fa-triangle-exclamation' },
                danger: { border: '#B91C1C', bg: '#FEF2F2', label: '#B91C1C', icon: 'fa-circle-exclamation' },
            }[type] || { border: '#3D008D', bg: '#F5F0FA', label: '#3D008D', icon: 'fa-circle-info' };
            return (
                <div className="rounded-xl px-5 py-4 my-4 border-l-4" style={{ borderColor: styles.border, background: styles.bg }}>
                    {label && (
                        <span className="inline-flex items-center gap-2 text-[0.7rem] uppercase tracking-wider font-bold rounded mb-2 px-2 py-0.5 text-white" style={{ background: styles.label }}>
                            <i className={`fas ${styles.icon}`}></i>{label}
                        </span>
                    )}
                    <div className="text-gray-700 leading-relaxed text-[0.95rem]">{children}</div>
                </div>
            );
        };

        const CalloutPro = ({ tema = 'info', titulo, subtitulo, icon, children }) => {
            const temas = {
                info: { grad: 'linear-gradient(135deg,#3D008D 0%,#0E7490 100%)', bg: 'rgba(61,0,141,0.05)', border: 'rgba(61,0,141,0.18)', icon: 'fa-circle-info' },
                warn: { grad: 'linear-gradient(135deg,#B45309 0%,#F59E0B 100%)', bg: 'rgba(180,83,9,0.06)', border: 'rgba(180,83,9,0.22)', icon: 'fa-triangle-exclamation' },
                gold: { grad: 'linear-gradient(135deg,#ED1E79 0%,#FF2D8A 100%)', bg: 'rgba(240,165,0,0.06)', border: 'rgba(240,165,0,0.22)', icon: 'fa-coins' },
            };
            const t = temas[tema] || temas.info;
            return (
                <div className="my-6 rounded-2xl overflow-hidden shadow-md border bg-white not-prose" style={{ borderColor: t.border }}>
                    <div className="px-5 py-3 flex items-center gap-3" style={{ background: t.grad }}>
                        <span className="bg-white/20 rounded-lg flex items-center justify-center flex-shrink-0" style={{ width: 36, height: 36 }}>
                            <i className={`fas ${icon || t.icon} text-white text-lg`}></i>
                        </span>
                        <div>
                            <div className="text-white font-bold text-base leading-tight">{titulo}</div>
                            {subtitulo && <div className="text-white text-xs">{subtitulo}</div>}
                        </div>
                    </div>
                    <div className="px-5 py-4 text-[0.95rem] text-gray-700 leading-relaxed" style={{ background: t.bg }}>
                        {children}
                    </div>
                </div>
            );
        };

        const Eq = ({ children }) => (
            <div className="eq-block my-4 text-center">{children}</div>
        );

        const SectionHeader = ({ title, icon: Icon }) => (
            <div className="flex items-center gap-3 mb-5 border-b border-gray-200 pb-3">
                <div className="lp-gradient p-2.5 rounded-xl shadow-md text-white">
                    {Icon && <Icon size={24} />}
                </div>
                <h2 className="text-2xl font-bold text-gray-900">{title}</h2>
            </div>
        );

        // La flecha va DENTRO del mismo ítem que su etapa, así que nunca abre
        // una fila; y se oculta (sin dejar de ocupar su sitio, para no mover el
        // reparto) cuando la etapa siguiente cae en otra fila. Antes la flecha
        // era un ítem suelto y, al partirse la fila, quedaba sola (L6).
        const Pipeline = ({ steps }) => {
            const ref = useRef(null);
            const [corta, setCorta] = useState([]);
            useEffect(() => {
                const cont = ref.current;
                if (!cont || !window.ResizeObserver) return;
                const medir = () => {
                    const tops = [...cont.children].map(c => c.offsetTop);
                    setCorta(tops.map((t, i) => i < tops.length - 1 && tops[i + 1] !== t));
                };
                const ro = new ResizeObserver(medir);
                ro.observe(cont);
                medir();
                return () => ro.disconnect();
            }, [steps.length]);
            return (
                <div ref={ref} className="flex items-stretch flex-wrap gap-2 my-6 justify-between">

        const MCQ = ({ pregunta, opciones, multiple = false }) => {
            const [sel, setSel] = useState([]);
            const [checked, setChecked] = useState(false);

            const toggle = (i) => {
                if (checked) return;
                if (multiple) setSel(s => s.includes(i) ? s.filter(x => x !== i) : [...s, i]);
                else setSel([i]);
            };

            const correctSet = opciones.map((o, i) => o.correcta ? i : -1).filter(i => i >= 0);
            const acierto = sel.length === correctSet.length && sel.every(i => opciones[i].correcta);
            const ref = useRef(null);
            useTypeset(ref, [checked]);

            return (
                <div ref={ref} className="my-5 rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
                    <div className="flex items-start gap-2 font-semibold text-navy mb-1">

                    {multiple && <p className="text-xs text-gray-500 mb-2 ml-6">Selección múltiple</p>}
                    <div className="space-y-2 mt-3">

                            let cls = 'border-gray-200 hover:border-primary/50';
                            if (checked) {
                                if (o.correcta) cls = 'border-green-500 bg-green-50';
                                else if (isSel) cls = 'border-red-400 bg-red-50';
                                else cls = 'border-gray-200 opacity-70';
                            } else if (isSel) cls = 'border-secondary bg-amber-50';
                            return (
                                <button key={i} onClick={() => toggle(i)} disabled={checked}

                                    <span className={`flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${isSel ? 'lp-gradient text-white' : 'bg-gray-100 text-gray-600'}`}>

            const esCorrecta = (qi) => {
                const correctSet = preguntas[qi].opciones.map((o, i) => o.correcta ? i : -1).filter(i => i >= 0);

                return sel.length === correctSet.length && sel.every(i => preguntas[qi].opciones[i].correcta);
            };

            const score = preguntas.reduce((acc, _, qi) => acc + (esCorrecta(qi) ? 1 : 0), 0);
            const total = preguntas.length;
            const pct = Math.round((score / total) * 100);
            const todasResp = preguntas.every((_, qi) => (resp[qi] || []).length > 0);

            const color = pct >= 80 ? '#15803D' : pct >= 50 ? '#B45309' : '#B91C1C';

            const ref = useRef(null);

                                    if (enviado) {
                                        if (o.correcta) cls = 'border-green-500 bg-green-50';
                                        else if (sel) cls = 'border-red-400 bg-red-50';
                                        else cls = 'border-gray-200 opacity-70';
                                    } else if (sel) cls = 'border-secondary bg-amber-50';
                                    return (
                                        <button key={oi} onClick={() => toggle(qi, oi, q.multiple)} disabled={enviado}
                                            className={`w-full text-left px-3 py-2 rounded-lg border text-[0.9rem] flex items-center gap-2.5 transition-all ${cls}`}>
                                            <span className={`flex-shrink-0 w-5 h-5 rounded-full flex items-center justify-center text-[0.7rem] font-bold ${sel ? 'lp-gradient text-white' : 'bg-gray-100 text-gray-600'}`}>
                                                {String.fromCharCode(97 + oi)}
                                            </span>
                                            <span className="flex-1 text-gray-700">{o.texto}</span>
                                            {enviado && o.correcta && <i className="fas fa-check text-green-600 text-xs"></i>}
                                            {enviado && sel && !o.correcta && <i className="fas fa-xmark text-red-500 text-xs"></i>}
                                        </button>
                                    );
                                })}
                            </div>
                            {enviado && q.justificacion && (
                                <p className="text-xs text-gray-600 mt-1.5 ml-1 italic">{q.justificacion}</p>
                            )}
                        </div>

                            <i className="fas fa-flag-checkered mr-2"></i>Calificar ({Object.keys(resp).length}/{total})
                        </button>
                        : (
                            <div className="animate-fade-in">
                                <div className="flex items-center gap-4 p-4 rounded-xl" style={{ background: '#FAFAFA' }}>
                                    <div className="relative w-20 h-20 flex-shrink-0">
                                        <svg viewBox="0 0 36 36" className="w-20 h-20">
                                            <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="#eee" strokeWidth="3" />
                                            <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke={color} strokeWidth="3" strokeDasharray={`${pct}, 100`} strokeLinecap="round" />
                                        </svg>
                                        <span className="absolute inset-0 flex items-center justify-center font-extrabold text-sm" style={{ color }}>{pct}%</span>
                                    </div>
                                    <div>
                                        <div className="font-bold text-navy">Puntaje: {score} / {total}</div>
                                        <div className="text-sm" style={{ color }}>{mensaje}</div>
                                    </div>
                                </div>
                                <button onClick={() => { setEnviado(false); setResp({}); }}
                                    className="mt-3 text-sm font-bold px-4 py-1.5 rounded-full border border-primary text-primary hover:bg-primary/5">
                                    <i className="fas fa-rotate-right mr-1"></i>Reintentar

        const usePlotly = (id, dataFn, layoutFn, deps = []) => {

        // `descripcion` es lo que oye un lector de pantalla: el gráfico de Plotly

        const ChartFrame = ({ id, height = 'chart-h-360', caption, descripcion }) => (

        const Termino = ({ children, def }) => {
            const [open, setOpen] = useState(false);
            const [pos, setPos] = useState(null);
            const btnRef = useRef(null);
            const popRef = useRef(null);
            const closeTimer = useRef(null);

            const cancelClose = () => { if (closeTimer.current) { clearTimeout(closeTimer.current); closeTimer.current = null; } };
            const scheduleClose = () => { cancelClose(); closeTimer.current = setTimeout(() => setOpen(false), 150); };
            const openNow = () => { cancelClose(); setOpen(true); };
            useEffect(() => cancelClose, []);

            const place = () => {
                if (!btnRef.current) return;
                const r = btnRef.current.getBoundingClientRect();
                const margin = 12;
                const w = Math.min(300, window.innerWidth - margin * 2);
                let left = r.left;
                if (left + w > window.innerWidth - margin) left = window.innerWidth - margin - w;
                if (left < margin) left = margin;
                const abreArriba = (window.innerHeight - r.bottom) < 180;
                setPos({
                    left, width: w,
                    top: abreArriba ? null : Math.round(r.bottom + 6),
                    bottom: abreArriba ? Math.round(window.innerHeight - r.top + 6) : null,
                });
            };

            useEffect(() => {
                if (!open) { setPos(null); return; }
                place();
                const reflow = () => place();
                const onDoc = (e) => {
                    if (popRef.current && popRef.current.contains(e.target)) return;
                    if (btnRef.current && btnRef.current.contains(e.target)) return;
                    setOpen(false);
                };
                window.addEventListener('scroll', reflow, true);
                window.addEventListener('resize', reflow);
                document.addEventListener('mousedown', onDoc);
                return () => {
                    window.removeEventListener('scroll', reflow, true);
                    window.removeEventListener('resize', reflow);
                    document.removeEventListener('mousedown', onDoc);
                };
            }, [open]);

            return (
                <span className="inline-block">
                    <button ref={btnRef} type="button" onClick={openNow} onMouseEnter={openNow} onMouseLeave={scheduleClose}
                        className="text-primary font-semibold cursor-help bg-primary/5 hover:bg-primary/10 rounded px-1 transition-colors"
                        style={{ borderBottom: '1px dotted #3D008D' }} title="Ver definición rápida">
                        {children}<i className="fas fa-circle-info text-[0.6em] align-super ml-0.5 text-secondary"></i>
                    </button>
                    {open && pos && ReactDOM.createPortal(
                        <span ref={popRef} role="tooltip"
                            onMouseEnter={cancelClose} onMouseLeave={scheduleClose}
                            className="block rounded-lg bg-white shadow-2xl border border-primary/30 p-3 text-[0.8rem] font-normal text-gray-700 leading-snug animate-fade-in text-left"
                            style={{ position: 'fixed', left: pos.left, top: pos.top == null ? 'auto' : pos.top, bottom: pos.bottom == null ? 'auto' : pos.bottom, width: pos.width, zIndex: 200 }}>
                            <span className="block font-bold text-primary mb-1 text-[0.72rem] uppercase tracking-wide">{children}</span>
                            {def}
                        </span>,
                        document.body
                    )}
                </span>
            );
        };
        /* ============================================================

        /* ============================================================
           RESALTADO DE SINTAXIS — Prism.js 1.29
           Prism trae gramáticas oficiales de R, Python y VBA (`visual-basic`,
           con alias `vba`). El pseudocódigo del curso no existe fuera de aquí,
           así que su gramática se registra abajo.

           Toda clave de `GRAMATICA` necesita su componente cargado en el
           `<head>`: el core de Prism solo trae markup, css, clike y javascript.
           Si falta, `resaltar` cae a `escaparHtml` y el bloque sale en gris sin

           al ensamblar y no en el aula.
        ============================================================ */
        // Sin cdnjs (sin red, o bloqueado), `window.Prism` es solo el `{ manual: true }`
        // del `<head>`, sin gramáticas: el código sale sin color y el capítulo carga igual.
        const hayPrism = !!(window.Prism && Prism.languages);
        if (hayPrism && !Prism.languages.pseudo) {
            Prism.languages.pseudo = {
                // `comment` va primero: si no, el operador `/` se comería el `//`.
                'comment': { pattern: /\/\/.*/, greedy: true },
                'string': { pattern: /"(?:[^"\\\n]|\\.)*"/, greedy: true },
                'keyword': /\b(?:FinSi|FinMientras|FinPara|FinSegun|FinFuncion|FinProcedimiento|FinRepita|Inicio|Fin|Si|Entonces|SinoSi|Sino|Segun|Caso|DeOtroModo|Mientras|Hacer|Para|Repita|Hasta|Con|Paso|Leer|Escribir|Funcion|Procedimiento|Retornar|Llamar|Salir)\b/,
                'builtin': /\b(?:Entero|Real|Cadena|Caracter|Logico|Arreglo|Matriz|Constante|Verdadero|Falso)\b/,
                'function': /\b(?:Y|O|NO|MOD|DIV|abs|raiz|redondear|potencia|longitud)\b/,
                'number': /\b\d+(?:\.\d+)?\b/,
                'operator': /<-|←|>=|<=|<>|[+\-*\/=<>]/,
                'punctuation': /[(),;\[\]]/,
            };
        }

        /* En una sola línea a propósito: partirla dejaría un `};` con ocho
           espacios de sangría, que es el patrón con el que `ensamblar.py` y
           `migrar.py` delimitan los componentes. `docker` y `dockerfile` son
           las dos claves que registra `prism-docker`; se aceptan ambas. */
        const GRAMATICA = { pseudo: 'pseudo', python: 'python', r: 'r', vba: 'visual-basic', shell: 'bash', docker: 'docker', dockerfile: 'docker', yaml: 'yaml', sql: 'sql', toml: 'toml', json: 'json', text: null };

        /* Prefijo de SALIDA por lenguaje: el marcador de comentario del propio
           lenguaje más `>`. Así la salida sigue siendo un comentario válido y
           el bloque copiado se puede ejecutar tal cual. */
        const PREFIJO_SALIDA = { pseudo: '//>', python: '#>', r: '#>', vba: "'>" };

        const escaparHtml = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        /* Marca las líneas de salida sobre el HTML YA resaltado. Prism las
           tokeniza como comentario, y un comentario nunca cruza el salto de
           línea, así que cada línea queda autocontenida y se puede envolver. */
        const marcarSalida = (html, lang) => {
            const pref = PREFIJO_SALIDA[lang];
            if (!pref) return html;
            return html.split('\n').map(linea => {
                const plano = linea.replace(/<[^>]*>/g, '').trimStart();
                return plano.startsWith(pref) ? `<span class="lp-salida">${linea}</span>` : linea;
            }).join('\n');
        };

        const resaltar = (codigo, lang) => {
            const nombre = GRAMATICA[lang];
            const gram = (nombre && hayPrism) ? Prism.languages[nombre] : null;
            const html = gram ? Prism.highlight(codigo, gram, nombre) : escaparHtml(codigo);
            return marcarSalida(html, lang);
        };

        /* ============================================================
           METADATOS DE LENGUAJE — orden fijo del curso
           Pseudocódigo (normativo) → Python → R → VBA (industria)
        ============================================================ */
        const LANG_ORDEN = ['pseudo', 'python', 'r', 'vba'];
        const LANG_META = {
            pseudo: { label: 'Pseudocódigo', corto: 'Pseudo', icon: 'fas fa-project-diagram', color: 'text-blue-300' },
            python: { label: 'Python', corto: 'Python', icon: 'fab fa-python', color: 'text-yellow-400' },
            r: { label: 'R', corto: 'R', icon: 'fas fa-chart-line', color: 'text-cyan-300' },
            vba: { label: 'VBA (Excel)', corto: 'VBA', icon: 'fas fa-file-excel', color: 'text-green-400' },
            shell: { label: 'Terminal', corto: 'Shell', icon: 'fas fa-terminal', color: 'text-green-400' },
            docker: { label: 'Dockerfile', corto: 'Docker', icon: 'fab fa-docker', color: 'text-blue-400' },
            dockerfile: { label: 'Dockerfile', corto: 'Docker', icon: 'fab fa-docker', color: 'text-blue-400' },
            yaml: { label: 'YAML', corto: 'YAML', icon: 'fas fa-file-code', color: 'text-purple-300' },
            sql: { label: 'SQL', corto: 'SQL', icon: 'fas fa-database', color: 'text-orange-300' },
            toml: { label: 'TOML', corto: 'TOML', icon: 'fas fa-gears', color: 'text-gray-300' },
            json: { label: 'JSON', corto: 'JSON', icon: 'fas fa-code', color: 'text-amber-300' },
            text: { label: 'Salida', corto: 'Salida', icon: 'fas fa-file-alt', color: 'text-gray-300' },
        };

        /* ============================================================
           BLOQUE DE CÓDIGO (un solo lenguaje)
           La salida NO va en un panel aparte: se escribe dentro del código
           con el prefijo del lenguaje, pegada a la instrucción que la produce.
        ============================================================ */
        const CodeBlock = ({ title, code, lang = 'pseudo', plegable, conPestanas = false }) => {
            const [copiado, setCopiado] = useState(false);
            const meta = LANG_META[lang] || LANG_META.text;

            // Se pliegan los bloques largos de exposición. Dentro de un
            // ejercicio nunca (`plegable={false}`): una traza que hay que
            // desplegar antes de poder trazarla estorba.
            const admitePliegue = plegable === undefined ? code.split('\n').length > 12 : plegable;
            const [plegado, setPlegado] = useState(admitePliegue);

            const copiar = () => {
                // Se copia `code`, la cadena original. El DOM lleva el marcado
                // de Prism y pegar eso daría un archivo que no corre.
                navigator.clipboard.writeText(code).then(() => {
                    setCopiado(true);
                    setTimeout(() => setCopiado(false), 2000);
                }).catch(() => { });
            };

            return (
                <div className={`lp-code-wrapper my-4 ${conPestanas ? 'con-pestanas' : ''}`}>
                    <div className="lp-code-header">
                        <span className="lp-code-title">
                            <i className={`${meta.icon} mr-2`}></i>{title || meta.label}
                        </span>
                        <span className="flex items-center gap-2">
                            <button className={`lp-code-btn ${copiado ? 'copiado' : ''}`} onClick={copiar}
                                title="Copiar código" aria-label="Copiar código">
                                <i className={`fas ${copiado ? 'fa-check' : 'fa-copy'}`}></i>
                                <span>{copiado ? 'Copiado' : 'Copiar'}</span>
                            </button>
                            {admitePliegue && (
                                <button className="lp-code-btn" onClick={() => setPlegado(p => !p)}
                                    aria-expanded={!plegado} title={plegado ? 'Mostrar todo el código' : 'Plegar el código'}>
                                    <span>{plegado ? 'Mostrar' : 'Ocultar'}</span>
                                    <i className={`fas fa-chevron-down transition-transform duration-200 ${plegado ? '' : 'rotate-180'}`}></i>
                                </button>
                            )}
                        </span>
                    </div>
                    <pre className={`lp-code-pre ${plegado ? 'plegado' : ''}`}>
                        <code dangerouslySetInnerHTML={{ __html: resaltar(code, lang) }} />
                    </pre>
                </div>
            );
        };

        /* ============================================================
           LÍNEA DE TIEMPO
        ============================================================ */
        const Timeline = ({ eventos }) => (
            <div className="relative border-l-2 border-primary/30 ml-3 my-6 space-y-5">
                {eventos.map((e, i) => (
                    <div key={i} className="ml-6 relative">
                        <span className="absolute left-[-1.95rem] top-1 w-4 h-4 rounded-full lp-gradient border-2 border-white shadow"></span>
                        <span className="text-sm font-extrabold text-secondary">{e.year}</span>
                        <p className="text-sm text-gray-700 mt-0.5">{e.text}</p>
                    </div>
                ))}
            </div>
        );

        /* ============================================================
           CODETABS — el mismo algoritmo en 4 lenguajes
           Cada bloque es INDEPENDIENTE: cambiar su pestaña no mueve
           ninguna otra, de modo que se pueden tener dos lenguajes en
           pantalla a la vez para compararlos.
           La última elección se guarda en localStorage y es la que
           muestran, al montarse, los bloques que el estudiante aún no ha
           tocado —en esta visita y en las siguientes—. Sin esa memoria,
           quien lea en VBA tendría que elegirlo en cada uno de los hasta
           15 bloques de un capítulo.
        ============================================================ */
        const CODETABS_KEY = 'lpf_lenguaje_preferido';

        /* `localStorage` puede no estar: en una ventana privada, con el
           almacenamiento bloqueado por política o en una URL `data:`, leerlo
           lanza un `SecurityError`. Sin `try`, esa excepción dentro de un
           inicializador de `useState` desmonta el árbol y el capítulo queda en
           blanco (H16 del capítulo 5). Sin almacenamiento todo funciona igual:
           solo se olvidan la lección y el lenguaje al cerrar la pestaña. */
        const leerGuardado = (clave) => {
            try { return window.localStorage.getItem(clave); } catch (e) { return null; }
        };
        const guardar = (clave, valor) => {
            try { window.localStorage.setItem(clave, valor); } catch (e) { /* sin almacenamiento */ }
        };

        const CodeTabs = ({ bloques, titulo, defecto = 'pseudo', nota, plegable }) => {
            const disponibles = LANG_ORDEN.filter(l => bloques && bloques[l]);
            const elegirInicial = () => {
                const guardado = leerGuardado(CODETABS_KEY);
                if (guardado && bloques[guardado]) return guardado;
                if (bloques[defecto]) return defecto;
                return disponibles[0];
            };
            const [lang, setLang] = useState(elegirInicial);
            const ref = useRef(null);

            // Solo el estado propio. Escribir la preferencia NO avisa a las
            // demás instancias: son independientes a propósito.
            const cambiar = (l) => {
                setLang(l);
                guardar(CODETABS_KEY, l);
            };

            if (!disponibles.length) return null;
            const activo = bloques[lang] ? lang : disponibles[0];

            return (
                <div ref={ref} className="my-5">
                    {titulo && (
                        <div className="text-sm font-semibold text-navy mb-2 flex items-center gap-2">
                            <i className="fas fa-code text-secondary"></i>{titulo}
                        </div>
                    )}
                    <div className="flex flex-wrap gap-1 items-end" role="tablist" aria-label="Lenguaje del ejemplo">
                        {disponibles.map(l => {
                            const m = LANG_META[l];
                            const esActivo = activo === l;
                            return (
                                <button key={l} role="tab" aria-selected={esActivo} onClick={() => cambiar(l)}
                                    className={`lp-tab ${esActivo ? 'activa' : ''}`}>
                                    <i className={m.icon}></i>
                                    <span className="hidden sm:inline">{m.label}</span>
                                    <span className="sm:hidden">{m.corto}</span>
                                </button>
                            );
                        })}
                        <span className="ml-auto text-[0.65rem] text-gray-500 pr-2 pb-1.5 hidden md:block">
                            <i className="fas fa-bookmark mr-1"></i>solo este bloque · se recuerda su preferencia
                        </span>
                    </div>
                    <div key={activo} className="animate-fade-in">
                        <CodeBlock code={bloques[activo]} lang={activo} conPestanas plegable={plegable} />
                    </div>
                    {nota && <p className="text-xs text-gray-500 italic -mt-2 mb-4 px-1">{nota}</p>}
                </div>
            );
        };

        /* ============================================================
           LENGUAJE ACTIVO EN LOS EJERCICIOS
           Misma regla que `CodeTabs`: cada ejercicio es independiente, y al
           montarse arranca en la última preferencia guardada. Así, quien lee
           la exposición en VBA encuentra el ejercicio en VBA sin tener que
           volver a elegirlo, pero puede cambiarlo sin arrastrar consigo el
           resto del capítulo.

           `porLenguaje` acepta indistintamente un valor único (igual para
           todos los lenguajes) o un objeto {pseudo, python, r, vba}. Si falta
           el lenguaje activo, cae a pseudocódigo.
        ============================================================ */
        const esMapaDeLenguajes = (v) =>
            v && typeof v === 'object' && !Array.isArray(v) && !React.isValidElement(v)
            && LANG_ORDEN.some(l => l in v);

        const porLenguaje = (v, lang) =>
            esMapaDeLenguajes(v) ? (v[lang] !== undefined ? v[lang] : (v.pseudo !== undefined ? v.pseudo : Object.values(v)[0])) : v;

        const lenguajesDe = (v) => esMapaDeLenguajes(v) ? LANG_ORDEN.filter(l => l in v) : [];

        const useLenguajeActivo = (disponibles, defecto = 'pseudo') => {
            const clave = disponibles.join('|');
            const elegir = () => {
                const g = leerGuardado(CODETABS_KEY);
                if (g && disponibles.includes(g)) return g;
                if (disponibles.includes(defecto)) return defecto;
                return disponibles[0];
            };
            const [lang, setLang] = useState(elegir);
            useEffect(() => { setLang(elegir()); }, [clave]);
            // Devuelve un par, no un valor: el componente necesita el
            // cambiador para pasárselo a su <SelectorLenguaje>.
            const cambiar = (l) => {
                setLang(l);
                guardar(CODETABS_KEY, l);
            };
            return [lang, cambiar];
        };

        const SelectorLenguaje = ({ disponibles, activo, onCambiar }) => {
            if (!disponibles || disponibles.length < 2) return null;
            const cambiar = (l) => onCambiar && onCambiar(l);
            return (
                <div className="flex flex-wrap gap-1 mb-2" role="tablist" aria-label="Lenguaje del ejercicio">
                    {disponibles.map(l => {
                        const m = LANG_META[l], act = activo === l;
                        return (
                            <button key={l} role="tab" aria-selected={act} onClick={() => cambiar(l)}
                                className={`px-2.5 py-1 text-[0.72rem] font-semibold rounded-full transition-colors flex items-center gap-1.5 border ${act ? 'text-white lp-gradient border-transparent shadow-sm' : 'text-gray-500 border-gray-200 hover:text-primary hover:border-primary/40'}`}>
                                <i className={`${m.icon} text-[0.7rem]`}></i>{m.corto}
                            </button>
                        );
                    })}
                </div>
            );
        };

        /* ============================================================
           MOTIVACIÓN DE APERTURA
           Obligatoria al comienzo de CADA sección. No resume lo que viene:
           da una razón para seguir leyendo.

           Receta (máx. ~80 palabras):
             1. una escena concreta del sector financiero;
             2. la tensión o el costo que esa escena revela;
             3. `gancho`: la pregunta que la sección viene a responder.
        ============================================================ */
        const Motivacion = ({ gancho, icon = 'fa-compass', etiqueta = 'Antes de empezar', children }) => {
            const ref = useRef(null);
            useTypeset(ref, []);
            return (
                <div ref={ref} className="my-5 rounded-2xl overflow-hidden border not-prose"
                    style={{ borderColor: 'rgba(61,0,141,0.15)' }}>
                    <div className="px-5 py-4"
                        style={{ background: 'linear-gradient(135deg, rgba(61,0,141,0.055) 0%, rgba(14,116,144,0.05) 45%, rgba(237,30,121,0.10) 100%)' }}>
                        <div className="flex gap-3.5">
                            <span className="flex-shrink-0 w-9 h-9 rounded-full lp-gradient text-white flex items-center justify-center shadow-sm">
                                <i className={`fas ${icon} text-sm`}></i>
                            </span>
                            <div className="flex-1 min-w-0">
                                <div className="text-[0.65rem] uppercase tracking-widest font-bold mb-1.5" style={{ color: '#3D008D' }}>
                                    {etiqueta}
                                </div>
                                <div className="text-[0.96rem] text-gray-700 leading-relaxed">{children}</div>
                                {gancho && (
                                    <p className="mt-3 text-primary font-semibold text-[1.02rem] leading-snug pl-3"
                                        style={{ margin: '0.75rem 0 0', borderLeft: '3px solid #ED1E79' }}>
                                        {gancho}
                                    </p>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        /* ============================================================
           TAXONOMÍA DE EJERCICIOS DEL CURSO
           E1, E3, E4, E5 y E6 tienen componente propio y ya se
           autoetiquetan. E2, E7 y E8 se construyen con MCQ o Reto, así
           que se envuelven en <Ejercicio tipo="E7"> para que el tipo sea
           visible al estudiante y contable por verificar.py.
        ============================================================ */
        const TIPOS_EJERCICIO = {
            E1: { etiqueta: 'E1 · Traza', color: '#3D008D' },
            E2: { etiqueta: 'E2 · Predice', color: '#0E7490' },
            E3: { etiqueta: 'E3 · Diagnóstico', color: '#B91C1C' },
            E4: { etiqueta: 'E4 · Equivalencia', color: '#0E7490' },
            E5: { etiqueta: 'E5 · Secuencia', color: '#3D008D' },
            E6: { etiqueta: 'E6 · Emparejar', color: '#3D008D' },
            E7: { etiqueta: 'E7 · Interpretación', color: '#15803D' },
            E8: { etiqueta: 'E8 · Criterio', color: '#B45309' },
        };

        // Los componentes que se autoetiquetan (E1, E3, E4, E5, E6) se anotan en
        // `AUTOETIQUETADOS` al final de esta librería. Envueltos en un
        // <Ejercicio>, la etiqueta salía dos veces —la del envoltorio y la
        // suya—; ahora el envoltorio no pinta la suya y le pasa su tipo por
        // contexto, y el componente lo muestra en su sitio de siempre. Manda el
        // tipo del envoltorio, que es el que cuenta `verificar.py`.
        const TipoDeEjercicio = React.createContext(null);
        const AUTOETIQUETADOS = new Set();

        const EtiquetaTipo = ({ texto, className, style }) => {
            const externo = React.useContext(TipoDeEjercicio);
            return externo
                ? <span className="ml-auto text-[0.65rem] uppercase tracking-wider font-bold text-white rounded px-2 py-0.5" style={{ background: externo.color }}>{externo.etiqueta}</span>
                : <span className={className} style={style}>{texto}</span>;
        };

        const Ejercicio = ({ tipo, children }) => {
            const t = TIPOS_EJERCICIO[tipo];
            if (!t) return children;
            const hijos = React.Children.toArray(children);
            if (hijos.length === 1 && AUTOETIQUETADOS.has(hijos[0].type)) {
                return <TipoDeEjercicio.Provider value={t}>{children}</TipoDeEjercicio.Provider>;
            }
            // La etiqueta se ancla SOBRE el borde superior de la tarjeta, no
            // dentro: si se superpone al contenido, un enunciado de dos líneas
            // le pasa por debajo y queda ilegible.
            return (
                <div className="relative">
                    <span className="absolute z-10 text-[0.65rem] uppercase tracking-wider font-bold text-white rounded px-2 py-0.5 shadow-sm"
                        style={{ background: t.color, top: '0.55rem', right: '1rem' }}>
                        {t.etiqueta}
                    </span>
                    {children}
                </div>
            );
        };

        /* ============================================================
           E1 · TABLA DE TRAZA (prueba de escritorio)
           El estudiante completa el estado de las variables paso a paso.
           Comparación tolerante: espacios, mayúsculas, coma/punto decimal
           y marcas de "sin valor" (—, -, vacío) se normalizan.
        ============================================================ */
        // Sin tildes, sin espacios, sin `$` ni `COP`. Las tildes se van porque
        // «sí» y «si» son la misma respuesta: sin plegarlas, quien escribía la
        // forma correcta en español veía su celda marcada mal (P2 del
        // capítulo 4). La ñ se queda: solo se quitan el agudo, el grave y la
        // diéresis.
        const limpiarCelda = (v) => {
            let s = String(v === null || v === undefined ? '' : v).trim().toLowerCase();
            s = s.normalize('NFD').replace(/[\u0300\u0301\u0308]/g, '').normalize('NFC');
            s = s.replace(/\s+/g, '');
            if (s === '' || s === '-' || s === '—' || s === '–' || s === 'vacio' || s === 'nada' || s === 'null') return '∅';
            return s.replace(/\$/g, '').replace(/\bcop\b/g, '');
        };

        const normalizarCelda = (v) => {
            let s = limpiarCelda(v);
            if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
            else s = s.replace(',', '.');
            return s;
        };

        // Lo que el estudiante pudo querer decir con un número. La lectura de
        // siempre va primero; se añaden dos que la ambigüedad del separador
        // impedía: «30,000» y «1,350,000», que es como imprime Python con
        // `f"{x:,}"` y se leían como 30 y 1,35 (L3), y «1.250» como uno coma
        // veinticinco. Solo se aplican a la respuesta, nunca a la clave: la
        // clave tiene una sola lectura, y así ninguna respuesta mala pasa por
        // ambigua.
        const lecturasNumericas = (v) => {
            const s = limpiarCelda(v);
            const out = [parseFloat(normalizarCelda(v))];
            if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) out.push(parseFloat(s.replace(/,/g, '')));
            if (/^-?\d{1,3}\.\d{3}$/.test(s)) out.push(parseFloat(s));
            return out.filter(Number.isFinite);
        };

        // `a` es la respuesta y `b` la clave.
        const celdasIguales = (a, b) => {
            const na = normalizarCelda(a), nb = normalizarCelda(b);
            if (na === nb) return true;
            const fb = parseFloat(nb);
            if (!Number.isFinite(fb)) return false;
            const tol = Math.max(1e-6, Math.abs(fb) * 1e-6);
            return lecturasNumericas(a).some(fa => Math.abs(fa - fb) <= tol);
        };

        const TablaTraza = ({ titulo = 'Prueba de escritorio', enunciado, codigo, lang = 'pseudo', columnas, filas, ocultas = [], pista, exigeRespuesta = false }) => {
            // `codigo` y la columna `instruccion` de cada fila admiten un objeto
            // {pseudo, python, r, vba}. Los VALORES de las variables no: son los
            // mismos en los cuatro lenguajes, que es justamente lo que el
            // ejercicio debe hacerle ver al estudiante.
            const idiomas = lenguajesDe(codigo);
            const disponibles = idiomas.length ? idiomas : [lang];
            const [langActivo, cambiarLang] = useLenguajeActivo(disponibles, lang);

            const editables = [];
            filas.forEach((f, i) => columnas.forEach(c => { if (ocultas.includes(c.clave)) editables.push(`${i}|${c.clave}`); }));

            const [valores, setValores] = useState({});
            const [comprobado, setComprobado] = useState(false);
            const [revelado, setRevelado] = useState(false);
            const ref = useRef(null);
            useTypeset(ref, [comprobado, revelado]);

            const escribir = (k, v) => { if (!comprobado) setValores(p => ({ ...p, [k]: v })); };
            // `normalizarCelda` manda '' y '—' al mismo token, así que una celda sin
            // tocar acierta sola siempre que la respuesta correcta sea «—». En una
            // traza donde la mayoría de las celdas ocultas valen «—» —que es lo
            // normal: las variables nacen sin valor— la tabla enviada en blanco
            // aprueba. Con `exigeRespuesta` hay que escribir la raya para que cuente.
            // Es opcional porque solo vale en los capítulos cuyo enunciado la pide.
            const enBlanco = (k) => valores[k] === undefined || String(valores[k]).trim() === '';
            const esCorrecta = (i, clave) => {
                const k = `${i}|${clave}`;
                if (exigeRespuesta && enBlanco(k)) return false;
                return celdasIguales(valores[k], filas[i][clave]);
            };
            const sinResponder = editables.filter(enBlanco).length;
            const aciertos = editables.filter(k => { const [i, c] = k.split('|'); return esCorrecta(Number(i), c); }).length;
            const total = editables.length;
            const pct = total ? Math.round((aciertos / total) * 100) : 0;
            const color = pct >= 80 ? '#15803D' : pct >= 50 ? '#B45309' : '#B91C1C';

            return (
                <div ref={ref} className="my-6 rounded-2xl border-2 border-primary/20 bg-white p-5 shadow-sm">
                    <div className="flex items-center gap-2 mb-2">
                        <span className="lp-gradient text-white p-2 rounded-lg"><i className="fas fa-table-list"></i></span>
                        <h4 className="text-base font-bold text-primary" style={{ margin: 0 }}>{titulo}</h4>
                        <EtiquetaTipo texto="E1 · Traza" className="ml-auto text-[0.65rem] uppercase tracking-wider font-bold text-white bg-primary/80 rounded px-2 py-0.5" />
                    </div>
                    {enunciado && <div className="text-[0.95rem] text-gray-700 mb-3">{enunciado}</div>}
                    <SelectorLenguaje disponibles={disponibles} activo={langActivo} onCambiar={cambiarLang} />
                    {codigo && <CodeBlock code={porLenguaje(codigo, langActivo)} lang={langActivo} title="Algoritmo a trazar" plegable={false} />}

                    <p className="text-xs text-gray-500 mb-2">
                        <i className="fas fa-keyboard mr-1"></i>
                        Complete las celdas resaltadas. Use <span className="inline-code">—</span> si la variable aún no tiene valor.
                    </p>

                    <div className="overflow-x-auto">
                        <table className="w-full text-sm border-collapse">
                            <thead>
                                <tr>
                                    {columnas.map(c => (
                                        <th key={c.clave} className="bg-primary/10 text-primary text-left px-3 py-2 border border-gray-200 font-semibold whitespace-nowrap">
                                            {c.titulo}
                                        </th>
                                    ))}
                                </tr>
                            </thead>
                            <tbody>
                                {filas.map((f, i) => (
                                    <tr key={i} className={i % 2 ? 'bg-gray-50/60' : ''}>
                                        {columnas.map(c => {
                                            const editable = ocultas.includes(c.clave);
                                            if (!editable) {
                                                return <td key={c.clave} className="px-3 py-1.5 border border-gray-200 text-gray-700 align-top">
                                                    {c.clave === 'instruccion'
                                                        ? <span className="font-mono text-[0.82rem]">{porLenguaje(f[c.clave], langActivo)}</span>
                                                        : f[c.clave]}
                                                </td>;
                                            }
                                            const k = `${i}|${c.clave}`;
                                            const ok = esCorrecta(i, c.clave);
                                            let cls = 'border-gray-300 bg-amber-50/60';
                                            if (comprobado) cls = ok ? 'border-green-500 bg-green-50' : 'border-red-400 bg-red-50';
                                            return (
                                                <td key={c.clave} className="px-1.5 py-1 border border-gray-200">
                                                    <div className="flex items-center gap-1">
                                                        <input type="text" value={valores[k] || ''} onChange={e => escribir(k, e.target.value)}
                                                            disabled={comprobado} aria-label={`${c.titulo}, paso ${i + 1}`}
                                                            className={`w-full min-w-[70px] px-2 py-1 rounded border text-[0.82rem] font-mono outline-none focus:border-secondary ${cls}`} />
                                                        {comprobado && <i className={`fas ${ok ? 'fa-check text-green-600' : 'fa-xmark text-red-500'} text-xs`}></i>}
                                                    </div>
                                                    {comprobado && !ok && (
                                                        <div className="text-[0.7rem] text-green-700 font-mono mt-0.5 pl-1">→ {f[c.clave]}</div>
                                                    )}
                                                </td>
                                            );
                                        })}
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    <div className="mt-3 flex items-center gap-3 flex-wrap">
                        {!comprobado
                            ? <button onClick={() => setComprobado(true)}
                                className="text-sm font-bold px-4 py-1.5 rounded-full text-white lp-gradient hover:opacity-90">
                                <i className="fas fa-check-double mr-1"></i>Comprobar traza
                            </button>
                            : <>
                                <button onClick={() => { setComprobado(false); setValores({}); setRevelado(false); }}
                                    className="text-sm font-bold px-4 py-1.5 rounded-full border border-primary text-primary hover:bg-primary/5">
                                    <i className="fas fa-rotate-right mr-1"></i>Reintentar
                                </button>
                                <span className="text-sm font-bold" style={{ color }}>
                                    {aciertos} / {total} celdas correctas ({pct} %)
                                </span>
                                {exigeRespuesta && sinResponder > 0 && (
                                    <span className="text-xs font-semibold text-[#B45309]">
                                        {sinResponder} sin responder — una celda en blanco no cuenta
                                    </span>
                                )}
                            </>}
                        {pista && !revelado && (
                            <button onClick={() => setRevelado(true)} className="text-xs font-semibold text-gray-500 hover:text-primary underline">
                                <i className="fas fa-lightbulb mr-1"></i>Ver pista
                            </button>
                        )}
                    </div>
                    {revelado && pista && (
                        <div className="mt-3 animate-fade-in"><Box type="tip" label="Pista">{pista}</Box></div>
                    )}
                </div>
            );
        };

        /* ============================================================
           E3 · DETECTA Y DIAGNOSTICA EL ERROR
           Tres respuestas obligatorias: UBICAR la línea, CLASIFICAR el
           tipo de error y ANTICIPAR su consecuencia, que es lo que la
           taxonomía E3 pide y lo que el `impacto` solo mostraba. La
           retroalimentación nombra los pasos que fallan: «ubicó bien
           pero clasificó mal» es el caso más informativo.
        ============================================================ */
        const DetectaError = ({ titulo = 'Detecte y diagnostique el error', enunciado, lineas, lang = 'pseudo', lineaCorrecta, tipos, tipoCorrecto, consecuencias, consecuenciaCorrecta, explicacion, impacto }) => {
            // OJO: `lineaCorrecta` también admite {pseudo, python, r, vba}. El
            // mismo fallo NO está en la misma línea en los cuatro lenguajes
            // (VBA añade Sub/Dim, Python no lleva declaraciones...). Darlo por
            // constante haría que el ejercicio calificara mal al cambiar de
            // pestaña, y en silencio.
            //
            // Y con la clave va el TEXTO: `enunciado` y `explicacion` admiten
            // el mismo objeto. Un enunciado que dice «el comentario de la
            // línea 4» es cierto en pseudocódigo y falso en Python, donde esa
            // línea es justamente la respuesta. Lo mejor es redactarlos sin
            // citar ningún número; cuando haga falta citarlo, va por lenguaje.
            // La comprobación 8 de verificar.py vigila las dos propiedades.
            const idiomas = lenguajesDe(lineas);
            const disponibles = idiomas.length ? idiomas : [lang];
            const [langActivo, cambiarLang] = useLenguajeActivo(disponibles, lang);
            const lineasAct = porLenguaje(lineas, langActivo);
            const correctaAct = porLenguaje(lineaCorrecta, langActivo);
            const enunciadoAct = porLenguaje(enunciado, langActivo);
            const explicacionAct = porLenguaje(explicacion, langActivo);

            const [linea, setLinea] = useState(null);
            const [tipo, setTipo] = useState(null);
            const [consecuencia, setConsecuencia] = useState(null);
            const [comprobado, setComprobado] = useState(false);
            const ref = useRef(null);
            useTypeset(ref, [comprobado]);

            // Al cambiar de lenguaje la selección de la línea deja de tener
            // sentido; el tipo y la consecuencia son los mismos en los cuatro.
            useEffect(() => { setLinea(null); setComprobado(false); }, [langActivo]);

            // Sin `consecuencias` el ejercicio se queda en dos pasos en vez de
            // romperse: un `.map` sobre `undefined` dejaría el capítulo en
            // blanco. Que todo E3 las traiga lo exige la regla 24 de verificar.py.
            const conConsecuencia = Array.isArray(consecuencias) && consecuencias.length > 0;
            const pasos = conConsecuencia ? 3 : 2;
            const lineaOk = linea === correctaAct;
            const tipoOk = tipo === tipoCorrecto;
            const consecuenciaOk = !conConsecuencia || consecuencia === consecuenciaCorrecta;
            // El botón exige TODAS las respuestas. Un botón deshabilitado que no
            // dice por qué se lee como roto: quien completó el Paso 1 pulsa y
            // no pasa nada. Se rotula el progreso —igual que `Emparejamiento`,
            // que muestra «Comprobar (2/4)»— y se nombran los pasos que faltan.
            const pendientes = [
                linea === null && 'señale la línea (Paso 1)',
                tipo === null && 'clasifique el error (Paso 2)',
                conConsecuencia && consecuencia === null && 'anticipe la consecuencia (Paso 3)',
            ].filter(Boolean);
            const hechos = pasos - pendientes.length;
            const listo = pendientes.length === 0;
            const unir = (partes) => partes.length < 2 ? partes.join('')
                : `${partes.slice(0, -1).join(', ')} y ${partes[partes.length - 1]}`;
            const queFalta = listo ? null
                : pendientes.length === 1 ? `Falta un paso: ${pendientes[0]}.`
                    : `Para poder comprobar: ${unir(pendientes)}.`;
            const fallados = [
                !lineaOk && 'la línea',
                !tipoOk && 'el tipo de error',
                !consecuenciaOk && 'la consecuencia',
            ].filter(Boolean);
            const veredicto = fallados.length === 0 ? '¡Diagnóstico correcto!'
                : fallados.length === pasos ? `No acertó ningún paso: revise ${unir(fallados)}.`
                    : `Revise ${unir(fallados)}: lo demás está bien.`;
            const reintentar = () => { setComprobado(false); setLinea(null); setTipo(null); setConsecuencia(null); };

            // Los pasos 2 y 3 son la misma pieza: opciones con letra que se
            // colorean al comprobar.
            const opcionesDe = (lista, elegida, elegir, correcta) => (
                <div className="space-y-1.5 mb-3">
                    {lista.map((t, i) => {
                        const sel = elegida === i;
                        let cls = 'border-gray-200 bg-white hover:border-primary/40';
                        if (comprobado) {
                            if (i === correcta) cls = 'border-green-500 bg-green-50';
                            else if (sel) cls = 'border-red-400 bg-red-50';
                            else cls = 'border-gray-200 bg-white opacity-70';
                        } else if (sel) cls = 'border-secondary bg-amber-50';
                        return (
                            <button key={i} onClick={() => !comprobado && elegir(i)} disabled={comprobado} aria-pressed={sel}
                                className={`w-full text-left px-3 py-2 rounded-lg border text-[0.9rem] flex items-center gap-2.5 transition-all ${cls}`}>
                                <span className={`flex-shrink-0 w-5 h-5 rounded-full flex items-center justify-center text-[0.7rem] font-bold ${sel ? 'lp-gradient text-white' : 'bg-gray-100 text-gray-600'}`}>
                                    {String.fromCharCode(97 + i)}
                                </span>
                                <span className="flex-1 text-gray-700">{t}</span>
                                {comprobado && i === correcta && <i className="fas fa-check text-green-600 text-xs"></i>}
                            </button>
                        );
                    })}
                </div>
            );

            return (
                <div ref={ref} className="my-6 rounded-2xl border-2 p-5 shadow-sm" style={{ borderColor: '#FCA5A5', background: '#FFFBFB' }}>
                    <div className="flex items-center gap-2 mb-2">
                        <span className="text-white p-2 rounded-lg" style={{ background: 'linear-gradient(135deg,#B91C1C 0%,#F59E0B 100%)' }}><i className="fas fa-bug"></i></span>
                        <h4 className="text-base font-bold text-navy" style={{ margin: 0 }}>{titulo}</h4>
                        <EtiquetaTipo texto="E3 · Diagnóstico" className="ml-auto text-[0.65rem] uppercase tracking-wider font-bold text-white bg-red-700/80 rounded px-2 py-0.5" />
                    </div>
                    {enunciadoAct && <div className="text-[0.95rem] text-gray-700 mb-3">{enunciadoAct}</div>}

                    <p className="text-xs font-semibold text-gray-600 mb-1"><span className="text-red-700">Paso 1.</span> Señale la línea que contiene el error:</p>
                    <SelectorLenguaje disponibles={disponibles} activo={langActivo} onCambiar={cambiarLang} />
                    <div className="rounded-xl overflow-hidden border border-gray-700 bg-gray-900 mb-4">
                        {lineasAct.map((l, i) => {
                            const n = i + 1;
                            const sel = linea === n;
                            let cls = 'hover:bg-white/5';
                            if (comprobado) {
                                if (n === correctaAct) cls = 'bg-green-900/50 ring-1 ring-green-500';
                                else if (sel) cls = 'bg-red-900/50 ring-1 ring-red-500';
                            } else if (sel) cls = 'bg-amber-500/20 ring-1 ring-amber-400';
                            return (
                                <button key={i} onClick={() => !comprobado && setLinea(n)} disabled={comprobado}
                                    aria-label={`Línea ${n}`} aria-pressed={sel}
                                    className={`w-full text-left flex items-start gap-3 px-3 py-1 font-mono text-[0.82rem] transition-colors ${cls}`}>
                                    <span className="text-gray-400 select-none w-6 text-right flex-shrink-0">{n}</span>
                                    <span className="text-gray-100 whitespace-pre overflow-x-auto"
                                        dangerouslySetInnerHTML={{ __html: resaltar(l, langActivo) }} />
                                    {comprobado && n === correctaAct && <i className="fas fa-arrow-left text-green-400 ml-auto flex-shrink-0 mt-0.5"></i>}
                                </button>
                            );
                        })}
                    </div>

                    <p className="text-xs font-semibold text-gray-600 mb-1"><span className="text-red-700">Paso 2.</span> Clasifique el tipo de error:</p>
                    {opcionesDe(tipos, tipo, setTipo, tipoCorrecto)}

                    {conConsecuencia && <>
                        <p className="text-xs font-semibold text-gray-600 mb-1"><span className="text-red-700">Paso 3.</span> Anticipe la consecuencia:</p>
                        {opcionesDe(consecuencias, consecuencia, setConsecuencia, consecuenciaCorrecta)}
                    </>}

                    <div className="flex items-center gap-3 flex-wrap">
                        {!comprobado
                            ? <button onClick={() => listo && setComprobado(true)} disabled={!listo}
                                className="text-sm font-bold px-4 py-1.5 rounded-full text-white lp-gradient disabled:opacity-40">
                                <i className="fas fa-magnifying-glass mr-1"></i>Comprobar diagnóstico ({hechos}/{pasos})
                            </button>
                            : <button onClick={reintentar}
                                className="text-sm font-bold px-4 py-1.5 rounded-full border border-primary text-primary hover:bg-primary/5">
                                <i className="fas fa-rotate-right mr-1"></i>Reintentar
                            </button>}
                        {!comprobado && queFalta && (
                            <span className="text-xs text-gray-600" role="status">
                                <i className="fas fa-circle-info mr-1"></i>{queFalta}
                            </span>
                        )}
                        {comprobado && (
                            <span className={`text-sm font-bold ${fallados.length === 0 ? 'text-green-600' : 'text-red-500'}`}>
                                <i className={`fas ${fallados.length === 0 ? 'fa-circle-check' : 'fa-circle-xmark'} mr-1`}></i>
                                {veredicto}
                            </span>
                        )}
                    </div>

                    {comprobado && (
                        <div className="mt-4 space-y-3 animate-fade-in">
                            <Box type="info" label="Explicación">{explicacionAct}</Box>
                            {impacto && <Box type="danger" label="Consecuencia financiera">{impacto}</Box>}
                        </div>
                    )}
                </div>
            );
        };

        /* ============================================================
           E4 · COMPARADOR — dos versiones lado a lado + veredicto
        ============================================================ */
        const Comparador = ({ titulo = 'Compare las dos versiones', enunciado, a, b, lang = 'pseudo', pregunta, opciones, multiple = false }) => {
            const idiomas = lenguajesDe(a.codigo);
            const disponibles = idiomas.length ? idiomas : [lang];
            const [langActivo, cambiarLang] = useLenguajeActivo(disponibles, lang);

            const panel = (v, acento) => (
                <div className="flex-1 min-w-[260px]">
                    <div className="text-xs font-bold uppercase tracking-wider mb-1 px-1" style={{ color: acento }}>
                        <i className="fas fa-code-branch mr-1"></i>{v.etiqueta}
                    </div>
                    <CodeBlock code={porLenguaje(v.codigo, langActivo)} lang={v.lang || langActivo} title={v.etiqueta} plegable={false} />
                    {v.nota && <p className="text-xs text-gray-500 italic -mt-2 px-1">{v.nota}</p>}
                </div>
            );
            return (
                <div className="my-6 rounded-2xl border-2 border-teal/30 bg-white p-5 shadow-sm" style={{ borderColor: 'rgba(14,116,144,0.3)' }}>
                    <div className="flex items-center gap-2 mb-2">
                        <span className="text-white p-2 rounded-lg" style={{ background: 'linear-gradient(135deg,#0E7490,#3D008D)' }}><i className="fas fa-code-compare"></i></span>
                        <h4 className="text-base font-bold text-primary" style={{ margin: 0 }}>{titulo}</h4>
                        <EtiquetaTipo texto="E4 · Equivalencia" className="ml-auto text-[0.65rem] uppercase tracking-wider font-bold text-white rounded px-2 py-0.5" style={{ background: '#0E7490' }} />
                    </div>
                    {enunciado && <div className="text-[0.95rem] text-gray-700 mb-3">{enunciado}</div>}
                    <SelectorLenguaje disponibles={disponibles} activo={langActivo} onCambiar={cambiarLang} />
                    <div className="flex flex-wrap gap-4">
                        {panel(a, '#3D008D')}
                        {panel(b, '#D81B6A')}
                    </div>
                    {pregunta && <MCQ pregunta={pregunta} opciones={opciones} multiple={multiple} />}
                </div>
            );
        };

        /* ============================================================
           E5 · ORDENA LOS PASOS
           Interacción por clic (no arrastrar): accesible por teclado y
           funcional en pantallas táctiles.
           El desorden es DETERMINISTA: no puede recalcularse en cada
           render ni cambiar entre visitas.
        ============================================================ */
        // Una permutación pseudoaleatoria sembrada con el texto de los pasos:
        // cada ejercicio, y cada lenguaje, tiene la suya, y no cambia entre
        // visitas. La anterior era `[n−1, 0, n−2, 1, …]` en todos, y quien notaba
        // el patrón resolvía los ocho del curso sin leer el código (L1). De 200
        // candidatas se queda con la primera que no deja ningún paso en su sitio,
        // ni dos seguidos en orden, ni tres a saltos iguales (como 1, 3, 5, que
        // es otro patrón); con tres pasos no existe, y se queda con la que menos
        // tiene.
        const mezclaPorDefecto = (pasos) => {
            const n = pasos.length;
            let h = 2166136261;                        // FNV-1a del texto
            for (const c of pasos.join('\n')) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); }
            let t = h >>> 0;
            const azar = () => {                       // mulberry32
                t = (t + 0x6D2B79F5) | 0;
                let r = Math.imul(t ^ (t >>> 15), 1 | t);
                r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
                return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
            };
            let mejor = [...Array(n).keys()], defectos = Infinity;
            for (let intento = 0; intento < 200 && defectos > 0; intento++) {
                const q = [...Array(n).keys()];
                for (let i = n - 1; i > 0; i--) { const j = Math.floor(azar() * (i + 1)); [q[i], q[j]] = [q[j], q[i]]; }
                const d = q.filter((v, k) => v === k || (k > 0 && v === q[k - 1] + 1)
                    || (k > 1 && v - q[k - 1] === q[k - 1] - q[k - 2])).length;
                if (d < defectos) { mejor = q; defectos = d; }
            }
            return mejor;
        };

        const OrdenaPasos = ({ titulo = 'Ordene los pasos del algoritmo', enunciado, pasos, lang = 'pseudo', mezcla, pista }) => {
            const idiomas = lenguajesDe(pasos);
