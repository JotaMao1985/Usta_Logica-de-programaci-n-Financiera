        /* ------------------------------------------------------------
           SimuladorVBE — el paso a paso del editor de VBA, sin Excel.

           Reproduce lo que se ve al ejecutar un procedimiento con «Paso a
           paso por instrucciones»: la línea resaltada es la que está POR
           ejecutarse, no la que se acaba de ejecutar, y la ventana Locales
           muestra las variables con el valor que tienen en ese momento.
           Es la diferencia con el `Trazador` de LP-CORE, que resalta lo ya
           hecho: aquí manda lo que hace el editor.

           Los `pasos` no se escriben a mano: se copian de recorrer la
           rutina en Excel. Cada uno dice en qué línea se detuvo el editor
           (`linea`, contada desde 1 sobre `codigo`), qué mostraba Locales
           (`locales`) y, si ya había salida, qué había en Inmediato
           (`inmediato`, que se hereda del paso anterior si no se da).
        ------------------------------------------------------------ */
        const SimuladorVBE = ({ titulo = 'Paso a paso en el editor', enunciado, modulo = 'Módulo1', codigo, variables, pasos, nota }) => {
            const total = pasos.length;
            // 0: sin empezar · 1..total: detenido antes de pasos[i-1] · total+1: terminó
            const [i, setI] = useState(0);
            const lineas = codigo.split('\n');
            const enCurso = i >= 1 && i <= total;
            const paso = enCurso ? pasos[i - 1] : null;
            const previo = i >= 2 && i <= total ? pasos[i - 2] : null;

            let inmediato = [];
            for (let k = 0; k < Math.min(i, total); k++) if (pasos[k].inmediato) inmediato = pasos[k].inmediato;

            const ir = (n) => setI(Math.max(0, Math.min(total + 1, n)));
            const teclado = (e) => {
                if (e.key === 'F8' || e.key === 'ArrowRight') { e.preventDefault(); ir(i + 1); }
                else if (e.key === 'ArrowLeft') { e.preventDefault(); ir(i - 1); }
                else if (e.key === 'Home') { e.preventDefault(); ir(0); }
            };

            const estado = i === 0 ? 'Sin ejecutar. El primer paso entra al procedimiento.'
                : i > total ? 'El procedimiento terminó: ya no hay línea resaltada.'
                    : `Detenido en la línea ${paso.linea}, que todavía no se ha ejecutado: ${lineas[paso.linea - 1].trim()}`;

            return (
                <div className="my-6 rounded-2xl border-2 border-primary/20 bg-white p-4 sm:p-5 shadow-sm not-prose">
                    <div className="flex flex-wrap items-center gap-2 mb-2">
                        <span className="lp-gradient text-white p-2 rounded-lg"><i className="fas fa-bug"></i></span>
                        <h4 className="text-base font-bold text-primary" style={{ margin: 0 }}>{titulo}</h4>
                        <span className="ml-auto text-[0.65rem] uppercase tracking-wider font-bold text-white bg-teal rounded px-2 py-0.5">Simulador</span>
                    </div>
                    {enunciado && <div className="text-[0.95rem] text-gray-700 mb-3">{enunciado}</div>}

                    <div tabIndex={0} onKeyDown={teclado} role="group"
                        aria-label={`${titulo}. Con F8 o la flecha derecha se avanza un paso; con la flecha izquierda se retrocede.`}
                        className="rounded-xl outline-none focus:ring-2 focus:ring-secondary/60">
                        <div className="grid grid-cols-1 lg:grid-cols-5 gap-3">
                            <div className="lg:col-span-3 rounded-lg border border-gray-300 overflow-hidden">
                                <div className="bg-gray-200 text-gray-700 text-xs font-semibold px-3 py-1.5">{modulo} (Código)</div>
                                <div className="overflow-x-auto bg-white">
                                    <div className="min-w-max py-1" style={{ fontFamily: "'Fira Code', monospace", fontSize: '0.8rem', lineHeight: 1.6 }}>
                                        {lineas.map((l, k) => {
                                            const activa = enCurso && paso.linea === k + 1;
                                            return (
                                                <div key={k} className="flex" style={activa ? { background: '#FFFF00' } : undefined}
                                                    {...(activa ? { 'aria-current': 'step' } : {})}>
                                                    <span className="shrink-0 text-center select-none" style={{ width: '1.5rem', color: '#B45309' }} aria-hidden="true">{activa ? '➔' : ''}</span>
                                                    <span className="whitespace-pre pr-4" style={{ color: '#0F172A' }}>{l || ' '}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>

                            <div className="lg:col-span-2 rounded-lg border border-gray-300 overflow-hidden">
                                <div className="bg-gray-200 text-gray-700 text-xs font-semibold px-3 py-1.5">Locales</div>
                                <div className="overflow-x-auto">
                                    {/* fuente-ok: la ventana Locales del simulador; su <Fuente> llega en `nota`, debajo del componente */}
                                    <table className="w-full text-sm" style={{ margin: 0 }}>
                                        <thead>
                                            <tr className="text-left text-xs text-gray-600 bg-gray-50">
                                                <th className="px-3 py-1.5 font-semibold">Expresión</th>
                                                <th className="px-3 py-1.5 font-semibold">Valor</th>
                                                <th className="px-3 py-1.5 font-semibold">Tipo</th>
                                            </tr>
                                        </thead>
                                        <tbody style={{ fontFamily: "'Fira Code', monospace", fontSize: '0.8rem' }}>
                                            {enCurso ? variables.map(v => {
                                                const valor = paso.locales[v.nombre];
                                                const cambio = previo && previo.locales[v.nombre] !== valor;
                                                return (
                                                    <tr key={v.nombre} className="border-t border-gray-100" style={cambio ? { background: '#CCFBF1' } : undefined}>
                                                        <td className="px-3 py-1.5">{v.nombre}</td>
                                                        <td className="px-3 py-1.5 whitespace-nowrap">{valor}{cambio && <span className="sr-only"> (cambió en este paso)</span>}</td>
                                                        <td className="px-3 py-1.5 text-gray-600">{v.tipo}</td>
                                                    </tr>
                                                );
                                            }) : (
                                                <tr className="border-t border-gray-100">
                                                    <td colSpan={3} className="px-3 py-3 text-gray-500" style={{ fontFamily: 'Inter, system-ui, sans-serif' }}>
                                                        {i === 0 ? 'Nada que mostrar: el procedimiento no ha empezado.' : 'Nada que mostrar: el procedimiento terminó.'}
                                                    </td>
                                                </tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <div className="mt-3 rounded-lg border border-gray-300 overflow-hidden">
                            <div className="bg-gray-200 text-gray-700 text-xs font-semibold px-3 py-1.5">Inmediato</div>
                            <div className="overflow-x-auto bg-white">
                                <pre className="px-3 py-2 min-w-max" style={{ margin: 0, minHeight: '2.4rem', background: 'transparent', color: '#0F172A', fontFamily: "'Fira Code', monospace", fontSize: '0.8rem' }}>{inmediato.join('\n')}</pre>
                            </div>
                        </div>
                    </div>

                    <p className="text-sm text-gray-700 mt-3 mb-2" role="status" aria-live="polite">
                        <strong>Paso {Math.min(i, total)} de {total}.</strong> {estado}
                    </p>

                    <div className="flex flex-wrap gap-2">
                        <button type="button" onClick={() => ir(i + 1)} disabled={i > total}
                            className="px-4 py-2 rounded-lg bg-primary text-white text-sm font-semibold disabled:opacity-40">
                            <i className="fas fa-shoe-prints mr-2" aria-hidden="true"></i>Paso a paso
                        </button>
                        <button type="button" onClick={() => ir(i - 1)} disabled={i === 0}
                            className="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 text-sm font-semibold disabled:opacity-40">
                            Paso anterior
                        </button>
                        <button type="button" onClick={() => ir(0)} disabled={i === 0}
                            className="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 text-sm font-semibold disabled:opacity-40">
                            Restablecer
                        </button>
                    </div>
                    <p className="text-xs text-gray-500 mt-2">
                        «Paso anterior» es una ayuda de este simulador: el editor de VBA no retrocede.
                    </p>
                    {nota && <div className="text-sm text-gray-700 mt-3">{nota}</div>}
                </div>
            );
        };

        /* ------------------------------------------------------------
           MapaObjetosExcel — de la aplicación a la celda.

           Cuatro cajas, una dentro de otra. Al elegir una se ve cómo se

                            className="w-full text-left rounded-lg px-2 py-1.5 outline-none focus:ring-2 focus:ring-secondary/60">

                        <span className="lp-gradient text-white p-2 rounded-lg"><i className="fas fa-sitemap"></i></span>
                        <h4 className="text-base font-bold text-primary" style={{ margin: 0 }}>{titulo}</h4>
                        <span className="ml-auto text-[0.65rem] uppercase tracking-wider font-bold text-white bg-teal rounded px-2 py-0.5">Interactivo</span>
                    </div>
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">

        /* ------------------------------------------------------------
           RendimientoHoja — celda por celda frente a en bloque.

           `filas` son tiempos medidos en Excel, en segundos: la mediana de
           las repeticiones de cada tamaño. La columna «veces» se deriva
           aquí, a la vista. Por debajo de la resolución del reloj de VBA
           (`resolucion`) el tiempo no se dibuja como cero: se dice.
        ------------------------------------------------------------ */
        const RendimientoHoja = ({ id = 'chart-rendimiento-hoja', filas, resolucion, medicion }) => {
            const [modo, setModo] = useState('leer');
            const claves = modo === 'leer' ? ['leerCelda', 'leerBloque'] : ['escribirCelda', 'escribirBloque'];
            const verbo = modo === 'leer' ? 'Leer' : 'Escribir';
            const piso = (x) => Math.max(x, resolucion);
            usePlotly(id, () => [
                { x: filas.map(f => f.n), y: filas.map(f => piso(f[claves[0]])), name: 'celda por celda', mode: 'lines+markers', line: { color: '#B45309', width: 2.5 }, marker: { size: 8 } },
                { x: filas.map(f => f.n), y: filas.map(f => piso(f[claves[1]])), name: 'en bloque', mode: 'lines+markers', line: { color: '#0E7490', width: 2.5 }, marker: { size: 8, symbol: 'square' } },
            ], () => ({
                margin: { l: 56, r: 12, t: 12, b: 44 },
                legend: { orientation: 'h', y: 1.12, x: 0 },
                xaxis: { title: { text: 'celdas', font: { size: 12 } }, tickvals: filas.map(f => f.n), tickformat: ',.0f', automargin: true },
                yaxis: { title: { text: 'segundos', font: { size: 12 }, standoff: 8 }, type: 'log', automargin: true },
                separators: ', ',
                font: { family: 'Inter, system-ui, sans-serif', size: 11 },
            }), [modo]);
            const celda = (x) => x < resolucion ? `menos de ${segundosCO(resolucion)}` : segundosCO(x);
            return (
                <div className="my-6 rounded-2xl border-2 border-primary/20 bg-white p-4 sm:p-5 shadow-sm not-prose">
                    <div className="flex flex-wrap items-center gap-2 mb-3">
                        <span className="lp-gradient text-white p-2 rounded-lg"><i className="fas fa-stopwatch"></i></span>
                        <h4 className="text-base font-bold text-primary" style={{ margin: 0 }}>Celda por celda o en bloque</h4>
                        <span className="ml-auto text-[0.65rem] uppercase tracking-wider font-bold text-white bg-teal rounded px-2 py-0.5">Interactivo</span>
                    </div>
                    <div className="flex flex-wrap gap-2 mb-2" role="group" aria-label="Qué operación se mide">
                        {[['leer', 'Leer de la hoja'], ['escribir', 'Escribir en la hoja']].map(([m, e]) => (
                            <button key={m} type="button" onClick={() => setModo(m)} aria-pressed={modo === m}
                                className={`px-3 py-1.5 rounded-lg text-sm font-semibold border ${modo === m ? 'bg-primary text-white border-primary' : 'bg-white text-gray-700 border-gray-300'}`}>{e}</button>
                        ))}
                    </div>
                    <ChartFrame id={id} height="chart-h-320"
                        caption={`${verbo} n celdas de una columna, de una en una y de una sola vez. El eje vertical es logarítmico: cada marca vale diez veces la anterior.`}
                        fuente={{ propia: true, children: `con los tiempos medidos ${medicion}` }} />
                    <div className="overflow-x-auto rounded-lg border border-gray-200 mt-3">
                        <table className="w-full text-sm" style={{ margin: 0 }}>
                            <thead>
                                <tr className="text-left text-xs text-gray-600 bg-gray-50">
                                    <th className="px-3 py-1.5 font-semibold">Celdas</th>
                                    <th className="px-3 py-1.5 font-semibold">Celda por celda (s)</th>
                                    <th className="px-3 py-1.5 font-semibold">En bloque (s)</th>
                                    <th className="px-3 py-1.5 font-semibold">Veces</th>
                                </tr>
                            </thead>
                            <tbody>
                                {filas.map(f => {
                                    const a = f[claves[0]], b = f[claves[1]];
                                    return (
                                        <tr key={f.n} className="border-t border-gray-100">
                                            <td className="px-3 py-1.5 whitespace-nowrap">{f.n.toLocaleString('es-CO').replace(/\./g, ' ')}</td>
                                            <td className="px-3 py-1.5 whitespace-nowrap">{celda(a)}</td>
                                            <td className="px-3 py-1.5 whitespace-nowrap">{celda(b)}</td>
                                            <td className="px-3 py-1.5 whitespace-nowrap">{b < resolucion ? `más de ${Math.floor(a / resolucion).toLocaleString('es-CO').replace(/\./g, ' ')}` : Math.round(a / b).toLocaleString('es-CO').replace(/\./g, ' ')}</td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                    <Fuente propia>{`con los mismos tiempos de la gráfica; «veces» es el primero dividido entre el segundo`}</Fuente>
                </div>
            );
        };

        /* ============================================================
           DATOS EJECUTADOS — fase 2 del plan de la Tarea 16

           Todo lo que sigue salió de Excel 16.115 para Mac el 2026-11-23,
           con el módulo `fase2.bas` (guardado en el vault, en la ficha del
           capítulo). Nada se calculó a mano: si cambia la rutina, se vuelve
           a recorrer y se copian otra vez.
        ============================================================ */

        // La rutina que el capítulo 5 dejó para recorrer aquí, copiada tal cual.
        const F8_CODIGO = `Sub OtroAcuerdo()
    Dim saldo As Currency, abono As Currency, meses As Integer
    saldo = 1850000
    abono = 500000
    meses = 0
    Do While saldo > 0
        saldo = saldo - abono
        meses = meses + 1
    Loop
    Debug.Print meses, saldo
End Sub`;

        const F8_VARIABLES = [
            { nombre: 'saldo', tipo: 'Currency' },
            { nombre: 'abono', tipo: 'Currency' },
            { nombre: 'meses', tipo: 'Integer' },
        ];

        // Las 23 paradas del editor: [línea de F8_CODIGO, saldo, abono, meses],
        // con los valores escritos como los mostró la ventana Locales. El
        // editor no se detuvo nunca en la línea 2, la del Dim.
        const F8_PARADAS = [
            [1, '0', '0', '0'],
            [3, '0', '0', '0'],
            [4, '1850000', '0', '0'],
            [5, '1850000', '500000', '0'],
            [6, '1850000', '500000', '0'],
            [7, '1850000', '500000', '0'],
            [8, '1350000', '500000', '0'],
            [9, '1350000', '500000', '1'],
            [6, '1350000', '500000', '1'],
            [7, '1350000', '500000', '1'],
            [8, '850000', '500000', '1'],
            [9, '850000', '500000', '2'],
            [6, '850000', '500000', '2'],
            [7, '850000', '500000', '2'],
            [8, '350000', '500000', '2'],
            [9, '350000', '500000', '3'],
            [6, '350000', '500000', '3'],
            [7, '350000', '500000', '3'],
            [8, '-150000', '500000', '3'],
            [9, '-150000', '500000', '4'],
            [6, '-150000', '500000', '4'],
            [10, '-150000', '500000', '4'],
            [11, '-150000', '500000', '4'],
        ];
        // Lo que quedó en Inmediato al ejecutarse la línea 10: se ve desde la
        // parada 23. El 4 lleva un espacio delante y el saldo empieza en la
        // columna 15, la segunda zona de impresión.
        const F8_INMEDIATO = [' 4            -150000 '];
        const F8_PASOS = F8_PARADAS.map(([linea, saldo, abono, meses], k) => ({
            linea, locales: { saldo, abono, meses },
            ...(k === F8_PARADAS.length - 1 ? { inmediato: F8_INMEDIATO } : {}),
        }));

        // Lo que respondió Excel a cada pregunta, con un libro nuevo sin guardar.
        const OBJETOS_NIVELES = [
            { rotulo: 'La aplicación', nombre: 'Application', camino: 'Application',
              resultado: [['Application.Name', 'Microsoft Excel'], ['Application.Version', '16.115'], ['TypeName(Application)', 'Application']] },
            { rotulo: 'El libro', nombre: 'Workbook', camino: 'ActiveWorkbook',
              resultado: [['TypeName(ActiveWorkbook)', 'Workbook'], ['ActiveWorkbook.Name', 'Book1'], ['TypeName(ActiveWorkbook.Parent)', 'Application'], ['Worksheets.Count', '1']] },
            { rotulo: 'La hoja', nombre: 'Worksheet', camino: 'ActiveSheet',

                    Seguridad <Cita k="microsoft2025macrosmac" loc="Habilitar o deshabilitar macros en Microsoft 365 para Mac" />.
                    Por ahora basta una regla: una macro es un programa, y no se habilita la de un archivo
                    cuyo origen no se conoce. La sección 7 vuelve sobre esto con calma.
                </p>

                <h3>Abrir el editor</h3>
                <p>
                    El código de un libro no se escribe en la hoja sino en una ventana aparte, el
                    {' '}<strong>editor de Visual Basic</strong>. En el Excel para Mac con que se preparó este
                    capítulo se abre desde la barra de menús de Excel:
                    {' '}<span className="inline-code">Tools › Macro › Visual Basic Editor</span>. En ese mismo
                    submenú están <span className="inline-code">Macros...</span> y
                    {' '}<span className="inline-code">Record New Macro...</span>.
                </p>
                <p>
                    También hay un atajo de teclado. En Excel para Mac, Opción+F11 abre Visual
                    Basic <Cita k="microsoft2026atajos" loc="pestaña macOS, Usar métodos abreviados de tecla de función" />;
                    en Excel para Windows es Alt+F11 <Cita k="microsoft2026atajos" loc="pestaña Windows, Métodos abreviados de teclado para trabajar con datos, funciones y la barra de fórmulas" />.
                    Si en un Mac una tecla de función no hace lo esperado, hay que pulsar también la tecla
                    Fn <Cita k="microsoft2026atajos" loc="pestaña macOS, Usar métodos abreviados de tecla de función" />.
                    Por eso este capítulo da cada paso por el menú, que no depende del teclado.
                </p>

                <h3>Las ventanas del editor</h3>
                <p>
                    El editor es una ventana con su propia barra de menús y varias zonas. El esquema
                    muestra las cinco que usa este capítulo, con la rutina <span className="inline-code">OtroAcuerdo</span> ya
                    escrita:
                </p>

                <MapaEditor />

                <p>
                    <strong>1 · El explorador de proyectos.</strong> Muestra una lista jerárquica de los
                    proyectos y de todos los elementos que los componen <Cita k="microsoft2018proyectos" loc="párrafo inicial" />.
                    El libro <span className="inline-code">Book1</span> aparecía ahí como el proyecto
                    {' '}<span className="inline-code">VBAProject (Book1)</span>, con dos carpetas:
                    {' '}<span className="inline-code">Microsoft Excel Objects</span>, con la hoja
                    {' '}<span className="inline-code">Sheet1</span> y un elemento llamado
                    {' '}<span className="inline-code">ThisWorkbook</span>, y <span className="inline-code">Modules</span>,
                    donde quedó el módulo insertado. Ahí es donde la analista del caso tendría que buscar
                    su macro: dentro del libro, pero en un módulo y no en una hoja.
                </p>
                <p>
                    <strong>2 · Las propiedades.</strong> Con un módulo seleccionado solo mostraba una:
                    su nombre, <span className="inline-code">(Name)</span>.
                </p>
                <p>
                    <strong>3 · La ventana de código.</strong> Sirve para escribir, mostrar y editar el
                    código, y se puede abrir una por cada módulo <Cita k="microsoft2018codigo" loc="párrafo inicial" />.
                    Arriba tiene dos listas, el cuadro Objeto y el cuadro Procedimiento. En un módulo, el
                    cuadro Procedimiento enumera sus procedimientos, y al
                    elegir uno el cursor pasa a la primera línea de código de ese
                    procedimiento <Cita k="microsoft2018codigo" loc="Elementos de la ventana" />. En el
                    Excel de este capítulo es la lista de la derecha, la que en el esquema dice
                    {' '}<span className="inline-code">OtroAcuerdo</span>.
                </p>
                <p>
                    <strong>4 · La ventana Inmediato</strong> y <strong>5 · la ventana Locales.</strong> La
                    primera es donde escribe <span className="inline-code">Debug.Print</span>; tiene su apartado
                    más abajo. La segunda muestra las variables mientras la rutina corre, y es de la
                    sección 6. Si alguna no está a la vista, se abre desde el menú
                    {' '}<span className="inline-code">View</span> del editor:
                    {' '}<span className="inline-code">Immediate Window</span>,
                    {' '}<span className="inline-code">Locals Window</span>,
                    {' '}<span className="inline-code">Project Explorer</span> y
                    {' '}<span className="inline-code">Properties Window</span>.
                </p>
                <p>
                    En ese mismo menú está <span className="inline-code">Object Browser</span>, el examinador
                    de objetos. Muestra las clases, propiedades, métodos, eventos y constantes de las
                    bibliotecas de objetos, y los procedimientos del proyecto <Cita k="microsoft2018examinador" loc="introducción, segundo párrafo" />.
                    Es un catálogo de consulta; la sección 5 usa una parte muy pequeña de lo que muestra.
                </p>

                <h3>Escribir y ejecutar una rutina</h3>
                <p>
                    Con el editor abierto, <span className="inline-code">Insert › Module</span> crea un módulo
                    vacío, <span className="inline-code">Module1</span>, y abre su ventana de código. Ahí se
                    escribe la rutina. Para ejecutarla se pone el cursor en cualquier línea entre
                    {' '}<span className="inline-code">Sub</span> y <span className="inline-code">End Sub</span> y se
                    elige <span className="inline-code">Run › Run Sub/UserForm</span>; el menú muestra F5 al lado
                    de esa orden. Lo que se ejecuta es el procedimiento donde está el cursor, no el módulo
                    entero.
                </p>

                <Box type="warn" label="Si las órdenes salen en gris">
                    Las órdenes de ejecutar actúan sobre la ventana de código. Al preparar este capítulo,
                    con el cursor en la ventana Inmediato, <span className="inline-code">Debug › Step Into</span> aparecía
                    deshabilitada; volvió a estar disponible al abrir el módulo con doble clic en el

                </Box>

                <Ejercicio tipo="E2"><MCQ
                    pregunta={<>La ventana Inmediato está vacía. Con el cursor dentro de <span className="inline-code">OtroAcuerdo</span>, se elige <span className="inline-code">Run › Run Sub/UserForm</span> dos veces seguidas. ¿Qué queda en la ventana Inmediato?</>}
                    opciones={[
                        { texto: 'Una línea, con 4 y -150000: la segunda ejecución reemplaza lo que escribió la primera.', correcta: false },
                        { texto: 'Dos líneas iguales, con 4 y -150000: cada ejecución empieza de nuevo y añade su línea.', correcta: true, justificacion: 'Así quedó al hacerlo en Excel. Son dos cosas distintas. La rutina empieza otra vez desde su primera línea: vuelve a asignar 1 850 000 al saldo y 0 a los meses, y por eso da lo mismo. La ventana Inmediato, en cambio, no se borra entre ejecuciones: guarda todo lo que se ha escrito en ella.' },
                        { texto: 'Dos líneas distintas: 4 y -150000, y luego 8 y -300000, porque las variables conservan su valor.', correcta: false },
                        { texto: 'Una línea y un mensaje de error: una rutina no se puede ejecutar dos veces sin cerrar el editor.', correcta: false },

                <h3>La ventana Inmediato</h3>
                <p>
                    La ventana Inmediato tiene dos usos. El primero lo conoce de los cinco capítulos
                    anteriores sin haberlo visto: es donde aparece lo que imprime
                    {' '}<span className="inline-code">Debug.Print</span>. El método
                    {' '}<span className="inline-code">Print</span> imprime texto en la ventana
                    Inmediato <Cita k="microsoft2018print" loc="párrafo inicial" />.
                </p>
                <p>
                    El segundo uso es escribir en ella directamente: se escribe o se pega una línea de
                    código y se pulsa Entrar para ejecutarla <Cita k="microsoft2018inmediato" loc="párrafo inicial" />.
                    Al escribir <span className="inline-code">Print 1850000 - 500000</span> y pulsar Entrar,
                    la ventana respondió <span className="inline-code">1350000</span> en la línea siguiente.
                    Se probó también <span className="inline-code">? saldo</span>, con el signo de
                    interrogación en lugar de <span className="inline-code">Print</span> y sin ninguna rutina
                    en ejecución: dejó una línea en blanco. La documentación dice que de un dato vacío
                    (<span className="inline-code">Empty</span>) no se escribe
                    nada <Cita k="microsoft2018print" loc="Observaciones" />, y que si no se indica otra
                    cosa lo siguiente se imprime en la línea
                    siguiente <Cita k="microsoft2018print" loc="Sintaxis" />. Las dos cosas juntas dan una
                    línea en blanco si esa variable está vacía fuera de la rutina, y lo está: a
                    {' '}<span className="inline-code">? TypeName(saldo)</span> la ventana
                    respondió <span className="inline-code">Empty</span>.
                </p>

                <h3>Cómo separa los datos Debug.Print</h3>
                <p>
                    En los capítulos anteriores la salida de VBA traía espacios que las de Python y R no
                    tenían. Salen de tres reglas, y las tres se ven en esta rutina:
                </p>

                <CodeBlock lang="vba" plegable={false} code={INMEDIATO_PRINT.vba} />

                <ul>
                    <li>
                        <strong>El punto y coma no añade nada.</strong> Deja el punto de inserción
                        inmediatamente después del último carácter mostrado <Cita k="microsoft2018print" loc="Sintaxis" />.
                        El espacio que se ve entre <span className="inline-code">Meses:</span> y el 4 no lo pone
                        el punto y coma: lo trae el número.
                    </li>
                    <li>
                        <strong>Un número trae sus propios espacios.</strong> La especificación del lenguaje
                        dice que un valor numérico que no sea una fecha se escribe con un espacio insertado como
                        primer carácter y otro como último <Cita k="microsoft2026vbal" loc="§5.4.5.8" />. En Excel el del final se ve
                        en <span className="inline-code">saldo; "pesos"</span>, que deja un espacio antes
                        de <span className="inline-code">pesos</span>. El del principio apareció con el 4 y
                        no con el saldo negativo, aunque la especificación no hace esa excepción:
                        {' '}<span className="inline-code">-150000</span> salió sin espacio delante del signo,
                        y por eso entre el 4 y el saldo hay un solo espacio y no dos.
                    </li>
                    <li>
                        <strong>La coma salta a la siguiente zona de impresión.</strong> Avanza escribiendo
                        espacios, igual que <span className="inline-code">Tab</span> sin argumento: hasta que la posición en la línea, dividida entre 14, deje residuo
                        1 <Cita k="microsoft2026vbal" loc="§5.4.5.8" />. Contando desde 1, eso da zonas que
                        empiezan en las columnas 1, 15, 29 y así sucesivamente, y es lo que se vio al
                        ejecutar: <span className="inline-code">meses, saldo</span> puso
                        el signo del saldo en la columna 15. Es el hueco de la rutina
                        {' '}<span className="inline-code">OtroAcuerdo</span>.
                    </li>
                </ul>
                <p>
                    Hay una cuarta regla que no se ve en la salida declarada. Lo que se imprime en la
                    ventana Inmediato usa el separador decimal de la configuración regional del
                    sistema <Cita k="microsoft2018print" loc="Observaciones" />. La última línea de la rutina
                    declara <span className="inline-code">916799.93</span>, con punto, como en todo el
                    material; el Excel con que se ejecutó, en un Mac con región Colombia, escribió
                    {' '}<span className="inline-code">916799,93</span>, con coma.
                </p>

                <Ejercicio tipo="E2"><MCQ
                    pregunta={<>Con <span className="inline-code">meses = 4</span>, la rutina ejecuta <span className="inline-code">Debug.Print "Meses:", meses</span>. La palabra <span className="inline-code">Meses:</span> ocupa las columnas 1 a 6. ¿En qué columna queda el 4?</>}
                    opciones={[
                        { texto: 'En la 7: la coma solo separa los dos datos, y el 4 va pegado a los dos puntos.', correcta: false },
                        { texto: 'En la 8: la coma pone un espacio y el número pone otro.', correcta: false },
                        { texto: 'En la 15: la coma lleva al comienzo de la segunda zona y ahí empieza el 4.', correcta: false },
                        { texto: 'En la 16: la segunda zona empieza en la 15, y el 4 deja antes un espacio.', correcta: true, justificacion: 'Son dos reglas seguidas. La coma avanza hasta la columna 15, donde empieza la segunda zona de impresión. Ahí se escribe el número, y un número que no es negativo lleva un espacio delante: el espacio queda en la 15 y el 4 en la 16. Con un saldo negativo, el signo habría quedado en la 15.' },
                    ]}
                /></Ejercicio>

                <h3>Guardar el libro</h3>
                <p>
                    El formato <span className="inline-code">.xlsx</span>, el libro de Excel predeterminado, no puede
                    almacenar código de macros de VBA; el libro habilitado para
                    macros, <span className="inline-code">.xlsm</span>, sí lo almacena <Cita k="microsoft2026formatos" loc="Formatos de archivo de Excel" />.
                    Por eso el libro del caso se llama <span className="inline-code">Acuerdos.xlsm</span>.
                    Según Microsoft, al guardar un libro con macros Excel pregunta si se guarda como libro
                    habilitado para macros o como libro sin macros <Cita k="microsoft2025guardarmacro" loc="Guardar una macro con el libro actual" />.
                    Esa página dice aplicarse a Excel 2013 y no menciona Mac; en el Excel para Mac de este
                    capítulo el guardado no se probó.
                </p>

                <Box type="tip" label="Lo que queda de esta sección">
                    El código vive en un módulo del proyecto del libro y se ve en el editor. Se ejecuta el

                    a la ventana Inmediato, que no se borra sola. Y el libro tiene que guardarse como
                    {' '}<span className="inline-code">.xlsm</span> para conservar el código.
                </Box>
            </div>

                <Fuente propia>comparando las pestañas de pseudocódigo y de VBA del bloque anterior</Fuente>

                <p>
                    Un <span className="inline-code">Sub</span> ejecuta instrucciones pero no devuelve un
                    valor: a diferencia de un procedimiento
                    {' '}<span className="inline-code">Function</span>, que devuelve un valor, un
                    {' '}<span className="inline-code">Sub</span> no puede usarse en una
                    expresión <Cita k="microsoft2018sub" loc="Remarks" />. Las funciones son el tema del
                    capítulo 8.
                </p>

                <OrdenaPasos
                    enunciado="Reconstruya la rutina que calcula el precio neto de un producto de 480 000 con el 10 % de descuento. En la pestaña de VBA hay tres líneas que las otras no tienen: su lugar es lo que importa."
                    pasos={ORDENA_DESCUENTO}
                    pista="Tres preguntas: qué tiene que conocerse antes de calcular el descuento, qué tiene que existir antes de asignarle un valor a una variable y qué va antes de cualquier procedimiento."
                />

                <h3>Declarar: lo que hace Dim</h3>
                <p>
                    El pseudocódigo del curso usa una variable sin anunciarla. VBA permite anunciarla con
                    {' '}<span className="inline-code">Dim</span>, que dentro de un procedimiento crea una variable
                    de ese procedimiento <Cita k="microsoft2018declarar" loc="introducción" />. La variable
                    nace con un valor: una numérica se inicializa en 0 y una cadena de longitud variable,
                    en la cadena vacía <Cita k="microsoft2019dim" loc="Observaciones" />. Es lo que los
                    capítulos 2, 4 y 5 dijeron de paso, que <span className="inline-code">Dim</span> deja
                    la variable en 0, y aquí se ve ejecutado:
                </p>

                <CodeBlock lang="vba" plegable={false} code={VALORES_INICIALES.vba} />

                <p>
                    Las dos últimas líneas muestran una trampa. En <span className="inline-code">Dim tasaA, tasaB As Double</span> parece
                    que las dos son <span className="inline-code">Double</span>, y no: el tipo acompaña solo al
                    nombre que lo lleva. Microsoft lo dice con su propio ejemplo: en
                    {' '}<span className="inline-code">Dim intX, intY, intZ As Integer</span> solo
                    {' '}<span className="inline-code">intZ</span> es entera <Cita k="microsoft2018declarar" loc="introducción" />,
                    y a la que no se le da tipo se le asigna
                    {' '}<span className="inline-code">Variant</span> por omisión <Cita k="microsoft2018declarar" loc="introducción" />,
                    que nace vacía, en <span className="inline-code">Empty</span> <Cita k="microsoft2019dim" loc="Observaciones" />.
                    Por eso las rutinas de este curso repiten <span className="inline-code">As</span> en cada
                    nombre: <span className="inline-code">Dim saldo As Currency, abono As Currency, meses As Integer</span>.
                    Los tipos son el tema de la sección 4.
                </p>
                <p>
                    Las variables locales de un procedimiento no conservan su valor de una llamada a la
                    siguiente, salvo que el procedimiento se declare <span className="inline-code">Static</span> <Cita k="microsoft2018sub" loc="Remarks" />.
                    Una variable suelta declarada con <span className="inline-code">Static</span> en lugar
                    de <span className="inline-code">Dim</span> sí mantiene su valor entre llamadas <Cita k="microsoft2018declarar" loc="Instrucción Static" />.
                    Las rutinas de este curso no usan ninguna de las dos cosas: cada ejecución empieza de
                    cero. Se comprobó con una rutina que declara
                    {' '}<span className="inline-code">Dim veces As Integer</span>, le suma 1 y la escribe:
                    llamada dos veces seguidas desde la ventana Inmediato, escribió
                    {' '}<span className="inline-code">veces = 1</span> las dos veces.
                </p>

                <h3>Option Explicit: la línea que va antes de todo</h3>
                <p>
                    En VBA declarar es voluntario, y ahí está el problema del caso inicial. Una variable se
                    puede declarar de manera implícita con solo usarla en una asignación, y toda variable
                    declarada así es de tipo <span className="inline-code">Variant</span> <Cita k="microsoft2018declarar" loc="Instrucción Option Explicit" />.
                    Esta es la rutina del analista:
                </p>

                <CodeBlock lang="vba" plegable={false} code={SIN_EXPLICIT.vba} />

                <p>
                    La línea 7 no es un error para VBA. Es una declaración implícita: crea
                    {' '}<span className="inline-code">totalIntres</span> y le asigna 70 000, mientras
                    {' '}<span className="inline-code">totalInteres</span> se queda en 20 000 y termina en
                    36 000.
                </p>
                <p>
                    La defensa es una línea. Cuando <span className="inline-code">Option Explicit</span> aparece
                    en un módulo, hay que declarar explícitamente todas las variables, y usar un nombre no
                    declarado produce un error en tiempo de
                    compilación <Cita k="microsoft2018optionexplicit" loc="Observaciones" />: la rutina no
                    llega a ejecutarse. La instrucción tiene que aparecer en el módulo antes de cualquier
                    procedimiento <Cita k="microsoft2018optionexplicit" loc="Observaciones" />, y por eso es
                    la primera línea de la mayoría de las rutinas completas de VBA de los capítulos 4 y 5.
                </p>

                <Box type="info" label="Lo que dijo Excel">
                    <p>
                        Se copió la línea del error a un módulo que empieza con
                        {' '}<span className="inline-code">Option Explicit</span> y se eligió
                        {' '}<strong>Debug › Compile VBAProject</strong>. Apareció un aviso con el
                        título <em>Microsoft Visual Basic</em> y el texto «Compile error: Variable not
                        defined», y en el código quedó seleccionado
                        {' '}<span className="inline-code">totalIntres =</span>, el nombre que nadie declaró.
                    </p>
                    <p className="mb-0">
                        No hace falta compilar a mano. Al llamar la rutina desde la ventana Inmediato salió
                        el mismo aviso antes de que se ejecutara ninguna línea, y al cerrarlo el editor
                        quedó en pausa, con la línea <span className="inline-code">Sub</span> resaltada
                        en amarillo. En un Excel en español el texto del aviso estará traducido; la
                        traducción no se vio en este capítulo.
                    </p>
                </Box>

                <p>
                    El entorno de Visual Basic tiene una opción para incluir
                    {' '}<span className="inline-code">Option Explicit</span> automáticamente en todos los módulos
                    nuevos, que no cambia el código ya escrito <Cita k="microsoft2018declarar" loc="Instrucción Option Explicit" />.
                    La página no dice dónde está esa opción, y en el Excel de este capítulo no se buscó:
                    mientras tanto, se escribe a mano.
                </p>

                /></Ejercicio>

                <h3>Select Case, otra vez</h3>
                <p>
                    El capítulo 4 mostró <span className="inline-code">Select Case</span> con tramos escritos con
                    {' '}<span className="inline-code">To</span> y dejó dicho que este capítulo volvería sobre él.
                    Faltaban dos cosas. La primera es que un caso admite una lista de una o varias de
                    tres formas: una expresión (un valor, por ejemplo), un intervalo con <span className="inline-code">To</span> o una
                    comparación con <span className="inline-code">Is</span> <Cita k="microsoft2018selectcase" loc="Syntax" />.
                    En el ejemplo de Microsoft las formas se separan con comas: <span className="inline-code">Case 1 To 4, 7 To 9, 11, 13, Is &gt; MaxNumber</span> <Cita k="microsoft2018selectcase" loc="Remarks" />.
                </p>

                <CodeBlock lang="vba" plegable={false} code={SELECT_MORA.vba} />

                <Ilustrativo>
                    Los tramos de días y los nombres de cada gestión de cobro se eligieron para el ejemplo:
                    no son los de ninguna entidad ni los de una norma.
                </Ilustrativo>

                <p>
                    La segunda es el orden. Si el valor coincide con más de un caso, solo se ejecutan las
                    instrucciones del primero que coincide <Cita k="microsoft2018selectcase" loc="Remarks" />.
                    Y si no coincide con ninguno y no hay <span className="inline-code">Case Else</span>, la
                    ejecución sigue en la instrucción que viene después de
                    {' '}<span className="inline-code">End Select</span> <Cita k="microsoft2018selectcase" loc="Remarks" />,
                    sin ningún aviso: es el <span className="inline-code">Segun</span> que no asigna nada, del
                    capítulo 4.
                </p>

                <CodeBlock lang="vba" plegable={false} code={SELECT_ORDEN.vba} />

                <Ejercicio tipo="E2"><MCQ
                    pregunta={<>La rutina <span className="inline-code">ClasificarMoraB</span> corre con <span className="inline-code">dias = 120</span>. ¿Qué escribe en la ventana Inmediato?</>}
                    opciones={[
                        { texto: 'Cobro juridico: 120 pasa de 90, y ese es el caso más exigente de los que cumple.', correcta: false },
                        { texto: 'Cobro juridico: cumple los dos casos, se ejecutan ambos y queda el último.', correcta: false },
                        { texto: 'Cobro administrativo: 120 pasa de 30, y ese caso está escrito primero.', correcta: true, justificacion: 'Así salió al ejecutarla. Select Case no busca el caso que mejor describe el dato: recorre los casos en el orden en que están escritos y ejecuta solo el primero que coincide. 120 es mayor que 30, y ahí termina. El caso de los 90 días no se alcanza nunca, con ningún dato. El arreglo es escribir primero el caso más exigente, o usar tramos con To que no se solapen.' },
                        { texto: 'Recordatorio: al cumplirse dos casos a la vez, la selección pasa a Case Else.', correcta: false },
                    ]}
                /></Ejercicio>

                <h3>Tres palabras que ya había leído</h3>
                <ul>
                    <li>
                        <span className="inline-code">Const</span> declara constantes para usarlas en lugar de
                        valores literales <Cita k="microsoft2018const" loc="párrafo inicial" />. Es el
                        {' '}<span className="inline-code">Constante</span> del pseudocódigo del capítulo 2.
                    </li>
                    <li>
                        <span className="inline-code">InputBox</span> muestra una pregunta en un cuadro de
                        diálogo, espera a que el usuario escriba o pulse un botón y
                        devuelve una cadena con el contenido del cuadro de texto <Cita k="microsoft2018inputbox" loc="párrafo inicial" />. Es el
                        {' '}<span className="inline-code">Leer</span> de los capítulos anteriores. Como devuelve
                        una cadena, esos capítulos la envolvían en
                        {' '}<span className="inline-code">CCur(…)</span>, <span className="inline-code">CLng(…)</span> u otra conversión;
                        las conversiones son de la sección 4.
                    </li>
                    <li>
                        <span className="inline-code">MsgBox</span> muestra un mensaje en un cuadro de diálogo
                        y espera a que el usuario pulse un botón <Cita k="microsoft2019msgbox" loc="párrafo inicial" />.
                        Sirve para el resultado final; para seguir una rutina mientras corre es mejor
                        {' '}<span className="inline-code">Debug.Print</span>, que no la detiene.
                    </li>
                </ul>

                <Box type="tip" label="Lo que queda de esta sección">
                    Un algoritmo pasa a VBA dentro de un <span className="inline-code">Sub</span>. Sus
                    variables se declaran con <span className="inline-code">Dim</span>, cada una con su
                    {' '}<span className="inline-code">As</span>, y nacen en 0 o vacías. Y el módulo empieza con
                    {' '}<span className="inline-code">Option Explicit</span>, para que un nombre mal escrito sea un
                    error antes de ejecutar y no una cifra equivocada después.
                </Box>

                <h3>Cuando el número no cabe: el error 6</h3>

                <SimuladorVBE titulo="OtroAcuerdo, paso a paso" modulo="Module1"
                    codigo={F8_CODIGO} variables={F8_VARIABLES} pasos={F8_PASOS}
                    nota={<Fuente propia>{`con el recorrido hecho en Excel 16.115 para Mac el 23 de noviembre de 2026: 23 paradas, ninguna en la línea Dim`}</Fuente>} />

                <p>
                    El saldo se volvió negativo en la cuarta ejecución
                    de <span className="inline-code">saldo = saldo - abono</span>: entró con 350 000 y
                    salió con −150 000. El ciclo no lo evitó porque la condición se pregunta antes de la
                    resta, no después: con 350 000 era verdadera, y la vuelta se hizo completa.
                </p>
                <p>
                    ¿Están bien las cifras, entonces? La rutina hizo lo que dice su código. Cuatro abonos
                    de 500 000 son 2 000 000, y la deuda era de 1 850 000: el saldo negativo dice que
                    el cuarto abono cobró 150 000 de más. El editor muestra lo que pasó. Decidir si eso
                    era lo que debía pasar le toca a quien lee, y ningún aviso lo va a hacer por él.
                </p>

                <h3>Tres cosas que la traza a mano hacía distinto</h3>
                <p>
                    <strong>El editor no se detuvo en el Dim.</strong> De la
                    línea <span className="inline-code">Sub</span> pasó a la primera asignación. Es
                    coherente con lo que dice Microsoft de los puntos de interrupción: no se pueden poner
                    en líneas de código no ejecutable, como los comentarios, las instrucciones de
                    declaración o las líneas en
                    blanco <Cita k="microsoft2018depuracion" loc="tabla de comandos" />. Sí se detuvo en
                    {' '}<span className="inline-code">Sub</span> y en <span className="inline-code">End Sub</span>,
                    a las que la traza a mano del capítulo 3 no les daba fila.
                </p>
                <p>
                    <strong>Las variables ya valían 0 en la primera parada.</strong> En la traza a mano
                    se escribía una raya hasta la primera asignación, porque «sin valor» no es cero. Para
                    una variable numérica declarada, en VBA esa raya no existe: como se vio en la sección 3,
                    nace en 0, y eso fue lo que mostró Locales antes de que se ejecutara nada.
                </p>
                <p>
                    <strong>Hubo más paradas que filas.</strong> La tabla del capítulo 5 tenía una fila
                    por evaluación de la condición. El editor se detuvo en cada línea ejecutable por la que
                    pasó, incluido el <span className="inline-code">Loop</span>: 23 paradas para cuatro
                    vueltas.
                </p>

                <h3>La ventana Locales</h3>
                <p>
                    La tabla de variables la lleva la ventana Locales, que muestra automáticamente todas
                    las variables declaradas en el procedimiento actual y sus
                    valores <Cita k="microsoft2018locales" loc="párrafo inicial" />, y, cuando está
                    visible, se actualiza cada vez que la ejecución pasa al modo de
                    interrupción <Cita k="microsoft2018locales" loc="párrafo inicial" />. Tiene tres
                    columnas: la expresión, que es el nombre de la variable; el valor; y el
                    tipo <Cita k="microsoft2018locales" loc="Elementos de la ventana" />. En un módulo
                    estándar, la primera línea de la lista es una entrada especial con el nombre del módulo, que se puede
                    expandir para ver las variables de nivel de
                    módulo <Cita k="microsoft2018locales" loc="Elementos de la ventana" />: en el
                    recorrido decía <span className="inline-code">Module1</span>. Debajo estaban las tres
                    variables, con el tipo que les dio el <span className="inline-code">Dim</span>. En
                    ese recorrido los <span className="inline-code">Currency</span>, que eran valores
                    enteros, se veían sin separadores ni decimales: <span className="inline-code">1850000</span>,
                    {' '}<span className="inline-code">-150000</span>.
                </p>

                <TablaTraza
                    titulo="Lo que mostró Locales en seis paradas"
                    enunciado={<>La rutina se recorre con Step Into. Para seis de las paradas, escriba <strong>lo que muestra la ventana Locales</strong> cuando la línea indicada está resaltada, es decir, antes de que se ejecute. Recuerde que en VBA una variable numérica declarada ya tiene valor.</>}
                    codigo={F8_TRES_ABONOS}
                    lang="vba"
                    columnas={[
                        { clave: 'parada', titulo: 'Línea resaltada' },
                        { clave: 'saldo', titulo: 'saldo' },
                        { clave: 'abono', titulo: 'abono' },
                        { clave: 'k', titulo: 'k' },
                    ]}
                    ocultas={['saldo', 'abono', 'k']}
                    exigeRespuesta
                    filas={[
                        { parada: 'Sub AbonosCrecientes()', saldo: '0', abono: '0', k: '0' },
                        { parada: 'For k = 1 To 3', saldo: '900000', abono: '0', k: '0' },
                        { parada: 'Next k, primera vez', saldo: '800000', abono: '100000', k: '1' },
                        { parada: 'Next k, segunda vez', saldo: '600000', abono: '200000', k: '2' },
                        { parada: 'Next k, tercera vez', saldo: '300000', abono: '300000', k: '3' },
                        { parada: 'Debug.Print k; saldo', saldo: '300000', abono: '300000', k: '4' },
                    ]}
                    pista="Dos trampas. En la primera parada nada se ha ejecutado, pero las variables ya existen. Y el contador no se queda en 3: el capítulo 5 dijo dónde suma VBA el paso."
                />

                <h3>Detenerse solo donde interesa</h3>
                <p>
                    Veintitrés pulsaciones para cuatro vueltas se soportan. Para un plan de 240 cuotas,
                    no. Para detenerse solo donde interesa está el punto de interrupción, que se pone para suspender la ejecución en
                    una instrucción determinada de un procedimiento, por ejemplo donde se sospecha que
                    puede haber problemas <Cita k="microsoft2018interrupcion" loc="párrafo inicial" />. Se
                    pone con el comando <strong>Toggle Breakpoint</strong> del menú Debug, que pone o
                    quita un punto de interrupción en la línea
                    actual <Cita k="microsoft2018depuracion" loc="tabla de comandos" />, o con un clic
                    junto a la instrucción en la barra del margen, si está
                    visible <Cita k="microsoft2018interrupcion" loc="To set a breakpoint" />. Y no viaja con el libro: los puntos de interrupción no se guardan
                    al guardar el código <Cita k="microsoft2018interrupcion" loc="Note" />.
                </p>

                <Box type="info" label="Lo que se vio en Excel">
                    <p>
                        Con <strong>Debug › Toggle Breakpoint</strong>, la línea donde estaba el cursor
                        quedó con fondo rojo oscuro y letra blanca, y con un punto del mismo color en el
                        margen. Un clic sobre ese punto lo quitó, y un clic en el margen, junto a otra
                        línea, puso uno nuevo allí.
                    </p>
                    <p>
                        Con el punto puesto en la resta de la rutina del ejercicio que sigue, se ejecutó
                        con el botón <strong>Run</strong> de la barra de herramientas. La rutina se detuvo
                        en esa línea, resaltada en amarillo y todavía sin ejecutar, y Locales mostró las
                        variables. Cada nueva pulsación de Run la dejó correr una vuelta completa, hasta
                        detenerse otra vez en la misma línea.
                    </p>
                    <p className="mb-0">
                        Después de la última detención, Run la llevó hasta el final, y en la ventana
                        Inmediato quedó <span className="inline-code">6</span> y
                        {' '}<span className="inline-code">-50000</span>. El punto de interrupción siguió
                        en su línea al terminar.
                    </p>
                </Box>

                <TablaTraza
                    titulo="Seis veces en la misma línea"
                    enunciado={<>Un acuerdo de pago de 2 350 000 en abonos de 400 000. Hay un punto de interrupción en la línea <span className="inline-code">saldo = saldo - abono</span> y la rutina se deja correr: se detiene ahí cada vez que va a ejecutarla. <strong>Escriba lo que muestra Locales en cada detención.</strong></>}
                    codigo={F8_ACUERDO_LARGO}
                    lang="vba"
                    columnas={[
                        { clave: 'vez', titulo: 'Detención' },
                        { clave: 'saldo', titulo: 'saldo' },
                        { clave: 'meses', titulo: 'meses' },
                    ]}
                    ocultas={['saldo', 'meses']}
                    exigeRespuesta
                    filas={[
                        { vez: '1.ª', saldo: '2350000', meses: '0' },
                        { vez: '2.ª', saldo: '1950000', meses: '1' },
                        { vez: '3.ª', saldo: '1550000', meses: '2' },
                        { vez: '4.ª', saldo: '1150000', meses: '3' },
                        { vez: '5.ª', saldo: '750000', meses: '4' },
                        { vez: '6.ª', saldo: '350000', meses: '5' },
                    ]}
                    pista="La rutina se detiene antes de ejecutar la línea: en cada detención la resta de esa vuelta todavía no se ha hecho."
                />

                <h3>Seguir el camino de una decisión</h3>
                <p>
                    En un ciclo, el paso a paso muestra cuántas veces. En una decisión muestra por dónde.
                    A juicio del docente, con una rutina ajena suele decir más saber qué
                    líneas <em>no</em> se ejecutaron que leer el código entero. Esta es una versión corta de la rutina de la sección 3 que
                    clasifica una mora:
                </p>

                <TablaTraza
                    titulo="Por dónde pasó la línea amarilla"
                    enunciado={<>La rutina se recorre con Step Into, con <span className="inline-code">dias = 45</span>. <strong>Escriba el número de la línea resaltada en cada parada.</strong> La última columna trae lo que mostró Locales para <span className="inline-code">gestion</span>, que escribe las cadenas entre comillas: dos comillas solas son una cadena a la que nadie le ha asignado nada.</>}
                    codigo={F8_MORA}
                    lang="vba"
                    columnas={[
                        { clave: 'parada', titulo: 'Parada' },
                        { clave: 'linea', titulo: 'Línea resaltada' },
                        { clave: 'gestion', titulo: 'gestion' },
                    ]}
                    ocultas={['linea']}
                    exigeRespuesta
                    filas={[
                        { parada: '1', linea: '1', gestion: '""' },
                        { parada: '2', linea: '3', gestion: '""' },
                        { parada: '3', linea: '4', gestion: '""' },
                        { parada: '4', linea: '5', gestion: '""' },
                        { parada: '5', linea: '7', gestion: '""' },
                        { parada: '6', linea: '9', gestion: '""' },
                        { parada: '7', linea: '10', gestion: '""' },
                        { parada: '8', linea: '13', gestion: '"Cobro administrativo"' },
                        { parada: '9', linea: '14', gestion: '"Cobro administrativo"' },
                        { parada: '10', linea: '15', gestion: '"Cobro administrativo"' },
                    ]}
                    pista="El editor no se detiene en el Dim. Y pregúntese en qué líneas hay algo que evaluar antes de llegar al caso que coincide."
                />

                <h3>Salir de una pausa, y de un ciclo que no termina</h3>
                <p>
                    En los recorridos de este capítulo, mientras una rutina estaba en pausa el título de
                    la ventana del editor terminaba en <span className="inline-code">[break]</span>. De
                    esa pausa se salió de dos maneras: dejándola continuar con Run, con lo que corrió
                    hasta el final o hasta el siguiente punto de interrupción, o abandonándola con el
                    botón <strong>Reset</strong> de la barra de herramientas, que se usó cada vez que no
                    interesaba llegar al final.
                </p>
                <p>
                    Queda una pregunta que este capítulo no pudo responder. El capítulo 5 dijo cómo se
                    interrumpe en Python y en R un ciclo que no termina, y no lo dijo para VBA. Al
                    preparar esta sección se ejecutó una rutina larga y se intentó detenerla desde un
                    programa, con la tecla Esc y con el botón de pausa del editor: ninguno de los dos
                    llegó a Excel mientras la rutina corría, así que la prueba no dice nada. Cómo se
                    detiene en Excel para Mac una rutina que no termina queda pendiente de probarse en
                    el teclado.
                </p>
                <p>
                    Entre los comandos del menú Debug que este capítulo no usó están Step Over y Run To
                    Cursor. Step Over ejecuta cada procedimiento llamado como si fuera una sola
                    instrucción, y Run To Cursor permite elegir la instrucción donde se quiere que la
                    ejecución se detenga, lo que sirve para pasar de largo secciones como los ciclos
                    grandes <Cita k="microsoft2018seguimiento" loc="párrafo inicial" />. El primero se
                    aprovecha cuando una rutina llama a otras, que es el tema del capítulo 8.
                </p>

                <Box type="tip" label="Lo que sigue">
                    El paso a paso sirve cuando la rutina corre y el resultado no convence. La sección 7
                    trata el otro caso: la rutina se detiene sola, con un mensaje de error.
                </Box>
            </div>
        );

        // ── Sección 7 · bloques (solo VBA) ───────────────────────────────────
        // Sin salida declarada: se detiene con el error 6. La división da el 11 si
        // su resultado se escribe o va a un Double, y el 6 si va a un Currency
        // (registro de ejecución del vault, apartado 12). Se ejecutó a mano; lo
        // que dijo Excel está en el recuadro que la sigue.
        const CUOTA_SIN_PLAZO = {
            vba: `Sub CuotaSinPlazo()
    Dim capital As Currency, plazo As Integer, cuota As Currency

    capital = 12000000
    plazo = 0
    cuota = capital / plazo
    Debug.Print "Cuota:"; cuota
End Sub`,
        };

        const CUOTA_GUARDIA = {
            vba: `Sub CuotaConGuardia()
    Dim capital As Currency, plazo As Integer, cuota As Currency

    capital = 12000000
    plazo = 0
    If plazo <= 0 Then
        Debug.Print "El plazo debe ser mayor que cero."
        '> El plazo debe ser mayor que cero.
        Exit Sub
    End If
    cuota = capital / plazo
    Debug.Print "Cuota:"; cuota
End Sub`,
        };

        const CUOTA_CONTROLADOR = {
            vba: `Sub CuotaConControlador()
    Dim capital As Currency, plazo As Integer, cuota As Currency

    On Error GoTo Fallo
    capital = 12000000
    plazo = 0
    cuota = capital / plazo
    Debug.Print "Cuota:"; cuota
    Exit Sub

Fallo:
    Debug.Print "Error"; Err.Number; "- "; Err.Description
    '> Error 6 - Overflow
End Sub`,
        };

        const ENTRADA_INVALIDA = {
            vba: `Sub MontoDigitado()
    Dim texto As String, monto As Currency

    On Error GoTo Fallo
    texto = "dos millones"      ' lo que alguien escribio en un InputBox
    monto = CCur(texto)
    Debug.Print "Monto:"; monto
    Exit Sub

Fallo:
    Debug.Print "Error"; Err.Number; "- "; Err.Description
    '> Error 13 - Type mismatch
End Sub`,
        };

        const RESUME_NEXT = {
            vba: `Sub CuotaQueCalla()
    Dim capital As Currency, plazo As Integer, cuota As Currency

    On Error Resume Next
    capital = 12000000
    plazo = 0
    cuota = capital / plazo
    Debug.Print "Cuota:"; cuota
    '> Cuota: 0
    Debug.Print "Err.Number:"; Err.Number
    '> Err.Number: 6
    On Error GoTo 0             ' los errores vuelven a avisar
End Sub`,
        };

        // E4 · solo VBA, como texto (ver CMP_CELLS_A). Son CuotaConGuardia y
        // CuotaQueCalla recortadas: sin las líneas de salida y, en B, sin lo que
        // va después de escribir la cuota. Lo que escribe cada una está ejecutado
        // en los bloques CUOTA_GUARDIA y RESUME_NEXT.
        const CMP_ERROR_GUARDIA = `Sub VersionA()
    Dim capital As Currency, plazo As Integer, cuota As Currency
    capital = 12000000
    plazo = 0
    If plazo <= 0 Then
        Debug.Print "El plazo debe ser mayor que cero."
        Exit Sub
    End If
    cuota = capital / plazo
    Debug.Print "Cuota:"; cuota
End Sub`;
        const CMP_ERROR_CALLA = `Sub VersionB()
    Dim capital As Currency, plazo As Integer, cuota As Currency
    On Error Resume Next
    capital = 12000000
    plazo = 0
    cuota = capital / plazo
    Debug.Print "Cuota:"; cuota
End Sub`;

        // Sección 7 — «Errores y seguridad». Solo VBA (decisión 3 del plan del capítulo).
        const Cap7Section = () => (
            <div className="prose-lp">
                <Motivacion icon="fa-triangle-exclamation"
                    gancho="Una macro que usted probó varias veces se detiene la primera vez que la usa otra persona. ¿Qué vio esa persona, y qué debió ver?">
                    Un analista entrega un libro con una macro que calcula la cuota de un crédito sin
                    intereses: el capital dividido entre el plazo. La probó con doce meses, con
                    veinticuatro y con treinta y seis. La gerente la ejecuta con el plazo en cero.
                    No ve una cuota ni una explicación: ve un aviso en inglés con un número de error y un
                    botón que, si lo pulsa, le abre el código del analista con una línea en amarillo.
                </Motivacion>

                <Ilustrativo>
                    El analista y la gerente son un caso inventado. El aviso es el que mostró Excel al
                    llamar la rutina <span className="inline-code">CuotaSinPlazo</span>, más abajo, desde
                    la ventana Inmediato.
                </Ilustrativo>

                <h3>Tres momentos en que algo sale mal</h3>
                <p>
                    Este capítulo ya mostró los tres:
                </p>

                <div className="overflow-x-auto">
                    <table>
                        <thead>
                            <tr><th>Cuándo avisa</th><th>Qué pasa</th><th>Dónde se vio</th></tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><strong>Antes de ejecutar</strong>: error de compilación</td>
                                <td>El editor rechaza el código: «Compile error». La rutina no arranca.</td>
                                <td>Sección 3, con el nombre mal escrito y <span className="inline-code">Option Explicit</span>.</td>
                            </tr>
                            <tr>
                                <td><strong>Durante la ejecución</strong>: error de ejecución</td>
                                <td>La rutina se detiene en una instrucción: «Run-time error».</td>
                                <td>Sección 4, con el error 6 del producto de dos enteros.</td>
                            </tr>
                            <tr>
                                <td><strong>Nunca</strong>: error de lógica</td>
                                <td>La rutina termina sin avisos y el resultado está mal.</td>
                                <td>Sección 4, con la tasa de cinco decimales; sección 6, con el saldo negativo.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <Fuente propia>con lo visto en las secciones 3, 4 y 6 de este capítulo</Fuente>

                <p>
                    En el tercero Excel no avisa: se encuentra probando y siguiendo la rutina paso a paso.
                    La primera parte de esta sección trata el segundo.
                </p>

                <h3>Lo que pasa cuando nadie previó el error</h3>
                <p>
                    Esta es la rutina del analista, con el plazo en cero:
                </p>

                <CodeBlock lang="vba" plegable={false} code={CUOTA_SIN_PLAZO.vba} />

                <Box type="info" label="Lo que dijo Excel">
                    Al llamar <span className="inline-code">CuotaSinPlazo</span> desde la ventana Inmediato
                    apareció el mismo aviso de la sección 4: «Run-time error '6': Overflow», con los
                    botones Help, Continue (apagado), End y Debug. En la sección 4, Debug fue el botón que
                    dejó el editor en pausa con la línea del error resaltada en amarillo.
                </Box>

                <p>
                    Es la regla general: si no se usa una
                    instrucción <span className="inline-code">On Error</span>, cualquier error en tiempo
                    de ejecución es grave, es decir, se muestra un mensaje de error y la ejecución se
                    detiene <Cita k="microsoft2018onerror" loc="Observaciones" />.
                </p>
                <p>
                    El número no es el que uno esperaría. VBA tiene un error propio para la división
                    entre cero, el 11: al escribir <span className="inline-code">? 12000000 / 0</span> en
                    la ventana Inmediato, Excel respondió «Run-time error '11': Division by zero». La
                    diferencia no está en lo que se divide sino en dónde se guarda el resultado. Se probó
                    en la ventana Inmediato la misma división, un <span className="inline-code">Currency</span> de
                    12 000 000 entre un <span className="inline-code">Integer</span> en cero, de tres
                    maneras. Escrita con <span className="inline-code">?</span>, dio el 11. Asignada a una
                    variable <span className="inline-code">Double</span>, dio el 11. Asignada a una
                    variable <span className="inline-code">Currency</span>, como en la rutina, dio el 6.
                </p>
                <p>
                    El capítulo 4 ya había anotado otro caso en que dividir entre cero informa el 6: cero
                    entre cero. Aquí se repitió y dio lo mismo. Lo que queda de esto para leer macros
                    ajenas: el número del error orienta, pero no siempre nombra la causa.
                </p>

                <h3>Prevenir: la guardia</h3>
                <p>
                    La primera defensa no es de VBA. Es la guardia que los capítulos 4 y 5 pusieron antes
                    de una división o de un ciclo: preguntar por el dato antes de usarlo.
                </p>

                <CodeBlock lang="vba" plegable={false} code={CUOTA_GUARDIA.vba} />

                <p>
                    La instrucción nueva es <span className="inline-code">Exit Sub</span>, que termina el
                    procedimiento en ese punto. Quien la ejecuta desde la ventana Inmediato ya no ve un
                    número de error sino una frase que le dice qué corregir. A juicio del docente, esta es la defensa que se
                    prefiere siempre que el error se pueda prever.
                </p>

                <h3>Atrapar: On Error GoTo</h3>
                <p>
                    A juicio del docente, no todo se puede prever con
                    un <span className="inline-code">If</span>. Para lo
                    demás, <span className="inline-code">On Error GoTo</span> seguido de una etiqueta
                    habilita una rutina de control de errores que empieza en esa línea: si se produce un
                    error en tiempo de ejecución, el control se transfiere
                    allí <Cita k="microsoft2018onerror" loc="Sintaxis" />. Lo que pasó queda en el
                    objeto <span className="inline-code">Err</span>, que contiene información sobre los
                    errores en tiempo de ejecución <Cita k="microsoft2018err" loc="párrafo inicial" />:
                    cuando se produce uno, sus propiedades se llenan con la información que lo
                    identifica <Cita k="microsoft2018err" loc="Observaciones" />. Esta rutina usa dos de
                    ellas, <span className="inline-code">Number</span> y <span className="inline-code">Description</span>,
                    y para verlo funcionar repite el plazo en cero, aunque ese caso ya lo resolvía la
                    guardia:
                </p>

                <CodeBlock lang="vba" plegable={false} code={CUOTA_CONTROLADOR.vba} />

                <p>
                    Hay dos líneas que no calculan nada y sostienen la estructura.
                    {' '}<span className="inline-code">Fallo:</span>, con sus dos puntos, es la etiqueta a la
                    que salta la ejecución. Y el <span className="inline-code">Exit Sub</span> de antes
                    de la etiqueta evita que el código de control de errores se ejecute cuando no hubo
                    ningún error <Cita k="microsoft2018onerror" loc="Observaciones" />: sin él, una rutina
                    que terminara bien seguiría de largo y ejecutaría también la línea del controlador.
                </p>
                <p>
                    El mismo esquema responde la pregunta que el capítulo 5 dejó abierta al validar un
                    monto: qué pasa si lo digitado no es un número.
                </p>

                <CodeBlock lang="vba" plegable={false} code={ENTRADA_INVALIDA.vba} />

                <p>
                    <span className="inline-code">CCur</span> no pudo convertir el texto y produjo el error
                    13. Sin el controlador, quien digitó «dos millones» habría visto el aviso de Excel;
                    con él, la rutina decide qué decir. Los textos
                    de <span className="inline-code">Err.Description</span> salieron en inglés, el idioma
                    del Excel con que se ejecutó este capítulo. Aquí se escriben el número y la descripción
                    para mostrar el objeto <span className="inline-code">Err</span>; a juicio del docente,
                    en un libro que va a usar otra persona el mensaje se redacta para ella y se pone donde
                    ella mira.
                </p>

                <h3>On Error Resume Next: el error que nadie ve</h3>
                <p>
                    Hay otra forma de <span className="inline-code">On Error</span>, y a juicio del
                    docente conviene reconocerla en macros ajenas.
                    {' '}<span className="inline-code">On Error Resume Next</span> especifica que, cuando se
                    produce un error en tiempo de ejecución, el control pasa a la instrucción
                    inmediatamente posterior a la que lo produjo, y la ejecución
                    sigue <Cita k="microsoft2018onerror" loc="Sintaxis" />. No hay aviso ni salto: la
                    rutina continúa como si nada.
                </p>

                <CodeBlock lang="vba" plegable={false} code={RESUME_NEXT.vba} />

                <p>
                    La última línea, <span className="inline-code">On Error GoTo 0</span>, deshabilita
                    el controlador de errores del procedimiento <Cita k="microsoft2018onerror" loc="Sintaxis" />.
                    Lo demás es lo que importa. La división falló, <span className="inline-code">cuota</span> se quedó con el 0 con
                    que nació y la rutina lo escribió como si fuera un resultado. El error quedó
                    registrado, pero solo lo ve quien consulta el
                    objeto <span className="inline-code">Err</span>, y esta rutina lo consultó porque
                    se escribió para mostrarlo. A juicio del docente, en una rutina de cálculo esta forma
                    convierte un error de ejecución, que avisa, en uno de lógica, que no avisa; fuera de
                    esta demostración, las rutinas de este curso no la usan. La documentación la
                    recomienda, en lugar de <span className="inline-code">On Error GoTo</span>, para otro
                    caso: el acceso a objetos <Cita k="microsoft2018onerror" loc="Sintaxis" />.
                </p>

                    titulo="Dos maneras de no ver el aviso de Excel"
