        /* ------------------------------------------------------------
           SimuladorVBE — el paso a paso del editor de VBA, sin Excel.

           Reproduce lo que se ve al ejecutar un procedimiento con «Paso a
           paso por instrucciones»: la línea resaltada es la que está POR
           ejecutarse, no la que se acaba de ejecutar, y la ventana Locales
           muestra las variables con el valor que tienen en ese momento.
           Es la diferencia con el `Trazador` de LP-CORE, que resalta lo ya
           hecho: aquí manda lo que hace el editor.

           Los `pasos` no se escriben a mano: se copian de recorrer la
           rutina en Excel. Cada uno dice en qué línea se detuvo el editor
           (`linea`, contada desde 1 sobre `codigo`), qué mostraba Locales
           (`locales`) y, si ya había salida, qué había en Inmediato
           (`inmediato`, que se hereda del paso anterior si no se da).
        ------------------------------------------------------------ */
        const SimuladorVBE = ({ titulo = 'Paso a paso en el editor', enunciado, modulo = 'Módulo1', codigo, variables, pasos, nota }) => {
            const total = pasos.length;
            // 0: sin empezar · 1..total: detenido antes de pasos[i-1] · total+1: terminó
            const [i, setI] = useState(0);
            const lineas = codigo.split('\n');
            const enCurso = i >= 1 && i <= total;
            const paso = enCurso ? pasos[i - 1] : null;
            const previo = i >= 2 && i <= total ? pasos[i - 2] : null;

            let inmediato = [];
            for (let k = 0; k < Math.min(i, total); k++) if (pasos[k].inmediato) inmediato = pasos[k].inmediato;

            const ir = (n) => setI(Math.max(0, Math.min(total + 1, n)));
            const teclado = (e) => {
                if (e.key === 'F8' || e.key === 'ArrowRight') { e.preventDefault(); ir(i + 1); }
                else if (e.key === 'ArrowLeft') { e.preventDefault(); ir(i - 1); }
                else if (e.key === 'Home') { e.preventDefault(); ir(0); }
            };

            const estado = i === 0 ? 'Sin ejecutar. El primer paso entra al procedimiento.'
                : i > total ? 'El procedimiento terminó: ya no hay línea resaltada.'
                    : `Detenido en la línea ${paso.linea}, que todavía no se ha ejecutado: ${lineas[paso.linea - 1].trim()}`;

            return (
                <div className="my-6 rounded-2xl border-2 border-primary/20 bg-white p-4 sm:p-5 shadow-sm not-prose">
                    <div className="flex flex-wrap items-center gap-2 mb-2">
                        <span className="lp-gradient text-white p-2 rounded-lg"><i className="fas fa-bug"></i></span>
                        <h4 className="text-base font-bold text-primary" style={{ margin: 0 }}>{titulo}</h4>
                        <span className="ml-auto text-[0.65rem] uppercase tracking-wider font-bold text-white bg-teal rounded px-2 py-0.5">Simulador</span>
                    </div>
                    {enunciado && <div className="text-[0.95rem] text-gray-700 mb-3">{enunciado}</div>}

                    <div tabIndex={0} onKeyDown={teclado} role="group"
                        aria-label={`${titulo}. Con F8 o la flecha derecha se avanza un paso; con la flecha izquierda se retrocede.`}
                        className="rounded-xl outline-none focus:ring-2 focus:ring-secondary/60">
                        <div className="grid grid-cols-1 lg:grid-cols-5 gap-3">
                            <div className="lg:col-span-3 rounded-lg border border-gray-300 overflow-hidden">
                                <div className="bg-gray-200 text-gray-700 text-xs font-semibold px-3 py-1.5">{modulo} (Código)</div>
                                <div className="overflow-x-auto bg-white">
                                    <div className="min-w-max py-1" style={{ fontFamily: "'Fira Code', monospace", fontSize: '0.8rem', lineHeight: 1.6 }}>
                                        {lineas.map((l, k) => {
                                            const activa = enCurso && paso.linea === k + 1;
                                            return (
                                                <div key={k} className="flex" style={activa ? { background: '#FFFF00' } : undefined}
                                                    {...(activa ? { 'aria-current': 'step' } : {})}>
                                                    <span className="shrink-0 text-center select-none" style={{ width: '1.5rem', color: '#B45309' }} aria-hidden="true">{activa ? '➔' : ''}</span>
                                                    <span className="whitespace-pre pr-4" style={{ color: '#0F172A' }}>{l || ' '}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>

                            <div className="lg:col-span-2 rounded-lg border border-gray-300 overflow-hidden">
                                <div className="bg-gray-200 text-gray-700 text-xs font-semibold px-3 py-1.5">Locales</div>
                                <div className="overflow-x-auto">
                                    {/* fuente-ok: la ventana Locales del simulador; su <Fuente> llega en `nota`, debajo del componente */}
                                    <table className="w-full text-sm" style={{ margin: 0 }}>
                                        <thead>
                                            <tr className="text-left text-xs text-gray-600 bg-gray-50">
                                                <th className="px-3 py-1.5 font-semibold">Expresión</th>
                                                <th className="px-3 py-1.5 font-semibold">Valor</th>
                                                <th className="px-3 py-1.5 font-semibold">Tipo</th>
                                            </tr>
                                        </thead>
                                        <tbody style={{ fontFamily: "'Fira Code', monospace", fontSize: '0.8rem' }}>
                                            {enCurso ? variables.map(v => {
                                                const valor = paso.locales[v.nombre];
                                                const cambio = previo && previo.locales[v.nombre] !== valor;
                                                return (
                                                    <tr key={v.nombre} className="border-t border-gray-100" style={cambio ? { background: '#CCFBF1' } : undefined}>
                                                        <td className="px-3 py-1.5">{v.nombre}</td>
                                                        <td className="px-3 py-1.5 whitespace-nowrap">{valor}{cambio && <span className="sr-only"> (cambió en este paso)</span>}</td>
                                                        <td className="px-3 py-1.5 text-gray-600">{v.tipo}</td>
                                                    </tr>
                                                );
                                            }) : (
                                                <tr className="border-t border-gray-100">
                                                    <td colSpan={3} className="px-3 py-3 text-gray-500" style={{ fontFamily: 'Inter, system-ui, sans-serif' }}>
                                                        {i === 0 ? 'Nada que mostrar: el procedimiento no ha empezado.' : 'Nada que mostrar: el procedimiento terminó.'}
                                                    </td>
                                                </tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <div className="mt-3 rounded-lg border border-gray-300 overflow-hidden">
                            <div className="bg-gray-200 text-gray-700 text-xs font-semibold px-3 py-1.5">Inmediato</div>
                            <div className="overflow-x-auto bg-white">
                                <pre className="px-3 py-2 min-w-max" style={{ margin: 0, minHeight: '2.4rem', background: 'transparent', color: '#0F172A', fontFamily: "'Fira Code', monospace", fontSize: '0.8rem' }}>{inmediato.join('\n')}</pre>
                            </div>
                        </div>
                    </div>

                    <p className="text-sm text-gray-700 mt-3 mb-2" role="status" aria-live="polite">
                        <strong>Paso {Math.min(i, total)} de {total}.</strong> {estado}
                    </p>

                    <div className="flex flex-wrap gap-2">
                        <button type="button" onClick={() => ir(i + 1)} disabled={i > total}
                            className="px-4 py-2 rounded-lg bg-primary text-white text-sm font-semibold disabled:opacity-40">
                            <i className="fas fa-shoe-prints mr-2" aria-hidden="true"></i>Paso a paso
                        </button>
                        <button type="button" onClick={() => ir(i - 1)} disabled={i === 0}
                            className="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 text-sm font-semibold disabled:opacity-40">
                            Paso anterior
                        </button>
                        <button type="button" onClick={() => ir(0)} disabled={i === 0}
                            className="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 text-sm font-semibold disabled:opacity-40">
                            Restablecer
                        </button>
                    </div>
                    <p className="text-xs text-gray-500 mt-2">
                        «Paso anterior» es una ayuda de este simulador: el editor de VBA no retrocede.
                    </p>
                    {nota && <div className="text-sm text-gray-700 mt-3">{nota}</div>}
                </div>
            );
        };

        /* ------------------------------------------------------------
           MapaObjetosExcel — de la aplicación a la celda.

           Cuatro cajas, una dentro de otra. Al elegir una se ve cómo se

                            className="w-full text-left rounded-lg px-2 py-1.5 outline-none focus:ring-2 focus:ring-secondary/60">

                        <span className="lp-gradient text-white p-2 rounded-lg"><i className="fas fa-sitemap"></i></span>
                        <h4 className="text-base font-bold text-primary" style={{ margin: 0 }}>{titulo}</h4>
                        <span className="ml-auto text-[0.65rem] uppercase tracking-wider font-bold text-white bg-teal rounded px-2 py-0.5">Interactivo</span>
                    </div>
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">

        /* ------------------------------------------------------------
           RendimientoHoja — celda por celda frente a en bloque.

           `filas` son tiempos medidos en Excel, en segundos: la mediana de
           las repeticiones de cada tamaño. La columna «veces» se deriva
           aquí, a la vista. Por debajo de la resolución del reloj de VBA
           (`resolucion`) el tiempo no se dibuja como cero: se dice.
        ------------------------------------------------------------ */
        const RendimientoHoja = ({ id = 'chart-rendimiento-hoja', filas, resolucion, medicion }) => {
            const [modo, setModo] = useState('leer');
            const claves = modo === 'leer' ? ['leerCelda', 'leerBloque'] : ['escribirCelda', 'escribirBloque'];
            const verbo = modo === 'leer' ? 'Leer' : 'Escribir';
            const piso = (x) => Math.max(x, resolucion);
            usePlotly(id, () => [
                { x: filas.map(f => f.n), y: filas.map(f => piso(f[claves[0]])), name: 'celda por celda', mode: 'lines+markers', line: { color: '#B45309', width: 2.5 }, marker: { size: 8 } },
                { x: filas.map(f => f.n), y: filas.map(f => piso(f[claves[1]])), name: 'en bloque', mode: 'lines+markers', line: { color: '#0E7490', width: 2.5 }, marker: { size: 8, symbol: 'square' } },
            ], () => ({
                margin: { l: 56, r: 12, t: 12, b: 44 },
                legend: { orientation: 'h', y: 1.12, x: 0 },
                xaxis: { title: { text: 'celdas', font: { size: 12 } }, tickvals: filas.map(f => f.n), tickformat: ',.0f', automargin: true },
                yaxis: { title: { text: 'segundos', font: { size: 12 }, standoff: 8 }, type: 'log', automargin: true },
                separators: ', ',
                font: { family: 'Inter, system-ui, sans-serif', size: 11 },
            }), [modo]);
            const celda = (x) => x < resolucion ? `menos de ${segundosCO(resolucion)}` : segundosCO(x);
            return (
                <div className="my-6 rounded-2xl border-2 border-primary/20 bg-white p-4 sm:p-5 shadow-sm not-prose">
                    <div className="flex flex-wrap items-center gap-2 mb-3">
                        <span className="lp-gradient text-white p-2 rounded-lg"><i className="fas fa-stopwatch"></i></span>
                        <h4 className="text-base font-bold text-primary" style={{ margin: 0 }}>Celda por celda o en bloque</h4>
                        <span className="ml-auto text-[0.65rem] uppercase tracking-wider font-bold text-white bg-teal rounded px-2 py-0.5">Interactivo</span>
                    </div>
                    <div className="flex flex-wrap gap-2 mb-2" role="group" aria-label="Qué operación se mide">
                        {[['leer', 'Leer de la hoja'], ['escribir', 'Escribir en la hoja']].map(([m, e]) => (
                            <button key={m} type="button" onClick={() => setModo(m)} aria-pressed={modo === m}
                                className={`px-3 py-1.5 rounded-lg text-sm font-semibold border ${modo === m ? 'bg-primary text-white border-primary' : 'bg-white text-gray-700 border-gray-300'}`}>{e}</button>
                        ))}
                    </div>
                    <ChartFrame id={id} height="chart-h-320"
                        caption={`${verbo} n celdas de una columna, de una en una y de una sola vez. El eje vertical es logarítmico: cada marca vale diez veces la anterior.`}
                        fuente={{ propia: true, children: `con los tiempos medidos ${medicion}` }} />
                    <div className="overflow-x-auto rounded-lg border border-gray-200 mt-3">
                        <table className="w-full text-sm" style={{ margin: 0 }}>
                            <thead>
                                <tr className="text-left text-xs text-gray-600 bg-gray-50">
                                    <th className="px-3 py-1.5 font-semibold">Celdas</th>
                                    <th className="px-3 py-1.5 font-semibold">Celda por celda (s)</th>
                                    <th className="px-3 py-1.5 font-semibold">En bloque (s)</th>
                                    <th className="px-3 py-1.5 font-semibold">Veces</th>
                                </tr>
                            </thead>
                            <tbody>
                                {filas.map(f => {
                                    const a = f[claves[0]], b = f[claves[1]];
                                    return (
                                        <tr key={f.n} className="border-t border-gray-100">
                                            <td className="px-3 py-1.5 whitespace-nowrap">{f.n.toLocaleString('es-CO').replace(/\./g, ' ')}</td>
                                            <td className="px-3 py-1.5 whitespace-nowrap">{celda(a)}</td>
                                            <td className="px-3 py-1.5 whitespace-nowrap">{celda(b)}</td>
                                            <td className="px-3 py-1.5 whitespace-nowrap">{b < resolucion ? `más de ${Math.floor(a / resolucion).toLocaleString('es-CO').replace(/\./g, ' ')}` : Math.round(a / b).toLocaleString('es-CO').replace(/\./g, ' ')}</td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                    <Fuente propia>{`con los mismos tiempos de la gráfica; «veces» es el primero dividido entre el segundo`}</Fuente>
                </div>
            );
        };

        /* ============================================================
           DATOS EJECUTADOS — fase 2 del plan de la Tarea 16

           Todo lo que sigue salió de Excel 16.115 para Mac el 2026-11-23,
           con el módulo `fase2.bas` (guardado en el vault, en la ficha del
           capítulo). Nada se calculó a mano: si cambia la rutina, se vuelve
           a recorrer y se copian otra vez.
        ============================================================ */

        // La rutina que el capítulo 5 dejó para recorrer aquí, copiada tal cual.
        const F8_CODIGO = `Sub OtroAcuerdo()
    Dim saldo As Currency, abono As Currency, meses As Integer
    saldo = 1850000
    abono = 500000
    meses = 0
    Do While saldo > 0
        saldo = saldo - abono
        meses = meses + 1
    Loop
    Debug.Print meses, saldo
End Sub`;

        const F8_VARIABLES = [
            { nombre: 'saldo', tipo: 'Currency' },
            { nombre: 'abono', tipo: 'Currency' },
            { nombre: 'meses', tipo: 'Integer' },
        ];

        // Las 23 paradas del editor: [línea de F8_CODIGO, saldo, abono, meses],
        // con los valores escritos como los mostró la ventana Locales. El
        // editor no se detuvo nunca en la línea 2, la del Dim.
        const F8_PARADAS = [
            [1, '0', '0', '0'],
            [3, '0', '0', '0'],
            [4, '1850000', '0', '0'],
            [5, '1850000', '500000', '0'],
            [6, '1850000', '500000', '0'],
            [7, '1850000', '500000', '0'],
            [8, '1350000', '500000', '0'],
            [9, '1350000', '500000', '1'],
            [6, '1350000', '500000', '1'],
            [7, '1350000', '500000', '1'],
            [8, '850000', '500000', '1'],
            [9, '850000', '500000', '2'],
            [6, '850000', '500000', '2'],
            [7, '850000', '500000', '2'],
            [8, '350000', '500000', '2'],
            [9, '350000', '500000', '3'],
            [6, '350000', '500000', '3'],
            [7, '350000', '500000', '3'],
            [8, '-150000', '500000', '3'],
            [9, '-150000', '500000', '4'],
            [6, '-150000', '500000', '4'],
            [10, '-150000', '500000', '4'],
            [11, '-150000', '500000', '4'],
        ];
        // Lo que quedó en Inmediato al ejecutarse la línea 10: se ve desde la
        // parada 23. El 4 lleva un espacio delante y el saldo empieza en la
        // columna 15, la segunda zona de impresión.
        const F8_INMEDIATO = [' 4            -150000 '];
        const F8_PASOS = F8_PARADAS.map(([linea, saldo, abono, meses], k) => ({
            linea, locales: { saldo, abono, meses },
            ...(k === F8_PARADAS.length - 1 ? { inmediato: F8_INMEDIATO } : {}),
        }));

        // Lo que respondió Excel a cada pregunta, con un libro nuevo sin guardar.
        const OBJETOS_NIVELES = [
            { rotulo: 'La aplicación', nombre: 'Application', camino: 'Application',
              resultado: [['Application.Name', 'Microsoft Excel'], ['Application.Version', '16.115'], ['TypeName(Application)', 'Application']] },
            { rotulo: 'El libro', nombre: 'Workbook', camino: 'ActiveWorkbook',
              resultado: [['TypeName(ActiveWorkbook)', 'Workbook'], ['ActiveWorkbook.Name', 'Book1'], ['TypeName(ActiveWorkbook.Parent)', 'Application'], ['Worksheets.Count', '1']] },
            { rotulo: 'La hoja', nombre: 'Worksheet', camino: 'ActiveSheet',

                <h3>Currency: el dinero, con cuatro decimales</h3>
                <p>
                    La sección 4 del capítulo 1 justificó por qué un importe no se guarda en punto
                    flotante, y anunció que aquí se declararía <span className="inline-code">As Currency</span>.

                    variable <span className="inline-code">Currency</span> se almacena como un número de 64

                    con 15 dígitos a la izquierda del separador decimal y 4 a la

                <h3>Cuando el número no cabe: el error 6</h3>
                <p>
                    Cada tipo tiene un rango, y el de <span className="inline-code">Integer</span> es
                    corto: sus variables se almacenan como números de 16 bits, entre −32 768 y
                    32 767 <Cita k="microsoft2018integer" loc="párrafo inicial" />. Cuando el resultado de

                    6 <Cita k="microsoft2017desbordamiento" loc="título, párrafo inicial y primera causa" />. La
                    sección 6 del capítulo 5 llegó a ese error con un contador que pasaba de 32 767.
                </p>

                    producto <span className="inline-code">2000 * 365</span> <Cita k="microsoft2017desbordamiento" loc="tercera causa" />.

            // se ignora y manda `h-screen`.
            return (
                <div className="flex h-screen overflow-hidden relative" style={{ height: '100dvh' }}>
                    <button onClick={() => setSidebarOpen(p => !p)}
                        className="fixed top-2 lg:top-4 left-4 z-50 p-2.5 rounded-full shadow-lg text-white transition-all hover:scale-110 lp-gradient"
                        title={sidebarOpen ? 'Ocultar menú' : 'Mostrar menú'} aria-label={sidebarOpen ? 'Ocultar menú' : 'Mostrar menú'}>
                        <i className={`fas ${sidebarOpen ? 'fa-times' : 'fa-bars'} text-sm`}></i>
                    </button>

                    {sidebarOpen && <div className="fixed inset-0 bg-black/20 z-30 lg:hidden" onClick={() => setSidebarOpen(false)} />}

                    <aside className="flex-shrink-0 overflow-y-auto z-40 flex flex-col lp-header"
                        style={{
                            width: sidebarOpen ? '18rem' : '0', minWidth: sidebarOpen ? '18rem' : '0',
                            opacity: sidebarOpen ? 1 : 0, transition: 'width 0.3s ease, min-width 0.3s ease, opacity 0.25s ease',
                            overflow: sidebarOpen ? 'visible auto' : 'hidden'
                        }}>
                        <div className="p-6 pt-16 border-b border-white/10">
                            {/* contraste-ok: el gold va sobre el navy de `lp-header`, no sobre el fondo claro */}
                            <p className="text-[0.65rem] uppercase tracking-widest text-gold font-bold">Universidad Santo Tomás</p>
                            <h1 className="text-white font-bold text-lg tracking-tight mt-1">
                                {CONFIG.asignatura}
                            </h1>
                            <p className="text-xs text-white/60 mt-1">
                                Capítulo {CONFIG.numero} · <span className="text-secondary-claro font-semibold">{CONFIG.titulo}</span>
                            </p>
                        </div>

                        <nav className="p-4 space-y-2 flex-1">
                            {curriculum.map((lesson, idx) => (
                                <button key={lesson.id} onClick={() => irA(idx)}
                                    className={`w-full flex items-start gap-3 px-3 py-3 text-sm rounded-lg transition-all text-left ${safeIndex === idx ? 'text-white shadow-lg lp-gradient' : 'text-white/60 hover:text-white hover:bg-white/10'}`}>
                                    <span className="flex-shrink-0 mt-0.5" style={{ width: 18, height: 18 }}>{renderIcon(lesson.icon, 18)}</span>
                                    <span className="font-medium leading-tight break-words">{lesson.title}</span>
                                </button>
                            ))}
                        </nav>

                        <div className="p-4 text-[10px] text-white/70 border-t border-white/10">
                            <p>{CONFIG.ra} · {CONFIG.horas} horas</p>
                            <p>Pseudocódigo · Python · R · VBA</p>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col overflow-hidden bg-bg">
                        <div className="h-1.5 bg-gray-200 flex-shrink-0">
                            <div className="h-full lp-gradient transition-all duration-500" style={{ width: `${progreso}%` }}></div>
                        </div>

                        {/* Por debajo de `lg` el botón del menú, fijo arriba a la
                            izquierda, flotaba sobre el contenido: al desplazarse tapaba
                            las primeras letras de la línea que pasaba por debajo (visto
                            en un iPhone el 2026-11-15). Esta barra no se desplaza y es
                            opaca: el botón queda sobre ella y el texto pasa por debajo
                            de la barra, no del botón. Lleva «Lección N de M», que así
                            sigue a la vista. Desde `lg` no hace falta: el relleno del
                            contenido deja libre el sitio del botón. */}
                        <div id="barra-movil" className="lg:hidden flex-shrink-0 h-12 flex items-center pl-16 pr-4 bg-bg border-b border-gray-200">
                            <span className="text-xs font-bold tracking-wider text-secondary-texto uppercase">
                                Lección {safeIndex + 1} de {curriculum.length} · {progreso} %
                            </span>
                        </div>

                        <div id="contenido-scroll" className="flex-1 overflow-y-auto overscroll-contain p-6 lg:p-12">
                            <div className="max-w-4xl mx-auto w-full">
                                <div className="mb-6 flex items-center justify-end lg:justify-between flex-wrap gap-3">
                                    <span className="hidden lg:inline text-xs font-bold tracking-wider text-secondary-texto uppercase">
                                        Lección {safeIndex + 1} de {curriculum.length} · {progreso} %
                                    </span>
                                    <div className="flex gap-2">
                                        <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full hover:bg-gray-100 disabled:opacity-30 transition-colors text-sm font-medium text-navy">
                                            {renderIcon('ChevronLeft', 18)} Anterior
                                        </button>
                                        <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full text-white lp-gradient disabled:opacity-30 transition-colors text-sm font-medium">
                                            Siguiente {renderIcon('ChevronRight', 18)}
                                        </button>
                                    </div>
                                </div>

                                <SectionHeader title={activeLesson.title} icon={Icons[activeLesson.icon]} />

                                {safeIndex === 0 && (
                                    <div className="mb-8 text-center bg-white p-7 rounded-2xl shadow-sm border border-gray-100">
                                        <p className="text-xs uppercase tracking-widest text-secondary-texto font-bold mb-2">
                                            Capítulo {CONFIG.numero} · {CONFIG.horas} horas · {CONFIG.ra}
                                        </p>
                                        <h1 className="text-2xl font-bold text-primary mb-2">{CONFIG.titulo}</h1>
                                        <p className="text-gray-600 font-light">{CONFIG.subtitulo}</p>
                                        <div className="flex justify-center flex-wrap gap-2 mt-4 text-xs">
                                            {CONFIG.temas.map(t => (
                                                <span key={t} className="px-3 py-1 rounded-full bg-primary/10 text-primary">{t}</span>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="animate-fade-in" key={activeLesson.id}>
                                    <ActiveComponent />
                                </div>

                                <div className="mt-12 flex items-center justify-between gap-3">
                                    <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-gray-300 bg-white hover:bg-gray-50 disabled:opacity-30 text-sm font-medium text-navy">
                                        {renderIcon('ChevronLeft', 18)}
                                        <span className="hidden sm:inline">{safeIndex > 0 ? curriculum[safeIndex - 1].title : 'Inicio'}</span>
                                        <span className="sm:hidden">Anterior</span>
                                    </button>
                                    <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-white lp-gradient hover:opacity-90 disabled:opacity-30 text-sm font-medium">
                                        <span className="hidden sm:inline">{safeIndex < curriculum.length - 1 ? curriculum[safeIndex + 1].title : 'Fin'}</span>
                                        <span className="sm:hidden">Siguiente</span>
                                        {renderIcon('ChevronRight', 18)}
                                    </button>
                                </div>

                                <footer className="mt-16 pt-8 border-t border-gray-200">
                                    <div className="lp-header rounded-xl p-6 text-center">
                                        <p className="text-white font-medium text-sm">
                                            <strong>Capítulo {CONFIG.numero} · {CONFIG.titulo}</strong>
                                        </p>
                                        <p className="text-xs mt-1 text-white italic">
                                            {CONFIG.lema}
                                        </p>
                                        <p className="text-xs mt-2 text-white/70">
                                            Universidad Santo Tomás · {CONFIG.asignatura}
                                        </p>
                                        <p className="text-xs text-white/70">
                                            Docente y diseño del material: {CONFIG.docente}
                                        </p>
                                        <p className="text-[10px] mt-2 text-white/50">
                                            {CONFIG.notaPie}
                                        </p>
                                    </div>
                                </footer>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
