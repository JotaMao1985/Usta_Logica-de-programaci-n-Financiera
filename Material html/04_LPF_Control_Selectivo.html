    <!-- Prism.js — resaltado de sintaxis con gramáticas oficiales.
         `Prism.manual = true` DEBE ir antes de cargar el núcleo: si no, Prism
         recorre el documento al cargar y aquí el contenido lo pinta React
         después, de modo que ese recorrido solo gasta tiempo.
         El pseudocódigo no tiene gramática oficial: se registra en LP-CORE.

         Cada componente corresponde a una clave de `GRAMATICA`, y el núcleo NO
         trae ninguno de ellos: solo markup, css, clike y javascript. Una clave
         sin su componente no da error, solo deja el bloque sin resaltar, así
         que `ensamblar.py` compara ambas listas y falla si falta alguno.

         Los cuatro lenguajes del curso son pseudocódigo, Python, R y VBA; los
         demás los usa el material de Python para APIs, que comparte esta
         librería. -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
    <script>window.Prism = window.Prism || {}; window.Prism.manual = true;</script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-toml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>

    <script>

        rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'Helvetica Neue', 'Helvetica', 'Arial', 'sans-serif'],
                    },
                    colors: {
                        primary: '#3D008D',
                        secondary: '#ED1E79',
                        // El rosa institucional como TEXTO no llega a 4,5:1: da
                        // 3,96 sobre el fondo de página y 3,37 sobre el degradado
                        // de la barra. Estos dos tonos son el mismo rosa movido
                        // lo justo para pasar, y no tocan la marca: `secondary`
                        // sigue mandando en degradados, bordes e iconos.
                        'secondary-texto': '#D81B6A',
                        'secondary-claro': '#F871A4',
                        navy: '#001A4D',
                        gold: '#FDB913',
                        teal: '#0E7490',
                        bg: '#F8FAFC',
                        surface: '#FFFFFF',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #F8FAFC;
            color: #1E293B;
            scroll-behavior: smooth;
        }

        code,
        pre {
            font-family: 'Fira Code', monospace;
        }

        .lp-gradient {
            background: linear-gradient(140deg, #3D008D 0%, #D81B6A 100%);
        }

        .lp-header {
            background: linear-gradient(180deg, #001A4D 0%, #002868 100%);
        }

        .lp-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }

        .lp-card:hover {
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
            transform: translateY(-4px);
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #3D008D, #ED1E79);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #4A00A8, #FF2D8A);
        }

        .code-scroll::-webkit-scrollbar {
            height: 8px;
        }

        .code-scroll::-webkit-scrollbar-track {
            background: #2d2d2d;
        }

        .code-scroll::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #3D008D, #ED1E79);

        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        button:focus-visible,
        a:focus-visible {
            outline: 2px solid #ED1E79;
            outline-offset: 2px;
        }

        .inline-code {
            background: #F1F5F9;
            color: #0F172A;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-size: 0.88em;
            font-family: 'Fira Code', monospace;
        }

        .chart-h-320 {
            height: 320px;
        }

        .chart-h-360 {
            height: 360px;
        }

        .chart-h-420 {
            height: 420px;
        }

        .prose-lp p {
            margin-bottom: 1rem;
            line-height: 1.75;
        }

        .prose-lp h3 {
            color: #D81B6A;
            font-weight: 600;
            font-size: 1.2rem;
            margin: 1.8rem 0 0.6rem;
        }

        .prose-lp h4 {
            color: #001A4D;
            font-weight: 600;
            font-size: 1.05rem;
            margin: 1.4rem 0 0.4rem;
        }

        .prose-lp ul {
            list-style: disc;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }

        .prose-lp ol {
            list-style: decimal;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }

        .prose-lp li {
            margin-bottom: 0.35rem;
            line-height: 1.65;
        }

        .prose-lp strong {
            color: #0F172A;
        }

        .prose-lp table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            margin: 1rem 0;
        }

        .prose-lp th {
            background: #F5F0FA;
            color: #001A4D;
            text-align: left;
            padding: 0.6rem 0.8rem;
            border: 1px solid #E2E8F0;
        }

        .prose-lp td {
            padding: 0.6rem 0.8rem;
            border: 1px solid #E2E8F0;
            vertical-align: top;
        }

        .eq-block {

            border: 1px solid rgba(61, 0, 141, 0.12);
            border-radius: 12px;
            padding: 0.6rem 1rem;
            overflow-x: auto;
        }

        .lp-range {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 999px;
            background: #EADCF8;
            outline: none;
        }

        .lp-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ED1E79;
            border: 2px solid #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .25);
            cursor: pointer;
        }

        mjx-container svg {
            display: inline-block;
        }

        /* ============================================================
           BLOQUES DE CÓDIGO — patrón tomado del material de Diseño de
           Experimentos (cap. 1, «El diseño, escrito en código»).
        ============================================================ */
        .lp-code-wrapper {
            position: relative;
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.12);
        }

        /* La pestaña activa se apoya sobre el bloque: sin esquina superior
           izquierda, para que se lea como una carpeta y no como dos cajas. */
        .lp-code-wrapper.con-pestanas {
            border-top-left-radius: 0;
        }

        .lp-code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            border-bottom: 1px solid #334155;
        }

        .lp-code-title {
            font-size: 0.72rem;
            font-weight: 600;
            color: #94A3B8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .lp-code-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #CBD5E1;
            padding: 0.35rem 0.7rem;
            border-radius: 0.375rem;
            font-size: 0.72rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .lp-code-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .lp-code-btn.copiado {
            background: rgba(34, 197, 94, 0.3);
            color: #4ADE80;
        }

        .lp-code-pre {
            background: #1E293B;
            color: #F3F4F6;
            padding: 1.5rem;
            margin: 0;
            overflow-x: auto;
            font-family: 'Fira Code', monospace;
            font-size: 0.875rem;
            line-height: 1.625;
            max-height: 30rem;
            overflow-y: auto;
            transition: max-height 0.3s ease;
        }

        /* Prism nombra sus tokens con palabras que Tailwind también usa como
           utilidades, y gana la que tenga más peso. `table` es la que muerde:
           la gramática de TOML marca `[pytest]` como `token table`, Tailwind
           le aplica `display: table` y la cabecera de sección se parte en tres
           líneas. Dentro de un bloque de código un token es siempre texto en
           línea, así que se fija aquí y la colisión deja de importar. */
        .lp-code-pre .token {
            display: inline;
        }

        .lp-code-pre.plegado {
            max-height: 9.5rem;
            overflow: hidden;
        }

        .lp-code-pre.plegado::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 3.75rem;
            background: linear-gradient(transparent, #1E293B);
            pointer-events: none;
        }

        /* Pestañas de lenguaje, en forma de carpeta. */
        .lp-tab {
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.45rem 1.1rem;
            border-radius: 0.5rem 0.5rem 0 0;
            background: #E2E8F0;
            color: #475569;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .lp-tab:hover {
            background: #CBD5E1;
            color: #0F172A;
        }

        .lp-tab.activa {
            background: linear-gradient(135deg, #3D008D 0%, #D81B6A 100%);
            color: #fff;
        }

        /* Líneas de SALIDA dentro del bloque (`//>`, `#>`, `'>`).
           Prism las tokeniza como comentario; aquí se les da color propio
           para distinguir lo que escribió el docente de lo que respondió
           la máquina. */
        .lp-salida,
        .lp-salida .token {
            color: #7DD3FC !important;
            font-style: normal !important;
        }

        .lp-salida {
            display: inline-block;
            width: 100%;
            background: rgba(125, 211, 252, 0.07);
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">

        /* === LP-CORE INICIO — no editar a mano: se genera con ensamblar.py === */
        const { useState, useEffect, useRef } = React;

        const typesetMath = (retries = 25) => {
            if (window.MathJax && window.MathJax.typesetPromise) {
                try { window.MathJax.typesetClear && window.MathJax.typesetClear(); } catch (e) { }
                window.MathJax.typesetPromise().catch(() => { });
            } else if (retries > 0) {
                setTimeout(() => typesetMath(retries - 1), 200);
            }
        };

        const useTypeset = (ref, deps) => {
            useEffect(() => {
                const t = setTimeout(() => {
                    if (ref.current && window.MathJax && window.MathJax.typesetPromise) {
                        window.MathJax.typesetPromise([ref.current]).catch(() => { });
                    }
                }, 40);
                return () => clearTimeout(t);
            }, deps);
        };

        /* ============================================================
           ICONOS SVG
        ============================================================ */
        const Icons = {
            BookOpen: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                </svg>
            ),
            Binary: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <rect x="2" y="2" width="20" height="20" rx="2" />
                    <line x1="6" y1="7" x2="10" y2="7" /><line x1="8" y1="5" x2="8" y2="9" />
                    <line x1="14" y1="7" x2="18" y2="7" />
                    <line x1="6" y1="13" x2="10" y2="13" /><line x1="6" y1="17" x2="10" y2="17" /><line x1="14" y1="17" x2="18" y2="17" />
                    <line x1="14" y1="13" x2="18" y2="13" /><line x1="16" y1="11" x2="16" y2="15" />
                </svg>
            ),
            Cpu: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <rect x="4" y="4" width="16" height="16" rx="2" />
                    <rect x="9" y="9" width="6" height="6" />
                    <path d="M9 2v2" /><path d="M15 2v2" /><path d="M9 20v2" /><path d="M15 20v2" />
                    <path d="M2 9h2" /><path d="M2 15h2" /><path d="M20 9h2" /><path d="M20 15h2" />
                </svg>
            ),
            Calculator: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <rect x="4" y="2" width="16" height="20" rx="2" />
                    <line x1="8" y1="6" x2="16" y2="6" /><line x1="8" y1="10" x2="8" y2="14" />
                    <line x1="12" y1="10" x2="12" y2="14" /><line x1="16" y1="10" x2="16" y2="14" />
                    <line x1="8" y1="18" x2="16" y2="18" />
                </svg>
            ),
            Award: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <circle cx="12" cy="8" r="7"></circle>
                    <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline>
                </svg>
            ),
            ChevronLeft: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            ),
            ChevronRight: ({ size = 24, className = "" }) => (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            ),
        };

        const renderIcon = (iconName, size = 20) => {
            const Icon = Icons[iconName];
            return Icon ? <Icon size={size} /> : null;
        };
        const Box = ({ type = 'info', label, children }) => {
            const styles = {
                info: { border: '#3D008D', bg: '#F5F0FA', label: '#3D008D', icon: 'fa-circle-info' },
                tip: { border: '#15803D', bg: '#F0FDF4', label: '#15803D', icon: 'fa-lightbulb' },
                warn: { border: '#B45309', bg: '#FFFBEB', label: '#B45309', icon: 'fa-triangle-exclamation' },
                danger: { border: '#B91C1C', bg: '#FEF2F2', label: '#B91C1C', icon: 'fa-circle-exclamation' },
            }[type] || { border: '#3D008D', bg: '#F5F0FA', label: '#3D008D', icon: 'fa-circle-info' };
            return (
                <div className="rounded-xl px-5 py-4 my-4 border-l-4" style={{ borderColor: styles.border, background: styles.bg }}>
                    {label && (
                        <span className="inline-flex items-center gap-2 text-[0.7rem] uppercase tracking-wider font-bold rounded mb-2 px-2 py-0.5 text-white" style={{ background: styles.label }}>
                            <i className={`fas ${styles.icon}`}></i>{label}
                        </span>
                    )}
                    <div className="text-gray-700 leading-relaxed text-[0.95rem]">{children}</div>
                </div>
            );
        };

        const CalloutPro = ({ tema = 'info', titulo, subtitulo, icon, children }) => {
            const temas = {
                info: { grad: 'linear-gradient(135deg,#3D008D 0%,#0E7490 100%)', bg: 'rgba(61,0,141,0.05)', border: 'rgba(61,0,141,0.18)', icon: 'fa-circle-info' },
                warn: { grad: 'linear-gradient(135deg,#B45309 0%,#F59E0B 100%)', bg: 'rgba(180,83,9,0.06)', border: 'rgba(180,83,9,0.22)', icon: 'fa-triangle-exclamation' },
                gold: { grad: 'linear-gradient(135deg,#ED1E79 0%,#FF2D8A 100%)', bg: 'rgba(240,165,0,0.06)', border: 'rgba(240,165,0,0.22)', icon: 'fa-coins' },
            };
            const t = temas[tema] || temas.info;
            return (
                <div className="my-6 rounded-2xl overflow-hidden shadow-md border bg-white not-prose" style={{ borderColor: t.border }}>
                    <div className="px-5 py-3 flex items-center gap-3" style={{ background: t.grad }}>
                        <span className="bg-white/20 rounded-lg flex items-center justify-center flex-shrink-0" style={{ width: 36, height: 36 }}>
                            <i className={`fas ${icon || t.icon} text-white text-lg`}></i>
                        </span>
                        <div>
                            <div className="text-white font-bold text-base leading-tight">{titulo}</div>
                            {subtitulo && <div className="text-white text-xs">{subtitulo}</div>}
                        </div>
                    </div>
                    <div className="px-5 py-4 text-[0.95rem] text-gray-700 leading-relaxed" style={{ background: t.bg }}>
                        {children}
                    </div>
                </div>
            );
        };

        const Eq = ({ children }) => (
            <div className="eq-block my-4 text-center">{children}</div>
        );

        const SectionHeader = ({ title, icon: Icon }) => (
            <div className="flex items-center gap-3 mb-5 border-b border-gray-200 pb-3">
                <div className="lp-gradient p-2.5 rounded-xl shadow-md text-white">
                    {Icon && <Icon size={24} />}
                </div>
                <h2 className="text-2xl font-bold text-gray-900">{title}</h2>
            </div>
        );

        const Pipeline = ({ steps }) => (
            <div className="flex items-stretch flex-wrap gap-2 my-6 justify-between">
                {steps.map((s, i) => (
                    <React.Fragment key={i}>
                        <div className="flex-1 min-w-[140px] bg-white border border-gray-200 rounded-xl px-3 py-3 text-center text-sm shadow-sm" style={{ borderTop: '4px solid #3D008D' }}>
                            <span className="inline-block w-6 h-6 leading-6 rounded-full text-white font-bold text-xs mb-1" style={{ background: '#3D008D' }}>{s.num}</span>
                            <span className="block font-semibold text-navy mb-1">{s.title}</span>
                            <span className="text-gray-600">{s.desc}</span>
                        </div>
                        {i < steps.length - 1 && <div className="self-center text-secondary font-bold text-xl hidden md:block">→</div>}
                    </React.Fragment>
                ))}
            </div>
        );

        const Tabs = ({ tabs }) => {
            const [active, setActive] = useState(0);
            const contentRef = useRef(null);
            useTypeset(contentRef, [active]);
            return (
                <div className="my-5">
                    <div className="flex flex-wrap gap-1 border-b border-gray-200">
                        {tabs.map((t, i) => (
                            <button key={i} onClick={() => setActive(i)}
                                className={`px-4 py-2 text-sm font-semibold rounded-t-lg transition-colors ${active === i ? 'text-primary border-b-2 border-secondary bg-white' : 'text-gray-500 hover:text-primary'}`}>
                                {t.label}
                            </button>
                        ))}
                    </div>
                    <div ref={contentRef} className="p-4 bg-white border border-t-0 border-gray-200 rounded-b-lg animate-fade-in text-[0.95rem] text-gray-700">
                        <div key={active}>{tabs[active].content}</div>
                    </div>
                </div>

        /* ============================================================
           RESALTADO DE SINTAXIS — Prism.js 1.29
           Prism trae gramáticas oficiales de R, Python y VBA (`visual-basic`,
           con alias `vba`). El pseudocódigo del curso no existe fuera de aquí,
           así que su gramática se registra abajo.

           Toda clave de `GRAMATICA` necesita su componente cargado en el
           `<head>`: el core de Prism solo trae markup, css, clike y javascript.
           Si falta, `resaltar` cae a `escaparHtml` y el bloque sale en gris sin
           avisar de nada. `ensamblar.py` lo comprueba para que ese fallo salte
           al ensamblar y no en el aula.
        ============================================================ */
        if (window.Prism && !Prism.languages.pseudo) {
            Prism.languages.pseudo = {
                // `comment` va primero: si no, el operador `/` se comería el `//`.
                'comment': { pattern: /\/\/.*/, greedy: true },

                'keyword': /\b(?:FinSi|FinMientras|FinPara|FinSegun|FinFuncion|FinProcedimiento|FinRepita|Inicio|Fin|Si|Entonces|SinoSi|Sino|Segun|Caso|DeOtroModo|Mientras|Hacer|Para|Repita|Hasta|Con|Paso|Leer|Escribir|Funcion|Procedimiento|Retornar|Llamar)\b/,
                'builtin': /\b(?:Entero|Real|Cadena|Caracter|Logico|Arreglo|Matriz|Constante|Verdadero|Falso)\b/,
                'function': /\b(?:Y|O|NO|MOD|DIV|abs|raiz|redondear|potencia|longitud)\b/,
                'number': /\b\d+(?:\.\d+)?\b/,
                'operator': /<-|←|>=|<=|<>|[+\-*\/=<>]/,
                'punctuation': /[(),;\[\]]/,
            };
        }

        /* En una sola línea a propósito: partirla dejaría un `};` con ocho
           espacios de sangría, que es el patrón con el que `ensamblar.py` y
           `migrar.py` delimitan los componentes. `docker` y `dockerfile` son
           las dos claves que registra `prism-docker`; se aceptan ambas. */
        const GRAMATICA = { pseudo: 'pseudo', python: 'python', r: 'r', vba: 'visual-basic', shell: 'bash', docker: 'docker', dockerfile: 'docker', yaml: 'yaml', sql: 'sql', toml: 'toml', json: 'json', text: null };

        /* Prefijo de SALIDA por lenguaje: el marcador de comentario del propio
           lenguaje más `>`. Así la salida sigue siendo un comentario válido y
           el bloque copiado se puede ejecutar tal cual. */
        const PREFIJO_SALIDA = { pseudo: '//>', python: '#>', r: '#>', vba: "'>" };

        const escaparHtml = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        /* Marca las líneas de salida sobre el HTML YA resaltado. Prism las
           tokeniza como comentario, y un comentario nunca cruza el salto de
           línea, así que cada línea queda autocontenida y se puede envolver. */
        const marcarSalida = (html, lang) => {
            const pref = PREFIJO_SALIDA[lang];
            if (!pref) return html;
            return html.split('\n').map(linea => {
                const plano = linea.replace(/<[^>]*>/g, '').trimStart();
                return plano.startsWith(pref) ? `<span class="lp-salida">${linea}</span>` : linea;
            }).join('\n');
        };

        const resaltar = (codigo, lang) => {
            const nombre = GRAMATICA[lang];
            const gram = (nombre && window.Prism) ? Prism.languages[nombre] : null;
            const html = gram ? Prism.highlight(codigo, gram, nombre) : escaparHtml(codigo);
            return marcarSalida(html, lang);
