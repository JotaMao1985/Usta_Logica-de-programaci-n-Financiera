                            : <span>Con estos valores las dos coinciden. Siga probando: hay combinaciones donde no.</span>}
                    </div>

                    <div className="overflow-x-auto">
                        <table className="w-full text-sm border-collapse">
                            <caption className="text-xs text-gray-500 text-left mb-1">
                                Las ocho combinaciones posibles. La fila resaltada es la que está activa.
                            </caption>
                            <thead>
                                <tr className="bg-gray-100">
                                    <th scope="col" className="border border-gray-300 px-2 py-1">A</th>
                                    <th scope="col" className="border border-gray-300 px-2 py-1">B</th>
                                    <th scope="col" className="border border-gray-300 px-2 py-1">C</th>
                                    <th scope="col" className="border border-gray-300 px-2 py-1">A O B Y C</th>
                                    <th scope="col" className="border border-gray-300 px-2 py-1">(A O B) Y C</th>
                                    <th scope="col" className="border border-gray-300 px-2 py-1" title="¿Difieren las dos expresiones?">≠</th>
                                </tr>
                            </thead>
                            <tbody>
                                {/* Las dos marcas se COMPONEN. Con un ternario excluyente, la fila
                                    activa borraba el ámbar de «aquí difieren» —y el estado inicial del
                                    componente es justamente una de las dos que difieren, así que el pie
                                    decía «2 de 8» y solo se veía una—. */}
                                {filas.map((f, i) => (
                                    <tr key={i} className={(f.sin !== f.con ? 'bg-[#B45309]/10 ' : '') + (activa(f) ? 'font-bold ring-2 ring-inset ring-secondary' : '')}>
                                        <td className="border border-gray-300 px-2 py-1 text-center font-mono">{vf(f.a)}</td>
                                        <td className="border border-gray-300 px-2 py-1 text-center font-mono">{vf(f.b)}</td>
                                        <td className="border border-gray-300 px-2 py-1 text-center font-mono">{vf(f.c)}</td>
                                        <td className="border border-gray-300 px-2 py-1 text-center font-mono">{vf(f.sin)}</td>
                                        <td className="border border-gray-300 px-2 py-1 text-center font-mono">{vf(f.con)}</td>
                                        <td className="border border-gray-300 px-2 py-1 text-center font-mono font-bold">{f.sin !== f.con ? '≠' : '='}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                    <p className="text-xs text-gray-500 mt-2">
                        Las filas marcadas con <span className="font-mono font-bold">≠</span> son aquellas
                        donde las dos expresiones difieren: <strong>{nDifieren} de 8</strong>. Todas ellas
                        tienen algo en común —el solicitante gana bien y está muy endeudado—, que es
                        exactamente el perfil que un banco no quiere aprobar por descuido de un paréntesis.
                    </p>
                </div>
            );
        };

        /* ------------------------------------------------------------
           ArbolRiesgo — la cascada de decisión, y la pregunta del cliente

           Un estudio de crédito real no es una condición: son cinco, en
           cascada, y la PRIMERA que se cumple decide. Las demás no llegan a
           evaluarse nunca.

           Eso es lo que el componente hace visible, y es lo que sostiene el
           E7 del capítulo: al cliente no se le explica «el sistema dijo que
           no», se le explica CUÁL condición lo rechazó. La respuesta no es
           «todas las que no cumple»: es una sola, la primera, y las
           siguientes ni se miraron.

           Se pinta como una cascada vertical y no como un árbol horizontal:
           un árbol de tres niveles con ocho hojas no cabe en 375 px sin
           desplazamiento lateral, y el desplazamiento lateral es justo lo que
           el punto de control 4 no admite.
        ------------------------------------------------------------ */
        const ArbolRiesgo = () => {
            const OPCIONES = {
                // Cada lista incluye el valor que cae EXACTAMENTE sobre su umbral.
                // Es el caso que ningún bloque de código estático deja probar y el
                // que más defectos produce: de estas cuatro condiciones solo una
                // incluye su frontera —ingreso >= 5000000— y las otras tres la excluyen.
                ingreso: [
                    { v: 0, t: '$ 0 — sin ingreso declarado' },
                    { v: 1200000, t: '$ 1.200.000' },
                    { v: 1500000, t: '$ 1.500.000 — el piso del codeudor, exacto' },
                    { v: 2800000, t: '$ 2.800.000' },
                    { v: 5000000, t: '$ 5.000.000 — el piso preferencial, exacto' },
                    { v: 6500000, t: '$ 6.500.000' },
                ],
                score: [
                    { v: 480, t: '480 — bajo' },
                    { v: 550, t: '550 — el mínimo, exacto' },
                    { v: 660, t: '660 — medio' },
                    { v: 745, t: '745 — alto' },
                ],
                endeud: [
                    { v: 22, t: '22 % — holgado' },
                    { v: 45, t: '45 % — ajustado' },
                    { v: 60, t: '60 % — el tope, exacto' },
                    { v: 68, t: '68 % — comprometido' },
                ],
            };
            const [sol, setSol] = useState({ ingreso: 2800000, score: 660, endeud: 45 });
            const fijar = (k, v) => setSol(p => ({ ...p, [k]: Number(v) }));
            // Las MISMAS cinco reglas, en los dos órdenes. El de producción sube la
            // del ingreso alto al primer lugar; no cambia ni una condición.
            const [orden, setOrden] = useState('comite');

            // La cascada, en el mismo orden en que la evaluaría el programa.
            // `prueba` devuelve si esa condición se cumple; la primera que se
            // cumple decide y corta.
            const REGLAS = [
                {
                    cond: 'score < 550',
                    prueba: (s) => s.score < 550,
                    salida: 'RECHAZADO',
                    tono: 'malo',
                    porque: 'El score está por debajo del mínimo de originación. Es una condición de entrada: no se compensa con ingresos.',
                },
                {
                    cond: 'endeudamiento > 60',
                    prueba: (s) => s.endeud > 60,
                    salida: 'RECHAZADO',
                    tono: 'malo',
                    porque: 'La capacidad de pago ya está comprometida. Un crédito más empeora la cartera del cliente y la del banco.',
                },
                {
                    cond: 'ingreso >= 5000000',
                    prueba: (s) => s.ingreso >= 5000000,
                    salida: 'APROBADO PREFERENCIAL',
                    tono: 'bueno',
                    porque: 'Su ingreso alcanza el tramo preferencial y accede a tasa preferencial. Lo que quede debajo de esta regla ya no se mira.',
                },
                {
                    cond: 'ingreso < 1500000',
                    prueba: (s) => s.ingreso < 1500000,
                    salida: 'APROBADO CON CODEUDOR',
                    tono: 'medio',
                    porque: 'El perfil de riesgo es aceptable, pero el ingreso no sostiene la cuota por sí solo.',
                },
                {
                    cond: 'en cualquier otro caso',
                    prueba: () => true,
                    salida: 'APROBADO ESTANDAR',
                    tono: 'bueno',
                    porque: 'No cae en ninguna causal de rechazo ni alcanza el tramo preferencial.',
                },
            ];

            const ORDEN_PRODUCCION = [2, 0, 1, 3, 4];
            const enProduccion = ORDEN_PRODUCCION.map(i => REGLAS[i]);
            const reglas = orden === 'produccion' ? enProduccion : REGLAS;

            // Se recorre como lo haría la máquina: hasta la primera verdadera.
            const decideCon = (lista) => {
                for (let i = 0; i < lista.length; i++) if (lista[i].prueba(sol)) return i;
                return -1;
            };
            const decidio = decideCon(reglas);
            const fallo = reglas[decidio];
            // Se calculan los dos para poder decir, con este solicitante, si el
            // orden cambia la decisión o si da igual. Con la mayoría da igual: ese
            // es justo el motivo por el que el defecto sobrevive a una revisión.
            const salidaComite = REGLAS[decideCon(REGLAS)].salida;
            const salidaProduccion = enProduccion[decideCon(enProduccion)].salida;
            const ordenImporta = salidaComite !== salidaProduccion;
            const colorTono = { bueno: '#15803D', medio: '#B45309', malo: '#B91C1C' };

            const selector = (clave, etiqueta, opciones) => (
                <label className="block">
                    <span className="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">{etiqueta}</span>
                    <select value={sol[clave]} onChange={(e) => fijar(clave, e.target.value)}
                        className="w-full rounded-lg border-2 border-gray-300 bg-white px-2 py-1.5 font-mono text-sm text-navy focus:border-primary focus:outline-none">
                        {opciones.map(o => <option key={o.v} value={o.v}>{o.t}</option>)}
                    </select>
                </label>
            );

            return (
                <div className="my-6 rounded-2xl border-2 border-primary/20 bg-white p-5 shadow-sm not-prose">
                    <div className="flex items-center gap-2 mb-3">
                        <span className="lp-gradient text-white p-2 rounded-lg"><i className="fas fa-code-branch"></i></span>
                        <h4 className="text-base font-bold text-primary" style={{ margin: 0 }}>Árbol de riesgo crediticio</h4>
                        <span className="ml-auto text-[0.65rem] uppercase tracking-wider font-bold text-white bg-teal rounded px-2 py-0.5">Interactivo</span>
                    </div>

                    <p className="text-[0.95rem] text-gray-700 mb-3">
                        Arme un solicitante y mire la cascada: <strong>decide la primera condición que se
                        cumple</strong>, y las que vienen después no se evalúan nunca. Esa es la respuesta
                        que hay que darle a un cliente que pregunta por qué le dijeron que no.
                    </p>
                    <p className="text-[0.95rem] text-gray-700 mb-3">
                        Pruebe también un solicitante <strong>sin ingreso declarado</strong>: la política no
                        tiene piso por abajo, y eso se ve mejor aquí que leyéndola.
                    </p>
                    <p className="text-[0.95rem] text-gray-700 mb-3">
                        Y cambie después el <strong>orden</strong> de las reglas. Son las mismas cinco, sin
                        tocar una condición: busque un solicitante al que los dos órdenes le den respuestas
                        contrarias. Existe, y no es raro.
                    </p>

                    <div className="flex flex-wrap gap-2 mb-4" role="group" aria-label="Orden de las reglas">
                        {[['comite', 'Orden del comité', 'Los dos filtros de rechazo van primero'],
                          ['produccion', 'Orden que quedó en producción', 'La regla del ingreso alto va primera']].map(([clave, rotulo, pie]) => (
                            <button key={clave} type="button" onClick={() => setOrden(clave)}
                                aria-pressed={orden === clave}
                                className={'text-left rounded-xl border-2 px-3 py-2 transition ' +
                                    (orden === clave ? 'border-primary bg-primary/10' : 'border-gray-300 bg-gray-50')}>
                                <span className="block text-sm font-bold text-navy">{rotulo}</span>
                                <span className="block text-xs text-gray-600">{pie}</span>
                            </button>
                        ))}
                    </div>

                    <div className="grid gap-3 sm:grid-cols-3 mb-4">
                        {selector('ingreso', 'Ingreso mensual', OPCIONES.ingreso)}
                        {selector('score', 'Score de crédito', OPCIONES.score)}
                        {selector('endeud', 'Endeudamiento', OPCIONES.endeud)}
                    </div>

                    <ol className="space-y-2 mb-4" style={{ listStyle: 'none', padding: 0, margin: 0 }}>
                        {reglas.map((r, i) => {
                            const evaluada = i <= decidio;
                            const esLaQueDecide = i === decidio;
                            return (
                                <li key={i}
                                    className={'rounded-xl border-2 px-3 py-2 ' +
                                        (esLaQueDecide ? 'border-primary bg-primary/10'
                                            : evaluada ? 'border-gray-300 bg-gray-50'
                                                : 'border-dashed border-gray-300 bg-white')}>
                                    <div className="flex items-start gap-2">
                                        <span className={'mt-0.5 text-xs font-bold rounded px-1.5 py-0.5 ' +
                                            (esLaQueDecide ? 'bg-primary text-white'
                                                : evaluada ? 'bg-gray-300 text-gray-700'
                                                    : 'bg-white text-gray-400 border border-gray-300')}>
                                            {i === reglas.length - 1 ? 'Sino' : (i === 0 ? 'Si' : 'Sino Si')}
                                        </span>
                                        <div className="min-w-0">
                                            <p className={'font-mono text-sm ' + (evaluada ? 'text-navy' : 'text-gray-500')}>{r.cond}</p>
                                            <p className={'text-xs ' + (evaluada ? 'text-gray-600' : 'text-gray-500')}>
                                                {esLaQueDecide
                                                    ? <span><strong>{i === reglas.length - 1
                                                        ? 'Nada de lo anterior se cumplió — decide el caso por defecto.'
                                                        : 'Se cumple — decide aquí.'}</strong> {r.porque}</span>
                                                    : evaluada
                                                        ? 'Se evaluó y no se cumple. Se sigue bajando.'
                                                        : 'No se evalúa: la decisión ya se tomó más arriba.'}
                                            </p>
                                        </div>
                                    </div>
                                </li>
                            );
                        })}
                    </ol>

                    {ordenImporta && (
                        <div role="status" className="rounded-xl border-2 border-[#B45309] bg-[#B45309]/15 p-3 text-sm mb-3">
                            <strong>Con este solicitante, el orden decide.</strong> El del comité devuelve
                            <span className="font-mono"> {salidaComite}</span> y el que quedó en producción devuelve
                            <span className="font-mono"> {salidaProduccion}</span>. Las cinco reglas son las mismas y
                            ninguna está mal escrita: lo único distinto es cuál se mira primero.
                        </div>
                    )}

                    <div role="status" className="rounded-xl p-3 text-white" style={{ background: colorTono[fallo.tono] }}>
                        <p className="text-xs uppercase tracking-wider font-bold" style={{ margin: 0 }}>Decisión del sistema</p>
                        <p className="text-lg font-bold" style={{ margin: 0 }}>{fallo.salida}</p>
                        <p className="text-sm" style={{ margin: 0 }}>
                            Condición que decidió: <span className="font-mono">{fallo.cond}</span>
                        </p>
                    </div>
                </div>
            );
        };

        /* ------------------------------------------------------------
           SelectivasComparadas — el mismo problema, dos estructuras

           Una escala de tarifas por monto, resuelta en cascada y con
           `Segun`, lado a lado. No están puestas para que se vean bonitas:
           están puestas porque NO son equivalentes, y el estudiante tiene que
           encontrar dónde.

           La versión con `Segun` no tiene caso por defecto. Para todo monto
           dentro de los tramos las dos dan lo mismo; para un monto fuera de
           ellos el `Segun` no devuelve nada y la cascada sí, pero no siempre
           lo mismo: por encima del tope cae en su `Sino` final y devuelve
           25 000; con una devolución en negativo entra en el PRIMER tramo
           —`monto <= 100000` también es cierto para un negativo— y devuelve
           2 500. Son dos defectos distintos, no uno.
           Ese es el E4 del capítulo, y el cloze
           «Segun sin caso por defecto» del banco.
        ------------------------------------------------------------ */
        const SelectivasComparadas = () => {
            // Con los bordes exactos de cada tramo, que es donde viven los
            // defectos de una escala y lo que un bloque de código no deja probar.
            const EJEMPLOS = [
                { v: -50000, t: '-$ 50.000 — una devolución' },
                { v: 0, t: '$ 0 — una transacción anulada' },
                { v: 80000, t: '$ 80.000 — tramo 1' },
                { v: 100000, t: '$ 100.000 — el borde del tramo 1' },
                { v: 350000, t: '$ 350.000 — tramo 2' },
                { v: 500000, t: '$ 500.000 — el borde del tramo 2' },
                { v: 1200000, t: '$ 1.200.000 — tramo 3' },
                { v: 7500000, t: '$ 7.500.000 — por encima del tope' },
            ];
            const [monto, setMonto] = useState(350000);

            // Cascada: el último `Sino` recoge todo lo que no cayó antes.
            const porCascada = (m) => {
                if (m <= 100000) return { tarifa: 2500, rama: 'monto <= 100.000' };
                if (m <= 500000) return { tarifa: 6000, rama: 'monto <= 500.000' };
                if (m <= 5000000) return { tarifa: 12000, rama: 'monto <= 5.000.000' };
                return { tarifa: 25000, rama: 'Sino (cualquier otro monto)' };
            };
            // `Segun` por tramos, SIN caso por defecto: lo que no encaja en
            // ningún caso sale sin tarifa asignada.
            const porSegun = (m) => {
                if (m >= 1 && m <= 100000) return { tarifa: 2500, rama: 'Caso 1..100.000' };
                if (m >= 100001 && m <= 500000) return { tarifa: 6000, rama: 'Caso 100.001..500.000' };
                if (m >= 500001 && m <= 5000000) return { tarifa: 12000, rama: 'Caso 500.001..5.000.000' };
                return { tarifa: null, rama: 'ningún caso coincide' };
            };

            const a = porCascada(monto);
            const b = porSegun(monto);
            const difieren = a.tarifa !== b.tarifa;
            const pesos = (n) => n === null ? 'sin tarifa' : '$ ' + n.toLocaleString('es-CO');

            const panel = (titulo, res, nota) => (
                <div className={'rounded-xl border-2 p-3 ' + (difieren ? 'border-[#B45309]' : 'border-gray-300')}>
                    <p className="text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">{titulo}</p>
                    <p className="font-mono text-xs text-gray-600 mb-2">rama: {res.rama}</p>
                    <p className={'text-lg font-bold ' + (res.tarifa === null ? 'text-[#B91C1C]' : 'text-navy')}>
                        {pesos(res.tarifa)}
                    </p>
                    <p className="text-xs text-gray-500">{nota}</p>
                </div>
            );

            return (
                <div className="my-6 rounded-2xl border-2 border-primary/20 bg-white p-5 shadow-sm not-prose">
                    <div className="flex items-center gap-2 mb-3">
                        <span className="lp-gradient text-white p-2 rounded-lg"><i className="fas fa-table-columns"></i></span>
                        <h4 className="text-base font-bold text-primary" style={{ margin: 0 }}>El mismo problema, dos estructuras</h4>
                        <span className="ml-auto text-[0.65rem] uppercase tracking-wider font-bold text-white bg-teal rounded px-2 py-0.5">Interactivo</span>
                    </div>

                    <p className="text-[0.95rem] text-gray-700 mb-3">
                        La misma escala de tarifas, escrita <strong>en cascada</strong> y
                        con <span className="inline-code">Segun</span>. Pruebe los montos y busque uno
                        donde <strong>no den lo mismo</strong>. Existe.
                    </p>

                    <label className="block mb-4">
                        <span className="block text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Monto de la transacción</span>
                        <select value={monto} onChange={(e) => setMonto(Number(e.target.value))}
                            className="w-full rounded-lg border-2 border-gray-300 bg-white px-2 py-1.5 font-mono text-sm text-navy focus:border-primary focus:outline-none">
                            {EJEMPLOS.map(o => <option key={o.v} value={o.v}>{o.t}</option>)}
                        </select>
                    </label>

                    <div className="grid gap-3 sm:grid-cols-2 mb-3">
                        {panel('Cascada de Si…Sino', a, 'El último Sino no pregunta nada: recoge todo lo que no cayó antes.')}
                        {panel('Segun, sin caso por defecto', b, 'Cada caso enumera un tramo. Lo que no encaja en ninguno, no encaja.')}
                    </div>

                    <div role="status" className={'rounded-xl p-3 text-sm ' +
                        (difieren ? 'bg-[#B45309]/15 border-2 border-[#B45309]' : 'bg-gray-100 border border-gray-300')}>
                        {difieren
                            ? (monto <= 0
                                ? <span><strong>Aquí difieren, y las dos están mal.</strong> La cascada cobra 2 500 sobre un monto
                                    que no es una venta: <span className="inline-code">monto &lt;= 100.000</span> también es cierto
                                    para un negativo y para el cero. El <span className="inline-code">Segun</span> no asigna
                                    ninguna. Son dos defectos distintos: un tope sin piso de un lado, y un caso por
                                    defecto que falta del otro.</span>
                                : <span><strong>Aquí difieren.</strong> La cascada cobra la tarifa de su <span className="inline-code">Sino</span> final;
                                    el <span className="inline-code">Segun</span> no asigna ninguna y el programa sigue con la
                                    variable sin valor. No hay error, no hay mensaje: hay una transacción sin cobrar.</span>)
                            : <span>Con este monto las dos coinciden. Pruebe uno que no esté en ningún tramo.</span>}
                    </div>
                </div>
            );
        };

        /* ------------------------------------------------------------
           FLUJOGRAMAS — la simbología que el syllabus pide por nombre

           Dos, y no uno, porque enseñan cosas distintas: el primero, que una
           selectiva doble abre DOS caminos y vuelve a juntarlos; el segundo,
           que una cascada es una sola columna de rombos y que cada «No» te
           baja al siguiente. El rombo es el símbolo de este capítulo.

           Van en SVG en línea y no como imagen: escalan, se leen con lector
           de pantalla por su `aria-label`, y no añaden un archivo que se
           pueda perder al mover el HTML.
        ------------------------------------------------------------ */
        const FLECHA_DEFS = (
            <defs>
                <marker id="lp-flecha4" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L7,3 z" fill="#3D008D" />
                </marker>
            </defs>
        );

        const FlujogramaSelectivaDoble = () => (
            <figure className="my-6 not-prose">
                <svg viewBox="0 0 420 472" role="img" className="hidden sm:block" style={{ width: '100%', maxWidth: '440px', height: 'auto', margin: '0 auto' }}
                    aria-label="Flujograma de una selectiva doble. Inicio; se leen esPreferencial y monto; un rombo pregunta si esPreferencial; por la rama Sí se calcula tarifa igual a monto por 0,002, que da 4000; por la rama No se calcula tarifa igual a monto por 0,005, que da 10000; las dos ramas vuelven a juntarse; se escribe tarifa y Fin. Exactamente una de las dos ramas se recorre.">
                    {FLECHA_DEFS}

                    <ellipse cx="210" cy="26" rx="58" ry="20" fill="#3D008D" />
                    <text x="210" y="31" textAnchor="middle" fontSize="13" fontWeight="700" fill="#FFFFFF">Inicio</text>
                    <line x1="210" y1="46" x2="210" y2="66" stroke="#3D008D" strokeWidth="1.5" markerEnd="url(#lp-flecha4)" />

                    <polygon points="44,66 390,66 376,114 30,114" fill="#E0F2F7" stroke="#0E7490" strokeWidth="1.5" />
                    <text x="210" y="86" textAnchor="middle" fontSize="13" fontFamily="ui-monospace, monospace" fill="#001A4D">Leer esPreferencial, monto</text>
                    <text x="210" y="103" textAnchor="middle" fontSize="11.5" fontFamily="ui-monospace, monospace" fill="#0E7490">Verdadero · 2000000</text>
                    <line x1="210" y1="114" x2="210" y2="134" stroke="#3D008D" strokeWidth="1.5" markerEnd="url(#lp-flecha4)" />

                    <polygon points="210,134 300,176 210,218 120,176" fill="#F5F0FA" stroke="#3D008D" strokeWidth="1.8" />
                    <text x="210" y="181" textAnchor="middle" fontSize="13" fontFamily="ui-monospace, monospace" fill="#001A4D">¿esPreferencial?</text>

                    <line x1="120" y1="176" x2="95" y2="176" stroke="#3D008D" strokeWidth="1.5" />
                    <line x1="95" y1="176" x2="95" y2="248" stroke="#3D008D" strokeWidth="1.5" markerEnd="url(#lp-flecha4)" />
                    <text x="107" y="169" textAnchor="middle" fontSize="12" fontWeight="700" fill="#15803D">Sí</text>

                    <line x1="300" y1="176" x2="325" y2="176" stroke="#3D008D" strokeWidth="1.5" />
                    <line x1="325" y1="176" x2="325" y2="248" stroke="#3D008D" strokeWidth="1.5" markerEnd="url(#lp-flecha4)" />
                    <text x="313" y="169" textAnchor="middle" fontSize="12" fontWeight="700" fill="#B91C1C">No</text>

                    <rect x="5" y="248" width="180" height="52" rx="6" fill="#F5F0FA" stroke="#3D008D" strokeWidth="1.5" />
                    <text x="95" y="270" textAnchor="middle" fontSize="12" fontFamily="ui-monospace, monospace" fill="#001A4D">{'tarifa ← monto * 0.002'}</text>
                    <text x="95" y="288" textAnchor="middle" fontSize="11.5" fontFamily="ui-monospace, monospace" fill="#0E7490">tarifa = 4000</text>

                    <rect x="235" y="248" width="180" height="52" rx="6" fill="#F5F0FA" stroke="#3D008D" strokeWidth="1.5" />
                    <text x="325" y="270" textAnchor="middle" fontSize="12" fontFamily="ui-monospace, monospace" fill="#001A4D">{'tarifa ← monto * 0.005'}</text>

        /* Cómo se escribe la MISMA regla en los cuatro lenguajes, con y sin
           paréntesis. El bloque no imprime nada a propósito: lo que hay que
           mirar es la sintaxis y el árbol que los paréntesis fuerzan; la
           evaluación paso a paso la hace el `EvaluadorLogico` de arriba. */
        const EJ_CONDICION = {
            pseudo: `// Estudio de crédito: la misma regla, con y sin paréntesis
ingreso       <- 6500000
score         <- 480
endeudamiento <- 68

// Sin paréntesis. Y liga más fuerte que O, así que esto se lee
// ingreso > 3000000  O  (score >= 680  Y  endeudamiento < 40)
aprobadoA <- ingreso > 3000000 O score >= 680 Y endeudamiento < 40

// Con paréntesis se fuerza el otro árbol
aprobadoB <- (ingreso > 3000000 O score >= 680) Y endeudamiento < 40`,
            python: `ingreso       = 6_500_000
score         = 480
endeudamiento = 68

# Sin paréntesis. «and» liga más fuerte que «or», así que esto se lee
# ingreso > 3_000_000 or (score >= 680 and endeudamiento < 40)
aprobado_a = ingreso > 3_000_000 or score >= 680 and endeudamiento < 40

# Con paréntesis se fuerza el otro árbol
aprobado_b = (ingreso > 3_000_000 or score >= 680) and endeudamiento < 40`,
            r: `ingreso       <- 6500000
score         <- 480
endeudamiento <- 68

# Sin paréntesis. «&&» liga más fuerte que «||», así que esto se lee
# ingreso > 3000000 || (score >= 680 && endeudamiento < 40)
aprobado_a <- ingreso > 3000000 || score >= 680 && endeudamiento < 40

# Con paréntesis se fuerza el otro árbol
aprobado_b <- (ingreso > 3000000 || score >= 680) && endeudamiento < 40`,
            vba: `Option Explicit

Sub EstudioDeCredito()
    Dim ingreso As Currency, score As Integer, endeudamiento As Double
    Dim aprobadoA As Boolean, aprobadoB As Boolean

    ingreso = 6500000
    score = 480
    endeudamiento = 68

    ' Sin paréntesis. And liga más fuerte que Or, así que esto se lee
    ' ingreso > 3000000 Or (score >= 680 And endeudamiento < 40)
    aprobadoA = ingreso > 3000000 Or score >= 680 And endeudamiento < 40

    ' Con paréntesis se fuerza el otro árbol
    aprobadoB = (ingreso > 3000000 Or score >= 680) And endeudamiento < 40
End Sub`,
        };

        /* La condición guardia. El primer operando protege al segundo, y solo
           funciona si el lenguaje evalúa en cortocircuito. VBA no lo hace: es
           el único de los cuatro donde este bloque revienta. */
        const EJ_GUARDIA = {
            pseudo: `// Consumo promedio de una tarjeta que este mes NO se usó
compras <- 0
total   <- 0

// La guardia: si compras es 0, el segundo operando NO se evalúa

            python: `compras = 0
total   = 0

# La guardia: si compras es 0, Python no evalúa el segundo operando
consumo_alto = compras != 0 and total / compras > 500_000`,
            r: `compras <- 0
total   <- 0

# La guardia: con && R no evalúa el segundo operando si el primero es FALSE.
# OJO: con & (un solo signo) sí lo evaluaría. Y no se detiene: 0/0 da NaN,
# NaN > 500000 da NA, y FALSE & NA da FALSE. Ni un aviso. Es peor que el
# error 11 de VBA: allí el fallo se ve; aquí se cuela sin dejar rastro.
consumo_alto <- compras != 0 && total / compras > 500000`,
            vba: `Option Explicit

Sub ConsumoPromedio()
    Dim compras As Long, total As Currency
    Dim consumoAlto As Boolean

    compras = 0
    total = 0

    ' And evalúa SIEMPRE los dos lados: la guardia no protege nada.
    ' Esta línea se detiene con el error 11, «División por cero».
    consumoAlto = compras <> 0 And total / compras > 500000
End Sub`,
        };

        const Cap1Section = () => (
            <div className="prose-lp">
                <Motivacion icon="fa-scale-balanced"

                    La regla decía: aprobar a quien supere tres millones de ingreso o llegue a 680 de

                </p>
                <p>
                    Lo que aquel capítulo no podía plantear todavía es lo que hace falta ahora, cuando
                    de una condición depende que un desembolso salga o no salga:
                </p>
                <div className="overflow-x-auto">

                            <tr><th>La pregunta</th><th>Dónde se responde</th></tr>
                        </thead>

                            <tr><td>¿Qué hace <span className="inline-code">Y</span>, y cómo se escribe en cada lenguaje?</td><td>Capítulo 1, sección 3</td></tr>

                            <tr><td>¿Cómo se <strong>niega</strong> una condición compuesta sin invertir su sentido?</td><td><strong>Aquí</strong></td></tr>
                            <tr><td>¿Qué operandos llega a <strong>mirar</strong> la máquina, y cuáles ni se evalúan?</td><td><strong>Aquí</strong></td></tr>
                        </tbody>
                    </table>
                </div>

                <h3>Una condición es un valor, no una pregunta</h3>
                <p>
                    Antes de que exista ningún <span className="inline-code">Si</span>, una condición ya es
                    algo por sí sola: una expresión que <strong>vale verdadero o falso</strong> y que se
                    puede guardar en una variable, igual que se guarda un saldo. Se mira así, sin
                    decisión de por medio, porque es donde se cometen los errores: cuando el
                    <span className="inline-code"> Si</span> aparece en la sección siguiente, la condición ya
                    tiene que estar bien.
                </p>

                <CodeTabs
                    titulo="La misma regla de aprobación, con y sin paréntesis"
                    bloques={EJ_CONDICION}
                    nota="Este bloque no imprime nada: lo que hay que mirar es dónde caen los paréntesis. Los dos valores que calcula no son iguales, y el evaluador de abajo permite comprobarlo combinación por combinación." />

                <EvaluadorLogico />

                <h3>La precedencia que faltaba</h3>
                <p>
                    El capítulo 3 cerró su tabla de precedencia con una fila que decía «relacionales y
                    lógicos — al final <em>(capítulo 4)</em>». Esta es esa fila, desplegada. El orden

                </p>

                    <table>
                        <thead>
                            <tr><th>Orden</th><th>Operadores</th><th>Observación</th></tr>
                        </thead>

                            <tr><td>1.ª</td><td><span className="inline-code">( )</span></td><td>Primero, siempre. De dentro hacia fuera</td></tr>

                <h3>Negar una condición compuesta</h3>
                <p>
                    Una regla de rechazo suele nacer como la negación de una de aprobación, y ahí aparece
                    el error: se niegan los operandos y se deja el conector como estaba. No funciona así.
                    Al negar, <strong>el conector también cambia</strong> —son las
                    <Termino def="Al negar una conjunción se obtiene una disyunción de las negaciones, y viceversa. Deben su nombre a Augustus De Morgan (1806-1871).">leyes de De Morgan</Termino>—:
                </p>
                <div className="overflow-x-auto">
                    <table>
                        <thead>
                            <tr><th>Si niega esto…</th><th>…obtiene esto</th><th>El error frecuente</th></tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><span className="inline-code">NO (A Y B)</span></td>
                                <td><span className="inline-code">NO A <strong>O</strong> NO B</span></td>
                                <td><span className="inline-code">NO A <strong>Y</strong> NO B</span> — deja el conector</td>
                            </tr>
                            <tr>
                                <td><span className="inline-code">NO (A O B)</span></td>
                                <td><span className="inline-code">NO A <strong>Y</strong> NO B</span></td>
                                <td><span className="inline-code">NO A <strong>O</strong> NO B</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <p>
                    Con cifras: la política de aprobación exige <span className="inline-code">score &gt;= 680
                    Y endeudamiento &lt; 40</span>. La de rechazo es su negación, y bien escrita queda
                    <span className="inline-code"> score &lt; 680 O endeudamiento &gt;= 40</span>. Quien deja el
                    conector y escribe <span className="inline-code">score &lt; 680 Y endeudamiento &gt;= 40</span>
                    solo rechaza a quien falla <strong>en las dos cosas a la vez</strong>:
                </p>
                <div className="overflow-x-auto">
                    <table>
                        <thead>
                            <tr><th>Solicitante</th><th>La regla correcta</th><th>La regla con el conector sin cambiar</th></tr>

                        <tbody>
                            <tr><td>score 720 · endeudamiento 35 %</td><td>aprueba</td><td>aprueba</td></tr>
                            <tr><td>score 720 · endeudamiento 55 %</td><td><strong>rechaza</strong></td><td className="text-[#B91C1C]"><strong>se le escapa</strong></td></tr>
                            <tr><td>score 600 · endeudamiento 35 %</td><td><strong>rechaza</strong></td><td className="text-[#B91C1C]"><strong>se le escapa</strong></td></tr>
                            <tr><td>score 600 · endeudamiento 55 %</td><td><strong>rechaza</strong></td><td>rechaza</td></tr>
                        </tbody>
                    </table>
                </div>
                <p>
                    Dos de los tres perfiles que debían rechazarse pasan el filtro, y son justamente
                    los que fallan en <em>una</em> cosa: los que un analista habría detenido sin dudar.
                </p>

                <Ejercicio tipo="E2"><MCQ
                    multiple={true}
                    pregunta="La política de aprobación se guardó tal cual en una variable: aprobado <- score >= 680 Y endeudamiento < 40. Hace falta ahora la condición de rechazo. ¿Cuáles de estas la calculan bien?"
                    opciones={[
                        { texto: 'rechazado <- NO aprobado', correcta: true, justificacion: 'Las dos que funcionan son NO aprobado y score < 680 O endeudamiento >= 40, y son la misma cosa escrita de dos maneras. La primera niega la condición ENTERA, y puede hacerlo porque una condición es un valor: se guardó en una variable igual que se guarda un saldo, así que negar ese valor es negar la política completa sin tocar ningún operando. La segunda es esa misma negación ya distribuida con De Morgan: al negar una conjunción el conector cambia, y por eso donde había un Y aparece un O. Las dos que fallan son la misma equivocación escrita dos veces —dejar el Y en su sitio—, una con las comparaciones invertidas y otra con un NO delante de cada operando; en pseudocódigo NO liga más fuerte que Y, así que la segunda dice exactamente lo mismo que la primera. Las dos rechazan solo a quien falla en las dos cosas a la vez, y dejan pasar a dos de los tres perfiles que debían detenerse. Y hay una razón de oficio para preferir NO aprobado: si mañana el comité cambia la política de aprobación, esa línea sigue siendo su negación exacta sin que nadie tenga que volver a distribuir nada.' },

                <h3>La traza de una cascada</h3>
                <p>

                <h3>¿Anidar o encadenar?</h3>

        /* Rangos: aquí los cuatro dejan de parecerse. VBA los admite tal cual,

            python: `monto = 350_000

# match compara patrones, no rangos: el rango va en una GUARDA (case ... if ...)
# Y la guarda lleva las DOS cotas: con solo m <= 500_000, una devolución
# en negativo entraría en el tramo, que no es lo que dice la escala.
match monto:
    case m if 1 <= m <= 100_000:
        tarifa = 2500
    case m if 100_001 <= m <= 500_000:
        tarifa = 6000
    case m if 500_001 <= m <= 5_000_000:
        tarifa = 12000
    case _:
        tarifa = 25000

print(f"Tarifa: {tarifa:,.0f}")
#> Tarifa: 6,000`,
            r: `monto <- 350000

# switch NO compara: iguala. Con rangos no sirve, y hay que volver
# a la cascada de if / else if. No es una limitación que se pueda
# rodear: es que switch resuelve otro problema.
# Cada rama repite su cota inferior porque la cascada no sabe decir
# «entre a y b» de una pieza: sin ella, una devolución en negativo cae
# en el primer tramo y se le cobran 2 500.
if (monto >= 1 && monto <= 100000) {
  tarifa <- 2500
} else if (monto >= 100001 && monto <= 500000) {
  tarifa <- 6000
} else if (monto >= 500001 && monto <= 5000000) {
  tarifa <- 12000
} else {
  tarifa <- 25000
}

cat(sprintf("Tarifa: %.0f\\n", tarifa))
#> Tarifa: 6000`,

            tarifa = 6000
        Case 500001 To 5000000
            tarifa = 12000
        Case Else
            tarifa = 25000
    End Select

    Debug.Print "Tarifa: " & tarifa
    '> Tarifa: 6000
End Sub`,

                            { texto: 'Que la variable asignada quede en el mismo tipo de dato.', correcta: false },
                        ],
                        multiple: true,
                        justificacion: 'La primera y la tercera, y son las dos caras del mismo defecto: con dos Si sueltos, el cliente preferencial de 2 000 000 cumple las dos condiciones y la segunda pisa a la primera, mientras el cliente corriente de 800 000 no cumple ninguna y se le cobra cero. Lo que Si…Sino no hace es evaluar las dos condiciones: evalúa una, y la segunda rama no tiene condición propia.',
                    },
                    {
                        seccion: 'cap4',
                        pregunta: 'Una cascada evalúa en este orden: endeudamiento > 60 da RECHAZADO; score < 550 da RECHAZADO; ingreso >= 5 000 000 da PREFERENCIAL; y en cualquier otro caso, ESTÁNDAR. Llega un solicitante con score 500, endeudamiento del 25 % e ingreso de 8 000 000. ¿Qué decisión sale, y cuántas condiciones llegó a evaluar?',
                        opciones: [
                            { texto: 'RECHAZADO, después de evaluar dos condiciones.', correcta: true },
                            { texto: 'RECHAZADO, después de evaluar las tres condiciones.', correcta: false },
                            { texto: 'APROBADO PREFERENCIAL, porque el ingreso supera los cinco millones.', correcta: false },
                            { texto: 'RECHAZADO, y basta con evaluar la primera condición.', correcta: false },
                        ],
                        justificacion: 'La primera, endeudamiento > 60, es falsa con un 25 %. La segunda, score < 550, es verdadera con 500, y ahí decide: RECHAZADO tras evaluar dos. La del ingreso queda debajo y no llega a mirarse, así que los ocho millones no entran en la decisión por mucho que superen el umbral. No se evalúan las tres —la cascada se detiene en la primera que se cumple— ni basta con la primera, que en este solicitante no se cumple. La diferencia entre «dio falso» y «no se evaluó» es la que permite contestarle a un cliente cuál condición lo rechazó.',
                    },
                    {
                        seccion: 'cap4',
                        pregunta: 'Las cinco reglas de una política de originación son correctas, pero la del ingreso alto está de primera en la cascada. ¿Qué tipo de defecto es?',
                        opciones: [
                            { texto: 'Un error de sintaxis: falta un delimitador en la cascada.', correcta: false },
                            { texto: 'Un defecto de orden entre reglas que son todas correctas.', correcta: true },
                            { texto: 'Una condición mal escrita, con el operador de comparación invertido.', correcta: false },
                            { texto: 'Una comparación entre unidades distintas.', correcta: false },
                        ],
                        justificacion: 'No hay ninguna línea defectuosa, y por eso una revisión de código no lo encuentra: el defecto está en la relación entre dos reglas. El arreglo no toca ninguna condición, solo las mueve.',
                    },
                    {
                        seccion: 'cap1',
                        pregunta: 'Un equipo traslada a VBA una línea que en Python funcionaba: if compras != 0 and total / compras > 500_000. Con compras en 0, el procedimiento se detiene con el error 11. ¿Cuál es el arreglo?',
                        opciones: [
                            { texto: 'Cambiar And por AndAlso, que en VBA sí hace cortocircuito.', correcta: false },
                            { texto: 'Invertir los operandos, para que la división se evalúe la primera.', correcta: false },
                            { texto: 'Partir la condición en dos If anidados, con la división en el interior.', correcta: true },
                            { texto: 'Declarar compras como Double, para que la división dé infinito.', correcta: false },
                        ],
                        justificacion: 'VBA no tiene operador de cortocircuito: And y Or evalúan siempre los dos lados, y AndAlso es de VB.NET, no de VBA. Invertir los operandos empeora las cosas, porque entonces la división se evalúa seguro. Y declarar compras como Double tampoco sirve: dividir entre cero en VBA es el error 11, no infinito. La única forma de que la división no llegue a ejecutarse es que esté dentro de un If que ya comprobó el divisor, que es como lo escribe la sección 2.',
                    },
                    {
                        seccion: 'cap5',
                        pregunta: '¿Cuál de estas situaciones pide una selectiva múltiple y no una cascada?',
                        opciones: [
                            { texto: 'Clasificar una solicitud de crédito según su score, su endeudamiento y su ingreso.', correcta: false },
                            { texto: 'Aplicar un recargo a la factura si la mora supera los 30 días.', correcta: false },
                            { texto: 'Decidir entre la tarifa preferencial y la tarifa plena del cliente.', correcta: false },
                            { texto: 'Asignar la cuota de manejo según el tipo de cuenta: ahorros, corriente o nómina.', correcta: true },
                        ],
                        justificacion: 'La selectiva múltiple sirve cuando todas las ramas preguntan por la MISMA variable y la comparan con valores concretos. La primera opción compara tres variables distintas, y las otras dos tienen una sola alternativa: son selectiva simple y doble.',
                    },
                    {
                        seccion: 'cap6',
                        pregunta: 'Un pago por servicios de 180 000 a un proveedor no declarante, con la UVT en 50 000. ¿Cuánto se le retiene?',
                        opciones: [
                            { texto: 'Se le retienen 10 800, que es el 6 % del pago.', correcta: false },
                            { texto: 'Nada: el pago no llega a la base mínima de 200 000.', correcta: true },
                            { texto: 'Se le retienen 7 200, que es el 4 % del pago.', correcta: false },
                            { texto: 'Nada, pero porque el proveedor no es declarante.', correcta: false },
                        ],
                        justificacion: 'La base mínima se calcula antes de preguntar nada: 4 × 50 000 = 200 000, y 180 000 no llega. La primera rama de la cascada decide y deja la retención en cero, así que la condición del declarante no se evalúa nunca. Por eso la opción que dice «nada, pero porque el proveedor no es declarante» acierta la cifra y se equivoca en la causa: si el proveedor fuera declarante el resultado sería exactamente el mismo. El 4 % y el 6 % solo entran en juego por encima del umbral.',
                    },
                    {
                        seccion: 'cap6',
                        pregunta: 'Con la política de originación en su orden correcto, un solicitante con ingreso de 6 500 000, score 720 y endeudamiento del 68 % es rechazado. ¿Qué condición lo decidió, y qué pasó con la del ingreso?',
                        opciones: [
                            { texto: 'El score, y la del ingreso se evaluó después y dio falso.', correcta: false },
                            { texto: 'El ingreso, que al superar los cinco millones lo dejó en preferencial.', correcta: false },
                            { texto: 'El endeudamiento del 68 %, y la del ingreso quedó debajo, sin evaluarse.', correcta: true },
                            { texto: 'Las dos causales de rechazo a la vez, porque ambas se cumplen.', correcta: false },
                        ],
                        justificacion: 'La cascada evalúa score < 550 —falso, tiene 720—, después endeudamiento > 60 —verdadero, 68— y ahí decide. La regla del ingreso está más abajo y no llega a mirarse: si estuviera de primera, este mismo solicitante saldría aprobado preferencial, que es el defecto de la sección 4 visto desde el otro lado. No lo rechazó el score, que pasa de sobra, y tampoco fallan las dos causales: la del score no se cumple.',
                    },
                ]} />

                <h3>Glosario del capítulo</h3>
                <div className="overflow-x-auto">
                    <table>
                        <thead>
                            <tr><th>Término</th><th>Definición</th></tr>
                        </thead>
                        <tbody>
                            {GLOSARIO_CAP04.map(([t, d], i) => (
                                <tr key={i}><th style={{ whiteSpace: 'nowrap' }}>{t}</th><td>{d}</td></tr>
                            ))}
                        </tbody>
                    </table>
                </div>

                <Box type="tip" label="Lo que viene">
                    El capítulo 5 rompe la otra garantía que quedaba: hasta aquí, una instrucción se
                    ejecutaba una vez o ninguna. Con la repetición puede ejecutarse cientos de veces, y
                    la pregunta deja de ser <em>por dónde pasó</em> para volverse <em>cuántas veces, y
                    cuándo para</em>. La tabla de amortización de un crédito a 240 meses tiene 240 filas
                    y nadie las escribió.
                </Box>
            </div>
        );

        const curriculum = [
            { id: 'portada', title: 'Portada y objetivos', icon: 'BookOpen', component: PortadaSection },
            { id: 'cap1', title: '1. Condiciones', icon: 'Binary', component: Cap1Section },
            { id: 'cap2', title: '2. Selectiva simple', icon: 'GitBranch', component: Cap2Section },
            { id: 'cap3', title: '3. Selectiva doble', icon: 'ArrowDownUp', component: Cap3Section },
            { id: 'cap4', title: '4. Anidadas y en cascada', icon: 'Layers', component: Cap4Section },
            { id: 'cap5', title: '5. Selectiva múltiple', icon: 'Table', component: Cap5Section },
            { id: 'cap6', title: '6. Casos financieros', icon: 'Grid', component: Cap6Section },
            { id: 'eval', title: 'Evaluación y glosario', icon: 'Award', component: EvaluacionSection },
        ];


        /* ============================================================
           APP — barra lateral, progreso, navegación y reanudación
        ============================================================ */
        const App = () => {
            const [activeLessonIndex, setActiveLessonIndex] = useState(() => {
                const saved = parseInt(localStorage.getItem(CONFIG.storageKey), 10);
                return Number.isInteger(saved) && saved >= 0 ? saved : 0;
            });
            // La barra es hermana flex del contenido: no lo superpone, lo
            // COMPRIME. Abierta ocupa 18 rem, así que en un viewport de 375 px
            // dejaría el texto en 79 px, ilegible. Arranca abierta solo desde
            // el punto de corte `lg` de Tailwind, que es el que usa `irA` para
            // cerrarla al navegar.
            const [sidebarOpen, setSidebarOpen] = useState(() => window.innerWidth >= 1024);

            const safeIndex = Math.min(activeLessonIndex, curriculum.length - 1);
            const activeLesson = curriculum[safeIndex];
            const ActiveComponent = activeLesson.component;
            const progreso = Math.round(((safeIndex + 1) / curriculum.length) * 100);

            useEffect(() => {
                localStorage.setItem(CONFIG.storageKey, String(safeIndex));
                typesetMath();
                const cont = document.getElementById('contenido-scroll');
                if (cont) cont.scrollTo({ top: 0, behavior: 'smooth' });
            }, [safeIndex]);

            const irA = (idx) => {
                setActiveLessonIndex(idx);
                if (window.innerWidth < 1024) setSidebarOpen(false);
            };

            return (
                <div className="flex h-screen overflow-hidden relative">
                    <button onClick={() => setSidebarOpen(p => !p)}
                        className="fixed top-4 left-4 z-50 p-2.5 rounded-full shadow-lg text-white transition-all hover:scale-110 lp-gradient"
                        title={sidebarOpen ? 'Ocultar menú' : 'Mostrar menú'} aria-label={sidebarOpen ? 'Ocultar menú' : 'Mostrar menú'}>
                        <i className={`fas ${sidebarOpen ? 'fa-times' : 'fa-bars'} text-sm`}></i>
                    </button>

                    {sidebarOpen && <div className="fixed inset-0 bg-black/20 z-30 lg:hidden" onClick={() => setSidebarOpen(false)} />}

                    <aside className="flex-shrink-0 overflow-y-auto z-40 flex flex-col lp-header"
                        style={{
                            width: sidebarOpen ? '18rem' : '0', minWidth: sidebarOpen ? '18rem' : '0',
                            opacity: sidebarOpen ? 1 : 0, transition: 'width 0.3s ease, min-width 0.3s ease, opacity 0.25s ease',
                            overflow: sidebarOpen ? 'visible auto' : 'hidden'
                        }}>
                        <div className="p-6 pt-16 border-b border-white/10">
                            {/* contraste-ok: el gold va sobre el navy de `lp-header`, no sobre el fondo claro */}
                            <p className="text-[0.65rem] uppercase tracking-widest text-gold font-bold">Universidad Santo Tomás</p>
                            <h1 className="text-white font-bold text-lg tracking-tight mt-1">
                                {CONFIG.asignatura}
                            </h1>
                            <p className="text-xs text-white/60 mt-1">
                                Capítulo {CONFIG.numero} · <span className="text-secondary-claro font-semibold">{CONFIG.titulo}</span>
                            </p>
                        </div>

                        <nav className="p-4 space-y-2 flex-1">
                            {curriculum.map((lesson, idx) => (
                                <button key={lesson.id} onClick={() => irA(idx)}
                                    className={`w-full flex items-start gap-3 px-3 py-3 text-sm rounded-lg transition-all text-left ${safeIndex === idx ? 'text-white shadow-lg lp-gradient' : 'text-white/60 hover:text-white hover:bg-white/10'}`}>
                                    <span className="flex-shrink-0 mt-0.5" style={{ width: 18, height: 18 }}>{renderIcon(lesson.icon, 18)}</span>
                                    <span className="font-medium leading-tight break-words">{lesson.title}</span>
                                </button>
                            ))}
                        </nav>

                        <div className="p-4 text-[10px] text-white/70 border-t border-white/10">
                            <p>{CONFIG.ra} · {CONFIG.horas} horas</p>
                            <p>Pseudocódigo · Python · R · VBA</p>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col overflow-hidden bg-bg">
                        <div className="h-1.5 bg-gray-200 flex-shrink-0">
                            <div className="h-full lp-gradient transition-all duration-500" style={{ width: `${progreso}%` }}></div>
                        </div>

                        <div id="contenido-scroll" className="flex-1 overflow-y-auto p-6 lg:p-12">
                            <div className="max-w-4xl mx-auto w-full">
                                <div className="mb-6 flex items-center justify-between flex-wrap gap-3">
                                    <span className="text-xs font-bold tracking-wider text-secondary-texto uppercase">
                                        Lección {safeIndex + 1} de {curriculum.length} · {progreso} %
                                    </span>
                                    <div className="flex gap-2">
                                        <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full hover:bg-gray-100 disabled:opacity-30 transition-colors text-sm font-medium text-navy">
                                            {renderIcon('ChevronLeft', 18)} Anterior
                                        </button>
                                        <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full text-white lp-gradient disabled:opacity-30 transition-colors text-sm font-medium">
                                            Siguiente {renderIcon('ChevronRight', 18)}
                                        </button>
                                    </div>
                                </div>

                                <SectionHeader title={activeLesson.title} icon={Icons[activeLesson.icon]} />

                                {safeIndex === 0 && (
                                    <div className="mb-8 text-center bg-white p-7 rounded-2xl shadow-sm border border-gray-100">
                                        <p className="text-xs uppercase tracking-widest text-secondary-texto font-bold mb-2">
                                            Capítulo {CONFIG.numero} · {CONFIG.horas} horas · {CONFIG.ra}
                                        </p>
                                        <h1 className="text-2xl font-bold text-primary mb-2">{CONFIG.titulo}</h1>
                                        <p className="text-gray-600 font-light">{CONFIG.subtitulo}</p>
                                        <div className="flex justify-center flex-wrap gap-2 mt-4 text-xs">
                                            {CONFIG.temas.map(t => (
                                                <span key={t} className="px-3 py-1 rounded-full bg-primary/10 text-primary">{t}</span>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="animate-fade-in" key={activeLesson.id}>
                                    <ActiveComponent />
                                </div>

                                <div className="mt-12 flex items-center justify-between gap-3">
                                    <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-gray-300 bg-white hover:bg-gray-50 disabled:opacity-30 text-sm font-medium text-navy">
                                        {renderIcon('ChevronLeft', 18)}
                                        <span className="hidden sm:inline">{safeIndex > 0 ? curriculum[safeIndex - 1].title : 'Inicio'}</span>
                                        <span className="sm:hidden">Anterior</span>
                                    </button>
                                    <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-white lp-gradient hover:opacity-90 disabled:opacity-30 text-sm font-medium">
                                        <span className="hidden sm:inline">{safeIndex < curriculum.length - 1 ? curriculum[safeIndex + 1].title : 'Fin'}</span>
                                        <span className="sm:hidden">Siguiente</span>
                                        {renderIcon('ChevronRight', 18)}
                                    </button>
                                </div>

                                <footer className="mt-16 pt-8 border-t border-gray-200">
                                    <div className="lp-header rounded-xl p-6 text-center">
                                        <p className="text-white font-medium text-sm">
                                            <strong>Capítulo {CONFIG.numero} · {CONFIG.titulo}</strong>
                                        </p>
                                        <p className="text-xs mt-1 text-white italic">
                                            {CONFIG.lema}
                                        </p>
                                        <p className="text-xs mt-2 text-white/70">
                                            Universidad Santo Tomás · {CONFIG.asignatura}
                                        </p>
                                        <p className="text-xs text-white/70">
                                            Docente y diseño del material: {CONFIG.docente}
                                        </p>
                                        <p className="text-[10px] mt-2 text-white/50">
                                            {CONFIG.notaPie}
                                        </p>
                                    </div>
                                </footer>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
